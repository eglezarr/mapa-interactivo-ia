miento de la caja negra. Su fidelidad, medida por ejemplo como el porcentaje de predicciones en que ambos coinciden, indica cuánto fiarse: un subrogado poco fiel no explica el modelo original.","cuando":"Para obtener una visión global aproximada de un modelo complejo, después de comprobar que el subrogado lo imita con suficiente fidelidad.","ej":"Un árbol de profundidad 3 entrenado con las predicciones de una red reproduce el 92 % de sus decisiones y muestra que la red se apoya sobre todo en la edad y en dos analíticas.","py":[{"c":"sklearn.tree.DecisionTreeClassifier","u":"https://scikit-learn.org/stable/modules/generated/sklearn.tree.DecisionTreeClassifier.html"},{"c":"arbol.fit(X, modelo.predict(X))","s":1}],"rel":["arboles-de-decision","destilacion-de-conocimiento","lime","r2"]},{"id":"analisis-de-interacciones","name":"Análisis de interacciones","en":"feature interaction analysis","frase":"Medir cuánto del efecto de una variable depende del valor de otras.","desc":"Hay interacción cuando el efecto de una variable cambia según el valor de otra, de modo que la predicción no es la suma de efectos separados. El estadístico H de Friedman mide qué parte de la variación se debe a interacciones; los valores de interacción de SHAP reparten cada predicción entre efectos principales y efectos de cada par; los PDP de dos variables las visualizan. Detectarlas ayuda a decidir si bastaría un modelo aditivo.","cuando":"Para descubrir qué combinaciones de variables usa un modelo complejo o decidir qué interacciones añadir a un modelo interpretable.","ej":"En un modelo de riesgo de diabetes, los valores de interacción de SHAP revelan que el índice de masa corporal pesa mucho más en pacientes con antecedentes familiares.","py":[{"c":"shap.TreeExplainer.shap_interaction_values","u":"https://shap.readthedocs.io/en/latest/generated/shap.TreeExplainer.html#shap.TreeExplainer.shap_interaction_values"},{"c":"sklearn.inspection.PartialDependenceDisplay.from_estimator","u":"https://scikit-learn.org/stable/modules/generated/sklearn.inspection.PartialDependenceDisplay.html#sklearn.inspection.PartialDependenceDisplay.from_estimator"}],"rel":["regresion-polinomica-e-interacciones","ebm","shap","pdp","ice"]}]},{"id":"explicabilidad-en-deep-learning","name":"Explicabilidad en deep learning","en":"explainability in deep learning","frase":"Métodos que aprovechan gradientes, activaciones o atención para explicar redes neuronales.","desc":"Las redes tienen millones de parámetros, pero son diferenciables y se pueden inspeccionar por dentro. Los mapas de saliencia y Grad-CAM usan gradientes para señalar qué partes de la entrada influyen en la salida; la visualización de filtros y activaciones muestra qué detecta cada capa; los mapas de atención indican en qué tokens o regiones se fija un transformer. Son rápidos y visuales, pero pueden resultar convincentes sin ser fieles al modelo.","cuando":"Para depurar y auditar redes de visión, texto o audio, por ejemplo para comprobar que una CNN mira el objeto y no el fondo.","ej":"Un clasificador de lobos y huskies acierta en test, pero el análisis revela que se apoya en la nieve del fondo y no en el animal.","py":[{"c":"captum.attr","u":"https://captum.ai/api/"}],"rel":["cnn","mecanismo-de-atencion","filtros-y-mapas-de-caracteristicas","evaluacion-de-explicaciones"],"children":[{"id":"grad-cam","name":"Mapas de saliencia y Grad-CAM","en":"saliency maps & Grad-CAM","frase":"Mapas de calor que señalan qué zonas de la entrada han pesado más en la predicción.","desc":"Un mapa de saliencia calcula el gradiente de la salida respecto a cada píxel, es decir, cuánto cambiaría la predicción al alterarlo; suele ser ruidoso, y variantes como SmoothGrad o Integrated Gradients lo estabilizan. Grad-CAM usa en su lugar los mapas de características de la última capa convolucional, ponderados por el gradiente medio de la clase, y produce un mapa más grueso pero más limpio de las regiones relevantes para esa clase.","cuando":"Para ver en qué zonas de una imagen se apoya una CNN, depurar errores o detectar atajos como marcas de agua o fondos.","ej":"Una red que detecta neumonía en radiografías acierta mucho, pero Grad-CAM revela que se fija en la marca del hospital impresa en una esquina, que delata de qué centro viene la imagen.","hp":[["target_layers","capas cuyos mapas de características se usan, normalmente la última convolucional"]],"py":[{"c":"pytorch_grad_cam.GradCAM","u":"https://github.com/jacobgil/pytorch-grad-cam"},{"c":"captum.attr.Saliency","u":"https://captum.ai/api/saliency.html"},{"c":"captum.attr.IntegratedGradients","u":"https://captum.ai/api/integrated_gradients.html"}],"rel":["cnn","filtros-y-mapas-de-caracteristicas","correlacion-espuria","backpropagation","evaluacion-de-explicaciones"]},{"id":"visualizacion-de-filtros-y-activaciones","name":"Visualización de filtros y activaciones","en":"filter & activation visualization","frase":"Ver qué detecta cada filtro: bordes en las primeras capas y partes de objetos en las últimas.","desc":"Hay dos enfoques principales. Uno muestra las activaciones, los mapas de características que produce una imagen concreta en cada capa, o busca las imágenes reales que más activan cada filtro. El otro sintetiza, por ascenso de gradiente a partir de ruido, la entrada que maximiza un filtro. Ambos revelan la jerarquía que aprenden las CNN: bordes y colores al principio, texturas y patrones después y partes de objetos al final.","cuando":"Para entender qué ha aprendido una red de visión, detectar filtros muertos o redundantes, o mostrar cómo funcionan las CNN.","ej":"En una CNN entrenada con ImageNet, un filtro de la primera capa responde a bordes diagonales y otro de las últimas capas, a caras de perro.","py":[{"c":"keras.Model(inputs=modelo.input, outputs=capa.output)","s":1}],"rel":["filtros-y-mapas-de-caracteristicas","cnn","campo-receptivo","inspiracion-biologica-de-las-cnn","grad-cam"]},{"id":"mapas-de-atencion","name":"Mapas de atención","en":"attention maps","frase":"Visualizar los pesos de atención de un transformer para ver qué tokens o regiones relaciona.","desc":"Cada cabeza de atención asigna pesos entre pares de tokens, y dibujarlos muestra qué partes de la entrada combina el modelo, por ejemplo un pronombre con su antecedente. En visión, la atención del token de clase sobre los parches da un mapa de la imagen. Son útiles para explorar, pero un peso alto no garantiza que ese token sea importante para la predicción; attention rollout, que combina todas las capas, se aproxima mejor.","cuando":"Para explorar qué relaciones ha aprendido un transformer o depurar su comportamiento, sin tomar los pesos como explicación causal.","ej":"En la frase \"María le prestó el libro a Ana porque ella se lo había pedido\", una cabeza de atención conecta \"ella\" con \"Ana\".","py":[{"c":"bertviz.head_view","u":"https://github.com/jessevig/bertviz"},{"c":"AutoModel.from_pretrained(nombre, output_attentions=True)","s":1}],"rel":["mecanismo-de-atencion","atencion-multicabeza","vit","token-cls","evaluacion-de-explicaciones"]}]},{"id":"evaluacion-de-explicaciones","name":"Evaluación de explicaciones","en":"evaluation of explanations","frase":"Comprobar si una explicación refleja de verdad lo que hace el modelo y si es estable y útil.","desc":"Una explicación puede parecer convincente sin ser correcta. Se evalúa su fidelidad, por ejemplo eliminando las variables o píxeles señalados como importantes y comprobando que la predicción cae; su robustez, si cambia poco ante entradas casi iguales; y su complejidad, si es lo bastante concisa. Las pruebas de cordura verifican que la explicación cambia al aleatorizar los pesos del modelo, y los estudios con personas, que de verdad ayuda a decidir.","cuando":"Antes de confiar en un método de explicación o al elegir entre varios para un modelo y unos datos concretos.","ej":"Al borrar el 10 % de los píxeles que Grad-CAM marca como más importantes, la confianza en la clase cae del 95 % al 30 %; al borrar un 10 % al azar, apenas baja.","py":[{"c":"quantus.FaithfulnessCorrelation","u":"https://quantus.readthedocs.io/en/stable/docs_api/quantus.metrics.faithfulness.faithfulness_correlation.html"},{"c":"quantus.MaxSensitivity","u":"https://quantus.readthedocs.io/en/stable/docs_api/quantus.metrics.robustness.max_sensitivity.html"}],"rel":["interpretabilidad-vs-explicabilidad","grad-cam","shap","lime"]}]},{"id":"equidad","name":"Equidad (fairness)","en":"fairness","frase":"Que un modelo no perjudique injustamente a personas o grupos por su sexo, origen u otros atributos.","desc":"Un modelo aprende de datos históricos que pueden reflejar desigualdades, y puede reproducirlas o amplificarlas aunque no use directamente el atributo sensible. La equidad estudia cómo detectar esos sesgos, medirlos con métricas de grupo o individuales y mitigarlos antes, durante o después del entrenamiento. No hay una única definición correcta: varias métricas razonables son incompatibles entre sí, y elegir una es también una decisión ética y legal.","cuando":"Siempre que un modelo tome o apoye decisiones sobre personas: contratación, salud, educación, justicia o acceso a servicios.","ej":"Una herramienta de selección entrenada con contrataciones pasadas penaliza los currículos que mencionan un club deportivo femenino, porque históricamente se contrataba sobre todo a hombres.","rel":["sesgo-algoritmico-y-atributos-sensibles","metricas-de-equidad","mitigacion-del-sesgo","ai-act","calidad-y-etiquetado-de-datos"],"children":[{"id":"sesgo-algoritmico-y-atributos-sensibles","name":"Sesgo algorítmico y atributos sensibles","en":"algorithmic bias & sensitive attributes","frase":"Errores sistemáticos que perjudican a ciertos grupos, a menudo heredados de los datos.","desc":"Los atributos sensibles son características protegidas como el sexo, el origen étnico, la edad o la discapacidad. El sesgo puede venir de datos históricos discriminatorios, de grupos poco representados, de etiquetas que miden mal lo que interesa o de variables que actúan como sustituto del atributo, como el código postal. Por eso quitar el atributo del modelo no basta, y además impide medir si hay sesgo.","ej":"Un algoritmo para priorizar pacientes en programas de cuidados usaba el gasto sanitario como medida de necesidad e infravaloraba el riesgo de los pacientes negros, que con la misma gravedad habían recibido menos atención y generado menos gasto.","rel":["equidad","metricas-de-equidad","calidad-y-etiquetado-de-datos","etiquetas-ruidosas","correlacion-espuria"]},{"id":"metricas-de-equidad","name":"Métricas de equidad","en":"fairness metrics","frase":"Medir si un modelo trata igual a distintos grupos en sus decisiones, sus errores o su calibración.","desc":"La paridad demográfica exige la misma tasa de decisiones positivas en cada grupo. La igualdad de oportunidades, la misma tasa de verdaderos positivos, y las probabilidades igualadas, además, la misma tasa de falsos positivos. La calibración por grupos exige que una misma puntuación signifique lo mismo en todos. Si las tasas base difieren y el modelo no es perfecto, no pueden cumplirse todas a la vez, así que hay que elegir según el contexto.","cuando":"Para auditar un modelo que decide sobre personas, comparando sus métricas por grupos antes de desplegarlo y durante su uso.","ej":"Un modelo de cribado de cáncer de piel detecta el 90 % de los casos en pacientes de piel clara y el 75 % en los de piel oscura: incumple la igualdad de oportunidades aunque su precisión global sea alta.","py":[{"c":"fairlearn.metrics.MetricFrame","u":"https://fairlearn.org/main/api_reference/generated/fairlearn.metrics.MetricFrame.html"},{"c":"fairlearn.metrics.demographic_parity_difference","u":"https://fairlearn.org/main/api_reference/generated/fairlearn.metrics.demographic_parity_difference.html"},{"c":"fairlearn.metrics.equalized_odds_difference","u":"https://fairlearn.org/main/api_reference/generated/fairlearn.metrics.equalized_odds_difference.html"}],"rel":["matriz-de-confusion","precision-y-recall","umbral-de-decision","mitigacion-del-sesgo","sesgo-algoritmico-y-atributos-sensibles"]},{"id":"mitigacion-del-sesgo","name":"Mitigación del sesgo","en":"bias mitigation","frase":"Reducir el sesgo corrigiendo los datos, restringiendo el entrenamiento o ajustando las decisiones finales.","desc":"En el preprocesado se corrigen los datos: reponderar o remuestrear grupos, o transformar variables para eliminar su correlación con el atributo sensible. Durante el entrenamiento se impone una restricción de equidad, como en el método de reducciones con gradiente exponenciado. En el posprocesado se fijan umbrales de decisión distintos por grupo para igualar sus tasas de error. Casi siempre tiene un coste en precisión que conviene medir y justificar.","cuando":"Cuando una auditoría detecta diferencias injustificadas entre grupos y hay que corregirlas.","ej":"Un sistema de alerta de abandono escolar ajusta sus umbrales para detectar la misma proporción de alumnos en riesgo en zonas rurales y urbanas.","hp":[["constraints","criterio de equidad que se impone (paridad demográfica, probabilidades igualadas…)"],["eps","incumplimiento máximo permitido de la restricción"]],"py":[{"c":"fairlearn.reductions.ExponentiatedGradient","u":"https://fairlearn.org/main/api_reference/generated/fairlearn.reductions.ExponentiatedGradient.html"},{"c":"fairlearn.postprocessing.ThresholdOptimizer","u":"https://fairlearn.org/main/api_reference/generated/fairlearn.postprocessing.ThresholdOptimizer.html"},{"c":"fairlearn.preprocessing.CorrelationRemover","u":"https://fairlearn.org/main/api_reference/generated/fairlearn.preprocessing.CorrelationRemover.html"}],"rel":["metricas-de-equidad","submuestreo-y-ponderacion-de-clases","umbral-de-decision","regularizacion"]}]},{"id":"robustez","name":"Robustez","en":"robustness","frase":"Que el modelo mantenga su comportamiento ante ruido, datos distintos o ataques deliberados.","desc":"Un modelo robusto no cambia de predicción ante variaciones pequeñas o irrelevantes de la entrada. Incluye la robustez frente al ruido y a cambios naturales de los datos, como otra cámara o la deriva con el tiempo, y frente a ataques: ejemplos adversarios, envenenamiento de los datos de entrenamiento o extracción del modelo mediante consultas. Se evalúa con perturbaciones y ataques controlados, y se mejora con entrenamiento robusto y aumento de datos.","cuando":"En sistemas críticos o expuestos a quien pueda querer engañarlos: conducción, biometría, ciberseguridad o moderación de contenidos.","ej":"Un detector de señales de tráfico deja de reconocer una señal de stop a la que se han pegado unas pocas pegatinas blancas y negras.","rel":["ejemplos-adversarios","entrenamiento-robusto","deriva-de-datos","data-augmentation","ood"],"children":[{"id":"ejemplos-adversarios","name":"Ejemplos adversarios","en":"adversarial examples","frase":"Entradas con perturbaciones mínimas, a menudo invisibles, diseñadas para que el modelo se equivoque.","desc":"Se construyen buscando, normalmente con el gradiente del modelo, una perturbación pequeña que cambie su predicción. En imágenes puede ser imperceptible para una persona y aun así provocar un error con mucha confianza. Los ataques pueden ser de caja blanca, con acceso a los gradientes, o de caja negra, solo con consultas, y dirigidos a una clase concreta o no. Muchos se transfieren entre modelos distintos entrenados para la misma tarea.","cuando":"Para evaluar la robustez de un modelo antes de desplegarlo en un entorno donde alguien podría intentar engañarlo.","ej":"Unas gafas con un estampado diseñado para ello hacen que un sistema de reconocimiento facial identifique a quien las lleva como otra persona.","hp":[["eps","tamaño máximo de la perturbación"],["max_iter","número de pasos del ataque iterativo"]],"py":[{"c":"art.attacks.evasion.ProjectedGradientDescent","u":"https://adversarial-robustness-toolbox.readthedocs.io/en/latest/modules/attacks/evasion.html#art.attacks.evasion.ProjectedGradientDescent"}],"rel":["fgsm","robustez","explicaciones-contrafactuales","descenso-por-gradiente","entrenamiento-robusto"]},{"id":"fgsm","name":"FGSM","en":"Fast Gradient Sign Method (FGSM)","frase":"Ataque de un solo paso: mover cada píxel un poco en la dirección del signo del gradiente.","desc":"El Fast Gradient Sign Method calcula el gradiente de la pérdida respecto a la entrada y suma a cada píxel ε veces su signo: según una aproximación lineal, es el cambio que más aumenta la pérdida sin mover ningún píxel más de ε. Es muy rápido y mostró que la vulnerabilidad de las redes se debe en buena parte a su comportamiento casi lineal en alta dimensión. Su versión iterativa, PGD, es más potente.","cuando":"Para generar ejemplos adversarios rápidamente, en evaluaciones iniciales de robustez o dentro del entrenamiento adversario.","ej":"Con ε = 0,007, FGSM convierte la foto de un panda, clasificada con un 58 % de confianza, en un gibón con un 99 %, sin ningún cambio visible.","hp":[["eps","tamaño máximo de la perturbación (por píxel con la norma L∞)"],["norm","norma con la que se mide la perturbación (L∞, L2…)"]],"py":[{"c":"art.attacks.evasion.FastGradientMethod","u":"https://adversarial-robustness-toolbox.readthedocs.io/en/latest/modules/attacks/evasion.html#art.attacks.evasion.FastGradientMethod"}],"rel":["ejemplos-adversarios","backpropagation","entrenamiento-robusto","diferenciacion-automatica"]},{"id":"ataque-de-un-pixel","name":"Ataque de un píxel","en":"one-pixel attack","frase":"Engañar a un clasificador de imágenes cambiando un único píxel, elegido con un algoritmo evolutivo.","desc":"Es un ataque de caja negra extremo: modifica uno o muy pocos píxeles, sin límite en cuánto los cambia. Usa evolución diferencial, un algoritmo evolutivo que no necesita gradientes, para buscar la posición y el color del píxel que más reducen la probabilidad de la clase correcta. En el estudio original bastó para engañar a la red en cerca de dos tercios de las imágenes de prueba de CIFAR-10, de 32 × 32 píxeles.","cuando":"Para evaluar la robustez de un clasificador de imágenes cuando solo se tiene acceso a sus predicciones.","ej":"Cambiar el color de un único píxel de una foto de 32 × 32 hace que la red clasifique un caballo como un coche.","hp":[["th","número de píxeles que se pueden modificar"],["es","estrategia evolutiva (CMA-ES o evolución diferencial)"],["max_iter","número de generaciones de la búsqueda"]],"py":[{"c":"art.attacks.evasion.PixelAttack","u":"https://adversarial-robustness-toolbox.readthedocs.io/en/latest/modules/attacks/evasion.html#art.attacks.evasion.PixelAttack"}],"rel":["ejemplos-adversarios","fgsm","cnn","robustez"]},{"id":"entrenamiento-robusto","name":"Entrenamiento robusto","en":"robust (adversarial) training","frase":"Entrenar el modelo con ejemplos adversarios o perturbados para que aprenda a resistirlos.","desc":"El entrenamiento adversario genera ejemplos adversarios durante el entrenamiento, por ejemplo con FGSM o PGD, y los mezcla con los datos limpios; equivale a minimizar la pérdida en el peor caso dentro de un radio de perturbación. Es la defensa empírica más eficaz, pero encarece el entrenamiento y suele restar algo de precisión en datos limpios. Las defensas certificadas, en cambio, garantizan matemáticamente la robustez dentro de un radio.","cuando":"Cuando el modelo debe resistir ataques o perturbaciones de un tamaño conocido y se puede asumir un entrenamiento más caro.","ej":"En CIFAR-10, entrenar con ejemplos PGD sube la precisión ante ese ataque de casi cero a cerca de la mitad de las imágenes, a cambio de perder unos 8 puntos en imágenes limpias.","hp":[["ratio","proporción de cada lote que se sustituye por ejemplos adversarios"]],"py":[{"c":"art.defences.trainer.AdversarialTrainer","u":"https://adversarial-robustness-toolbox.readthedocs.io/en/latest/modules/defences/trainer.html#art.defences.trainer.AdversarialTrainer"}],"rel":["fgsm","ejemplos-adversarios","data-augmentation","inyeccion-de-ruido","regularizacion-en-redes"]}]},{"id":"incertidumbre","name":"Incertidumbre","en":"uncertainty quantification","frase":"Cuantificar cuánto fiarse de cada predicción, además de la predicción en sí.","desc":"Un modelo útil debería indicar cuándo no está seguro, para que esos casos se revisen o se descarten. La incertidumbre puede deberse al ruido propio de los datos (aleatoria) o a la falta de conocimiento del modelo (epistémica). Se expresa con intervalos de predicción, probabilidades bien calibradas o conjuntos de predicción; la predicción conformal los construye para cualquier modelo con una cobertura garantizada.","cuando":"Cuando las predicciones apoyan decisiones de riesgo y hace falta saber en qué casos abstenerse o pedir revisión humana.","ej":"Un modelo prevé una demanda eléctrica de 520 MW para mañana, con un intervalo del 90 % entre 480 y 570 MW, y el operador planifica las reservas con el extremo superior.","hp":[["confidence_level","cobertura deseada de los intervalos"]],"py":[{"c":"mapie.regression.SplitConformalRegressor","u":"https://mapie.readthedocs.io/en/stable/generated/mapie.regression.SplitConformalRegressor.html"}],"rel":["intervalo-de-confianza","procesos-gaussianos","human-in-the-loop","ood","incertidumbre-aleatoria-y-epistemica"],"children":[{"id":"incertidumbre-aleatoria-y-epistemica","name":"Incertidumbre aleatoria y epistémica","en":"aleatoric & epistemic uncertainty","frase":"El ruido propio de los datos, que no se reduce, y el desconocimiento, que disminuye con más datos.","desc":"La incertidumbre aleatoria procede de la variabilidad intrínseca del fenómeno o del ruido de medida, y seguiría ahí con un modelo perfecto. La epistémica procede de lo que el modelo no sabe, por falta de datos en esa zona o por no saber qué parámetros son los correctos. Con un ensemble, la entropía de la predicción se descompone en la entropía media de cada modelo (aleatoria) y su desacuerdo (epistémica).","ej":"El resultado de un dado tiene incertidumbre aleatoria que ningún dato elimina; la altura media de los adultos de un país del que solo se ha medido a diez personas tiene sobre todo incertidumbre epistémica.","rel":["incertidumbre","informacion-mutua","probabilidad-frecuentista-vs-bayesiana","ood","compromiso-sesgo-varianza"]},{"id":"propagacion-de-la-incertidumbre","name":"Propagación de la incertidumbre","en":"uncertainty propagation","frase":"Calcular cómo se transmite la incertidumbre de las entradas a los resultados que dependen de ellas.","desc":"Si un resultado se calcula a partir de magnitudes inciertas, su incertidumbre depende de la de cada una y de cómo se combinan. La aproximación lineal usa las derivadas parciales: por ejemplo, en una suma de variables independientes se suman las varianzas. Si la función es muy no lineal o las distribuciones no son normales, se recurre a Monte Carlo: muestrear las entradas, calcular el resultado muchas veces y estudiar su distribución.","cuando":"Cuando las predicciones de un modelo alimentan cálculos posteriores, como dosis, pedidos de stock o simulaciones, y hay que saber cuánto fiarse del resultado.","ej":"Si la demanda diaria de un producto se predice con una desviación típica de 10 unidades y los errores de cada día son independientes, la de la demanda semanal es 10 × √7 ≈ 26 unidades, y no 70.","py":[{"c":"uncertainties.ufloat","u":"https://uncertainties.readthedocs.io/en/latest/user_guide.html#creating-variables-numbers-with-uncertainties"},{"c":"y = f(rng.normal(mu, sigma, size=10_000))","s":1}],"rel":["incertidumbre","distribuciones-de-probabilidad","intervalo-de-confianza","estimacion-de-incertidumbre-en-redes"]},{"id":"estimacion-de-incertidumbre-en-redes","name":"Estimación de incertidumbre en redes","en":"uncertainty estimation in neural networks","frase":"Hacer que una red indique cuánto se fía de cada predicción, con ensembles, dropout o predicción conformal.","desc":"Las probabilidades de la softmax suelen estar mal calibradas y no reflejan lo que la red no sabe: puede dar un 99 % a una entrada absurda. Para estimarlo se entrenan varias redes con distinta inicialización y se mide su desacuerdo (deep ensembles), o se mantiene el dropout activo al predecir y se repite la predicción (MC dropout). El escalado de temperatura mejora la calibración, y la predicción conformal da conjuntos con cobertura garantizada.","cuando":"Cuando una predicción equivocada con mucha confianza sale cara, como en diagnóstico médico o conducción autónoma.","ej":"Un clasificador de lesiones cutáneas con MC dropout repite cada predicción 30 veces: en una imagen nítida coinciden todas; en una borrosa oscilan entre tres diagnósticos, y el caso se deriva al dermatólogo.","hp":[["confidence_level","cobertura deseada de los conjuntos de predicción"]],"py":[{"c":"modelo(x, training=True)","s":1},{"c":"mapie.classification.SplitConformalClassifier","u":"https://mapie.readthedocs.io/en/stable/generated/mapie.classification.SplitConformalClassifier.html"}],"rel":["dropout","ensembles","incertidumbre-aleatoria-y-epistemica","softmax","ood"]}]},{"id":"regulacion-y-gobernanza","name":"Regulación y gobernanza","en":"AI regulation & governance","frase":"Normas, estándares y prácticas para que la IA se desarrolle y se use de forma legal y responsable.","desc":"Los sistemas de IA están sujetos a leyes generales, como la de protección de datos, y cada vez más a leyes específicas, como el Reglamento Europeo de IA. A ello se suman estándares técnicos y marcos voluntarios para gestionar sus riesgos, y prácticas de documentación como las model cards. La gobernanza convierte todo ello en procesos dentro de la organización: inventario de modelos, evaluación de riesgos, supervisión humana, registros y auditorías.","cuando":"Desde el inicio de cualquier proyecto que diseñe, compre o despliegue un sistema de IA que afecte a personas o a procesos críticos.","ej":"Antes de desplegar un asistente conversacional en un hospital, se clasifica su nivel de riesgo, se documentan sus datos y limitaciones y se define quién revisa sus respuestas.","rel":["ai-act","decisiones-automatizadas-y-rgpd","gobernanza-ia","model-cards","mlops"],"children":[{"id":"decisiones-automatizadas-y-rgpd","name":"Decisiones automatizadas y RGPD","en":"automated decision-making & GDPR (art. 22)","frase":"El RGPD limita las decisiones totalmente automatizadas que afectan de forma significativa a las personas.","desc":"El artículo 22 del Reglamento General de Protección de Datos reconoce el derecho a no ser objeto de decisiones basadas únicamente en tratamiento automatizado, incluida la elaboración de perfiles, con efectos jurídicos o igual de significativos. Se permiten si son necesarias para un contrato, las autoriza la ley o hay consentimiento explícito, con garantías como la intervención humana y el derecho a impugnar. La persona también debe recibir información significativa sobre la lógica aplicada.","ej":"Una plataforma de empleo que descarta candidaturas de forma automática, sin revisión humana, debe permitir que un candidato pida que una persona revise su caso y explicarle en qué se basó la decisión.","rel":["human-in-the-loop","explicaciones-contrafactuales","xai","ai-act"]},{"id":"ai-act","name":"AI Act","en":"EU AI Act","frase":"El reglamento europeo que regula la IA según su riesgo, desde usos prohibidos hasta obligaciones de transparencia.","desc":"El Reglamento (UE) 2024/1689 clasifica los sistemas según su riesgo. Prohíbe prácticas inaceptables, como la puntuación social o la manipulación que explota vulnerabilidades. Los sistemas de alto riesgo, en ámbitos como el empleo, la educación o la aplicación de la ley, deben cumplir requisitos de gestión de riesgos, calidad de datos, documentación, supervisión humana, precisión y robustez. Los chatbots y los deepfakes tienen obligaciones de transparencia, y los modelos de propósito general, obligaciones propias.","ej":"Un sistema que filtra currículos es de alto riesgo: su proveedor debe documentarlo, registrar su funcionamiento y garantizar la supervisión humana. Un chatbot de atención al cliente solo debe dejar claro que se está hablando con una IA.","rel":["decisiones-automatizadas-y-rgpd","gobernanza-ia","model-cards","human-in-the-loop","que-es-un-modelo-fundacional"]},{"id":"gobernanza-ia","name":"Estándares y gobernanza de la IA","en":"AI standards & governance (ISO/IEC 42001, NIST AI RMF)","frase":"Marcos y normas técnicas para gestionar de forma sistemática los riesgos de la IA en una organización.","desc":"Los estándares convierten principios generales en procesos auditables. ISO/IEC 42001 define un sistema de gestión de la IA certificable, al estilo de ISO/IEC 27001 para la seguridad de la información, e ISO/IEC 23894 trata la gestión de sus riesgos. El marco de gestión de riesgos de IA del NIST organiza el trabajo en cuatro funciones: gobernar, mapear, medir y gestionar. En la práctica implica inventariar modelos, asignar responsables, evaluar riesgos y revisar periódicamente.","cuando":"Para organizar cómo se desarrollan, compran y supervisan los sistemas de IA en una organización y prepararse para auditorías o certificaciones.","ej":"Una empresa mantiene un registro de todos sus modelos con su responsable, su nivel de riesgo, sus datos de entrenamiento y la fecha de su última evaluación.","rel":["ai-act","mlops","model-cards","seguimiento-de-experimentos","regulacion-y-gobernanza"]},{"id":"model-cards","name":"Model cards","en":"model cards","frase":"Fichas que acompañan a un modelo: para qué sirve, cómo se evaluó, sus limitaciones y sus riesgos.","desc":"Propuestas en 2019, las model cards resumen los detalles del modelo, su uso previsto y los usos desaconsejados, los datos de entrenamiento y evaluación, las métricas, también desglosadas por grupos, y las limitaciones y consideraciones éticas. Su equivalente para los conjuntos de datos son las datasheets for datasets. Son la práctica habitual en repositorios como Hugging Face y facilitan cumplir las obligaciones de documentación de la regulación.","cuando":"Al publicar o desplegar cualquier modelo, sobre todo si otras personas lo van a reutilizar o si interviene en decisiones sobre personas.","ej":"La model card de un reconocedor de voz indica que se evaluó con hablantes adultos de inglés y español, que su tasa de error se duplica con voces infantiles y que no debe usarse para vigilancia.","py":[{"c":"huggingface_hub.ModelCard","u":"https://huggingface.co/docs/huggingface_hub/package_reference/cards#huggingface_hub.ModelCard"},{"c":"huggingface_hub.ModelCardData","u":"https://huggingface.co/docs/huggingface_hub/package_reference/cards#huggingface_hub.ModelCardData"}],"rel":["hugging-face","gobernanza-ia","metricas-de-equidad","ai-act","reconocimiento-de-voz"]}]}]},{"id":"aprendizaje-por-refuerzo","name":"Aprendizaje por refuerzo","en":"reinforcement learning","frase":"Aprender a decidir por ensayo y error, maximizando una recompensa acumulada.","desc":"Un agente aprende a tomar decisiones interactuando con un entorno. Actúa, recibe una recompensa y ajusta su política para maximizar la recompensa acumulada. No hay etiquetas con la respuesta correcta, solo señales de lo bien o mal que ha ido, y el dilema central es explorar acciones nuevas o explotar las que ya funcionan.","cuando":"Cuando hay que tomar decisiones en secuencia y aprender de la recompensa que generan, sin respuestas correctas de antemano.","ej":"AlphaGo Zero aprendió a jugar al go desde cero jugando millones de partidas contra sí mismo. Un sistema de anuncios elige qué banner mostrar según los clics que va recibiendo.","rel":["agente-entorno-y-recompensa","exploracion-vs-explotacion","multi-armed-bandits","rlhf"],"children":[{"id":"agente-entorno-y-recompensa","name":"Agente, entorno y recompensa","en":"agent, environment & reward","frase":"Un agente actúa en un entorno, observa el resultado y recibe recompensas; aprende a actuar para maximizarlas.","desc":"En el aprendizaje por refuerzo no hay respuestas correctas: el agente observa el estado del entorno, elige una acción, el entorno cambia de estado y devuelve una recompensa. El objetivo es maximizar la recompensa acumulada a largo plazo, lo que puede exigir sacrificar recompensas inmediatas. Se formaliza como un proceso de decisión de Markov: estados, acciones, transiciones, recompensas y un factor de descuento.","ej":"Un agente que aprende a jugar al ajedrez recibe +1 al ganar, −1 al perder y 0 en cualquier otra jugada, y debe descubrir qué movimientos llevan a la victoria.","py":[{"c":"gymnasium.make","u":"https://gymnasium.farama.org/api/registry/#gymnasium.make"},{"c":"gymnasium.Env","u":"https://gymnasium.farama.org/api/env/"}],"rel":["politica-y-funcion-de-valor","exploracion-vs-explotacion","paradigmas-de-aprendizaje","multi-armed-bandits"]},{"id":"politica-y-funcion-de-valor","name":"Política y función de valor","en":"policy & value function","frase":"La política dice qué hacer en cada estado; la función de valor, cuánta recompensa futura cabe esperar.","desc":"La política π(a|s) es la estrategia del agente: la probabilidad de elegir cada acción en cada estado. La función de valor V(s) estima la recompensa acumulada esperada a partir de un estado siguiendo la política, y la función Q(s, a), la de tomar una acción concreta y seguir la política después. Los métodos basados en valor aprenden Q y actúan de forma voraz respecto a ella; los de gradiente de política optimizan π directamente; los actor-crítico combinan ambas ideas.","ej":"En un laberinto, V es alto en las casillas cercanas a la salida, y la política consiste en moverse siempre hacia la casilla vecina de mayor valor.","rel":["agente-entorno-y-recompensa","ppo","exploracion-vs-explotacion","regret"]},{"id":"exploracion-vs-explotacion","name":"Exploración vs explotación","en":"exploration vs exploitation","frase":"El dilema entre aprovechar lo que ya sabes que funciona y probar opciones nuevas que podrían ser mejores.","desc":"Explotar maximiza la recompensa inmediata con el conocimiento actual; explorar sacrifica algo de recompensa para obtener información que puede mejorar las decisiones futuras. Si se explota demasiado pronto, el agente se queda con una opción mediocre; si se explora demasiado, desperdicia oportunidades. Estrategias como ε-greedy, UCB o el muestreo de Thompson resuelven el dilema de formas distintas.","ej":"Ir siempre a tu restaurante favorito (explotar) o probar uno nuevo que podría convertirse en tu nuevo favorito (explorar).","rel":["multi-armed-bandits","epsilon-greedy","ucb","muestreo-de-thompson","arranque-en-frio"]},{"id":"multi-armed-bandits","name":"Multi-armed bandits","en":"multi-armed bandits","frase":"Elegir repetidamente entre varias opciones de recompensa incierta, aprendiendo cuál es la mejor mientras se decide.","desc":"Es el problema de aprendizaje por refuerzo más simple: no hay estados, solo K acciones (los brazos de una máquina tragaperras) cuyas recompensas siguen distribuciones desconocidas. En cada ronda se elige un brazo, se observa su recompensa y se actualiza lo que se sabe. Se usa como alternativa adaptativa a los tests A/B, porque desvía el tráfico hacia las mejores opciones mientras aprende, y en recomendación, publicidad y ensayos clínicos.","cuando":"Para elegir en línea entre varias alternativas (versiones de una web, anuncios, precios) minimizando lo que se pierde mientras se aprende.","ej":"Una web prueba cinco titulares para una noticia y, en pocas horas, el bandit muestra casi siempre el que más clics consigue.","py":[{"c":"mabwiser.mab.MAB","u":"https://github.com/fidelity/mabwiser"}],"rel":["exploracion-vs-explotacion","epsilon-greedy","ucb","muestreo-de-thompson","regret"],"children":[{"id":"epsilon-greedy","name":"Greedy y ε-greedy","en":"greedy & ε-greedy","frase":"Elegir casi siempre la mejor opción conocida y, con una pequeña probabilidad ε, una al azar.","desc":"La estrategia voraz (greedy) elige siempre el brazo con la mejor recompensa media estimada, y puede quedarse atascada en uno mediocre si al principio tuvo suerte. ε-greedy explora con probabilidad ε eligiendo un brazo al azar, lo que garantiza que todos se sigan probando. Es simple y eficaz, y es habitual reducir ε con el tiempo para explorar mucho al principio y poco después.","cuando":"Como estrategia de referencia sencilla en bandits y en aprendizaje por refuerzo.","ej":"Con ε = 0,1, nueve de cada diez visitantes ven el titular que mejor ha funcionado hasta ahora y uno de cada diez, un titular al azar.","hp":[["epsilon","probabilidad de explorar con una acción al azar"]],"py":[{"c":"mabwiser.mab.LearningPolicy.EpsilonGreedy","u":"https://github.com/fidelity/mabwiser"}],"rel":["multi-armed-bandits","exploracion-vs-explotacion","valores-iniciales-optimistas","ucb"]},{"id":"valores-iniciales-optimistas","name":"Valores iniciales optimistas","en":"optimistic initial values","frase":"Empezar suponiendo que todas las opciones son excelentes, para que el agente se vea obligado a probarlas todas.","desc":"Si las estimaciones iniciales de recompensa son muy altas, cualquier opción probada decepciona y su estimación baja, así que el agente voraz pasa a probar las que todavía conservan su valor optimista. El resultado es una exploración sistemática al principio, sin aleatoriedad. Funciona bien en problemas estacionarios, pero no ayuda si las recompensas cambian con el tiempo, porque la exploración ocurre solo al inicio.","cuando":"En bandits estacionarios con pocas opciones, como forma sencilla de forzar la exploración inicial.","ej":"Con recompensas entre 0 y 1, iniciar todas las estimaciones en 5 hace que el agente pruebe cada opción varias veces antes de decidirse.","py":[{"c":"Q = np.full(n_brazos, 5.0)","s":1}],"rel":["epsilon-greedy","exploracion-vs-explotacion","multi-armed-bandits","prior-verosimilitud-y-posterior"]},{"id":"ucb","name":"UCB (Upper Confidence Bound)","en":"UCB (upper confidence bound)","frase":"Elegir la opción con la estimación más optimista: su media más un margen que crece cuanto menos se ha probado.","desc":"Upper Confidence Bound suma a la recompensa media de cada brazo un término de incertidumbre proporcional a √(ln t / n), donde t es el número total de rondas y n, las veces que se ha probado ese brazo. Los brazos poco explorados tienen un margen grande y acaban probándose; a medida que se prueban, el margen se reduce. Es el principio de \"optimismo ante la incertidumbre\" y tiene garantías teóricas de regret logarítmico.","cuando":"En bandits con recompensas estacionarias cuando se quiere una exploración dirigida, sin aleatoriedad.","ej":"Un titular con una tasa de clics media del 4 % probado 10 veces puede elegirse antes que otro del 5 % probado 1.000 veces, porque su incertidumbre es mucho mayor.","hp":[["alpha","peso del término de exploración"]],"py":[{"c":"mabwiser.mab.LearningPolicy.UCB1","u":"https://github.com/fidelity/mabwiser"}],"rel":["multi-armed-bandits","exploracion-vs-explotacion","intervalo-de-confianza","regret"]},{"id":"muestreo-de-thompson","name":"Muestreo de Thompson","en":"Thompson sampling","frase":"Elegir cada opción con la probabilidad de que sea la mejor, muestreando de la distribución posterior de su recompensa.","desc":"Mantiene una distribución de creencia bayesiana sobre la recompensa de cada brazo, por ejemplo una Beta para tasas de éxito. En cada ronda toma una muestra de cada distribución, elige el brazo con la muestra más alta y actualiza su posterior con el resultado. Explora de forma natural las opciones inciertas y converge a la mejor; en la práctica suele superar a ε-greedy y a UCB.","cuando":"Como estrategia por defecto en bandits, sobre todo con recompensas binarias como clics o conversiones.","ej":"Con dos versiones de un botón, una con 30 clics en 1.000 visitas y otra con 5 en 100, el muestreo de Thompson sigue mostrando a veces la segunda porque su tasa real aún es muy incierta.","py":[{"c":"mabwiser.mab.LearningPolicy.ThompsonSampling","u":"https://github.com/fidelity/mabwiser"},{"c":"numpy.random.Generator.beta","u":"https://numpy.org/doc/stable/reference/random/generated/numpy.random.Generator.beta.html"}],"rel":["prior-verosimilitud-y-posterior","multi-armed-bandits","ucb","teorema-de-bayes"]},{"id":"bandits-contextuales","name":"Bandits contextuales (LinUCB)","en":"contextual bandits (LinUCB)","frase":"Bandits que eligen la acción teniendo en cuenta el contexto de cada decisión, como las características del usuario.","desc":"En lugar de buscar la mejor opción para todos, aprenden qué opción es mejor en cada contexto. LinUCB modela la recompensa de cada brazo como una función lineal del contexto y aplica UCB sobre esa estimación. Están a medio camino entre los bandits simples y el aprendizaje por refuerzo completo: hay contexto, pero las acciones no cambian el estado futuro.","cuando":"Para personalizar decisiones en línea (qué noticia, oferta o diseño mostrar) según las características de cada usuario o situación.","ej":"Una app de noticias elige el titular de portada para cada lector según su ubicación, la hora y los temas que lee, aprendiendo de cada clic.","hp":[["alpha","peso del término de exploración en LinUCB"],["l2_lambda","regularización de los modelos lineales"]],"py":[{"c":"mabwiser.mab.LearningPolicy.LinUCB","u":"https://github.com/fidelity/mabwiser"}],"rel":["multi-armed-bandits","ucb","regresion-lineal","recomendacion-con-deep-learning"]}]},{"id":"regret","name":"Regret","en":"regret","frase":"Lo que se pierde por no haber elegido siempre la mejor opción: la medida de calidad de una estrategia de bandit.","desc":"El regret acumulado es la diferencia entre la recompensa que se habría obtenido eligiendo siempre la mejor acción y la que realmente se obtuvo. Una buena estrategia tiene un regret que crece cada vez más despacio, como el logaritmo del número de rondas, porque aprende pronto cuál es la mejor opción. Sirve para comparar estrategias en simulación y para cuantificar el coste de aprender.","ej":"Si el mejor anuncio da 5 clics por cada 100 visitas y la estrategia ha obtenido 4,2 de media en 10.000 visitas, el regret acumulado es de 80 clics.","rel":["multi-armed-bandits","exploracion-vs-explotacion","ucb","muestreo-de-thompson"]}]}]}</script>
<script>
(() => {
  "use strict";
  const DATA = JSON.parse(document.getElementById("datos").textContent);
  const $ = (s) => document.querySelector(s);
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const isMobile = () => matchMedia("(max-width: 860px)").matches;
  const DEFAULT_ID = "aprendizaje-supervisado";   // vista inicial sin enlace directo

  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  // ---------- Índice del árbol ----------
  const areas = DATA.children || [];
  const byId = new Map(), order = [];
  (function index(n, parent, depth, area) {
    n.parent = parent; n.depth = depth; n.area = depth === 1 ? n : area;
    n.ai = n.area ? areas.indexOf(n.area) : -1;            // índice de área → color viridis
    byId.set(n.id, n); order.push(n);
    (n.children || []).forEach((c) => index(c, n, depth + 1, depth === 0 ? null : n.area));
  })(DATA, null, 0, null);
  const total = order.length - 1;                             // sin contar la raíz
  const conFicha = order.filter((n) => n.depth > 0 && n.desc).length;
  const color = (n) => (n.ai >= 0 ? `var(--a${n.ai})` : "var(--accent)");

  $("#q").placeholder = `Buscar entre ${total} conceptos`;
  if (conFicha < total) {
    const p = $("#m-estado");
    p.textContent = `Prototipo: ${conFicha} de ${total} fichas redactadas`;
    p.hidden = false;
  }

  // ---------- Estado ----------
  const expanded = new Set([DATA.id]);
  let selected = DATA.id, pathSet = new Set([DATA.id]);
  const ZOOMS = [0.55, 0.7, 0.85, 1, 1.15, 1.3];
  let zi = 3;

  // ---------- Nodos (se crean una vez; se muestran u ocultan) ----------
  const viewport = $("#viewport"), sizer = $("#sizer"), canvas = $("#canvas");
  const nodesEl = $("#nodes"), wiresEl = $("#wires");
  const els = new Map(), heights = new Map();
  order.forEach((n) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = `node d${Math.min(n.depth, 2)}` + (n.depth > 0 && !n.desc ? " pending" : "");
    b.style.setProperty("--c", color(n));
    b.innerHTML = '<span class="port in"></span><span class="label"></span>' +
      (n.children ? '<span class="count"></span><span class="port out"></span>' : "");
    // Las palabras con guion (k-NN, t-SNE, multi-salida) no se parten a final de línea
    b.querySelector(".label").innerHTML = esc(n.name).replace(/(\S+-\S+)/g, '<span class="nw">$1</span>');
    b.setAttribute("aria-label", n.name);
    b.hidden = true;
    b.addEventListener("click", () => { hideTip(); onNodeClick(n.id); });
    // "En una frase": al pasar el ratón (no en pantallas táctiles) o al llegar con el teclado
    b.addEventListener("pointerenter", (e) => { if (e.pointerType !== "touch") scheduleTip(n, b); });
    b.addEventListener("pointerleave", hideTip);
    b.addEventListener("focus", () => { if (b.matches(":focus-visible")) scheduleTip(n, b, 0); });
    b.addEventListener("blur", hideTip);
    nodesEl.appendChild(b);
    els.set(n.id, b);
  });

  // ---------- Layout: árbol horizontal con alturas variables ----------
  const PAD = 32, GAP_X = 58, GAP_Y = 8, GAP_GROUP = 14, W_ROOT = 168, W_NODE = 216;
  const nodeW = (n) => (n.depth === 0 ? W_ROOT : W_NODE);
  const colX = (d) => PAD + (d === 0 ? 0 : W_ROOT + GAP_X + (d - 1) * (W_NODE + GAP_X));

  function visibleList() {
    const out = [];
    (function walk(n) { out.push(n); if (expanded.has(n.id)) (n.children || []).forEach(walk); })(DATA);
    return out;
  }

  function layout() {
    let cursor = PAD;
    (function place(n) {
      n._x = colX(n.depth); n._w = nodeW(n); n._h = heights.get(n.id);
      const kids = expanded.has(n.id) ? n.children || [] : [];
      if (!kids.length) { n._y = cursor; cursor += n._h + GAP_Y; return; }
      const start = cursor;
      kids.forEach(place);
      const first = kids[0], last = kids[kids.length - 1];
      n._y = Math.max(start, (first._y + last._y + last._h) / 2 - n._h / 2);   // centrado sobre sus hijos
      cursor = Math.max(cursor, n._y + n._h + GAP_Y) + GAP_GROUP;
    })(DATA);
    return cursor;
  }

  function render(nuevos = new Set()) {
    const list = visibleList();
    const vis = new Set(list.map((n) => n.id));
    order.forEach((n) => { const el = els.get(n.id); if (el.hidden === vis.has(n.id)) el.hidden = !vis.has(n.id); });
    list.forEach((n) => { if (!heights.has(n.id)) heights.set(n.id, els.get(n.id).offsetHeight); });
    const H = layout() + PAD;
    let W = 0, k = 0;
    list.forEach((n) => {
      const el = els.get(n.id);
      el.style.transform = `translate(${n._x}px, ${n._y}px)`;
      W = Math.max(W, n._x + n._w + PAD);
      const abierto = expanded.has(n.id) && !!n.children;
      if (n.children) {
        el.setAttribute("aria-expanded", String(abierto));
        el.querySelector(".count").textContent = abierto ? "" : n.children.length;
      }
      el.classList.toggle("open", abierto);
      el.classList.toggle("sel", n.id === selected);
      el.classList.toggle("path", pathSet.has(n.id) && n.id !== selected);
      if (n.id === selected) el.setAttribute("aria-current", "true"); else el.removeAttribute("aria-current");
      if (nuevos.has(n.id) && !reduceMotion) {
        el.classList.remove("enter"); void el.offsetWidth;
        el.style.setProperty("--i", k++); el.classList.add("enter");
      }
    });
    const z = ZOOMS[zi];
    canvas.style.width = W + "px"; canvas.style.height = H + "px";
    canvas.style.transform = `scale(${z})`;
    sizer.style.width = W * z + "px"; sizer.style.height = H * z + "px";
    drawWires(list, nuevos, W, H);
  }

  function drawWires(list, nuevos, W, H) {
    wiresEl.setAttribute("width", W); wiresEl.setAttribute("height", H);
    wiresEl.setAttribute("viewBox", `0 0 ${W} ${H}`);
    let s = "";
    list.forEach((n) => {
      const p = n.parent;
      if (!p) return;
      const x1 = p._x + p._w, y1 = p._y + p._h / 2, x2 = n._x, y2 = n._y + n._h / 2, dx = (x2 - x1) / 2;
      const cls = "w" + (pathSet.has(n.id) ? " on" : "") + (nuevos.has(n.id) && !reduceMotion ? " draw" : "");
      s += `<path class="${cls}" pathLength="1" style="stroke:${color(n)}" d="M${x1} ${y1}C${x1 + dx} ${y1} ${x2 - dx} ${y2} ${x2} ${y2}"/>`;
    });
    wiresEl.innerHTML = s;
  }

  // ---------- Navegación ----------
  function setPath() {
    pathSet = new Set();
    for (let n = byId.get(selected); n; n = n.parent) pathSet.add(n.id);
  }

  function select(id, { expand = false, sheet = false, instant = false } = {}) {
    const n = byId.get(id);
    if (!n) return;
    const nuevos = new Set();
    for (let p = n.parent; p; p = p.parent) {
      if (!expanded.has(p.id)) { expanded.add(p.id); (p.children || []).forEach((c) => nuevos.add(c.id)); }
    }
    if (expand && n.children && !expanded.has(id)) { expanded.add(id); n.children.forEach((c) => nuevos.add(c.id)); }
    selected = id;
    setPath();
    render(nuevos);
    renderCard(n);
    reveal(n, instant);
    try { history.replaceState(null, "", "#" + id); } catch (e) { /* sin historial disponible */ }
    if (sheet && isMobile()) setSheet(sheet);              // en móvil: primero la frase ("peek"), luego la ficha
  }

  function onNodeClick(id) {
    const n = byId.get(id);
    if (n.children && n.depth > 0 && selected === id && expanded.has(id)) {   // segundo clic: plegar
      (function fold(m) { expanded.delete(m.id); (m.children || []).forEach(fold); })(n);
      render();
      return;
    }
    select(id, { expand: true, sheet: "peek" });
  }

  // ---------- "En una frase": tarjeta flotante junto al nodo ----------
  const tip = $("#tip"), tipText = $("#tip-text");
  let tipTimer = 0, tipFor = null;
  function scheduleTip(n, el, delay = 380) {
    clearTimeout(tipTimer);
    if (!n.frase || n.id === selected || isMobile()) return;   // la ficha abierta ya lo dice; en móvil va en la hoja
    tipTimer = setTimeout(() => showTip(n, el), delay);
  }
  function showTip(n, el) {
    tipText.textContent = n.frase;
    tip.style.setProperty("--c", color(n));
    tip.hidden = false;
    tip.classList.remove("on");
    const r = el.getBoundingClientRect(), v = viewport.getBoundingClientRect();
    const w = Math.min(300, v.width - 24);
    tip.style.maxWidth = w + "px";
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    // Debajo del nodo; si no cabe en el mapa, encima. Nunca tapa el propio nodo.
    let top = r.bottom + 10, down = false;
    if (top + th > v.bottom - 8 && r.top - th - 10 > v.top + 4) { top = r.top - th - 10; down = true; }
    const left = Math.min(Math.max(r.left + 4, v.left + 8), v.right - tw - 8);
    tip.style.top = top + "px"; tip.style.left = left + "px";
    tip.style.setProperty("--ax", Math.min(Math.max(r.left + 22 - left, 16), tw - 16) + "px");   // flecha hacia el nodo
    tip.classList.toggle("down", down);
    el.setAttribute("aria-describedby", "tip");
    tipFor = el;
    requestAnimationFrame(() => tip.classList.add("on"));
  }
  function hideTip() {
    clearTimeout(tipTimer);
    if (tipFor) { tipFor.removeAttribute("aria-describedby"); tipFor = null; }
    tip.classList.remove("on");
    tip.hidden = true;
  }
  viewport.addEventListener("scroll", hideTip, { passive: true });

  // Desplaza lo justo para que el nodo (y su columna de hijos, si está abierto) quede a la vista
  function reveal(n, instant) {
    const z = ZOOMS[zi], vw = viewport.clientWidth, vh = viewport.clientHeight;
    const right = (n._x + n._w + (expanded.has(n.id) && n.children ? GAP_X + W_NODE : 0)) * z + 24;
    let left = viewport.scrollLeft;
    if (right > left + vw) left = right - vw;
    if (n._x * z - 24 < left) left = n._x * z - 24;
    const top = (n._y + n._h / 2) * z - vh / 2;
    viewport.scrollTo({ left: Math.max(0, left), top: Math.max(0, top), behavior: instant || reduceMotion ? "auto" : "smooth" });
  }

  // ---------- Ficha ----------
  const ficha = $("#ficha");
  const fmt = (s) => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
  const norm = (s) => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

  const chip = (id) => {
    const m = byId.get(id);
    const t = m.frase ? ` title="${esc(m.frase)}"` : "";
    return `<button type="button" class="chip" data-go="${m.id}" style="--c:${color(m)}"${t}><span class="dot"></span>${esc(m.name)}</button>`;
  };
  const ICONO_EXT = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M5 2H2v8h8V7M7 2h3v3M10 2 5.5 6.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const pyItem = (p) => {
    const docs = p.u ? `<a class="docs" href="${esc(p.u)}" target="_blank" rel="noopener noreferrer" aria-label="Documentación oficial de ${esc(p.c)} (se abre en una pestaña nueva)">Docs ${ICONO_EXT}</a>` : "";
    return `<li><code>${esc(p.c)}</code>${docs}<button type="button" class="copy" data-copy="${esc(p.c)}">Copiar</button></li>`;
  };

  function renderCard(n) {
    const ruta = [];
    for (let p = n.parent; p && p.depth > 0; p = p.parent) ruta.unshift(p);
    const h = [];
    h.push('<nav class="crumbs" aria-label="Ruta">' + (n.depth === 0 ? "<span>Raíz del mapa</span>" :
      ['<button type="button" data-go="' + DATA.id + '">IA</button>']
        .concat(ruta.map((p) => `<button type="button" data-go="${p.id}">${esc(p.name)}</button>`))
        .join('<span aria-hidden="true">›</span>')) + "</nav>");
    h.push(`<h2 id="ficha-titulo">${esc(n.name)}</h2>`);
    if (n.en && norm(n.en) !== norm(n.name)) h.push(`<p class="en" lang="en">${esc(n.en)}</p>`);
    if (n.desc) {
      // Orden de lectura: qué es (frase + explicación) → cuándo usarlo → ejemplo → cómo usarlo (hiperparámetros, Python)
      if (n.frase) h.push(`<p class="lead">${fmt(n.frase)}</p>`);
      h.push(`<p class="desc">${fmt(n.desc)}</p>`);
      if (n.cuando) h.push(`<section class="blk cuando"><h3>Cuándo usarlo</h3><p>${fmt(n.cuando)}</p></section>`);
      if (n.ej) h.push(`<section class="blk ej"><h3>Ejemplo</h3><p>${fmt(n.ej)}</p></section>`);
      if (n.hp && n.hp.length) h.push(`<section class="blk"><h3>Hiperparámetros clave</h3><dl class="hp">${
        n.hp.map(([k, v]) => `<dt>${k.split("/").map((s) => `<code>${esc(s.trim())}</code>`).join(" / ")}</dt><dd>${fmt(v)}</dd>`).join("")}</dl></section>`);
    } else {
      h.push('<p class="pending-note">Esta ficha todavía no está redactada en el prototipo.</p>');
    }
    if (n.py && n.py.length) h.push(`<section class="blk"><h3>En Python</h3><ul class="py">${n.py.map(pyItem).join("")}</ul></section>`);
    if (n.rel && n.rel.length) h.push(`<section class="blk"><h3>Relacionados</h3><div class="chips">${n.rel.map(chip).join("")}</div></section>`);
    if (n.children) h.push(`<section class="blk"><h3>En esta rama (${n.children.length})</h3><div class="chips">${n.children.map((c) => chip(c.id)).join("")}</div></section>`);
    const i = order.indexOf(n), prev = order[i - 1], next = order[i + 1];
    h.push('<footer class="seq">' +
      `<button type="button" class="btn" data-go="${prev ? prev.id : ""}"${prev ? "" : " disabled"}>Anterior</button>` +
      `<span class="pos">${i} de ${total}</span>` +
      `<button type="button" class="btn" data-go="${next ? next.id : ""}"${next ? "" : " disabled"}>Siguiente</button></footer>`);
    if (n.depth === 0) h.push('<p class="foot">Pasa el ratón por un concepto para ver su idea en una frase; púlsalo para abrir su ficha y su rama. Cada área lleva su color de la escala viridis. Atajos: <kbd>/</kbd> para buscar, <kbd>←</kbd> y <kbd>→</kbd> para pasar al concepto anterior o siguiente.</p>');
    ficha.innerHTML = h.join("");
    $("#peek-title").textContent = n.name;
    $("#peek-frase").textContent = n.frase || "";
    $("#panel").scrollTop = 0;
    updatePeek();
  }

  // Altura de la hoja asomada (móvil): lo que mida la cabecera con nombre y frase
  function updatePeek() {
    if (!isMobile()) return;
    const h = $("#handle").offsetHeight;
    if (h) document.documentElement.style.setProperty("--peek", h + "px");
  }

  $("#panel").addEventListener("click", (e) => {
    const go = e.target.closest("[data-go]");
    if (go && go.dataset.go) { select(go.dataset.go, { expand: true }); return; }
    const cp = e.target.closest(".copy");
    if (cp) copiar(cp);
  });

  function copiar(btn) {
    const done = (t) => { btn.textContent = t; setTimeout(() => (btn.textContent = "Copiar"), 1400); };
    const fallback = () => {
      const r = document.createRange(); r.selectNodeContents(btn.previousElementSibling);
      const s = getSelection(); s.removeAllRanges(); s.addRange(r); done("Seleccionado");
    };
    try { navigator.clipboard.writeText(btn.dataset.copy).then(() => done("Copiado"), fallback); }
    catch (e) { fallback(); }
  }

  // ---------- Hoja inferior (móvil) ----------
  const panel = $("#panel"), handle = $("#handle");
  function setSheet(state) {
    panel.dataset.state = state;
    handle.setAttribute("aria-expanded", String(state === "open"));
    $("#peek-accion").textContent = state === "open" ? "Ocultar" : "Ver ficha";
  }
  handle.addEventListener("click", () => setSheet(panel.dataset.state === "open" ? "peek" : "open"));

  // ---------- Buscador ----------
  const q = $("#q"), res = $("#resultados");
  const idx = order.filter((n) => n.depth > 0).map((n) => ({
    n, name: norm(n.name), all: norm([n.name, n.en || "", n.frase || "", n.desc || "", n.cuando || "", n.ej || ""].join(" ")),
  }));
  let hits = [], active = -1;

  function buscar(texto) {
    const t = norm(texto.trim()).split(/\s+/).filter(Boolean);
    if (!t.length) return [];
    const out = [];
    idx.forEach((r) => {
      if (!t.every((w) => r.all.includes(w))) return;
      const frase = t.join(" ");
      const score = r.name.startsWith(frase) ? 4 : r.name.includes(frase) ? 3 : t.every((w) => r.name.includes(w)) ? 2 : 1;
      out.push([score, r.n]);
    });
    out.sort((a, b) => b[0] - a[0] || a[1].name.length - b[1].name.length);
    return out.slice(0, 14).map((x) => x[1]);
  }

  function pintarResultados() {
    if (!q.value.trim()) { cerrarResultados(); return; }
    res.innerHTML = hits.length ? hits.map((n, i) =>
      `<li><button type="button" role="option" id="op-${i}" data-go="${n.id}" aria-selected="${i === active}" style="--c:${color(n)}">` +
      `<span class="dot"></span><span class="r-name">${esc(n.name)}</span><span class="r-area">${esc(n.area ? n.area.name : "")}</span>` +
      (n.frase ? `<span class="r-frase">${esc(n.frase)}</span>` : "") + `</button></li>`).join("")
      : '<li class="vacio">Ningún concepto coincide. Prueba con otra palabra o con el término en inglés.</li>';
    res.hidden = false;
    q.setAttribute("aria-expanded", "true");
    if (active >= 0) q.setAttribute("aria-activedescendant", `op-${active}`); else q.removeAttribute("aria-activedescendant");
  }
  function cerrarResultados() { res.hidden = true; q.setAttribute("aria-expanded", "false"); active = -1; }
  function elegir(id) { cerrarResultados(); q.value = ""; select(id, { expand: true, sheet: "peek" }); }

  q.addEventListener("input", () => { hits = buscar(q.value); active = hits.length ? 0 : -1; pintarResultados(); });
  q.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown" && hits.length) { active = (active + 1) % hits.length; pintarResultados(); e.preventDefault(); }
    else if (e.key === "ArrowUp" && hits.length) { active = (active - 1 + hits.length) % hits.length; pintarResultados(); e.preventDefault(); }
    else if (e.key === "Enter" && active >= 0) { elegir(hits[active].id); e.preventDefault(); }
    else if (e.key === "Escape") { cerrarResultados(); q.blur(); }
  });
  res.addEventListener("mousedown", (e) => e.preventDefault());       // no perder el foco al pulsar
  res.addEventListener("click", (e) => { const b = e.target.closest("[data-go]"); if (b) elegir(b.dataset.go); });
  q.addEventListener("blur", () => setTimeout(cerrarResultados, 120));

  // ---------- Herramientas ----------
  $("#b-general").addEventListener("click", () => {
    expanded.clear(); expanded.add(DATA.id);
    selected = DATA.id; setPath(); render(); renderCard(DATA);
    viewport.scrollTo({ left: 0, top: 0, behavior: reduceMotion ? "auto" : "smooth" });
    try { history.replaceState(null, "", "#" + DATA.id); } catch (e) { /* nada */ }
  });
  $("#b-rama").addEventListener("click", () => {
    const n = byId.get(selected), nuevos = new Set();
    (function all(m) { if (m.children) { if (!expanded.has(m.id)) m.children.forEach((c) => nuevos.add(c.id)); expanded.add(m.id); m.children.forEach(all); } })(n);
    render(nuevos); reveal(n);
  });
  function setZoom(d) {
    hideTip();
    const n = byId.get(selected);
    zi = Math.min(ZOOMS.length - 1, Math.max(0, zi + d));
    $("#z-nivel").textContent = Math.round(ZOOMS[zi] * 100) + " %";
    $("#z-menos").disabled = zi === 0; $("#z-mas").disabled = zi === ZOOMS.length - 1;
    render(); reveal(n, true);
  }
  $("#z-menos").addEventListener("click", () => setZoom(-1));
  $("#z-mas").addEventListener("click", () => setZoom(1));

  document.addEventListener("keydown", (e) => {
    if (e.key !== "Tab") hideTip();
    const t = e.target, escribiendo = t.matches && t.matches("input, textarea");
    if (e.key === "/" && !escribiendo) { e.preventDefault(); q.focus(); return; }
    if (escribiendo || e.metaKey || e.ctrlKey || e.altKey) return;
    const i = order.indexOf(byId.get(selected));
    if (e.key === "ArrowRight" && order[i + 1]) { e.preventDefault(); select(order[i + 1].id, { expand: true }); }
    if (e.key === "ArrowLeft" && i > 0) { e.preventDefault(); select(order[i - 1].id, { expand: true }); }
    if (e.key === "Escape" && isMobile()) setSheet("peek");
  });

  // ---------- Arranque ----------
  const inicial = byId.has(location.hash.slice(1)) ? location.hash.slice(1) : DEFAULT_ID;
  select(inicial, { expand: true, instant: true });
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => { heights.clear(); render(); reveal(byId.get(selected), true); updatePeek(); });
  }
  addEventListener("resize", () => { hideTip(); updatePeek(); });
})();
</script>
</body>
</html>
