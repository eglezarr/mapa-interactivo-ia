casos arrastren todo el modelo.","hp":[["delta","en Huber, error a partir del cual la penalización pasa de cuadrática a lineal"]],"py":[{"c":"keras.losses.MeanSquaredError","u":"https://keras.io/api/losses/regression_losses/#meansquarederror-class"},{"c":"keras.losses.MeanAbsoluteError","u":"https://keras.io/api/losses/regression_losses/#meanabsoluteerror-class"},{"c":"keras.losses.Huber","u":"https://keras.io/api/losses/regression_losses/#huber-class"},{"c":"torch.nn.HuberLoss","u":"https://docs.pytorch.org/docs/stable/generated/torch.nn.HuberLoss.html"}],"rel":["mse-rmse-y-mae","funciones-de-perdida","outliers","maxima-verosimilitud"]},{"id":"entropia-cruzada","name":"Entropía cruzada (binaria y categórica)","en":"cross-entropy (binary & categorical)","frase":"La pérdida estándar de clasificación: penaliza asignar poca probabilidad a la clase correcta.","desc":"Mide −log de la probabilidad que el modelo asigna a la clase verdadera, promediada sobre los ejemplos. La versión binaria acompaña a una salida sigmoide y la categórica, a una softmax; la variante \"sparse\" recibe la clase como un entero en lugar de en one-hot. Es la NLL de una distribución categórica, y por estabilidad numérica conviene pasarle los logits en lugar de las probabilidades.","ej":"Si el modelo asigna un 0,9 a la clase correcta, la pérdida de ese ejemplo es 0,105; si le asigna un 0,1, es 2,3.","hp":[["label_smoothing","reparte una pequeña parte de la probabilidad entre las clases incorrectas para evitar el exceso de confianza"]],"py":[{"c":"keras.losses.BinaryCrossentropy","u":"https://keras.io/api/losses/probabilistic_losses/#binarycrossentropy-class"},{"c":"keras.losses.SparseCategoricalCrossentropy","u":"https://keras.io/api/losses/probabilistic_losses/#sparsecategoricalcrossentropy-class"},{"c":"torch.nn.CrossEntropyLoss","u":"https://docs.pytorch.org/docs/stable/generated/torch.nn.CrossEntropyLoss.html"},{"c":"torch.nn.BCEWithLogitsLoss","u":"https://docs.pytorch.org/docs/stable/generated/torch.nn.BCEWithLogitsLoss.html"}],"rel":["nll","softmax","divergencia-de-kullback-leibler","funciones-de-perdida"]},{"id":"perdidas-perceptuales","name":"Pérdidas perceptuales","en":"perceptual losses","frase":"Comparan imágenes por sus características visuales en una red preentrenada, no píxel a píxel.","desc":"Dos imágenes desplazadas un píxel tienen un error cuadrático grande aunque parezcan idénticas. Las pérdidas perceptuales comparan las activaciones que ambas imágenes producen en una red preentrenada, como VGG, que capturan bordes, texturas y formas. Se usan en superresolución, transferencia de estilo y modelos generativos para obtener resultados más nítidos y naturales. LPIPS es una medida de este tipo calibrada con juicios humanos.","cuando":"Para entrenar o evaluar modelos que generan imágenes cuando importa la calidad visual percibida más que el error por píxel.","ej":"Un modelo de superresolución entrenado con MSE produce caras borrosas; con una pérdida perceptual recupera la textura de la piel y del pelo.","py":[{"c":"lpips.LPIPS","u":"https://github.com/richzhang/PerceptualSimilarity"},{"c":"keras.applications.VGG19","u":"https://keras.io/api/applications/vgg/"}],"rel":["transferencia-de-estilo-neuronal","srgan","metricas-perceptuales","superresolucion-inpainting-y-colorizacion"]}]},{"id":"optimizacion","name":"Optimización","en":"optimization","frase":"Cómo se ajustan los pesos de la red, paso a paso, para reducir la pérdida.","desc":"Entrenar una red es resolver un problema de optimización: encontrar los pesos que minimizan la pérdida. La retropropagación calcula el gradiente, que indica cómo cambia la pérdida al mover cada peso, y un optimizador da pasos en la dirección que la reduce. Detalles como el learning rate, el tamaño de lote, el momentum o la inicialización deciden si el entrenamiento converge, a qué velocidad y a qué solución.","ej":"Entrenar una CNN con Adam y un learning rate de 0,001 que se reduce cuando la pérdida de validación se estanca.","rel":["descenso-por-gradiente","backpropagation","adam-y-adamw","learning-rate"],"children":[{"id":"descenso-por-gradiente","name":"Descenso por gradiente","en":"gradient descent","frase":"Bajar por la superficie de la pérdida dando pasos en la dirección de máxima pendiente descendente.","desc":"En cada paso actualiza los pesos con w ← w − η·∇L(w), donde ∇L es el gradiente de la pérdida y η, el learning rate. Si el paso es pequeño, avanza despacio; si es grande, oscila o diverge. En las redes neuronales la superficie de la pérdida no es convexa, pero en la práctica el descenso por gradiente encuentra soluciones que generalizan bien.","ej":"Es como bajar una montaña con niebla: en cada paso miras la pendiente bajo tus pies y avanzas cuesta abajo.","py":[{"c":"keras.optimizers.SGD","u":"https://keras.io/api/optimizers/sgd/"},{"c":"torch.optim.SGD","u":"https://docs.pytorch.org/docs/stable/generated/torch.optim.SGD.html"}],"rel":["learning-rate","batch-mini-batch-y-sgd","backpropagation","momentum"]},{"id":"backpropagation","name":"Retropropagación (backpropagation)","en":"backpropagation","frase":"Calcula de forma eficiente cuánto contribuye cada peso al error, propagándolo de la salida hacia atrás.","desc":"Aplica la regla de la cadena capa a capa, desde la pérdida hasta la entrada, reutilizando los cálculos intermedios. Con un pase hacia delante y otro hacia atrás obtiene el gradiente de la pérdida respecto a todos los pesos, con un coste similar al de hacer la propia predicción. Es el algoritmo que hizo práctico entrenar redes con muchas capas.","ej":"Si una red clasifica mal la foto de un gato, la retropropagación indica a cada uno de sus millones de pesos cuánto y en qué sentido debe cambiar.","py":[{"c":"torch.Tensor.backward","u":"https://docs.pytorch.org/docs/stable/generated/torch.Tensor.backward.html"}],"rel":["diferenciacion-automatica","descenso-por-gradiente","desvanecimiento-y-explosion-del-gradiente","bptt"]},{"id":"diferenciacion-automatica","name":"Diferenciación automática","en":"automatic differentiation","frase":"El framework calcula las derivadas exactas de cualquier cálculo que escribas, sin derivar a mano.","desc":"Los frameworks registran las operaciones que se aplican a los tensores y, recorriendo ese grafo de cálculo con la regla de la cadena, obtienen derivadas exactas, no aproximaciones numéricas. El modo inverso, que es la retropropagación, es eficiente cuando hay muchos parámetros y una sola salida, como la pérdida. Permite entrenar cualquier arquitectura diferenciable sin escribir los gradientes.","cuando":"Siempre que se entrena un modelo diferenciable o se necesita el gradiente de una función compleja.","ej":"Definir una pérdida nueva que combina tres términos y obtener sus gradientes automáticamente en una línea.","py":[{"c":"torch.autograd.grad","u":"https://docs.pytorch.org/docs/stable/generated/torch.autograd.grad.html"},{"c":"jax.grad","u":"https://docs.jax.dev/en/latest/_autosummary/jax.grad.html"}],"rel":["backpropagation","frameworks-de-ml","capas-y-perdidas-personalizadas","descenso-por-gradiente"]},{"id":"batch-mini-batch-y-sgd","name":"Batch, mini-batch y SGD","en":"batch, mini-batch & SGD","frase":"Calcular el gradiente con todos los datos, con un subconjunto o con un solo ejemplo en cada paso.","desc":"El descenso por lotes (batch) usa todo el conjunto en cada paso: es preciso pero lento. El estocástico (SGD) usa un solo ejemplo: es rápido pero muy ruidoso. El mini-batch, con lotes de decenas o cientos de ejemplos, es el estándar: aprovecha la GPU y su ruido moderado ayuda a escapar de malos mínimos. En la práctica, \"SGD\" suele referirse a esta última variante.","cuando":"Mini-batch, siempre para redes neuronales; el lote completo, solo con datasets pequeños y métodos que lo necesitan, como L-BFGS.","ej":"Con un millón de imágenes y lotes de 256, cada época tiene unos 3.900 pasos de actualización.","hp":[["batch_size","número de ejemplos por lote"],["shuffle","barajar los datos en cada época"]],"py":[{"c":"torch.utils.data.DataLoader","u":"https://docs.pytorch.org/docs/stable/data.html#torch.utils.data.DataLoader"},{"c":"keras.Model.fit","u":"https://keras.io/api/models/model_training_apis/#fit-method"}],"rel":["epoca-y-tamano-de-lote","descenso-por-gradiente","learning-rate","gpu-y-tpu"]},{"id":"epoca-y-tamano-de-lote","name":"Época y tamaño de lote","en":"epoch & batch size","frase":"Época: una pasada completa por los datos. Lote: cuántos ejemplos se usan en cada actualización.","desc":"El entrenamiento recorre los datos varias veces (épocas), divididos en lotes, y cada lote produce una actualización de los pesos. Los lotes grandes aprovechan mejor el hardware y dan gradientes más estables, pero necesitan más memoria y a veces generalizan algo peor; si se aumenta el lote, suele convenir subir también el learning rate. El número de épocas se controla con early stopping.","ej":"Entrenar 30 épocas con lotes de 64 imágenes; la pérdida de validación deja de mejorar en la época 18.","hp":[["epochs","número de pasadas completas por los datos"],["batch_size","ejemplos por actualización"]],"py":[{"c":"keras.Model.fit","u":"https://keras.io/api/models/model_training_apis/#fit-method"}],"rel":["batch-mini-batch-y-sgd","early-stopping","learning-rate","curvas-de-aprendizaje"]},{"id":"learning-rate","name":"Tasa de aprendizaje (learning rate)","en":"learning rate","frase":"El tamaño de cada paso del optimizador: el hiperparámetro más importante del entrenamiento.","desc":"Multiplica el gradiente en cada actualización. Si es demasiado alto, la pérdida oscila o se dispara; si es demasiado bajo, el entrenamiento avanza muy despacio o se queda atascado. Su valor óptimo depende del optimizador, del tamaño de lote y de la arquitectura, y suele buscarse en escala logarítmica, por ejemplo entre 10⁻⁵ y 10⁻¹. Casi siempre conviene variarlo durante el entrenamiento.","cuando":"Es lo primero que hay que ajustar al entrenar una red y lo primero que hay que revisar si la pérdida no baja o se dispara.","ej":"Con Adam, 0,001 suele funcionar como punto de partida; para ajustar un modelo preentrenado se usan valores entre 10 y 100 veces menores.","hp":[["learning_rate / lr","tamaño del paso (Keras / PyTorch)"]],"py":[{"c":"keras.optimizers.Adam","u":"https://keras.io/api/optimizers/adam/"},{"c":"torch.optim.Adam","u":"https://docs.pytorch.org/docs/stable/generated/torch.optim.Adam.html"}],"rel":["lr-schedulers","adam-y-adamw","descenso-por-gradiente","learning-rates-discriminativos"]},{"id":"lr-schedulers","name":"Programación de la tasa de aprendizaje","en":"learning rate schedules","frase":"Variar el learning rate durante el entrenamiento: subirlo con cuidado al principio y bajarlo para afinar.","desc":"Un programador ajusta el learning rate según avanzan los pasos o las épocas. Los más usados son el decaimiento por escalones o exponencial; el coseno, que lo baja suavemente hasta casi cero; el calentamiento (warm-up), que lo sube poco a poco al principio para estabilizar redes grandes; y la reducción cuando la pérdida de validación se estanca. Suelen mejorar tanto la velocidad como el resultado final.","cuando":"Casi siempre en redes profundas; el calentamiento, en transformers y en entrenamientos con lotes grandes.","ej":"Calentar durante las primeras 1.000 iteraciones hasta 3·10⁻⁴ y después bajar con un coseno hasta cero al final del entrenamiento.","hp":[["patience","en la reducción por meseta, épocas sin mejora antes de bajar el learning rate"],["factor","por cuánto se multiplica el learning rate al reducirlo"],["T_max","en el coseno de PyTorch, pasos hasta llegar al mínimo"]],"py":[{"c":"keras.optimizers.schedules.CosineDecay","u":"https://keras.io/api/optimizers/learning_rate_schedules/cosine_decay/"},{"c":"keras.callbacks.ReduceLROnPlateau","u":"https://keras.io/api/callbacks/reduce_lr_on_plateau/"},{"c":"torch.optim.lr_scheduler.CosineAnnealingLR","u":"https://docs.pytorch.org/docs/stable/generated/torch.optim.lr_scheduler.CosineAnnealingLR.html"},{"c":"torch.optim.lr_scheduler.OneCycleLR","u":"https://docs.pytorch.org/docs/stable/generated/torch.optim.lr_scheduler.OneCycleLR.html"}],"rel":["learning-rate","adam-y-adamw","callbacks","receta-de-entrenamiento"]},{"id":"momentum","name":"Momentum","en":"momentum","frase":"Acumula la dirección de los pasos anteriores para avanzar más rápido y oscilar menos.","desc":"En lugar de seguir solo el gradiente actual, mantiene una media móvil de los gradientes pasados, como una bola que coge inercia al rodar cuesta abajo. Acelera el avance en las direcciones consistentes y amortigua las oscilaciones en las que cambian de signo. El momentum de Nesterov evalúa el gradiente en la posición a la que apunta la inercia, lo que lo hace algo más preciso.","cuando":"Al usar SGD, prácticamente siempre; Adam ya incorpora una forma de momentum.","ej":"En un valle estrecho y alargado, SGD zigzaguea de pared a pared; con un momentum de 0,9 avanza casi en línea recta hacia el fondo.","hp":[["momentum","fracción de la velocidad anterior que se conserva, típicamente 0,9"],["nesterov","activa el momentum de Nesterov"]],"py":[{"c":"keras.optimizers.SGD","u":"https://keras.io/api/optimizers/sgd/"},{"c":"torch.optim.SGD","u":"https://docs.pytorch.org/docs/stable/generated/torch.optim.SGD.html"}],"rel":["descenso-por-gradiente","adam-y-adamw","rmsprop-y-adagrad","learning-rate"]},{"id":"rmsprop-y-adagrad","name":"RMSprop y Adagrad","en":"RMSprop & Adagrad","frase":"Optimizadores que adaptan el learning rate de cada peso según el tamaño de sus gradientes pasados.","desc":"Adagrad divide el paso de cada parámetro por la raíz de la suma de sus gradientes al cuadrado: los parámetros con gradientes grandes o frecuentes avanzan menos, y los raros, más, lo que funciona bien con datos dispersos. Su problema es que el paso decrece sin parar. RMSprop lo corrige usando una media móvil de los gradientes al cuadrado en lugar de la suma, y es la base de Adam.","cuando":"Adagrad, con variables dispersas como texto o recomendación; RMSprop, en redes recurrentes o como alternativa a Adam.","ej":"En un modelo con embeddings de palabras, Adagrad da pasos grandes a las palabras raras, que reciben pocas actualizaciones.","hp":[["learning_rate / lr","tamaño de paso base (Keras / PyTorch)"],["rho / alpha","en RMSprop, factor de olvido de la media móvil (Keras / PyTorch)"]],"py":[{"c":"keras.optimizers.RMSprop","u":"https://keras.io/api/optimizers/rmsprop/"},{"c":"keras.optimizers.Adagrad","u":"https://keras.io/api/optimizers/adagrad/"},{"c":"torch.optim.RMSprop","u":"https://docs.pytorch.org/docs/stable/generated/torch.optim.RMSprop.html"},{"c":"torch.optim.Adagrad","u":"https://docs.pytorch.org/docs/stable/generated/torch.optim.Adagrad.html"}],"rel":["adam-y-adamw","momentum","learning-rate","word-embeddings"]},{"id":"adam-y-adamw","name":"Adam y AdamW","en":"Adam & AdamW","frase":"El optimizador por defecto: combina momentum con un learning rate adaptado a cada peso.","desc":"Adam mantiene dos medias móviles por parámetro: la del gradiente (momentum) y la de su cuadrado (como RMSprop), con una corrección del sesgo inicial. Funciona bien con poco ajuste en casi cualquier arquitectura. AdamW separa el weight decay del gradiente y lo aplica directamente a los pesos, lo que regulariza mejor; es el estándar para entrenar transformers.","cuando":"Como optimizador por defecto en deep learning; AdamW, cuando además se quiere regularizar con weight decay.","ej":"Ajustar un modelo de lenguaje con AdamW, un learning rate de 2·10⁻⁵ y un weight decay de 0,01.","hp":[["learning_rate / lr","tamaño de paso (Keras / PyTorch)"],["beta_1 / betas","tasas de olvido de las medias móviles (Keras / PyTorch)"],["weight_decay","fuerza del decaimiento de pesos en AdamW"]],"py":[{"c":"keras.optimizers.Adam","u":"https://keras.io/api/optimizers/adam/"},{"c":"keras.optimizers.AdamW","u":"https://keras.io/api/optimizers/adamw/"},{"c":"torch.optim.Adam","u":"https://docs.pytorch.org/docs/stable/generated/torch.optim.Adam.html"},{"c":"torch.optim.AdamW","u":"https://docs.pytorch.org/docs/stable/generated/torch.optim.AdamW.html"}],"rel":["momentum","rmsprop-y-adagrad","penalizacion-l1-y-l2","learning-rate"]},{"id":"metodos-de-segundo-orden","name":"Métodos de segundo orden (Newton)","en":"second-order methods (Newton, L-BFGS)","frase":"Usan también la curvatura de la pérdida para dar pasos mejor dirigidos, a un coste mucho mayor.","desc":"El método de Newton usa la matriz hessiana de segundas derivadas para saltar directamente al mínimo de una aproximación cuadrática. Converge en muy pocas iteraciones, pero con millones de parámetros calcular e invertir la hessiana es inviable. Los métodos cuasi-Newton, como L-BFGS, la aproximan con los gradientes recientes y se usan en modelos pequeños, en optimización clásica y en ajustes deterministas con el lote completo.","cuando":"Con pocos parámetros (miles, no millones) y gradientes de lote completo, como en regresión logística o en el ajuste de modelos estadísticos.","ej":"La regresión logística de scikit-learn usa por defecto L-BFGS y converge en unas decenas de iteraciones.","py":[{"c":"torch.optim.LBFGS","u":"https://docs.pytorch.org/docs/stable/generated/torch.optim.LBFGS.html"},{"c":"scipy.optimize.minimize","u":"https://docs.scipy.org/doc/scipy/reference/generated/scipy.optimize.minimize.html"}],"rel":["descenso-por-gradiente","optimizacion","regresion-logistica","adam-y-adamw"]},{"id":"inicializacion-de-pesos","name":"Inicialización de pesos","en":"weight initialization (Glorot/Xavier, He)","frase":"Elegir los valores iniciales de los pesos para que la señal no se apague ni explote al atravesar la red.","desc":"Si los pesos empiezan demasiado pequeños, las activaciones y los gradientes se desvanecen capa a capa; si son demasiado grandes, explotan. Las inicializaciones de Glorot (Xavier) y de He fijan la varianza de los pesos según el número de entradas y salidas de cada capa para mantener estable la señal: Glorot, pensada para tanh y sigmoide; He, para ReLU. Inicializar todos los pesos igual impide que las neuronas aprendan cosas distintas.","ej":"Una red profunda con ReLU e inicialización He empieza a aprender desde la primera época; con pesos aleatorios demasiado pequeños, apenas se mueve.","py":[{"c":"keras.initializers.HeNormal","u":"https://keras.io/api/layers/initializers/#henormal-class"},{"c":"keras.initializers.GlorotUniform","u":"https://keras.io/api/layers/initializers/#glorotuniform-class"},{"c":"torch.nn.init.kaiming_normal_","u":"https://docs.pytorch.org/docs/stable/nn.init.html#torch.nn.init.kaiming_normal_"},{"c":"torch.nn.init.xavier_uniform_","u":"https://docs.pytorch.org/docs/stable/nn.init.html#torch.nn.init.xavier_uniform_"}],"rel":["desvanecimiento-y-explosion-del-gradiente","relu-y-variantes","capas-de-normalizacion","receta-de-entrenamiento"]},{"id":"desvanecimiento-y-explosion-del-gradiente","name":"Desvanecimiento y explosión del gradiente","en":"vanishing & exploding gradients","frase":"En redes profundas, el gradiente puede hacerse diminuto o enorme al propagarse hacia atrás por las capas.","desc":"La retropropagación multiplica derivadas capa a capa. Si esos factores son menores que 1, el gradiente se desvanece y las primeras capas apenas aprenden; si son mayores, explota y el entrenamiento diverge. Es especialmente grave en redes muy profundas y en las recurrentes. Las soluciones son activaciones como ReLU, una buena inicialización, capas de normalización, conexiones residuales, LSTM o GRU en secuencias y el recorte del gradiente.","cuando":"El recorte del gradiente, al entrenar redes recurrentes o transformers grandes, o cuando la pérdida se dispara de repente.","ej":"Una RNN simple no aprende dependencias de más de unos diez pasos porque el gradiente se desvanece; una LSTM sí las aprende.","hp":[["max_norm","norma máxima del gradiente; si la supera, se reescala (en los optimizadores de Keras, clipnorm)"]],"py":[{"c":"torch.nn.utils.clip_grad_norm_","u":"https://docs.pytorch.org/docs/stable/generated/torch.nn.utils.clip_grad_norm_.html"},{"c":"keras.optimizers.Adam(clipnorm=1.0)","s":1}],"rel":["backpropagation","inicializacion-de-pesos","conexion-residual","lstm","capas-de-normalizacion"]}]},{"id":"regularizacion-en-redes","name":"Regularización en redes","en":"regularization in neural networks","frase":"Técnicas para que una red con millones de parámetros no memorice los datos de entrenamiento.","desc":"Las redes neuronales tienen capacidad de sobra para memorizar el conjunto de entrenamiento, así que necesitan regularización para generalizar. Las técnicas más usadas son penalizar los pesos grandes (L2 o weight decay), apagar neuronas al azar (dropout), parar el entrenamiento a tiempo (early stopping), añadir ruido y aumentar los datos. Se suelen combinar varias.","ej":"Una red que llega al 100 % de acierto en entrenamiento y se queda en el 80 % en validación mejora con dropout y aumento de datos.","rel":["penalizacion-l1-y-l2","dropout","early-stopping","data-augmentation","sobreajuste"],"children":[{"id":"penalizacion-l1-y-l2","name":"Penalización L1 y L2 (weight decay)","en":"L1 & L2 regularization (weight decay)","frase":"Añadir a la pérdida un castigo por los pesos grandes para obtener modelos más simples.","desc":"La penalización L2 suma a la pérdida el cuadrado de los pesos multiplicado por un factor y los empuja hacia cero sin anularlos. La L1 suma su valor absoluto y tiende a dejar pesos exactamente en cero. En redes, la L2 se aplica casi siempre como weight decay, que reduce un poco los pesos en cada paso; con Adam conviene usar AdamW, que lo aplica de forma desacoplada.","cuando":"Casi siempre, como regularización básica; L1, cuando además se busca que muchos pesos sean cero.","ej":"Añadir un weight decay de 10⁻⁴ al entrenar una CNN con 5.000 imágenes reduce la diferencia entre entrenamiento y validación.","hp":[["l2","factor de la penalización L2 en Keras"],["weight_decay","factor del decaimiento de pesos en el optimizador"]],"py":[{"c":"keras.regularizers.L2","u":"https://keras.io/api/layers/regularizers/#l2-class"},{"c":"keras.regularizers.L1L2","u":"https://keras.io/api/layers/regularizers/#l1l2-class"},{"c":"torch.optim.AdamW","u":"https://docs.pytorch.org/docs/stable/generated/torch.optim.AdamW.html"}],"rel":["ridge-lasso-y-elastic-net","regularizacion","adam-y-adamw","regularizacion-en-redes"]},{"id":"dropout","name":"Dropout","en":"dropout","frase":"Apagar al azar una fracción de neuronas en cada paso de entrenamiento para que no dependan unas de otras.","desc":"En cada paso de entrenamiento, cada neurona se anula con una probabilidad p y las demás se reescalan. La red no puede apoyarse en neuronas concretas y aprende representaciones redundantes y robustas; equivale a entrenar a la vez muchas subredes que comparten pesos. En inferencia se desactiva; mantenerlo activo al predecir (MC dropout) permite estimar la incertidumbre.","cuando":"En capas densas grandes y en transformers cuando hay sobreajuste; en las convolucionales se usa menos, o en su versión espacial.","ej":"Un dropout de 0,5 tras cada capa densa de un clasificador de texto reduce la distancia entre el acierto de entrenamiento y el de validación.","hp":[["rate / p","probabilidad de apagar cada neurona (Keras / PyTorch)"]],"py":[{"c":"keras.layers.Dropout","u":"https://keras.io/api/layers/regularization_layers/dropout/"},{"c":"torch.nn.Dropout","u":"https://docs.pytorch.org/docs/stable/generated/torch.nn.Dropout.html"}],"rel":["regularizacion-en-redes","ensembles","estimacion-de-incertidumbre-en-redes","inyeccion-de-ruido"]},{"id":"early-stopping","name":"Early stopping","en":"early stopping","frase":"Parar el entrenamiento cuando el error de validación deja de mejorar.","desc":"Mientras el error de entrenamiento sigue bajando, el de validación acaba subiendo cuando la red empieza a memorizar. Early stopping vigila la métrica de validación y detiene el entrenamiento tras varias épocas sin mejora, recuperando los pesos del mejor momento. Es una regularización barata que además ahorra cómputo.","cuando":"Prácticamente siempre que se entrena una red durante varias épocas con un conjunto de validación.","ej":"Con una paciencia de 5 épocas, el entrenamiento se detiene en la época 23 y se restauran los pesos de la 18, la mejor en validación.","hp":[["patience","épocas sin mejora antes de parar"],["monitor","métrica que se vigila"],["restore_best_weights","recupera los pesos de la mejor época"]],"py":[{"c":"keras.callbacks.EarlyStopping","u":"https://keras.io/api/callbacks/early_stopping/"}],"rel":["curvas-de-aprendizaje","callbacks","sobreajuste","entrenamiento-validacion-y-test"]},{"id":"inyeccion-de-ruido","name":"Inyección de ruido","en":"noise injection","frase":"Añadir ruido aleatorio a las entradas, los pesos o las activaciones para que la red sea más robusta.","desc":"Perturbar los datos durante el entrenamiento obliga a la red a ser insensible a pequeñas variaciones, lo que actúa como regularización: añadir ruido gaussiano a las entradas equivale, aproximadamente, a una penalización L2. El ruido también es la base de los autoencoders de eliminación de ruido, del suavizado de etiquetas y del entrenamiento robusto frente a ataques.","cuando":"Con pocos datos o entradas ruidosas, o cuando se busca robustez frente a perturbaciones.","ej":"Añadir ruido gaussiano a las lecturas de sensores durante el entrenamiento para que el modelo tolere la imprecisión de los sensores reales.","hp":[["stddev","desviación típica del ruido gaussiano"]],"py":[{"c":"keras.layers.GaussianNoise","u":"https://keras.io/api/layers/regularization_layers/gaussian_noise/"},{"c":"keras.layers.GaussianDropout","u":"https://keras.io/api/layers/regularization_layers/gaussian_dropout/"}],"rel":["regularizacion-en-redes","autoencoder-denoising","dropout","data-augmentation"]}]},{"id":"entrenamiento-en-la-practica","name":"Entrenamiento en la práctica","en":"training in practice","frase":"Los hábitos que separan un entrenamiento que funciona de uno que falla en silencio.","desc":"Entrenar redes tiene mucho de oficio: empezar simple, verificar cada pieza, vigilar las curvas de pérdida, guardar los mejores modelos y poder reproducir cada resultado. Las redes fallan en silencio: un error de preprocesado o en la pérdida no produce ninguna excepción, solo un modelo peor de lo que podría ser.","ej":"Antes de entrenar con todo el dataset, comprobar que la red es capaz de memorizar un único lote de 32 ejemplos.","rel":["receta-de-entrenamiento","curvas-de-aprendizaje","callbacks","reproducibilidad-y-semillas"],"children":[{"id":"receta-de-entrenamiento","name":"Receta de entrenamiento","en":"neural network training recipe","frase":"Un proceso paso a paso para entrenar redes: de lo simple a lo complejo, verificando cada paso.","desc":"Una receta habitual es: inspeccionar a fondo los datos; montar el ciclo completo con un modelo sencillo y líneas base; comprobar que la red puede sobreajustar un lote pequeño; aumentar la capacidad hasta sobreajustar el conjunto de entrenamiento; regularizar para generalizar; y, solo entonces, ajustar los hiperparámetros. Cada paso aísla posibles errores antes de añadir complejidad.","cuando":"Al empezar cualquier proyecto de deep learning y al depurar un entrenamiento que no funciona.","ej":"Si la red no consigue memorizar 10 imágenes, el fallo está en el código o en los datos, no en que le falten capas.","rel":["entrenamiento-en-la-practica","linea-base","curvas-de-aprendizaje","sobreajuste"]},{"id":"curvas-de-aprendizaje","name":"Curvas de aprendizaje","en":"learning curves","frase":"La evolución de la pérdida o la métrica durante el entrenamiento, en entrenamiento y en validación.","desc":"Comparar la pérdida de entrenamiento con la de validación es la herramienta de diagnóstico más útil. Si ambas son altas, hay infraajuste; si la de entrenamiento baja y la de validación sube, sobreajuste; si oscilan mucho, el learning rate puede ser excesivo. Otra variante muestra el rendimiento frente al tamaño del conjunto de entrenamiento e indica si conseguir más datos ayudaría.","cuando":"Siempre, durante y después de cada entrenamiento, para decidir el siguiente paso.","ej":"La pérdida de validación toca fondo en la época 12 y después sube mientras la de entrenamiento sigue bajando: señal de sobreajuste.","py":[{"c":"sklearn.model_selection.learning_curve","u":"https://scikit-learn.org/stable/modules/generated/sklearn.model_selection.learning_curve.html"},{"c":"history.history[\"val_loss\"]","s":1}],"rel":["sobreajuste","infraajuste","early-stopping","seguimiento-de-experimentos"]},{"id":"callbacks","name":"Callbacks","en":"callbacks","frase":"Funciones que se ejecutan en momentos concretos del entrenamiento para vigilar, guardar o ajustar el modelo.","desc":"Un callback es código que el bucle de entrenamiento llama en momentos determinados, como al final de cada época o de cada lote. Se usan para parar a tiempo (early stopping), guardar el mejor modelo, ajustar el learning rate, registrar métricas o detener el entrenamiento si la pérdida da NaN. Permiten personalizar el entrenamiento sin reescribir el bucle.","cuando":"En cualquier entrenamiento de más de unos minutos, para no perder el mejor modelo ni malgastar cómputo.","ej":"Guardar automáticamente los pesos cada vez que mejora el acierto en validación y parar tras 10 épocas sin mejora.","hp":[["monitor","métrica que se vigila"],["save_best_only","guarda solo cuando la métrica mejora"]],"py":[{"c":"keras.callbacks.ModelCheckpoint","u":"https://keras.io/api/callbacks/model_checkpoint/"},{"c":"keras.callbacks.Callback","u":"https://keras.io/api/callbacks/base_callback/"}],"rel":["early-stopping","lr-schedulers","seguimiento-de-experimentos","curvas-de-aprendizaje"]},{"id":"reproducibilidad-y-semillas","name":"Reproducibilidad y semillas","en":"reproducibility & random seeds","frase":"Fijar las fuentes de aleatoriedad para poder repetir un entrenamiento y obtener el mismo resultado.","desc":"La inicialización de pesos, el barajado de datos, el dropout y el aumento de datos dependen de números aleatorios. Fijar las semillas de Python, NumPy y el framework permite repetir resultados, aunque en GPU algunas operaciones no son deterministas salvo que se fuerce. Como cada semilla da un resultado algo distinto, conviene comparar modelos con varias semillas y no con una sola ejecución.","cuando":"Siempre que se comparen modelos, se depure un entrenamiento o se publiquen resultados.","ej":"Un modelo parece un 1 % mejor que otro, pero con cinco semillas distintas la diferencia desaparece: era ruido.","py":[{"c":"keras.utils.set_random_seed","u":"https://keras.io/api/utils/python_utils/#setrandomseed-function"},{"c":"torch.manual_seed","u":"https://docs.pytorch.org/docs/stable/generated/torch.manual_seed.html"},{"c":"torch.use_deterministic_algorithms","u":"https://docs.pytorch.org/docs/stable/generated/torch.use_deterministic_algorithms.html"}],"rel":["seguimiento-de-experimentos","mlops","validacion-cruzada","entrenamiento-en-la-practica"]}]},{"id":"construccion-de-modelos","name":"Construcción de modelos","en":"building models","frase":"Las formas de definir la arquitectura de una red en código, de una pila simple a grafos complejos.","desc":"Los frameworks ofrecen varios niveles. La API secuencial apila capas una tras otra. La funcional permite grafos con ramas, varias entradas y salidas y capas compartidas. La subclasificación, heredando de Layer, Model o nn.Module, da libertad total para lógica personalizada. Elegir el nivel adecuado hace el código más simple y más fácil de mantener.","ej":"Un clasificador de imágenes simple cabe en una API secuencial; un modelo que combina una foto y su descripción necesita la funcional.","rel":["api-secuencial","api-funcional","capas-y-perdidas-personalizadas","multi-entrada-salida"],"children":[{"id":"api-secuencial","name":"API secuencial","en":"Sequential API","frase":"Definir una red como una pila de capas en la que cada una alimenta a la siguiente.","desc":"Es la forma más sencilla de construir un modelo: una lista ordenada de capas en la que la salida de cada una es la entrada de la siguiente. Basta para los MLP y las CNN clásicas. No admite varias entradas o salidas, ramas ni capas compartidas; para eso existe la API funcional.","cuando":"Para modelos que son una cadena de capas con una entrada y una salida.","ej":"Un clasificador de dígitos: aplanar la imagen, una capa densa de 128 neuronas con ReLU y una salida softmax de 10 clases.","py":[{"c":"keras.Sequential","u":"https://keras.io/api/models/sequential/"},{"c":"torch.nn.Sequential","u":"https://docs.pytorch.org/docs/stable/generated/torch.nn.Sequential.html"}],"rel":["api-funcional","mlp","construccion-de-modelos","frameworks-de-ml"]},{"id":"api-funcional","name":"API funcional","en":"Functional API","frase":"Definir la red conectando capas como funciones, lo que permite ramas, atajos y varias entradas o salidas.","desc":"Cada capa se aplica sobre el tensor de salida de otra, y el modelo se define indicando sus entradas y sus salidas. Así se construyen grafos arbitrarios sin ciclos: conexiones residuales, ramas paralelas que se concatenan, capas compartidas y modelos con varias entradas o salidas. La arquitectura sigue siendo inspeccionable y se puede dibujar.","cuando":"Cuando el modelo no es una simple cadena de capas: atajos, ramas o varias entradas o salidas.","ej":"Una red que recibe la imagen de un producto y su precio, procesa cada uno por una rama distinta y concatena ambas antes de clasificar.","py":[{"c":"keras.Model","u":"https://keras.io/api/models/model/"},{"c":"keras.Input","u":"https://keras.io/api/layers/core_layers/input/"}],"rel":["api-secuencial","multi-entrada-salida","conexion-residual","capas-y-perdidas-personalizadas"]},{"id":"capas-y-perdidas-personalizadas","name":"Capas y pérdidas personalizadas","en":"custom layers & losses","frase":"Programar tus propias capas, pérdidas o modelos cuando las piezas estándar no bastan.","desc":"Heredando de las clases base del framework se define una capa con sus pesos y su cálculo hacia delante, o una pérdida que compara la predicción con el objetivo de forma específica. La diferenciación automática se encarga de los gradientes. Es la vía para implementar ideas nuevas o incorporar restricciones del dominio al entrenamiento.","cuando":"Cuando necesitas una operación, una restricción o un objetivo que no existe en la librería.","ej":"Una pérdida que penaliza el doble quedarse corto en la previsión de demanda que pasarse, porque la rotura de stock cuesta más que el exceso.","py":[{"c":"keras.layers.Layer","u":"https://keras.io/api/layers/base_layer/#layer-class"},{"c":"keras.losses.Loss","u":"https://keras.io/api/losses/#loss-class"},{"c":"torch.nn.Module","u":"https://docs.pytorch.org/docs/stable/generated/torch.nn.Module.html"}],"rel":["diferenciacion-automatica","construccion-de-modelos","funciones-de-perdida","api-funcional"]},{"id":"redes-siamesas","name":"Redes siamesas (pesos compartidos)","en":"Siamese networks (shared weights)","frase":"Dos o más ramas idénticas, con los mismos pesos, que procesan entradas distintas para compararlas.","desc":"Cada entrada pasa por la misma red, que la convierte en un vector, y después se mide la distancia entre los vectores. Se entrenan con pérdidas contrastivas o de triplete, que acercan los pares similares y alejan los diferentes hasta un margen. Así aprenden una medida de similitud y permiten reconocer clases nuevas con pocos ejemplos, solo comparando.","cuando":"Para verificar si dos elementos son el mismo (firmas, caras, productos) o buscar similares, sobre todo con muchas clases y pocos ejemplos de cada una.","ej":"Un sistema de desbloqueo facial compara el vector de tu cara con el que guardó al registrarte, sin reentrenar la red para cada usuario.","hp":[["margin","separación mínima exigida entre los pares distintos y los similares"]],"py":[{"c":"torch.nn.TripletMarginLoss","u":"https://docs.pytorch.org/docs/stable/generated/torch.nn.TripletMarginLoss.html"},{"c":"torch.nn.CosineEmbeddingLoss","u":"https://docs.pytorch.org/docs/stable/generated/torch.nn.CosineEmbeddingLoss.html"}],"rel":["aprendizaje-contrastivo","embeddings","busqueda-por-similitud","distancia-y-similitud"]},{"id":"multi-entrada-salida","name":"Modelos multi-entrada y multi-salida","en":"multi-input & multi-output models","frase":"Modelos que combinan varios tipos de datos de entrada o resuelven varias tareas a la vez.","desc":"Con varias entradas, cada una (una imagen, un texto, unas variables tabulares) se procesa por su propia rama y las representaciones se fusionan, normalmente concatenándolas. Con varias salidas, un tronco común alimenta cabezas distintas, cada una con su pérdida, y la pérdida total es una suma ponderada. Compartir la representación entre tareas relacionadas suele mejorar todas ellas.","cuando":"Cuando los datos llegan en varias modalidades o hay varias predicciones relacionadas que pueden compartir aprendizaje.","ej":"A partir de la foto y la descripción de un anuncio inmobiliario, predecir a la vez el precio (regresión) y el tipo de vivienda (clasificación).","py":[{"c":"keras.Model","u":"https://keras.io/api/models/model/"},{"c":"keras.layers.Concatenate","u":"https://keras.io/api/layers/merging_layers/concatenate/"},{"c":"model.compile(loss={...}, loss_weights={...})","s":1}],"rel":["api-funcional","fine-tuning-multitarea","aprendizaje-multimodal","capas-y-perdidas-personalizadas"]}]}]},{"id":"arquitecturas-de-redes-neuronales","name":"Arquitecturas de redes neuronales","en":"neural network architectures","frase":"Las formas de red adaptadas a cada tipo de dato: imágenes, secuencias o texto.","desc":"Las formas que puede tomar una red según el tipo de dato. Las CNN aprovechan la estructura espacial de las imágenes y las RNN la secuencial del texto o las series. Los Transformers relacionan todos los elementos entre sí mediante atención, y los autoencoders comprimen y reconstruyen. Cada arquitectura incorpora un sesgo inductivo distinto.","ej":"Para clasificar imágenes se suele usar una CNN o un Vision Transformer; para traducir texto, un Transformer encoder-decoder.","rel":["cnn","rnn","atencion-y-transformers","autoencoders"],"children":[{"id":"bloques-comunes","name":"Bloques comunes","children":[{"id":"conexion-residual","name":"Conexión residual (skip connection)"},{"id":"capas-de-normalizacion","name":"Capas de normalización (batch, layer, group)"},{"id":"capa-de-embedding","name":"Capa de embedding"}]},{"id":"cnn","name":"Redes convolucionales (CNN)","children":[{"id":"convolucion","name":"Convolución"},{"id":"filtros-y-mapas-de-caracteristicas","name":"Filtros y mapas de características"},{"id":"padding-y-stride","name":"Padding y stride"},{"id":"pooling","name":"Pooling"},{"id":"campo-receptivo","name":"Campo receptivo"},{"id":"equivarianza-e-invarianza","name":"Equivarianza e invarianza"},{"id":"convolucion-1d","name":"Convolución 1D"},{"id":"convolucion-separable","name":"Convolución separable"},{"id":"convolucion-transpuesta","name":"Convolución transpuesta (upsampling)"},{"id":"inspiracion-biologica-de-las-cnn","name":"Inspiración biológica de las CNN"}]},{"id":"rnn","name":"Redes recurrentes (RNN)","children":[{"id":"estado-oculto-y-memoria","name":"Estado oculto y memoria"},{"id":"bptt","name":"Retropropagación a través del tiempo (BPTT)"},{"id":"lstm","name":"LSTM"},{"id":"gru","name":"GRU"},{"id":"rnn-bidireccional","name":"RNN bidireccional"},{"id":"echo-state-networks","name":"Echo State Networks (reservoir computing)"},{"id":"rnn-clasicas","name":"RNN clásicas: Hopfield, Elman y Jordan"},{"id":"topologias-de-secuencia","name":"Topologías de secuencia (one-to-many, many-to-one, many-to-many)"}]},{"id":"atencion-y-transformers","name":"Atención y Transformers","children":[{"id":"mecanismo-de-atencion","n ando":"Cuando tienes pocos datos etiquetados y existe un modelo preentrenado con datos parecidos a los tuyos.","ej":"Reutilizar un modelo preentrenado con millones de imágenes para clasificar radiografías disponiendo solo de unos cientos de ejemplos etiquetados.","rel":["embeddings","aprendizaje-autosupervisado","transfer-learning","que-es-un-modelo-fundacional"],"children":[{"id":"aprendizaje-de-representaciones","name":"Aprendizaje de representaciones"},{"id":"embeddings","name":"Embeddings","children":[{"id":"espacio-latente","name":"Espacio latente"},{"id":"aritmetica-de-embeddings","name":"Aritmética de embeddings"},{"id":"busqueda-por-similitud","name":"Búsqueda por similitud"}]},{"id":"aprendizaje-autosupervisado","name":"Aprendizaje autosupervisado (SSL)","children":[{"id":"tarea-pretexto","name":"Tarea pretexto"},{"id":"aprendizaje-contrastivo","name":"Aprendizaje contrastivo","children":[{"id":"perdida-infonce","name":"Pérdida InfoNCE"},{"id":"simclr-moco-byol-y-dino","name":"SimCLR, MoCo, BYOL y DINO"}]},{"id":"modelado-enmascarado","name":"Modelado enmascarado (MAE, BEiT)"},{"id":"colapso-de-la-representacion","name":"Colapso de la representación"},{"id":"evaluacion-de-representaciones","name":"Evaluación de representaciones (linear probing, k-NN)"}]},{"id":"transfer-learning","name":"Aprendizaje por transferencia (transfer learning)","children":[{"id":"extractor-de-caracteristicas","name":"Modelo preentrenado como extractor de características"},{"id":"fine-tuning","name":"Ajuste fino (fine-tuning)"},{"id":"congelar-y-descongelar-capas","name":"Congelar y descongelar capas"},{"id":"learning-rates-discriminativos","name":"Learning rates discriminativos"},{"id":"adaptacion-de-dominio","name":"Adaptación de dominio"},{"id":"olvido-catastrofico","name":"Olvido catastrófico"},{"id":"destilacion-de-conocimiento","name":"Destilación de conocimiento"}]},{"id":"modelos-fundacionales","name":"Modelos fundacionales","children":[{"id":"que-es-un-modelo-fundacional","name":"Qué es un modelo fundacional"},{"id":"leyes-de-escalado","name":"Leyes de escalado (scaling laws)"}]}]},{"id":"ia-generativa","name":"IA generativa","en":"generative AI","frase":"Modelos que aprenden cómo son los datos para crear ejemplos nuevos y realistas.","desc":"Modelos que aprenden la distribución de los datos para generar ejemplos nuevos y realistas: imágenes, texto, audio o datos sintéticos. Las grandes familias son los modelos autorregresivos, los VAE, las GAN, los flujos normalizantes y los modelos de difusión. Cada una resuelve a su manera cómo modelar y muestrear una distribución de muy alta dimensión.","cuando":"Cuando necesitas crear contenido nuevo (imágenes, texto, audio) o datos sintéticos realistas.","ej":"Stable Diffusion genera una imagen a partir de una frase: parte de ruido aleatorio y lo va eliminando paso a paso.","rel":["modelo-generativo-vs-discriminativo","modelos-de-difusion","gan","vae"],"children":[{"id":"modelo-generativo-vs-discriminativo","name":"Modelo generativo vs discriminativo"},{"id":"densidad-explicita-vs-implicita","name":"Densidad explícita vs implícita"},{"id":"muestreo-por-transformada-inversa","name":"Muestreo por transformada inversa"},{"id":"modelos-autorregresivos","name":"Modelos autorregresivos","children":[{"id":"regla-de-la-cadena-probabilidad","name":"Factorización por regla de la cadena"},{"id":"generacion-con-rnn","name":"Generación con RNN"},{"id":"pixelcnn","name":"PixelCNN"},{"id":"perplejidad","name":"Perplejidad"}]},{"id":"vae","name":"Autoencoder variacional (VAE)","children":[{"id":"elbo","name":"ELBO"},{"id":"truco-de-reparametrizacion","name":"Truco de reparametrización"}]},{"id":"gan","name":"Redes generativas adversarias (GAN)","children":[{"id":"generador-y-discriminador","name":"Generador y discriminador (juego minimax)"},{"id":"colapso-de-modos","name":"Colapso de modos (mode collapse)"},{"id":"dcgan","name":"DCGAN"},{"id":"wasserstein-gan","name":"Wasserstein GAN (WGAN)"},{"id":"otras-vari id":"verosimilitud-vs-calidad-de-muestras","name":"Verosimilitud vs calidad de muestras"}]}]},{"id":"lenguaje-y-llms","name":"Lenguaje y LLMs","en":"natural language processing & LLMs","frase":"Cómo las máquinas representan, entienden y generan lenguaje, hasta llegar a los LLMs.","desc":"Cómo representan y procesan el lenguaje las máquinas, desde la bolsa de palabras y los word embeddings hasta los grandes modelos de lenguaje (LLMs). Un LLM es un Transformer preentrenado para predecir el siguiente token y adaptado después (instruction tuning, RLHF) para seguir instrucciones y conversar.","cuando":"Cuando el problema gira en torno a texto: clasificarlo, extraer información, resumirlo, traducirlo o generarlo.","ej":"ChatGPT, Gemini o Claude son LLMs: modelos preentrenados con billones de tokens de texto y ajustados para seguir instrucciones.","rel":["tokenizacion","word-embeddings","llm","adaptacion-de-llms"],"children":[{"id":"nlp","name":"Procesamiento del lenguaje natural (NLP)","children":[{"id":"tareas-de-nlp","name":"Tareas de NLP"},{"id":"analisis-de-sentimiento","name":"Análisis de sentimiento"},{"id":"benchmarks-de-nlp","name":"Benchmarks de NLP (GLUE)"}]},{"id":"representacion-del-texto","name":"Representación del texto","children":[{"id":"preprocesado-de-texto","name":"Preprocesado de texto"},{"id":"bolsa-de-palabras","name":"One-hot y bolsa de palabras"},{"id":"tf-idf","name":"TF-IDF"},{"id":"tokenizacion","name":"Tokenización","children":[{"id":"tokenizacion-por-subpalabras","name":"Tokenización por subpalabras (BPE, WordPiece, SentencePiece)"},{"id":"vocabulario-y-tokens-especiales","name":"Vocabulario y tokens especiales"}]},{"id":"word-embeddings","name":"Word embeddings","children":[{"id":"word2vec","name":"Word2Vec (Skip-gram y CBOW)"},{"id":"negative-sampling","name":"Negative sampling"},{"id":"glove-y-swivel","name":"GloVe y Swivel"}]},{"id":"embeddings-estaticos-vs-contextuales","name":"Embeddings estáticos vs contextuales"},{"id":"modelos-de-embe ought","name":"Chain-of-thought"},{"id":"plantillas-de-chat","name":"Plantillas de chat y prompt de sistema"},{"id":"salida-estructurada","name":"Salida estructurada"},{"id":"alucinaciones","name":"Alucinaciones"}]},{"id":"evaluacion-de-llms","name":"Evaluación de LLMs","children":[{"id":"benchmarks-y-saturacion","name":"Benchmarks y saturación"},{"id":"llm-as-a-judge","name":"LLM como juez (LLM-as-a-judge)"},{"id":"arenas-de-preferencia-humana","name":"Arenas de preferencia humana"}]}]},{"id":"rag-y-agentes","name":"RAG y agentes","en":"RAG & AI agents","frase":"Conectar un LLM con documentos y herramientas para que responda con fundamento y actúe.","desc":"Cómo convertir un LLM en un sistema útil y fiable. El RAG lo conecta con documentos externos: recupera los fragmentos relevantes y los añade al prompt para que la respuesta se apoye en ellos. Un agente da al LLM herramientas (buscar, ejecutar código, llamar a APIs) y un bucle en el que decide qué hacer en cada paso hasta completar la tarea.","cuando":"Cuando un LLM debe responder con información propia o actualizada, o completar tareas de varios pasos usando herramientas.","ej":"Un asistente que responde sobre la documentación interna de una empresa citando sus fuentes es un RAG. Si además puede abrir incidencias o enviar correos, es un agente.","rel":["rag","agentes-de-ia","alucinaciones","function-calling"],"children":[{"id":"rag","name":"RAG (generación aumentada por recuperación)","children":[{"id":"memoria-parametrica-vs-no-parametrica","name":"Memoria paramétrica vs no paramétrica"},{"id":"chunking","name":"Chunking"},{"id":"recuperacion-densa","name":"Recuperación densa (dual encoder)"},{"id":"bases-de-datos-vectoriales","name":"Bases de datos vectoriales"},{"id":"busqueda-aproximada-de-vecinos","name":"Búsqueda aproximada de vecinos (ANN)"},{"id":"busqueda-hibrida","name":"Búsqueda híbrida"},{"id":"re-ranking","name":"Re-ranking y Reciprocal Rank Fusion"},{"id":"reescritura-de-consultas","name":"Reescritura de consultas"},{"id":"compresion-y-reordenacion-del-contexto","name":"Compresión y reordenación del contexto"},{"id":"graphrag","name":"GraphRAG"},{"id":"agentic-rag","name":"Agentic RAG"},{"id":"evaluacion-de-rag","name":"Evaluación de RAG"}]},{"id":"agentes-de-ia","name":"Agentes de IA","children":[{"id":"agente-llm","name":"Agente (LLM + herramientas + bucle)"},{"id":"function-calling","name":"Llamada a herramientas (function calling)"},{"id":"bucle-react","name":"Bucle ReAct"},{"id":"memoria-del-agente","name":"Memoria del agente"},{"id":"guardrails-y-middleware","name":"Guardrails y middleware"},{"id":"human-in-the-loop","name":"Human-in-the-loop"},{"id":"agentes-de-codigo","name":"Agentes de código"},{"id":"sistemas-multiagente","name":"Sistemas multiagente"},{"id":"mcp","name":"Model Context Protocol (MCP)"},{"id":"evaluacion-de-agentes","name":"Evaluación de agentes"},{"id":"riesgos-y-permisos","name":"Riesgos y permisos"}]}]},{"id":"vision-por-computador","name":"Visión por computador","en":"computer vision","frase":"Máquinas que interpretan imágenes y vídeo: clasifican, detectan, segmentan y reconstruyen.","desc":"Enseñar a las máquinas a interpretar imágenes y vídeo: clasificar, detectar objetos, segmentar píxeles, estimar profundidad o reconstruir escenas en 3D. El campo ha pasado de los filtros diseñados a mano a las CNN y los Vision Transformers entrenados con grandes cantidades de datos.","cuando":"Cuando la información que necesitas está en imágenes o en vídeo.","ej":"Un coche autónomo detecta peatones y señales (detección) y separa la calzada del resto de la escena (segmentación) en tiempo real.","rel":["cnn","vit","deteccion-de-objetos","segmentacion"],"children":[{"id":"vision-clasica","name":"Visión clásica","children":[{"id":"piramides-gaussiana-y-laplaciana","name":"Pirámides gaussiana y laplaciana"},{"id":"transformada-de-fourier","name":"Transformada de Fourier"},{"id":"wavelets","name":"Wavelets"}]},{"id":"arquitecturas-cnn-de-referencia","name":"Arquitecturas CNN de referencia","children":[{"id":"imagenet-y-alexnet","name":"ImageNet y AlexNet"},{"id":"vgg","name":"VGG"},{"id":"googlenet","name":"GoogLeNet (Inception)"},{"id":"resnet","name":"ResNet"},{"id":"densenet-resnext-y-senet","name":"DenseNet, ResNeXt y SENet"},{"id":"mobilenet-y-efficientnet","name":"MobileNet y EfficientNet"},{"id":"convnext","name":"ConvNeXt"}]},{"id":"vit","name":"Vision Transformer (ViT)"},{"id":"clasificacion-de-imagenes","name":"Clasificación de imágenes"},{"id":"deteccion-de-objetos","name":"Detección de objetos","children":[{"id":"cajas-delimitadoras-e-iou","name":"Cajas delimitadoras e IoU"},{"id":"detectores-de-dos-fases","name":"Detectores de dos fases (R-CNN)"},{"id":"detectores-de-una-fase","name":"Detectores de una fase (YOLO, RetinaNet)"},{"id":"seguimiento-de-objetos","name":"Seguimiento de objetos (tracking)"}]},{"id":"segmentacion","name":"Segmentación","children":[{"id":"segmentacion-semantica-y-de-instancias","name":"Segmentación semántica y de instancias"},{"id":"u-net","name":"U-Net"},{"id":"sam","name":"Segment Anything (SAM)"}]},{"id":"estimacion-de-pose-y-profundidad","name":"Estimación de pose y profundidad"},{"id":"calidad-de-imagen","name":"Calidad de imagen (IQA)","children":[{"id":"con-referencia-vs-sin-referencia","name":"Con referencia vs sin referencia"},{"id":"psnr-y-ssim","name":"PSNR y SSIM"},{"id":"metricas-perceptuales","name":"Métricas perceptuales (LPIPS, NLPD)"}]},{"id":"vision-3d-y-neural-rendering","name":"Visión 3D y neural rendering","children":[{"id":"nerf","name":"NeRF"},{"id":"gaussian-splatting","name":"Gaussian Splatting"}]}]},{"id":"ia-multimodal-y-audio","name":"IA multimodal y audio","en":"multimodal AI & audio","frase":"Modelos que combinan texto, imagen, audio y vídeo en un mismo sistema.","desc":"Modelos que combinan varias modalidades (texto, imagen, audio y vídeo) en un mismo sistema. Sirven para buscar imágenes con texto, describir una foto, responder preguntas sobre un documento escaneado o transcribir y sintetizar voz. La clave es alinear las modalidades en un espacio de representación común.","cuando":"Cuando el problema mezcla modalidades, como buscar imágenes con texto o preguntar sobre un documento escaneado, o cuando trabajas con voz.","ej":"CLIP permite buscar \"un perro corriendo por la playa\" entre millones de fotos aunque ninguna esté etiquetada con esas palabras.","rel":["clip","mllm","texto-a-imagen","audio-y-voz"],"children":[{"id":"aprendizaje-multimodal","name":"Aprendizaje multimodal"},{"id":"tareas-multimodales","name":"Tareas multimodales (recuperación, captioning, VQA)"},{"id":"datasets-multimodales","name":"Datasets multimodales"},{"id":"modelos-contrastivos-imagen-texto","name":"Modelos contrastivos imagen-texto","children":[{"id":"clip","name":"CLIP"},{"id":"clasificacion-zero-shot","name":"Clasificación zero-shot"},{"id":"siglip","name":"SigLIP"}]},{"id":"mllm","name":"Modelos de lenguaje multimodales (MLLM / VLM)","children":[{"id":"arquitectura-mllm","name":"Arquitectura: encoder, conector y LLM"},{"id":"entrenamiento-mllm","name":"Entrenamiento de un MLLM"},{"id":"modelos-any-to-any","name":"Modelos any-to-any"}]},{"id":"generacion-multimodal","name":"Generación multimodal","children":[{"id":"texto-a-imagen","name":"Texto a imagen"},{"id":"generacion-de-video","name":"Texto a vídeo e imagen a vídeo"}]},{"id":"audio-y-voz","name":"Audio y voz","children":[{"id":"espectrograma-de-mel","name":"Espectrograma de Mel"},{"id":"reconocimiento-de-voz","name":"Reconocimiento de voz (Whisper)"},{"id":"sintesis-de-voz","name":"Síntesis de voz (TTS)"},{"id":"clap","name":"CLAP (audio-texto)"},{"id":"generacion-de-musica","name":"Generación de música"}]}]},{"id":"series-temporales","name":"Series temporales","en":"time series","frase":"Datos ordenados en el tiempo: anticipar lo que viene y entender su dinámica.","desc":"Datos ordenados en el tiempo, donde cada valor depende de los anteriores: ventas, temperatura, tráfico o señales de sensores. Los problemas típicos son predecir valores futuros (forecasting), clasificar secuencias y detectar comportamientos anómalos. Exigen validar respetando el orden temporal.","cuando":"Cuando el orden temporal importa y quieres anticipar valores futuros o entender cómo evoluciona algo.","ej":"Predecir la demanda eléctrica de las próximas 24 horas a partir del consumo de las últimas semanas y la previsión meteorológica.","rel":["prediccion-multipaso","enventanado","modelos-fundacionales-de-series","validacion-en-series-temporales"],"children":[{"id":"componentes-de-una-serie","name":"Componentes de una serie (tendencia, estacionalidad)"},{"id":"estacionariedad","name":"Estacionariedad"},{"id":"autocorrelacion","name":"Autocorrelación"},{"id":"enventanado","name":"Enventanado"},{"id":"prediccion-multipaso","name":"Predicción a uno y varios pasos"},{"id":"prediccion-autorregresiva","name":"Predicción autorregresiva"},{"id":"redes-neuronales-para-series","name":"Redes neuronales para series"},{"id":"modelos-fundacionales-de-series","name":"Modelos fundacionales de series (TimesFM, Chronos)"},{"id":"dtw","name":"Dynamic Time Warping (DTW)"},{"id":"series-como-imagenes","name":"Series como imágenes (GAF, wavelets, espectrograma)"}]},{"id":"sistemas-de-recomendacion","name":"Sistemas de recomendación","en":"recommender systems","frase":"Predecir qué le interesará a cada usuario a partir de su comportamiento y el de otros.","desc":"Sistemas que predicen qué ítems (películas, productos, canciones) interesarán a cada usuario a partir de su historial y del de usuarios parecidos. Combinan filtrado basado en contenido, filtrado colaborativo, factorización de matrices y modelos profundos basados en embeddings.","cuando":"Cuando hay muchos ítems entre los que elegir y quieres mostrar a cada usuario los más relevantes para él.","ej":"Netflix recomienda series según lo que has visto y lo que vieron usuarios con gustos similares, y hasta elige qué portada
