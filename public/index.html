scenas en 3D. El campo ha pasado de los filtros diseñados a mano a las CNN y los Vision Transformers entrenados con grandes cantidades de datos.","cuando":"Cuando la información que necesitas está en imágenes o en vídeo.","ej":"Un coche autónomo detecta peatones y señales (detección) y separa la calzada del resto de la escena (segmentación) en tiempo real.","rel":["cnn","vit","deteccion-de-objetos","segmentacion"],"children":[{"id":"vision-clasica","name":"Visión clásica","children":[{"id":"piramides-gaussiana-y-laplaciana","name":"Pirámides gaussiana y laplaciana"},{"id":"transformada-de-fourier","name":"Transformada de Fourier"},{"id":"wavelets","name":"Wavelets"}]},{"id":"arquitecturas-cnn-de-referencia","name":"Arquitecturas CNN de referencia","children":[{"id":"imagenet-y-alexnet","name":"ImageNet y AlexNet"},{"id":"vgg","name":"VGG"},{"id":"googlenet","name":"GoogLeNet (Inception)"},{"id":"resnet","name":"ResNet"},{"id":"densenet-resnext-y-senet","name":"DenseNet, ResNeXt y SENet"},{"id":"mobilenet-y-efficientnet","name":"MobileNet y EfficientNet"},{"id":"convnext","name":"ConvNeXt"}]},{"id":"vit","name":"Vision Transformer (ViT)"},{"id":"clasificacion-de-imagenes","name":"Clasificación de imágenes"},{"id":"deteccion-de-objetos","name":"Detección de objetos","children":[{"id":"cajas-delimitadoras-e-iou","name":"Cajas delimitadoras e IoU"},{"id":"detectores-de-dos-fases","name":"Detectores de dos fases (R-CNN)"},{"id":"detectores-de-una-fase","name":"Detectores de una fase (YOLO, RetinaNet)"},{"id":"seguimiento-de-objetos","name":"Seguimiento de objetos (tracking)"}]},{"id":"segmentacion","name":"Segmentación","children":[{"id":"segmentacion-semantica-y-de-instancias","name":"Segmentación semántica y de instancias"},{"id":"u-net","name":"U-Net"},{"id":"sam","name":"Segment Anything (SAM)"}]},{"id":"estimacion-de-pose-y-profundidad","name":"Estimación de pose y profundidad"},{"id":"calidad-de-imagen","name":"Calidad de imagen (IQA)","children":[{"id":"con-refere o-a-imagen","name":"Texto a imagen"},{"id":"generacion-de-video","name":"Texto a vídeo e imagen a vídeo"}]},{"id":"audio-y-voz","name":"Audio y voz","children":[{"id":"espectrograma-de-mel","name":"Espectrograma de Mel"},{"id":"reconocimiento-de-voz","name":"Reconocimiento de voz (Whisper)"},{"id":"sintesis-de-voz","name":"Síntesis de voz (TTS)"},{"id":"clap","name":"CLAP (audio-texto)"},{"id":"generacion-de-musica","name":"Generación de música"}]}]},{"id":"series-temporales","name":"Series temporales","en":"time series","frase":"Datos ordenados en el tiempo: anticipar lo que viene y entender su dinámica.","desc":"Datos ordenados en el tiempo, donde cada valor depende de los anteriores: ventas, temperatura, tráfico o señales de sensores. Los problemas típicos son predecir valores futuros (forecasting), clasificar secuencias y detectar comportamientos anómalos. Exigen validar respetando el orden temporal.","cuando":"Cuando el orden temporal importa y quieres anticipar valores futuros o entender cómo evoluciona algo.","ej":"Predecir la demanda eléctrica de las próximas 24 horas a partir del consumo de las últimas semanas y la previsión meteorológica.","rel":["prediccion-multipaso","enventanado","modelos-fundacionales-de-series","validacion-en-series-temporales"],"children":[{"id":"componentes-de-una-serie","name":"Componentes de una serie (tendencia, estacionalidad)"},{"id":"estacionariedad","name":"Estacionariedad"},{"id":"autocorrelacion","name":"Autocorrelación"},{"id":"enventanado","name":"Enventanado"},{"id":"prediccion-multipaso","name":"Predicción a uno y varios pasos"},{"id":"prediccion-autorregresiva","name":"Predicción autorregresiva"},{"id":"redes-neuronales-para-series","name":"Redes neuronales para series"},{"id":"modelos-fundacionales-de-series","name":"Modelos fundacionales de series (TimesFM, Chronos)"},{"id":"dtw","name":"Dynamic Time Warping (DTW)"},{"id":"series-como-imagenes","name":"Series como imágenes (GAF, wavelets, espectrograma)"}]},{"id":"sistemas-de-recomendacion","name":"Sistemas de recomendación","en":"recommender systems","frase":"Predecir qué le interesará a cada usuario a partir de su comportamiento y el de otros.","desc":"Sistemas que predicen qué ítems (películas, productos, canciones) interesarán a cada usuario a partir de su historial y del de usuarios parecidos. Combinan filtrado basado en contenido, filtrado colaborativo, factorización de matrices y modelos profundos basados en embeddings.","cuando":"Cuando hay muchos ítems entre los que elegir y quieres mostrar a cada usuario los más relevantes para él.","ej":"Netflix recomienda series según lo que has visto y lo que vieron usuarios con gustos similares, y hasta elige qué portada enseñarte.","rel":["filtrado-colaborativo","factorizacion-de-matrices","embeddings","recall-k-y-hitrate-k"],"children":[{"id":"el-problema-de-la-recomendacion","name":"El problema de la recomendación"},{"id":"matriz-de-utilidad","name":"Matriz de utilidad (usuario-ítem)"},{"id":"feedback-explicito-vs-implicito","name":"Feedback explícito vs implícito"},{"id":"filtrado-basado-en-contenido","name":"Filtrado basado en contenido"},{"id":"filtrado-colaborativo","name":"Filtrado colaborativo"},{"id":"factorizacion-de-matrices","name":"Factorización de matrices"},{"id":"sistemas-hibridos","name":"Sistemas híbridos"},{"id":"recomendacion-basada-en-sesion","name":"Recomendación basada en sesión"},{"id":"arranque-en-frio","name":"Arranque en frío (cold start)"},{"id":"recomendacion-con-deep-learning","name":"Recomendación con deep learning","children":[{"id":"autorec","name":"AutoRec"},{"id":"ncf","name":"Neural Collaborative Filtering (GMF, NeuMF)"},{"id":"dcn","name":"Deep & Cross Network (DCN)"}]},{"id":"scoring-y-re-ranking","name":"Scoring y re-ranking"},{"id":"burbuja-de-filtro","name":"Burbuja de filtro"},{"id":"evaluacion-de-recomendadores","name":"Evaluación de recomendadores","children":[{"id":"recall-k-y-hitrate-k","name":"Recall@K y HitRate@K"},{"id":"diversidad-novedad-y-serendipia","name":"Diversidad, novedad y serendipia"}]}]},{"id":"deteccion-de-anomalias","name":"Detección de anomalías","en":"anomaly detection","frase":"Encontrar lo raro: datos que no encajan con el comportamiento normal.","desc":"Identificar observaciones que se desvían del comportamiento normal: fraudes, averías, intrusiones o errores de medida. Como las anomalías son raras y casi nunca están etiquetadas, se suele modelar la normalidad (por distancia, probabilidad o reconstrucción) y marcar lo que no encaja.","cuando":"Cuando buscas casos raros (fraude, averías, errores) y apenas tienes ejemplos etiquetados de ellos.","ej":"Un autoencoder entrenado solo con transacciones normales reconstruye mal una fraudulenta, y ese error de reconstrucción alto la delata.","rel":["outliers","deteccion-por-reconstruccion-o-prediccion","isolation-forest","ood"],"children":[{"id":"anomalia-outlier-ruido-y-novedad","name":"Anomalía, outlier, ruido y novedad"},{"id":"ood","name":"Detección fuera de distribución (OOD)"},{"id":"enfoques-deteccion-anomalias","name":"Enfoques supervisado, semisupervisado y no supervisado"},{"id":"deteccion-basada-en-distancia","name":"Detección basada en distancia"},{"id":"deteccion-basada-en-probabilidad","name":"Detección basada en probabilidad"},{"id":"deteccion-teoria-informacion","name":"Detección basada en teoría de la información"},{"id":"deteccion-por-reconstruccion-o-prediccion","name":"Detección por reconstrucción o predicción"},{"id":"lof","name":"Local Outlier Factor (LOF)"},{"id":"isolation-forest","name":"Isolation Forest"},{"id":"deteccion-con-modelos-generativos","name":"Detección con modelos generativos"},{"id":"eleccion-del-umbral","name":"Elección del umbral"}]},{"id":"ia-fiable-y-responsable","name":"IA fiable y responsable","en":"trustworthy & responsible AI","frase":"Que la IA sea explicable, justa, robusta, consciente de su incertidumbre y legal.","desc":"Lo que hace falta para que la IA sea digna de confianza. Hay que entender por qué decide lo que decide (explicabilidad), evitar que discrimine (equidad), que resista manipulaciones (robustez), que sepa cuándo no está segura (incertidumbre) y que cumpla la regulación (RGPD, AI Act).","cuando":"Cuando un modelo toma decisiones que afectan a personas o hay que justificarlas, auditarlas o adaptarlas a la regulación.","ej":"Si un modelo deniega un préstamo, SHAP muestra qué variables pesaron en la decisión. Una explicación contrafactual indica qué tendría que cambiar para aprobarlo.","rel":["xai","equidad","robustez","ai-act"],"children":[{"id":"xai","name":"Explicabilidad (XAI)","children":[{"id":"caja-negra-vs-caja-blanca","name":"Caja negra vs caja blanca"},{"id":"interpretabilidad-vs-explicabilidad","name":"Interpretabilidad vs explicabilidad"},{"id":"transparencia","name":"Transparencia (simulable, descomponible, algorítmica)"},{"id":"taxonomia-de-metodos-xai","name":"Taxonomía de métodos XAI"},{"id":"modelos-interpretables-por-diseno","name":"Modelos interpretables por diseño","children":[{"id":"reglas-de-decision","name":"Reglas de decisión (RIPPER)"},{"id":"rulefit","name":"RuleFit"},{"id":"ebm","name":"Explainable Boosting Machine (EBM)"}]},{"id":"explicaciones-locales","name":"Explicaciones locales","children":[{"id":"perfiles-ceteris-paribus","name":"Perfiles Ceteris Paribus"},{"id":"ice","name":"ICE (Individual Conditional Expectation)"},{"id":"lime","name":"LIME"},{"id":"anchors","name":"Anchors (reglas acotadas)"},{"id":"valores-de-shapley","name":"Valores de Shapley"},{"id":"shap","name":"SHAP"},{"id":"explicaciones-contrafactuales","name":"Explicaciones contrafactuales"},{"id":"prototipos-y-excepciones","name":"Prototipos y excepciones"}]},{"id":"explicaciones-globales","name":"Explicaciones globales","children":[{"id":"pdp","name":"PDP (dependencia parcial)"},{"id":"ale","name":"ALE (efectos locales acumulados)"},{"id":"importancia-por-permutacion","name":"Importancia por permutación"},{"id":"modelo-subrogado-global","name":"Modelo subrogado global"},{"id":"analisis-de-interacciones","name":"Análisis de interacciones"}]},{"id":"explicabilidad-en-deep-learning","name":"Explicabilidad en deep learning","children":[{"id":"grad-cam","name":"Mapas de saliencia y Grad-CAM"},{"id":"visualizacion-de-filtros-y-activaciones","name":"Visualización de filtros y activaciones"},{"id":"mapas-de-atencion","name":"Mapas de atención"}]},{"id":"evaluacion-de-explicaciones","name":"Evaluación de explicaciones"}]},{"id":"equidad","name":"Equidad (fairness)","children":[{"id":"sesgo-algoritmico-y-atributos-sensibles","name":"Sesgo algorítmico y atributos sensibles"},{"id":"metricas-de-equidad","name":"Métricas de equidad"},{"id":"mitigacion-del-sesgo","name":"Mitigación del sesgo"}]},{"id":"robustez","name":"Robustez","children":[{"id":"ejemplos-adversarios","name":"Ejemplos adversarios"},{"id":"fgsm","name":"FGSM"},{"id":"ataque-de-un-pixel","name":"Ataque de un píxel"},{"id":"entrenamiento-robusto","name":"Entrenamiento robusto"}]},{"id":"incertidumbre","name":"Incertidumbre","children":[{"id":"incertidumbre-aleatoria-y-epistemica","name":"Incertidumbre aleatoria y epistémica"},{"id":"propagacion-de-la-incertidumbre","name":"Propagación de la incertidumbre"},{"id":"estimacion-de-incertidumbre-en-redes","name":"Estimación de incertidumbre en redes"}]},{"id":"regulacion-y-gobernanza","name":"Regulación y gobernanza","children":[{"id":"decisiones-automatizadas-y-rgpd","name":"Decisiones automatizadas y RGPD"},{"id":"ai-act","name":"AI Act"},{"id":"gobernanza-ia","name":"Estándares y gobernanza de la IA"},{"id":"model-cards","name":"Model cards"}]}]},{"id":"aprendizaje-por-refuerzo","name":"Aprendizaje por refuerzo","en":"reinforcement learning","frase":"Aprender a decidir por ensayo y error, maximizando una recompensa acumulada.","desc":"Un agente aprende a tomar decisiones interactuando con un entorno. Actúa, recibe una recompensa y ajusta su política para maximizar la recompensa acumulada. No hay etiquetas con la respuesta correcta, solo señales de lo bien o mal que ha ido, y el dilema central es explorar acciones nuevas o explotar las que ya funcionan.","cuando":"Cuando hay que tomar decisiones en secuencia y aprender de la recompensa que generan, sin respuestas correctas de antemano.","ej":"AlphaGo Zero aprendió a jugar al go desde cero jugando millones de partidas contra sí mismo. Un sistema de anuncios elige qué banner mostrar según los clics que va recibiendo.","rel":["agente-entorno-y-recompensa","exploracion-vs-explotacion","multi-armed-bandits","rlhf"],"children":[{"id":"agente-entorno-y-recompensa","name":"Agente, entorno y recompensa"},{"id":"politica-y-funcion-de-valor","name":"Política y función de valor"},{"id":"exploracion-vs-explotacion","name":"Exploración vs explotación"},{"id":"multi-armed-bandits","name":"Multi-armed bandits","children":[{"id":"epsilon-greedy","name":"Greedy y ε-greedy"},{"id":"valores-iniciales-optimistas","name":"Valores iniciales optimistas"},{"id":"ucb","name":"UCB (Upper Confidence Bound)"},{"id":"muestreo-de-thompson","name":"Muestreo de Thompson"},{"id":"bandits-contextuales","name":"Bandits contextuales (LinUCB)"}]},{"id":"regret","name":"Regret"}]}]}</script>
<script>
(() => {
  "use strict";
  const DATA = JSON.parse(document.getElementById("datos").textContent);
  const $ = (s) => document.querySelector(s);
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const isMobile = () => matchMedia("(max-width: 860px)").matches;
  const DEFAULT_ID = "aprendizaje-supervisado";   // vista inicial sin enlace directo

  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  // ---------- Índice del árbol ----------
  const areas = DATA.children || [];
  const byId = new Map(), order = [];
  (function index(n, parent, depth, area) {
    n.parent = parent; n.depth = depth; n.area = depth === 1 ? n : area;
    n.ai = n.area ? areas.indexOf(n.area) : -1;            // índice de área → color viridis
    byId.set(n.id, n); order.push(n);
    (n.children || []).forEach((c) => index(c, n, depth + 1, depth === 0 ? null : n.area));
  })(DATA, null, 0, null);
  const total = order.length - 1;                             // sin contar la raíz
  const conFicha = order.filter((n) => n.depth > 0 && n.desc).length;
  const color = (n) => (n.ai >= 0 ? `var(--a${n.ai})` : "var(--accent)");

  $("#q").placeholder = `Buscar entre ${total} conceptos`;
  if (conFicha < total) {
    const p = $("#m-estado");
    p.textContent = `Prototipo: ${conFicha} de ${total} fichas redactadas`;
    p.hidden = false;
  }

  // ---------- Estado ----------
  const expanded = new Set([DATA.id]);
  let selected = DATA.id, pathSet = new Set([DATA.id]);
  const ZOOMS = [0.55, 0.7, 0.85, 1, 1.15, 1.3];
  let zi = 3;

  // ---------- Nodos (se crean una vez; se muestran u ocultan) ----------
  const viewport = $("#viewport"), sizer = $("#sizer"), canvas = $("#canvas");
  const nodesEl = $("#nodes"), wiresEl = $("#wires");
  const els = new Map(), heights = new Map();
  order.forEach((n) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = `node d${Math.min(n.depth, 2)}` + (n.depth > 0 && !n.desc ? " pending" : "");
    b.style.setProperty("--c", color(n));
    b.innerHTML = '<span class="port in"></span><span class="label"></span>' +
      (n.children ? '<span class="count"></span><span class="port out"></span>' : "");
    // Las palabras con guion (k-NN, t-SNE, multi-salida) no se parten a final de línea
    b.querySelector(".label").innerHTML = esc(n.name).replace(/(\S+-\S+)/g, '<span class="nw">$1</span>');
    b.setAttribute("aria-label", n.name);
    b.hidden = true;
    b.addEventListener("click", () => { hideTip(); onNodeClick(n.id); });
    // "En una frase": al pasar el ratón (no en pantallas táctiles) o al llegar con el teclado
    b.addEventListener("pointerenter", (e) => { if (e.pointerType !== "touch") scheduleTip(n, b); });
    b.addEventListener("pointerleave", hideTip);
    b.addEventListener("focus", () => { if (b.matches(":focus-visible")) scheduleTip(n, b, 0); });
    b.addEventListener("blur", hideTip);
    nodesEl.appendChild(b);
    els.set(n.id, b);
  });

  // ---------- Layout: árbol horizontal con alturas variables ----------
  const PAD = 32, GAP_X = 58, GAP_Y = 8, GAP_GROUP = 14, W_ROOT = 168, W_NODE = 216;
  const nodeW = (n) => (n.depth === 0 ? W_ROOT : W_NODE);
  const colX = (d) => PAD + (d === 0 ? 0 : W_ROOT + GAP_X + (d - 1) * (W_NODE + GAP_X));

  function visibleList() {
    const out = [];
    (function walk(n) { out.push(n); if (expanded.has(n.id)) (n.children || []).forEach(walk); })(DATA);
    return out;
  }

  function layout() {
    let cursor = PAD;
    (function place(n) {
      n._x = colX(n.depth); n._w = nodeW(n); n._h = heights.get(n.id);
      const kids = expanded.has(n.id) ? n.children || [] : [];
      if (!kids.length) { n._y = cursor; cursor += n._h + GAP_Y; return; }
      const start = cursor;
      kids.forEach(place);
      const first = kids[0], last = kids[kids.length - 1];
      n._y = Math.max(start, (first._y + last._y + last._h) / 2 - n._h / 2);   // centrado sobre sus hijos
      cursor = Math.max(cursor, n._y + n._h + GAP_Y) + GAP_GROUP;
    })(DATA);
    return cursor;
  }

  function render(nuevos = new Set()) {
    const list = visibleList();
    const vis = new Set(list.map((n) => n.id));
    order.forEach((n) => { const el = els.get(n.id); if (el.hidden === vis.has(n.id)) el.hidden = !vis.has(n.id); });
    list.forEach((n) => { if (!heights.has(n.id)) heights.set(n.id, els.get(n.id).offsetHeight); });
    const H = layout() + PAD;
    let W = 0, k = 0;
    list.forEach((n) => {
      const el = els.get(n.id);
      el.style.transform = `translate(${n._x}px, ${n._y}px)`;
      W = Math.max(W, n._x + n._w + PAD);
      const abierto = expanded.has(n.id) && !!n.children;
      if (n.children) {
        el.setAttribute("aria-expanded", String(abierto));
        el.querySelector(".count").textContent = abierto ? "" : n.children.length;
      }
      el.classList.toggle("open", abierto);
      el.classList.toggle("sel", n.id === selected);
      el.classList.toggle("path", pathSet.has(n.id) && n.id !== selected);
      if (n.id === selected) el.setAttribute("aria-current", "true"); else el.removeAttribute("aria-current");
      if (nuevos.has(n.id) && !reduceMotion) {
        el.classList.remove("enter"); void el.offsetWidth;
        el.style.setProperty("--i", k++); el.classList.add("enter");
      }
    });
    const z = ZOOMS[zi];
    canvas.style.width = W + "px"; canvas.style.height = H + "px";
    canvas.style.transform = `scale(${z})`;
    sizer.style.width = W * z + "px"; sizer.style.height = H * z + "px";
    drawWires(list, nuevos, W, H);
  }

  function drawWires(list, nuevos, W, H) {
    wiresEl.setAttribute("width", W); wiresEl.setAttribute("height", H);
    wiresEl.setAttribute("viewBox", `0 0 ${W} ${H}`);
    let s = "";
    list.forEach((n) => {
      const p = n.parent;
      if (!p) return;
      const x1 = p._x + p._w, y1 = p._y + p._h / 2, x2 = n._x, y2 = n._y + n._h / 2, dx = (x2 - x1) / 2;
      const cls = "w" + (pathSet.has(n.id) ? " on" : "") + (nuevos.has(n.id) && !reduceMotion ? " draw" : "");
      s += `<path class="${cls}" pathLength="1" style="stroke:${color(n)}" d="M${x1} ${y1}C${x1 + dx} ${y1} ${x2 - dx} ${y2} ${x2} ${y2}"/>`;
    });
    wiresEl.innerHTML = s;
  }

  // ---------- Navegación ----------
  function setPath() {
    pathSet = new Set();
    for (let n = byId.get(selected); n; n = n.parent) pathSet.add(n.id);
  }

  function select(id, { expand = false, sheet = false, instant = false } = {}) {
    const n = byId.get(id);
    if (!n) return;
    const nuevos = new Set();
    for (let p = n.parent; p; p = p.parent) {
      if (!expanded.has(p.id)) { expanded.add(p.id); (p.children || []).forEach((c) => nuevos.add(c.id)); }
    }
    if (expand && n.children && !expanded.has(id)) { expanded.add(id); n.children.forEach((c) => nuevos.add(c.id)); }
    selected = id;
    setPath();
    render(nuevos);
    renderCard(n);
    reveal(n, instant);
    try { history.replaceState(null, "", "#" + id); } catch (e) { /* sin historial disponible */ }
    if (sheet && isMobile()) setSheet(sheet);              // en móvil: primero la frase ("peek"), luego la ficha
  }

  function onNodeClick(id) {
    const n = byId.get(id);
    if (n.children && n.depth > 0 && selected === id && expanded.has(id)) {   // segundo clic: plegar
      (function fold(m) { expanded.delete(m.id); (m.children || []).forEach(fold); })(n);
      render();
      return;
    }
    select(id, { expand: true, sheet: "peek" });
  }

  // ---------- "En una frase": tarjeta flotante junto al nodo ----------
  const tip = $("#tip"), tipText = $("#tip-text");
  let tipTimer = 0, tipFor = null;
  function scheduleTip(n, el, delay = 380) {
    clearTimeout(tipTimer);
    if (!n.frase || n.id === selected || isMobile()) return;   // la ficha abierta ya lo dice; en móvil va en la hoja
    tipTimer = setTimeout(() => showTip(n, el), delay);
  }
  function showTip(n, el) {
    tipText.textContent = n.frase;
    tip.style.setProperty("--c", color(n));
    tip.hidden = false;
    tip.classList.remove("on");
    const r = el.getBoundingClientRect(), v = viewport.getBoundingClientRect();
    const w = Math.min(300, v.width - 24);
    tip.style.maxWidth = w + "px";
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    // Debajo del nodo; si no cabe en el mapa, encima. Nunca tapa el propio nodo.
    let top = r.bottom + 10, down = false;
    if (top + th > v.bottom - 8 && r.top - th - 10 > v.top + 4) { top = r.top - th - 10; down = true; }
    const left = Math.min(Math.max(r.left + 4, v.left + 8), v.right - tw - 8);
    tip.style.top = top + "px"; tip.style.left = left + "px";
    tip.style.setProperty("--ax", Math.min(Math.max(r.left + 22 - left, 16), tw - 16) + "px");   // flecha hacia el nodo
    tip.classList.toggle("down", down);
    el.setAttribute("aria-describedby", "tip");
    tipFor = el;
    requestAnimationFrame(() => tip.classList.add("on"));
  }
  function hideTip() {
    clearTimeout(tipTimer);
    if (tipFor) { tipFor.removeAttribute("aria-describedby"); tipFor = null; }
    tip.classList.remove("on");
    tip.hidden = true;
  }
  viewport.addEventListener("scroll", hideTip, { passive: true });

  // Desplaza lo justo para que el nodo (y su columna de hijos, si está abierto) quede a la vista
  function reveal(n, instant) {
    const z = ZOOMS[zi], vw = viewport.clientWidth, vh = viewport.clientHeight;
    const right = (n._x + n._w + (expanded.has(n.id) && n.children ? GAP_X + W_NODE : 0)) * z + 24;
    let left = viewport.scrollLeft;
    if (right > left + vw) left = right - vw;
    if (n._x * z - 24 < left) left = n._x * z - 24;
    const top = (n._y + n._h / 2) * z - vh / 2;
    viewport.scrollTo({ left: Math.max(0, left), top: Math.max(0, top), behavior: instant || reduceMotion ? "auto" : "smooth" });
  }

  // ---------- Ficha ----------
  const ficha = $("#ficha");
  const fmt = (s) => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
  const norm = (s) => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

  const chip = (id) => {
    const m = byId.get(id);
    const t = m.frase ? ` title="${esc(m.frase)}"` : "";
    return `<button type="button" class="chip" data-go="${m.id}" style="--c:${color(m)}"${t}><span class="dot"></span>${esc(m.name)}</button>`;
  };
  const ICONO_EXT = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M5 2H2v8h8V7M7 2h3v3M10 2 5.5 6.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const pyItem = (p) => {
    const docs = p.u ? `<a class="docs" href="${esc(p.u)}" target="_blank" rel="noopener noreferrer" aria-label="Documentación oficial de ${esc(p.c)} (se abre en una pestaña nueva)">Docs ${ICONO_EXT}</a>` : "";
    return `<li><code>${esc(p.c)}</code>${docs}<button type="button" class="copy" data-copy="${esc(p.c)}">Copiar</button></li>`;
  };

  function renderCard(n) {
    const ruta = [];
    for (let p = n.parent; p && p.depth > 0; p = p.parent) ruta.unshift(p);
    const h = [];
    h.push('<nav class="crumbs" aria-label="Ruta">' + (n.depth === 0 ? "<span>Raíz del mapa</span>" :
      ['<button type="button" data-go="' + DATA.id + '">IA</button>']
        .concat(ruta.map((p) => `<button type="button" data-go="${p.id}">${esc(p.name)}</button>`))
        .join('<span aria-hidden="true">›</span>')) + "</nav>");
    h.push(`<h2 id="ficha-titulo">${esc(n.name)}</h2>`);
    if (n.en && norm(n.en) !== norm(n.name)) h.push(`<p class="en" lang="en">${esc(n.en)}</p>`);
    if (n.desc) {
      // Orden de lectura: qué es (frase + explicación) → cuándo usarlo → ejemplo → cómo usarlo (hiperparámetros, Python)
      if (n.frase) h.push(`<p class="lead">${fmt(n.frase)}</p>`);
      h.push(`<p class="desc">${fmt(n.desc)}</p>`);
      if (n.cuando) h.push(`<section class="blk cuando"><h3>Cuándo usarlo</h3><p>${fmt(n.cuando)}</p></section>`);
      if (n.ej) h.push(`<section class="blk ej"><h3>Ejemplo</h3><p>${fmt(n.ej)}</p></section>`);
      if (n.hp && n.hp.length) h.push(`<section class="blk"><h3>Hiperparámetros clave</h3><dl class="hp">${
        n.hp.map(([k, v]) => `<dt>${k.split("/").map((s) => `<code>${esc(s.trim())}</code>`).join(" / ")}</dt><dd>${fmt(v)}</dd>`).join("")}</dl></section>`);
    } else {
      h.push('<p class="pending-note">Esta ficha todavía no está redactada en el prototipo.</p>');
    }
    if (n.py && n.py.length) h.push(`<section class="blk"><h3>En Python</h3><ul class="py">${n.py.map(pyItem).join("")}</ul></section>`);
    if (n.rel && n.rel.length) h.push(`<section class="blk"><h3>Relacionados</h3><div class="chips">${n.rel.map(chip).join("")}</div></section>`);
    if (n.children) h.push(`<section class="blk"><h3>En esta rama (${n.children.length})</h3><div class="chips">${n.children.map((c) => chip(c.id)).join("")}</div></section>`);
    const i = order.indexOf(n), prev = order[i - 1], next = order[i + 1];
    h.push('<footer class="seq">' +
      `<button type="button" class="btn" data-go="${prev ? prev.id : ""}"${prev ? "" : " disabled"}>Anterior</button>` +
      `<span class="pos">${i} de ${total}</span>` +
      `<button type="button" class="btn" data-go="${next ? next.id : ""}"${next ? "" : " disabled"}>Siguiente</button></footer>`);
    if (n.depth === 0) h.push('<p class="foot">Pasa el ratón por un concepto para ver su idea en una frase; púlsalo para abrir su ficha y su rama. Cada área lleva su color de la escala viridis. Atajos: <kbd>/</kbd> para buscar, <kbd>←</kbd> y <kbd>→</kbd> para pasar al concepto anterior o siguiente.</p>');
    ficha.innerHTML = h.join("");
    $("#peek-title").textContent = n.name;
    $("#peek-frase").textContent = n.frase || "";
    $("#panel").scrollTop = 0;
    updatePeek();
  }

  // Altura de la hoja asomada (móvil): lo que mida la cabecera con nombre y frase
  function updatePeek() {
    if (!isMobile()) return;
    const h = $("#handle").offsetHeight;
    if (h) document.documentElement.style.setProperty("--peek", h + "px");
  }

  $("#panel").addEventListener("click", (e) => {
    const go = e.target.closest("[data-go]");
    if (go && go.dataset.go) { select(go.dataset.go, { expand: true }); return; }
    const cp = e.target.closest(".copy");
    if (cp) copiar(cp);
  });

  function copiar(btn) {
    const done = (t) => { btn.textContent = t; setTimeout(() => (btn.textContent = "Copiar"), 1400); };
    const fallback = () => {
      const r = document.createRange(); r.selectNodeContents(btn.previousElementSibling);
      const s = getSelection(); s.removeAllRanges(); s.addRange(r); done("Seleccionado");
    };
    try { navigator.clipboard.writeText(btn.dataset.copy).then(() => done("Copiado"), fallback); }
    catch (e) { fallback(); }
  }

  // ---------- Hoja inferior (móvil) ----------
  const panel = $("#panel"), handle = $("#handle");
  function setSheet(state) {
    panel.dataset.state = state;
    handle.setAttribute("aria-expanded", String(state === "open"));
    $("#peek-accion").textContent = state === "open" ? "Ocultar" : "Ver ficha";
  }
  handle.addEventListener("click", () => setSheet(panel.dataset.state === "open" ? "peek" : "open"));

  // ---------- Buscador ----------
  const q = $("#q"), res = $("#resultados");
  const idx = order.filter((n) => n.depth > 0).map((n) => ({
    n, name: norm(n.name), all: norm([n.name, n.en || "", n.frase || "", n.desc || "", n.cuando || "", n.ej || ""].join(" ")),
  }));
  let hits = [], active = -1;

  function buscar(texto) {
    const t = norm(texto.trim()).split(/\s+/).filter(Boolean);
    if (!t.length) return [];
    const out = [];
    idx.forEach((r) => {
      if (!t.every((w) => r.all.includes(w))) return;
      const frase = t.join(" ");
      const score = r.name.startsWith(frase) ? 4 : r.name.includes(frase) ? 3 : t.every((w) => r.name.includes(w)) ? 2 : 1;
      out.push([score, r.n]);
    });
    out.sort((a, b) => b[0] - a[0] || a[1].name.length - b[1].name.length);
    return out.slice(0, 14).map((x) => x[1]);
  }

  function pintarResultados() {
    if (!q.value.trim()) { cerrarResultados(); return; }
    res.innerHTML = hits.length ? hits.map((n, i) =>
      `<li><button type="button" role="option" id="op-${i}" data-go="${n.id}" aria-selected="${i === active}" style="--c:${color(n)}">` +
      `<span class="dot"></span><span class="r-name">${esc(n.name)}</span><span class="r-area">${esc(n.area ? n.area.name : "")}</span>` +
      (n.frase ? `<span class="r-frase">${esc(n.frase)}</span>` : "") + `</button></li>`).join("")
      : '<li class="vacio">Ningún concepto coincide. Prueba con otra palabra o con el término en inglés.</li>';
    res.hidden = false;
    q.setAttribute("aria-expanded", "true");
    if (active >= 0) q.setAttribute("aria-activedescendant", `op-${active}`); else q.removeAttribute("aria-activedescendant");
  }
  function cerrarResultados() { res.hidden = true; q.setAttribute("aria-expanded", "false"); active = -1; }
  function elegir(id) { cerrarResultados(); q.value = ""; select(id, { expand: true, sheet: "peek" }); }

  q.addEventListener("input", () => { hits = buscar(q.value); active = hits.length ? 0 : -1; pintarResultados(); });
  q.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown" && hits.length) { active = (active + 1) % hits.length; pintarResultados(); e.preventDefault(); }
    else if (e.key === "ArrowUp" && hits.length) { active = (active - 1 + hits.length) % hits.length; pintarResultados(); e.preventDefault(); }
    else if (e.key === "Enter" && active >= 0) { elegir(hits[active].id); e.preventDefault(); }
    else if (e.key === "Escape") { cerrarResultados(); q.blur(); }
  });
  res.addEventListener("mousedown", (e) => e.preventDefault());       // no perder el foco al pulsar
  res.addEventListener("click", (e) => { const b = e.target.closest("[data-go]"); if (b) elegir(b.dataset.go); });
  q.addEventListener("blur", () => setTimeout(cerrarResultados, 120));

  // ---------- Herramientas ----------
  $("#b-general").addEventListener("click", () => {
    expanded.clear(); expanded.add(DATA.id);
    selected = DATA.id; setPath(); render(); renderCard(DATA);
    viewport.scrollTo({ left: 0, top: 0, behavior: reduceMotion ? "auto" : "smooth" });
    try { history.replaceState(null, "", "#" + DATA.id); } catch (e) { /* nada */ }
  });
  $("#b-rama").addEventListener("click", () => {
    const n = byId.get(selected), nuevos = new Set();
    (function all(m) { if (m.children) { if (!expanded.has(m.id)) m.children.forEach((c) => nuevos.add(c.id)); expanded.add(m.id); m.children.forEach(all); } })(n);
    render(nuevos); reveal(n);
  });
  function setZoom(d) {
    hideTip();
    const n = byId.get(selected);
    zi = Math.min(ZOOMS.length - 1, Math.max(0, zi + d));
    $("#z-nivel").textContent = Math.round(ZOOMS[zi] * 100) + " %";
    $("#z-menos").disabled = zi === 0; $("#z-mas").disabled = zi === ZOOMS.length - 1;
    render(); reveal(n, true);
  }
  $("#z-menos").addEventListener("click", () => setZoom(-1));
  $("#z-mas").addEventListener("click", () => setZoom(1));

  document.addEventListener("keydown", (e) => {
    if (e.key !== "Tab") hideTip();
    const t = e.target, escribiendo = t.matches && t.matches("input, textarea");
    if (e.key === "/" && !escribiendo) { e.preventDefault(); q.focus(); return; }
    if (escribiendo || e.metaKey || e.ctrlKey || e.altKey) return;
    const i = order.indexOf(byId.get(selected));
    if (e.key === "ArrowRight" && order[i + 1]) { e.preventDefault(); select(order[i + 1].id, { expand: true }); }
    if (e.key === "ArrowLeft" && i > 0) { e.preventDefault(); select(order[i - 1].id, { expand: true }); }
    if (e.key === "Escape" && isMobile()) setSheet("peek");
  });

  // ---------- Arranque ----------
  const inicial = byId.has(location.hash.slice(1)) ? location.hash.slice(1) : DEFAULT_ID;
  select(inicial, { expand: true, instant: true });
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => { heights.clear(); render(); reveal(byId.get(selected), true); updatePeek(); });
  }
  addEventListener("resize", () => { hideTip(); updatePeek(); });
})();
</script>
</body>
</html>
