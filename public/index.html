peline"},{"c":"diffusers.WanPipeline","u":"https://huggingface.co/docs/diffusers/api/pipelines/wan#diffusers.WanPipeline"}],"rel":["modelos-de-difusion","generacion-de-video","stable-diffusion","atencion-y-transformers"]}]},{"id":"transferencia-de-estilo-neuronal","name":"Transferencia de estilo neuronal","en":"neural style transfer","frase":"Pintar el contenido de una imagen con el estilo de otra usando las características de una red preentrenada.","desc":"Se optimiza una imagen para que sus activaciones profundas en una red como VGG se parezcan a las de la imagen de contenido, y sus correlaciones entre canales (matrices de Gram), a las de la imagen de estilo. Las matrices de Gram capturan texturas y pinceladas independientemente de su posición. El método original optimiza cada imagen por separado; después aparecieron redes que aplican un estilo en un solo paso.","cuando":"Para efectos artísticos o para aumentar datos cambiando la apariencia y conservando la estructura.","ej":"Convertir una foto de tu ciudad en un cuadro con las pinceladas de \"La noche estrellada\".","py":[{"c":"keras.applications.VGG19","u":"https://keras.io/api/applications/vgg/vgg_models/#vgg19-function"},{"c":"torch.einsum(\"bchw,bdhw->bcd\", f, f)","s":1}],"rel":["perdidas-perceptuales","cyclegan","filtros-y-mapas-de-caracteristicas","visualizacion-de-filtros-y-activaciones"]},{"id":"superresolucion-inpainting-y-colorizacion","name":"Superresolución, inpainting y colorización","en":"super-resolution, inpainting & colorization","frase":"Restaurar imágenes: aumentar su resolución, rellenar las zonas que faltan o dar color a fotos en blanco y negro.","desc":"Son problemas inversos: hay muchas soluciones posibles y el modelo debe elegir una plausible usando lo que sabe de cómo son las imágenes. La superresolución inventa detalle fino; el inpainting rellena regiones borradas o dañadas de forma coherente con el resto; la colorización asigna colores creíbles. Se abordan con U-Net, GAN y, sobre todo hoy, con modelos de difusión.","cuando":"Para restaurar fotos antiguas o dañadas, ampliar imágenes o eliminar objetos no deseados.","ej":"Borrar a un turista del fondo de una foto de vacaciones y rellenar el hueco con el paisaje que había detrás.","py":[{"c":"diffusers.StableDiffusionInpaintPipeline","u":"https://huggingface.co/docs/diffusers/api/pipelines/stable_diffusion/inpaint#diffusers.StableDiffusionInpaintPipeline"},{"c":"diffusers.StableDiffusionUpscalePipeline","u":"https://huggingface.co/docs/diffusers/api/pipelines/stable_diffusion/upscale#diffusers.StableDiffusionUpscalePipeline"}],"rel":["srgan","el-denoiser-como-prior-implicito","u-net","pix2pix"]},{"id":"datos-sinteticos","name":"Datos sintéticos","en":"synthetic data","frase":"Datos artificiales generados por modelos que imitan las propiedades de los reales.","desc":"Se usan cuando los datos reales son escasos, caros, desbalanceados o privados. Pueden ser tablas que conservan las distribuciones y correlaciones de las originales sin copiar a ninguna persona, imágenes simuladas o generadas, o textos creados por un LLM para entrenar otros modelos. Hay que validar que sean útiles (que un modelo entrenado con ellos funcione con datos reales) y que no filtren información privada.","cuando":"Con datos escasos, sensibles o desbalanceados, para compartir datos sin exponer información personal o para cubrir casos raros.","ej":"Un banco genera transacciones sintéticas con las mismas pautas estadísticas que las reales para que un proveedor externo desarrolle su modelo sin acceder a datos de clientes.","py":[{"c":"sdv.single_table.GaussianCopulaSynthesizer","u":"https://docs.sdv.dev/sdv/single-table-data/modeling/synthesizers/gaussiancopulasynthesizer"},{"c":"sdv.single_table.CTGANSynthesizer","u":"https://docs.sdv.dev/sdv/single-table-data/modeling/synthesizers/ctgansynthesizer"}],"rel":["data-augmentation","adaptacion-de-dominio","desbalanceo-de-clases","decisiones-automatizadas-y-rgpd"]},{"id":"evaluacion-de-modelos-generativos","name":"Evaluación de modelos generativos","en":"evaluating generative models","frase":"Medir si lo generado es realista, diverso y fiel a lo pedido: mucho más difícil que medir un acierto.","desc":"No hay una respuesta correcta con la que comparar, así que se combinan varias miradas: la inspección humana, métricas que comparan las distribuciones de muestras reales y generadas en el espacio de características de una red (IS, FID, KID), medidas separadas de calidad y diversidad (precisión y cobertura) y, cuando existe, la verosimilitud. Ninguna basta por sí sola.","ej":"Dos modelos de imagen con un FID parecido pueden fallar de forma distinta: uno genera manos deformes y el otro repite siempre los mismos fondos.","rel":["evaluacion-cualitativa","fid-y-kid","mode-drop-y-cobertura","verosimilitud-vs-calidad-de-muestras"],"children":[{"id":"evaluacion-cualitativa","name":"Evaluación cualitativa","en":"qualitative evaluation","frase":"Mirar las muestras: el juicio humano sigue siendo imprescindible para evaluar lo generado.","desc":"Inspeccionar muestras, compararlas lado a lado y pedir a personas que elijan la mejor, o que distingan lo real de lo generado, revela defectos que las métricas no ven: anatomías imposibles, texto ilegible, incoherencias o falta de fidelidad a la instrucción. Para que sea fiable conviene usar muestras al azar y no las mejores, varios evaluadores y comparaciones a ciegas.","cuando":"Siempre, como complemento de las métricas automáticas, y sobre todo antes de decidir entre modelos.","ej":"Un panel de evaluadores compara a ciegas pares de imágenes de dos modelos para la misma instrucción y elige la que mejor la cumple.","rel":["evaluacion-de-modelos-generativos","arenas-de-preferencia-humana","llm-as-a-judge"]},{"id":"inception-score","name":"Inception Score (IS)","en":"Inception Score (IS)","frase":"Puntúa las imágenes generadas según lo claras y variadas que le parecen a un clasificador preentrenado.","desc":"Pasa las imágenes por la red Inception: si cada una se clasifica con confianza en una clase (es nítida) y en conjunto aparecen muchas clases distintas (hay diversidad), la puntuación es alta. Formalmente, es la exponencial de la divergencia KL media entre la distribución de clases de cada imagen y la distribución marginal. No se compara con imágenes reales y solo tiene sentido con clases parecidas a las de ImageNet.","cuando":"Como métrica histórica de referencia para imágenes naturales; hoy se prefiere el FID.","ej":"Un modelo que genera solo perros muy nítidos obtiene un IS bajo por falta de diversidad.","py":[{"c":"torchmetrics.image.inception.InceptionScore","u":"https://lightning.ai/docs/torchmetrics/stable/image/inception_score.html"}],"rel":["fid-y-kid","divergencia-de-kullback-leibler","evaluacion-de-modelos-generativos"]},{"id":"fid-y-kid","name":"FID y KID","en":"FID & KID","frase":"Comparan la distribución de imágenes reales y generadas en el espacio de características de una red: cuanto más bajo, mejor.","desc":"El FID (Fréchet Inception Distance) extrae características de Inception de imágenes reales y generadas, ajusta una gaussiana a cada conjunto y mide la distancia entre ambas. Recoge a la vez calidad y diversidad y es la métrica estándar en generación de imágenes, aunque está sesgado cuando hay pocas muestras. El KID usa en su lugar una distancia basada en kernels (MMD), insesgada y más fiable con muestras pequeñas.","cuando":"Para comparar modelos de generación de imágenes entre sí o seguir su evolución durante el entrenamiento.","ej":"A lo largo del entrenamiento, el FID de un modelo de difusión baja de 25 a 8 a medida que sus imágenes se parecen más a las reales.","hp":[["feature","capa de Inception cuyas características se comparan (2048 por defecto)"],["subset_size","en KID, tamaño de los subconjuntos con los que se estima"]],"py":[{"c":"torchmetrics.image.fid.FrechetInceptionDistance","u":"https://lightning.ai/docs/torchmetrics/stable/image/frechet_inception_distance.html"},{"c":"torchmetrics.image.kid.KernelInceptionDistance","u":"https://lightning.ai/docs/torchmetrics/stable/image/kernel_inception_distance.html"}],"rel":["inception-score","mode-drop-y-cobertura","evaluacion-de-modelos-generativos","metricas-perceptuales"]},{"id":"mode-drop-y-cobertura","name":"Mode drop y cobertura","en":"mode dropping & coverage","frase":"Medir por separado si lo generado es realista (precisión) y si cubre toda la variedad de los datos (cobertura).","desc":"El FID mezcla calidad y diversidad en un solo número. Las métricas de precisión y recall para modelos generativos, y sus versiones mejoradas de densidad y cobertura, las separan: la precisión mide qué fracción de las muestras generadas cae en la zona de los datos reales, y la cobertura, qué fracción de los datos reales tiene muestras generadas cerca. Así detectan el mode drop, la pérdida de partes de la distribución.","cuando":"Para diagnosticar si un modelo generativo falla por calidad o por falta de diversidad.","ej":"Un generador de caras con una precisión de 0,9 y una cobertura de 0,4 hace caras muy realistas, pero casi nunca de personas mayores.","py":[{"c":"prdc.compute_prdc","u":"https://github.com/clovaai/generative-evaluation-prdc"}],"rel":["colapso-de-modos","fid-y-kid","evaluacion-de-modelos-generativos","precision-y-recall"]},{"id":"verosimilitud-vs-calidad-de-muestras","name":"Verosimilitud vs calidad de muestras","en":"likelihood vs sample quality","frase":"Un modelo puede asignar mucha probabilidad a los datos y generar muestras malas, o al revés.","desc":"La verosimilitud mide lo bien que el modelo cubre la distribución de los datos, pero está dominada por detalles poco perceptibles: un modelo puede tener muy buena verosimilitud y generar imágenes mediocres, mientras que una GAN genera imágenes excelentes sin dar ninguna verosimilitud. Además, los modelos de densidad a veces asignan más probabilidad a datos de otro dominio que a los suyos. Por eso ambas cosas se evalúan por separado.","ej":"Un modelo de densidad entrenado con fotos de prendas de ropa asigna más verosimilitud a dígitos manuscritos, que nunca vio, que a la propia ropa.","rel":["densidad-explicita-vs-implicita","evaluacion-de-modelos-generativos","ood","normalizing-flows"]}]}]},{"id":"lenguaje-y-llms","name":"Lenguaje y LLMs","en":"natural language processing & LLMs","frase":"Cómo las máquinas representan, entienden y generan lenguaje, hasta llegar a los LLMs.","desc":"Cómo representan y procesan el lenguaje las máquinas, desde la bolsa de palabras y los word embeddings hasta los grandes modelos de lenguaje (LLMs). Un LLM es un Transformer preentrenado para predecir el siguiente token y adaptado después (instruction tuning, RLHF) para seguir instrucciones y conversar.","cuando":"Cuando el problema gira en torno a texto: clasificarlo, extraer información, resumirlo, traducirlo o generarlo.","ej":"ChatGPT, Gemini o Claude son LLMs: modelos preentrenados con billones de tokens de texto y ajustados para seguir instrucciones.","rel":["tokenizacion","word-embeddings","llm","adaptacion-de-llms"],"children":[{"id":"nlp","name":"Procesamiento del lenguaje natural (NLP)","en":"natural language processing (NLP)","frase":"La rama de la IA que permite a las máquinas entender, analizar y generar lenguaje humano.","desc":"El procesamiento del lenguaje natural abarca desde tareas clásicas, como clasificar textos, extraer entidades o traducir, hasta la generación de texto libre. Evolucionó de las reglas escritas a mano a los modelos estadísticos, después a las redes recurrentes y, desde 2018, a los transformers preentrenados. Hoy los LLM resuelven la mayoría de tareas con un único modelo.","ej":"Un sistema que lee las reclamaciones de los clientes, detecta el producto mencionado, mide el enfado y redacta un borrador de respuesta.","rel":["tareas-de-nlp","representacion-del-texto","modelos-de-lenguaje","llm"],"children":[{"id":"tareas-de-nlp","name":"Tareas de NLP","en":"NLP tasks","frase":"Los problemas típicos con texto: clasificar, extraer, traducir, resumir, responder y generar.","desc":"Las tareas se agrupan por el tipo de salida: clasificar un texto completo (tema, sentimiento, spam), etiquetar cada palabra (entidades, categorías gramaticales), extraer respuestas o relaciones y generar texto nuevo (traducción, resumen, diálogo). Antes cada tarea tenía su propio modelo; hoy un LLM, o un transformer preentrenado y ajustado, resuelve casi todas.","ej":"Detectar en una noticia las entidades \"Banco de España\" (organización), \"Madrid\" (lugar) y \"3 de marzo\" (fecha).","py":[{"c":"transformers.pipeline","u":"https://huggingface.co/docs/transformers/main_classes/pipelines#transformers.pipeline"}],"rel":["nlp","analisis-de-sentimiento","benchmarks-de-nlp","topologias-de-secuencia"]},{"id":"analisis-de-sentimiento","name":"Análisis de sentimiento","en":"sentiment analysis","frase":"Determinar si un texto expresa una opinión positiva, negativa o neutra.","desc":"Es la tarea de clasificación de texto más conocida. Puede ser global (el tono de una reseña entera), por aspectos (qué opina el cliente del precio y qué de la atención) o de emociones más finas. Va desde diccionarios de palabras positivas y negativas hasta transformers ajustados, que captan mejor la negación, el contexto y, en parte, la ironía.","cuando":"Para medir la opinión de los clientes en reseñas, encuestas, redes sociales o llamadas transcritas.","ej":"Clasificar miles de reseñas de un hotel y descubrir que las negativas mencionan sobre todo el ruido nocturno.","py":[{"c":"pipeline(\"sentiment-analysis\")","s":1}],"rel":["tareas-de-nlp","bert","tf-idf","regresion-logistica"]},{"id":"benchmarks-de-nlp","name":"Benchmarks de NLP (GLUE)","en":"NLP benchmarks (GLUE)","frase":"Conjuntos de tareas estándar para comparar modelos de lenguaje con las mismas reglas.","desc":"GLUE (2018) reunió nueve tareas de comprensión, como inferencia, paráfrasis o sentimiento, con una puntuación global; SuperGLUE lo endureció cuando los modelos superaron el nivel humano. Permitieron medir el progreso de BERT y sus sucesores, pero se saturaron en pocos años. Hoy los LLM se evalúan con benchmarks de conocimiento, razonamiento y programación.","ej":"BERT elevó la puntuación de GLUE en más de 7 puntos respecto al mejor modelo anterior.","py":[{"c":"load_dataset(\"nyu-mll/glue\", \"sst2\")","s":1}],"rel":["benchmarks-y-saturacion","evaluacion-de-llms","bert","tareas-de-nlp"]}]},{"id":"representacion-del-texto","name":"Representación del texto","en":"text representation","frase":"Cómo convertir el texto en números que un modelo pueda procesar.","desc":"Los modelos solo operan con números, así que el texto debe representarse numéricamente. Los métodos clásicos cuentan palabras (bolsa de palabras, TF-IDF) y producen vectores enormes y dispersos. Los modernos dividen el texto en tokens y asignan a cada uno un embedding denso, primero estático (word2vec) y después contextual, que depende de la frase en la que aparece.","ej":"Con un modelo contextual, \"el banco cerró\" se representa con vectores distintos según hable de una entidad financiera o de un asiento.","rel":["bolsa-de-palabras","tf-idf","tokenizacion","word-embeddings","embeddings-estaticos-vs-contextuales"],"children":[{"id":"preprocesado-de-texto","name":"Preprocesado de texto","en":"text preprocessing","frase":"Limpiar y normalizar el texto antes de representarlo: minúsculas, tokens, palabras vacías y raíces.","desc":"En los métodos clásicos, el preprocesado reduce el ruido y el vocabulario: pasar a minúsculas, quitar signos o etiquetas HTML, separar en palabras, eliminar las palabras vacías (stopwords), como \"el\" o \"de\", y reducir las palabras a su raíz (stemming) o a su forma de diccionario (lematización). Con transformers se hace mucho menos, porque el tokenizador y el propio modelo gestionan la variación del texto.","cuando":"Con modelos clásicos, como la bolsa de palabras o TF-IDF; con transformers, solo una limpieza básica.","ej":"\"Corriendo\", \"corrió\" y \"correrán\" se reducen a la raíz \"corr\" para contarse como la misma palabra.","py":[{"c":"nltk.tokenize.word_tokenize","u":"https://www.nltk.org/api/nltk.tokenize.word_tokenize.html"},{"c":"nltk.stem.SnowballStemmer","u":"https://www.nltk.org/api/nltk.stem.snowball.html#nltk.stem.snowball.SnowballStemmer"}],"rel":["bolsa-de-palabras","tf-idf","tokenizacion","eda"]},{"id":"bolsa-de-palabras","name":"One-hot y bolsa de palabras","en":"one-hot & bag of words","frase":"Representar un texto por cuántas veces aparece cada palabra del vocabulario, ignorando el orden.","desc":"One-hot representa cada palabra como un vector con un 1 en su posición del vocabulario. La bolsa de palabras suma esos vectores: cada documento es un vector del tamaño del vocabulario con el recuento de cada palabra. Es simple, interpretable y funciona sorprendentemente bien para clasificar, pero pierde el orden (\"el perro mordió al hombre\" y \"el hombre mordió al perro\" coinciden) y no capta sinónimos. Los n-gramas recuperan algo del orden local.","cuando":"Como línea base rápida para clasificar textos, sobre todo con pocos datos.","ej":"Un filtro de spam que cuenta palabras como \"gratis\", \"premio\" o \"urgente\" y pasa los recuentos a una regresión logística.","hp":[["ngram_range","tamaño de las secuencias de palabras que se cuentan (1 = palabras sueltas)"],["min_df","frecuencia mínima para incluir una palabra en el vocabulario"],["max_features","tamaño máximo del vocabulario"]],"py":[{"c":"sklearn.feature_extraction.text.CountVectorizer","u":"https://scikit-learn.org/stable/modules/generated/sklearn.feature_extraction.text.CountVectorizer.html"}],"rel":["tf-idf","preprocesado-de-texto","codificacion-de-variables-categoricas","word-embeddings"]},{"id":"tf-idf","name":"TF-IDF","en":"TF-IDF","frase":"Pondera cada palabra por su frecuencia en el documento y por lo rara que es en el conjunto.","desc":"TF-IDF multiplica la frecuencia de un término en un documento (TF) por el logaritmo inverso de la fracción de documentos que lo contienen (IDF). Así, las palabras presentes en casi todos los documentos, como \"de\" o \"que\", pesan poco, y las características de cada documento, mucho. Es la base clásica de los buscadores y sigue siendo una línea base fuerte para clasificar y comparar textos.","cuando":"Para clasificar o buscar textos con métodos clásicos, como línea base o con pocos recursos.","ej":"En una colección de recetas, \"azafrán\" tiene un IDF alto y pesa mucho en la paella; \"sal\" aparece en casi todas y apenas cuenta.","hp":[["ngram_range","tamaño de las secuencias de palabras"],["max_df / min_df","descartan las palabras demasiado frecuentes o demasiado raras"],["sublinear_tf","usa el logaritmo de la frecuencia del término"]],"py":[{"c":"sklearn.feature_extraction.text.TfidfVectorizer","u":"https://scikit-learn.org/stable/modules/generated/sklearn.feature_extraction.text.TfidfVectorizer.html"}],"rel":["bolsa-de-palabras","busqueda-hibrida","metodos-filtro","analisis-de-sentimiento"]},{"id":"tokenizacion","name":"Tokenización","en":"tokenization","frase":"Dividir el texto en las unidades (tokens) que procesa el modelo: palabras, trozos de palabra o caracteres.","desc":"Es el primer paso de cualquier modelo de lenguaje: el texto se corta en tokens y cada uno se sustituye por su número en el vocabulario. La elección es un compromiso: las palabras completas dan vocabularios enormes y no cubren palabras nuevas; los caracteres dan secuencias muy largas; las subpalabras, el estándar actual, equilibran ambas cosas. El número de tokens determina el coste y el límite de contexto de un LLM.","ej":"Un tokenizador puede dividir \"desafortunadamente\" en \"des\", \"afortunada\" y \"mente\".","py":[{"c":"transformers.AutoTokenizer","u":"https://huggingface.co/docs/transformers/model_doc/auto#transformers.AutoTokenizer"},{"c":"tiktoken.get_encoding","u":"https://github.com/openai/tiktoken"}],"rel":["tokenizacion-por-subpalabras","vocabulario-y-tokens-especiales","ventana-de-contexto","capa-de-embedding"],"children":[{"id":"tokenizacion-por-subpalabras","name":"Tokenización por subpalabras (BPE, WordPiece, SentencePiece)","en":"subword tokenization (BPE, WordPiece, SentencePiece)","frase":"Partir las palabras en fragmentos frecuentes: las comunes quedan enteras y las raras se componen de trozos.","desc":"BPE parte de los caracteres y fusiona repetidamente el par de símbolos más frecuente hasta alcanzar el tamaño de vocabulario deseado. WordPiece, usado por BERT, elige las fusiones que más aumentan la verosimilitud. SentencePiece trata el texto como una secuencia bruta, espacios incluidos, lo que lo hace independiente del idioma. Con vocabularios de 30.000 a 200.000 tokens se representa cualquier texto sin palabras desconocidas.","ej":"Una palabra inventada como \"superchulísimo\" se divide en \"super\", \"chul\" e \"ísimo\" en lugar de quedar como desconocida.","hp":[["vocab_size","tamaño del vocabulario final"],["min_frequency","frecuencia mínima de un par para fusionarlo"]],"py":[{"c":"tokenizers.models.BPE","u":"https://huggingface.co/docs/tokenizers/api/models#tokenizers.models.BPE"},{"c":"tokenizers.trainers.BpeTrainer","u":"https://huggingface.co/docs/tokenizers/api/trainers#tokenizers.trainers.BpeTrainer"},{"c":"sentencepiece.SentencePieceProcessor","u":"https://github.com/google/sentencepiece"}],"rel":["tokenizacion","vocabulario-y-tokens-especiales","llm"]},{"id":"vocabulario-y-tokens-especiales","name":"Vocabulario y tokens especiales","en":"vocabulary & special tokens","frase":"La lista fija de tokens que conoce el modelo, más unos tokens reservados con funciones especiales.","desc":"El vocabulario asigna un número a cada token. Los tokens especiales marcan la estructura: [CLS] y [SEP] en BERT para clasificar y separar frases, [MASK] para el preentrenamiento enmascarado, [PAD] para igualar longitudes dentro de un lote, y marcadores de inicio y fin de texto o de turnos de conversación en los LLM. Añadir tokens nuevos exige ampliar la capa de embedding.","ej":"Una conversación con un LLM se codifica intercalando tokens especiales que indican dónde empieza el mensaje del usuario y dónde la respuesta del asistente.","py":[{"c":"tokenizer.add_special_tokens({\"pad_token\": \"[PAD]\"})","s":1}],"rel":["tokenizacion","token-cls","plantillas-de-chat","capa-de-embedding"]}]},{"id":"word-embeddings","name":"Word embeddings","en":"word embeddings","frase":"Un vector denso por palabra, aprendido de forma que las palabras de significado parecido queden cerca.","desc":"Se basan en la hipótesis distribucional: una palabra se caracteriza por las palabras que la rodean. Métodos como word2vec, GloVe o fastText aprenden de grandes corpus un vector de entre 100 y 300 dimensiones por palabra que captura relaciones semánticas y sintácticas. Supusieron un salto respecto a la bolsa de palabras, aunque cada palabra tiene un único vector, sea cual sea su contexto.","cuando":"Para representar palabras en modelos ligeros o analizar relaciones semánticas en un corpus.","ej":"Los vecinos más cercanos de \"Madrid\" en un espacio de word2vec son \"Barcelona\", \"Sevilla\" y \"Valencia\".","py":[{"c":"gensim.models.Word2Vec","u":"https://radimrehurek.com/gensim/models/word2vec.html#gensim.models.word2vec.Word2Vec"},{"c":"gensim.models.FastText","u":"https://radimrehurek.com/gensim/models/fasttext.html#gensim.models.fasttext.FastText"}],"rel":["word2vec","glove-y-swivel","embeddings-estaticos-vs-contextuales","aritmetica-de-embeddings"],"children":[{"id":"word2vec","name":"Word2Vec (Skip-gram y CBOW)","en":"Word2Vec (Skip-gram & CBOW)","frase":"Aprende vectores de palabras entrenando una red sencilla a predecir cada palabra a partir de su contexto, o al revés.","desc":"Tiene dos variantes. CBOW predice una palabra a partir de las que la rodean; Skip-gram predice las palabras del contexto a partir de la central y funciona mejor con palabras raras. La red tiene una sola capa oculta lineal, cuyos pesos son los embeddings. Gracias a trucos como el negative sampling, se entrena con miles de millones de palabras en horas. Sus vectores reflejan analogías como rey − hombre + mujer ≈ reina.","cuando":"Para obtener embeddings de palabras de un dominio específico (médico, legal, de productos) a partir de un corpus propio.","ej":"Entrenar word2vec con las descripciones de productos de una tienda para que \"zapatillas\" y \"deportivas\" queden juntas.","hp":[["vector_size","dimensión de los vectores"],["window","palabras de contexto a cada lado"],["sg","1 para Skip-gram, 0 para CBOW"],["min_count","frecuencia mínima para incluir una palabra"]],"py":[{"c":"gensim.models.Word2Vec","u":"https://radimrehurek.com/gensim/models/word2vec.html#gensim.models.word2vec.Word2Vec"}],"rel":["word-embeddings","negative-sampling","aritmetica-de-embeddings","glove-y-swivel"]},{"id":"negative-sampling","name":"Negative sampling","en":"negative sampling","frase":"Entrenar comparando cada palabra del contexto real con unas pocas palabras al azar, en lugar de con todo el vocabulario.","desc":"Calcular una softmax sobre cientos de miles de palabras en cada paso es carísimo. El negative sampling convierte la tarea en una clasificación binaria: distinguir el par real (palabra, contexto) de unos pocos pares falsos con palabras muestreadas al azar, en proporción a su frecuencia elevada a 0,75. Reduce el coste de cada paso de todo el vocabulario a unas pocas palabras, y la misma idea reaparece en el aprendizaje contrastivo.","ej":"Para el par real (\"café\", \"taza\"), se generan 5 pares falsos, como (\"café\", \"tractor\"), que el modelo debe rechazar.","hp":[["negative","número de palabras negativas por ejemplo (entre 5 y 20)"],["ns_exponent","exponente de la distribución de muestreo (0,75)"]],"py":[{"c":"gensim.models.Word2Vec","u":"https://radimrehurek.com/gensim/models/word2vec.html#gensim.models.word2vec.Word2Vec"}],"rel":["word2vec","aprendizaje-contrastivo","softmax","perdida-infonce"]},{"id":"glove-y-swivel","name":"GloVe y Swivel","en":"GloVe & Swivel","frase":"Embeddings de palabras obtenidos factorizando la matriz de coocurrencias de todo el corpus.","desc":"En lugar de recorrer ventanas como word2vec, GloVe construye una matriz global de cuántas veces aparece cada palabra cerca de cada otra y aprende vectores cuyo producto escalar aproxime el logaritmo de esas coocurrencias. Combina las estadísticas globales de los métodos de factorización con la eficacia de los métodos predictivos. Swivel, de Google, sigue la misma idea y escala mejor a matrices enormes, tratando con cuidado los pares que nunca aparecen juntos.","cuando":"Para usar vectores de palabras preentrenados y de propósito general sin entrenar nada.","ej":"Cargar vectores GloVe preentrenados de 100 dimensiones como capa de embedding inicial de un clasificador de textos.","py":[{"c":"gensim.downloader.load","u":"https://radimrehurek.com/gensim/downloader.html#gensim.downloader.load"}],"rel":["word2vec","word-embeddings","factorizacion-de-matrices","embeddings-estaticos-vs-contextuales"]}]},{"id":"embeddings-estaticos-vs-contextuales","name":"Embeddings estáticos vs contextuales","en":"static vs contextual embeddings","frase":"Un vector fijo por palabra frente a un vector que cambia según la frase en la que aparece.","desc":"Los embeddings estáticos (word2vec, GloVe) dan a \"banco\" el mismo vector hable de dinero o de un asiento, mezclando sus significados. Los contextuales, producidos por modelos como ELMo, BERT o cualquier LLM, calculan el vector de cada token a partir de toda la frase, así que distinguen los sentidos. Son mucho más potentes, a cambio de necesitar un modelo grande para calcularlos.","ej":"En \"me senté en el banco del parque\" y \"pedí un préstamo al banco\", un modelo contextual da a \"banco\" vectores muy distintos.","rel":["word-embeddings","bert","modelos-de-embeddings-de-texto","autoatencion"]},{"id":"modelos-de-embeddings-de-texto","name":"Modelos de embeddings de texto","en":"text embedding models","frase":"Modelos entrenados para convertir frases o documentos enteros en un vector que capta su significado.","desc":"Parten de un transformer y se ajustan con aprendizaje contrastivo sobre pares de textos relacionados (pregunta y respuesta, título y resumen, paráfrasis), de modo que los textos con significado parecido den vectores cercanos. Producen un vector por texto, que se compara con la similitud coseno. Son la pieza de recuperación de los sistemas RAG y de los buscadores semánticos.","cuando":"Para búsqueda semántica, RAG, agrupar documentos o detectar duplicados por su significado.","ej":"\"¿Cómo cambio mi contraseña?\" y \"He olvidado la clave de acceso\" obtienen vectores muy cercanos aunque no compartan palabras.","py":[{"c":"sentence_transformers.SentenceTransformer","u":"https://sbert.net/docs/package_reference/sentence_transformer/model.html"},{"c":"modelo.encode(frases, normalize_embeddings=True)","s":1}],"rel":["embeddings","recuperacion-densa","aprendizaje-contrastivo","busqueda-por-similitud","token-cls"]}]},{"id":"modelos-de-lenguaje","name":"Modelos de lenguaje","en":"language models","frase":"Modelos que asignan probabilidades al texto y, por tanto, pueden predecirlo y generarlo.","desc":"Un modelo de lenguaje aprende la distribución de probabilidad de las secuencias de texto, normalmente prediciendo el siguiente token. De los modelos de n-gramas se pasó a las redes recurrentes y después a los transformers, entrenados con cantidades crecientes de texto. Según su objetivo de preentrenamiento y su arquitectura, se especializan en entender (BERT), generar (GPT) o transformar textos (T5).","ej":"El autocompletado del teclado del móvil es un modelo de lenguaje pequeño; un LLM es uno enorme.","rel":["modelo-de-lenguaje","objetivos-de-preentrenamiento","llm","tipos-de-transformer"],"children":[{"id":"modelo-de-lenguaje","name":"Modelo de lenguaje (predicción del siguiente token)","en":"language model (next-token prediction)","frase":"Un modelo que, dado un texto, predice la probabilidad de cada posible token siguiente.","desc":"Entrenar a un modelo para predecir la siguiente palabra parece una tarea modesta, pero para hacerlo bien con textos variados debe aprender gramática, hechos sobre el mundo, estilo e incluso cierto razonamiento. Generar texto consiste en predecir el siguiente token, elegir uno y repetir. Su calidad se mide con la perplejidad sobre textos no vistos.","ej":"Tras \"La capital de Francia es\", un buen modelo asigna una probabilidad muy alta a \"París\".","py":[{"c":"transformers.AutoModelForCausalLM","u":"https://huggingface.co/docs/transformers/model_doc/auto#transformers.AutoModelForCausalLM"}],"rel":["modelos-autorregresivos","clm","perplejidad","decodificacion-y-temperatura"]},{"id":"objetivos-de-preentrenamiento","name":"Objetivos de preentrenamiento","en":"pretraining objectives","frase":"La tarea autosupervisada con la que se preentrena un modelo de lenguaje: adivinar palabras ocultas, la siguiente o tramos borrados.","desc":"El objetivo determina qué aprende el modelo y para qué sirve después. El modelado enmascarado (MLM) da representaciones bidireccionales ideales para comprender; el causal (CLM) da modelos que generan texto de forma natural; la corrupción de spans, intermedia, encaja con las arquitecturas codificador-decodificador. Todos se entrenan sin etiquetas, con texto bruto.","ej":"Con el mismo texto, BERT aprende a rellenar huecos, GPT a continuar frases y T5 a reconstruir tramos borrados.","rel":["mlm","clm","corrupcion-de-spans","aprendizaje-autosupervisado"],"children":[{"id":"mlm","name":"Modelado de lenguaje enmascarado (MLM)","en":"masked language modeling (MLM)","frase":"Ocultar al azar una parte de los tokens y entrenar al modelo para adivinarlos a partir del resto.","desc":"El modelado de lenguaje enmascarado, introducido con BERT, sustituye alrededor del 15 % de los tokens por [MASK] (o por otro token, o los deja igual) y entrena al modelo para predecir los originales. Como puede mirar a ambos lados del hueco, aprende representaciones bidireccionales muy ricas, ideales para clasificar y extraer información. No sirve para generar texto de forma natural.","ej":"En \"el [MASK] ladra por las noches\", el modelo debe predecir \"perro\" usando el contexto anterior y el posterior.","hp":[["mlm_probability","fracción de tokens enmascarados (0,15 por defecto)"]],"py":[{"c":"transformers.DataCollatorForLanguageModeling","u":"https://huggingface.co/docs/transformers/main_classes/data_collator#transformers.DataCollatorForLanguageModeling"},{"c":"transformers.AutoModelForMaskedLM","u":"https://huggingface.co/docs/transformers/model_doc/auto#transformers.AutoModelForMaskedLM"}],"rel":["bert","modelado-enmascarado","objetivos-de-preentrenamiento","clm"]},{"id":"clm","name":"Modelado causal (CLM)","en":"causal language modeling (CLM)","frase":"Predecir cada token a partir solo de los anteriores: el objetivo con el que se entrenan los GPT.","desc":"El modelado de lenguaje causal entrena al modelo para predecir el siguiente token en cada posición, con una máscara causal que le impide ver el futuro. Cada posición del texto es un ejemplo de entrenamiento, lo que lo hace muy eficiente. Es el objetivo natural para generar texto y el que, a gran escala, ha producido los LLM actuales.","ej":"Con la frase \"hoy hace mucho calor\", el modelo aprende a la vez a predecir \"hace\" tras \"hoy\", \"mucho\" tras \"hoy hace\" y \"calor\" tras \"hoy hace mucho\".","py":[{"c":"transformers.AutoModelForCausalLM","u":"https://huggingface.co/docs/transformers/model_doc/auto#transformers.AutoModelForCausalLM"},{"c":"transformers.DataCollatorForLanguageModeling","u":"https://huggingface.co/docs/transformers/main_classes/data_collator#transformers.DataCollatorForLanguageModeling"}],"rel":["gpt","mascara-causal","modelos-autorregresivos","mlm"]},{"id":"corrupcion-de-spans","name":"Corrupción de spans","en":"span corruption","frase":"Borrar tramos contiguos del texto y entrenar al modelo para generarlos: el objetivo de T5.","desc":"Se eliminan tramos de varios tokens, cada uno sustituido por un único marcador centinela, y el decodificador debe generar los tramos que faltan, precedidos de su marcador. Combina la comprensión bidireccional del codificador con la capacidad de generar del decodificador, y es más eficiente que reconstruir el texto entero.","ej":"\"Gracias por [X] a mi fiesta [Y] semana\" → el modelo genera \"[X] invitarme [Y] la pasada\".","py":[{"c":"transformers.T5ForConditionalGeneration","u":"https://huggingface.co/docs/transformers/model_doc/t5#transformers.T5ForConditionalGeneration"}],"rel":["t5","mlm","objetivos-de-preentrenamiento","tipos-de-transformer"]}]},{"id":"bert","name":"Encoder-only: BERT","en":"BERT (encoder-only)","frase":"Transformer codificador preentrenado con texto enmascarado; el referente para entender y clasificar texto.","desc":"BERT (2018) apila bloques transformer codificadores con atención bidireccional y se preentrena con modelado enmascarado y, en su versión original, prediciendo si una frase sigue a otra. Después se ajusta con pocos datos para clasificar, extraer entidades o responder preguntas, y en su momento batió el estado del arte en casi todos los benchmarks. Variantes como RoBERTa, DistilBERT o los modelos entrenados en español siguen siendo opciones eficientes para tareas de comprensión.","cuando":"Para clasificar textos, extraer entidades o calcular embeddings con un modelo pequeño, rápido y barato de ajustar.","ej":"Ajustar un modelo tipo BERT en español para detectar qué correos de clientes son quejas urgentes.","py":[{"c":"transformers.BertModel","u":"https://huggingface.co/docs/transformers/model_doc/bert#transformers.BertModel"},{"c":"transformers.AutoModelForSequenceClassification","u":"https://huggingface.co/docs/transformers/model_doc/auto#transformers.AutoModelForSequenceClassification"}],"rel":["mlm","tipos-de-transformer","token-cls","fine-tuning","benchmarks-de-nlp"]},{"id":"gpt","name":"Decoder-only: GPT","en":"GPT (decoder-only)","frase":"Transformer decodificador entrenado para predecir el siguiente token: la familia de la que nacen los LLM generativos.","desc":"GPT apila bloques transformer decodificadores con máscara causal y se preentrena prediciendo el siguiente token en enormes cantidades de texto. GPT-2 (2019) mostró que un modelo así genera textos coherentes y resuelve tareas sin ajuste específico, y GPT-3 (2020) demostró el aprendizaje a partir de ejemplos incluidos en la instrucción. Casi todos los LLM actuales siguen esta arquitectura.","cuando":"Para generar texto, completar código o, una vez ajustado con instrucciones, actuar como asistente.","ej":"Dado el inicio de un correo, un modelo tipo GPT lo continúa con el tono y el tema adecuados.","py":[{"c":"transformers.GPT2LMHeadModel","u":"https://huggingface.co/docs/transformers/model_doc/gpt2#transformers.GPT2LMHeadModel"},{"c":"transformers.AutoModelForCausalLM","u":"https://huggingface.co/docs/transformers/model_doc/auto#transformers.AutoModelForCausalLM"}],"rel":["clm","mascara-causal","llm","in-context-learning","tipos-de-transformer"]},{"id":"t5","name":"Encoder-decoder: T5","en":"T5 (encoder-decoder)","frase":"Transformer codificador-decodificador que trata cualquier tarea como transformar un texto en otro.","desc":"T5 (2019) unificó las tareas de NLP en un formato de texto a texto: la entrada incluye la instrucción, como \"traduce al alemán:\" o \"resume:\", y la salida siempre es texto. Se preentrena con corrupción de spans y se ajusta en muchas tareas a la vez. Sus variantes, como mT5 (multilingüe) y Flan-T5 (ajustada con instrucciones), siguen siendo útiles para traducir y resumir con modelos medianos.","cuando":"Para traducir, resumir o reformular textos con un modelo mediano y controlable.","ej":"\"resume: [texto de una noticia]\" → el modelo devuelve un resumen de dos frases.","py":[{"c":"transformers.T5ForConditionalGeneration","u":"https://huggingface.co/docs/transformers/model_doc/t5#transformers.T5ForConditionalGeneration"}],"rel":["corrupcion-de-spans","tipos-de-transformer","fine-tuning-multitarea","instruction-tuning"]},{"id":"llm","name":"Gran modelo de lenguaje (LLM)","en":"large language model (LLM)","frase":"Un modelo de lenguaje con miles de millones de parámetros, entrenado con una parte enorme del texto disponible.","desc":"Un gran modelo de lenguaje es un transformer, casi siempre decodificador, preentrenado con billones de tokens y después ajustado para seguir instrucciones y ser útil y seguro. A gran escala muestra capacidades que no tiene a pequeña escala: seguir instrucciones, aprender de ejemplos incluidos en la petición, razonar paso a paso, programar o usar herramientas. Es la base de los asistentes conversacionales y de los agentes.","cuando":"Para tareas abiertas de lenguaje: redactar, resumir, extraer, clasificar sin datos de entrenamiento, programar o razonar sobre documentos.","ej":"Un LLM convierte el correo desordenado de un cliente en una ficha estructurada con el producto, el problema y la urgencia.","rel":["gpt","preentrenamiento-de-llms","adaptacion-de-llms","leyes-de-escalado","agentes-de-ia"]},{"id":"preentrenamiento-de-llms","name":"Preentrenamiento de LLMs","en":"LLM pretraining","frase":"La fase cara y masiva en la que el LLM aprende de billones de tokens a predecir el siguiente.","desc":"Se recopilan y filtran enormes cantidades de texto y código (web, libros, artículos, repositorios), se eliminan duplicados y contenidos de baja calidad, y se entrena el modelo durante semanas o meses en miles de GPU. La calidad y la mezcla de los datos importan tanto como el tamaño. El resultado es un modelo base que completa textos, pero que aún no sigue instrucciones ni conversa: eso llega con el ajuste posterior.","ej":"Ante \"¿Cuál es la capital de Italia?\", un modelo base puede continuar con otra pregunta de examen en lugar de responder.","rel":["llm","leyes-de-escalado","clm","sft","gpu-y-tpu"]},{"id":"ventana-de-contexto","name":"Ventana de contexto","en":"context window","frase":"El número máximo de tokens que el modelo puede considerar a la vez, entre la entrada y la respuesta.","desc":"Todo lo que el modelo \"ve\" en una petición (instrucciones, historial, documentos y su propia respuesta) debe caber en la ventana de contexto, que va de unos miles a millones de tokens según el modelo. Lo que queda fuera no existe para él. Los contextos largos son caros, porque el coste de la atención crece con la longitud, y los modelos pueden aprovechar peor la información situada en mitad de un contexto muy largo.","ej":"En una ventana de 128.000 tokens cabe un libro de unas 300 páginas; para consultar una biblioteca entera hace falta RAG.","rel":["atencion-por-producto-escalar-escalado","rag","codificacion-posicional","compresion-y-reordenacion-del-contexto","memoria-del-agente"]},{"id":"modelos-de-razonamiento","name":"Modelos de razonamiento","en":"reasoning models","frase":"LLM entrenados para pensar paso a paso antes de responder, dedicando más cómputo a los problemas difíciles.","desc":"En lugar de contestar directamente, generan primero un razonamiento interno largo en el que plantean, prueban y corrigen enfoques, y solo después dan la respuesta. Se entrenan con aprendizaje por refuerzo sobre problemas con respuesta verificable, como matemáticas o programación, lo que les enseña a razonar mejor. Rinden mucho más en tareas complejas a cambio de más tiempo y coste por respuesta: mejoran cuanto más \"piensan\" (escalado en inferencia).","cuando":"Para problemas de matemáticas, programación, planificación o análisis con varios pasos, cuando la precisión importa más que la latencia.","ej":"Ante un problema de olimpiada matemática, el modelo escribe varias páginas de razonamiento, descarta dos caminos fallidos y llega a la solución.","rel":["chain-of-thought","llm","rlhf","agentes-de-ia"]}]},{"id":"adaptacion-de-llms","name":"Adaptación de LLMs","en":"LLM adaptation","frase":"Cómo se convierte un modelo base en un asistente útil, o se especializa en una tarea o un dominio.","desc":"Tras el preentrenamiento, el modelo se adapta en varias etapas: ajuste supervisado con ejemplos de instrucciones y respuestas, alineamiento con preferencias humanas mediante RLHF o DPO y, si hace falta, especialización en un dominio. Como ajustar todos los parámetros es caro, se usan métodos eficientes (PEFT) como LoRA. Antes de ajustar, conviene comprobar si bastan un buen prompt o RAG.","ej":"Un modelo abierto se ajusta con 10.000 conversaciones de soporte técnico para responder con el tono y los procedimientos de la empresa.","rel":["sft","peft","rlhf","dpo","prompt-engineering"],"children":[{"id":"sft","name":"Fine-tuning supervisado (SFT)","en":"supervised fine-tuning (SFT)","frase":"Ajustar el LLM con ejemplos de instrucciones y de las respuestas ideales, escritas o revisadas por personas.","desc":"El fine-tuning supervisado entrena el modelo, con la misma pérdida de predicción del siguiente token, sobre pares de instrucción y respuesta de alta calidad, normalmente calculando la pérdida solo sobre la respuesta. Es el paso que convierte un modelo que completa textos en uno que sigue instrucciones y conversa. Pocos miles de ejemplos muy cuidados pueden bastar: la calidad importa más que la cantidad.","cuando":"Para enseñar a un modelo un formato, un estilo o una tarea concreta a partir de ejemplos de cómo debe responder.","ej":"Ajustar un modelo con 2.000 informes radiológicos y sus resúmenes para que redacte resúmenes con el formato del hospital.","hp":[["learning_rate","tamaño de paso, típicamente entre 10⁻⁵ y 2·10⁻⁴ (más alto con LoRA)"],["num_train_epochs","pasadas por los datos, normalmente de 1 a 3"],["max_length","longitud máxima de cada ejemplo, en tokens"]],"py":[{"c":"trl.SFTTrainer","u":"https://huggingface.co/docs/trl/sft_trainer#trl.SFTTrainer"},{"c":"trl.SFTConfig","u":"https://huggingface.co/docs/trl/sft_trainer#trl.SFTConfig"}],"rel":["instruction-tuning","fine-tuning","lora","rlhf","plantillas-de-chat"]},{"id":"instruction-tuning","name":"Instruction tuning","en":"instruction tuning","frase":"SFT con miles de tareas distintas formuladas como instrucciones, para que el modelo aprenda a seguir instrucciones nuevas.","desc":"En lugar de entrenar una tarea concreta, se ajusta el modelo con una colección muy variada de tareas expresadas en lenguaje natural (\"resume…\", \"traduce…\", \"clasifica…\"). Así aprende la habilidad general de seguir instrucciones y generaliza a tareas que nunca vio. Flan-T5 y los primeros asistentes demostraron que este paso mejora drásticamente el rendimiento en tareas nuevas sin ejemplos.","cuando":"Para convertir un modelo base en un asistente generalista, más que para enseñarle una tarea concreta.","ej":"Un modelo ajustado con instrucciones de unas 1.800 tareas responde bien a \"escribe un haiku sobre la lluvia\" sin haber visto nunca esa tarea.","py":[{"c":"trl.SFTTrainer","u":"https://huggingface.co/docs/trl/sft_trainer#trl.SFTTrainer"}],"rel":["sft","fine-tuning-multitarea","t5","in-context-learning"]},{"id":"fine-tuning-multitarea","name":"Fine-tuning multitarea","en":"multitask fine-tuning","frase":"Entrenar un mismo modelo en varias tareas a la vez para que compartan lo aprendido.","desc":"En lugar de un modelo por tarea, se mezclan los datos de varias tareas y se entrena un único modelo, a menudo indicando la tarea en la entrada. Las tareas relacionadas se ayudan entre sí, sobre todo las que tienen pocos datos, y el modelo resultante es más general. Hay que equilibrar la mezcla para que las tareas grandes no ahoguen a las pequeñas.","cuando":"Cuando hay varias tareas relacionadas, algunas con pocos datos, y se quiere un único modelo que las resuelva todas.","ej":"Un solo modelo que, según la instrucción, clasifica la intención de un cliente, extrae su número de pedido o resume la conversación.","rel":["instruction-tuning","t5","multi-entrada-salida","transfer-learning"]},{"id":"peft","name":"PEFT (fine-tuning eficiente)","en":"parameter-efficient fine-tuning (PEFT)","frase":"Ajustar un modelo grande entrenando solo una pequeñísima fracción de sus parámetros.","desc":"El fine-tuning eficiente en parámetros congela el modelo base y entrena solo unos pocos parámetros añadidos o seleccionados, a menudo menos del 1 %. Reduce drásticamente la memoria y el coste, permite guardar cada adaptación en unos pocos megabytes y limita el olvido catastrófico. Las técnicas principales son LoRA, los adapters y el prompt tuning, y suelen rendir casi como el ajuste completo.","cuando":"Para ajustar LLM u otros modelos grandes con hardware limitado, o para mantener muchas versiones especializadas de un mismo modelo.","ej":"Una empresa mantiene un único modelo base y 20 adaptaciones LoRA de pocos megabytes, una por departamento, que carga según la petición.","py":[{"c":"peft.get_peft_model","u":"https://huggingface.co/docs/peft/package_reference/peft_model#peft.get_peft_model"},{"c":"peft.LoraConfig","u":"https://huggingface.co/docs/peft/package_reference/lora#peft.LoraConfig"}],"rel":["lora","qlora","prompt-tuning","adapters","olvido-catastrofico"],"children":[{"id":"lora","name":"LoRA","en":"LoRA (low-rank adaptation)","frase":"Aprender la corrección de cada matriz de pesos como el producto de dos matrices estrechas.","desc":"LoRA (Low-Rank Adaptation) congela los pesos originales W y aprende una corrección de rango bajo, ΔW = B·A, con A y B mucho más pequeñas: con rango 8, una matriz de 4.096 × 4.096 se ajusta con unos 65.000 parámetros en lugar de 16,7 millones. Al terminar, la corrección se puede sumar a W, así que la inferencia no se ralentiza. Es la técnica de ajuste eficiente más usada en LLM y en modelos de difusión.","cuando":"Como opción por defecto para ajustar LLM o modelos de difusión con recursos limitados.","ej":"Ajustar un LLM de 8.000 millones de parámetros en una sola GPU entrenando menos del 1 % de los parámetros.","hp":[["r","rango de la corrección; más alto, más capacidad"],["lora_alpha","factor de escala de la corrección"],["lora_dropout","dropout aplicado en las capas LoRA"],["target_modules","capas a las que se aplica (por ejemplo, las proyecciones de la atención)"]],"py":[{"c":"peft.LoraConfig","u":"https://huggingface.co/docs/peft/package_reference/lora#peft.LoraConfig"},{"c":"peft.get_peft_model","u":"https://huggingface.co/docs/peft/package_reference/peft_model#peft.get_peft_model"}],"rel":["peft","qlora","fine-tuning","dreambooth"]},{"id":"qlora","name":"QLoRA","en":"QLoRA","frase":"LoRA sobre un modelo base cuantizado a 4 bits: ajustar modelos grandes en una sola GPU.","desc":"QLoRA carga el modelo base en 4 bits con un formato pensado para pesos con distribución normal (NF4), lo que reduce su memoria unas cuatro veces respecto a 16 bits, y entrena adaptadores LoRA en 16 bits encima. Añade la doble cuantización de las constantes de escala y la paginación de memoria para absorber picos. Logra resultados casi iguales al ajuste en 16 bits con una fracción del hardware.","cuando":"Para ajustar LLM grandes cuando la memoria de la GPU es el factor limitante.","ej":"Ajustar un modelo de 65.000 millones de parámetros en una única GPU de 48 GB, algo imposible sin cuantizar.","hp":[["load_in_4bit","carga los pesos del modelo base en 4 bits"],["bnb_4bit_quant_type","formato de cuantización (\"nf4\")"],["bnb_4bit_compute_dtype","precisión de los cálculos (por ejemplo, bfloat16)"]],"py":[{"c":"transformers.BitsAndBytesConfig","u":"https://huggingface.co/docs/transformers/main_classes/quantization#transformers.BitsAndBytesConfig"},{"c":"peft.prepare_model_for_kbit_training","u":"https://huggingface.co/docs/peft/package_reference/peft_model#peft.prepare_model_for_kbit_training"}],"rel":["lora","cuantizacion","peft","gpu-y-tpu"]},{"id":"prompt-tuning","name":"Prompt tuning","en":"prompt tuning","frase":"Aprender unos pocos vectores de \"instrucción\" que se anteponen a la entrada, sin tocar el modelo.","desc":"En lugar de escribir un prompt con palabras, se aprenden directamente unos pocos embeddings virtuales que se colocan al principio de la entrada, con el modelo congelado. Solo se entrenan esos vectores, unos miles de parámetros por tarea. Funciona mejor cuanto más grande es el modelo, y variantes como el prefix tuning añaden vectores entrenables en todas las capas.","cuando":"Para adaptar un modelo grande a muchas tareas con un coste mínimo por tarea.","ej":"Con 20 tokens virtuales entrenados, un modelo congelado aprende a clasificar las consultas de los clientes en sus categorías.","hp":[["num_virtual_tokens","número de vectores que se anteponen a la entrada"]],"py":[{"c":"peft.PromptTuningConfig","u":"https://huggingface.co/docs/peft/package_reference/prompt_tuning#peft.PromptTuningConfig"}],"rel":["peft","prompt-engineering","lora","adapters"]},{"id":"adapters","name":"Adapters","en":"adapters","frase":"Pequeñas capas que se insertan dentro del modelo congelado y son lo único que se entrena.","desc":"Un adapter es un pequeño módulo con forma de cuello de botella (proyección hacia abajo, no linealidad y proyección hacia arriba, con conexión residual) que se inserta tras las subcapas de cada bloque transformer. Solo se entrenan los adapters, en torno al 1-4 % de los parámetros, y se pueden intercambiar por tarea. Añaden algo de latencia en inferencia, a diferencia de LoRA, cuya corrección se puede fusionar con los pesos.","cuando":"Para mantener muchas especializaciones intercambiables de un mismo modelo o combinar conocimientos de varias tareas.","ej":"Un modelo multilingüe con un adapter por idioma que se activa según la lengua del texto.","py":[{"c":"adapters.SeqBnConfig","u":"https://github.com/adapter-hub/adapters"}],"rel":["peft","lora","conexion-residual","cuello-de-botella"]}]},{"id":"rlhf","name":"RLHF","en":"RLHF (reinforcement learning from human feedback)","frase":"Alinear el LLM con lo que prefieren las personas mediante un modelo de recompensa y aprendizaje por refuerzo.","desc":"Primero se recogen comparaciones humanas: dadas dos respuestas a la misma petición, cuál es mejor. Con ellas se entrena un modelo de recompensa que puntúa respuestas. Después se optimiza el LLM con aprendizaje por refuerzo (tradicionalmente PPO; hoy también variantes como GRPO) para maximizar esa recompensa, con una penalización KL que le impide alejarse demasiado del modelo original. Así se vuelve más útil, honesto e inofensivo de lo que logra el SFT por sí solo.","cuando":"Para alinear un modelo con preferencias difíciles de especificar con ejemplos, como la utilidad, el tono o la seguridad.","ej":"Tras el RLHF, ante una pregunta ambigua el asistente pide una aclaración en lugar de inventarse una respuesta.","py":[{"c":"trl.RewardTrainer","u":"https://huggingface.co/docs/trl/reward_trainer#trl.RewardTrainer"},{"c":"trl.GRPOTrainer","u":"https://huggingface.co/docs/trl/grpo_trainer#trl.GRPOTrainer"}],"rel":["modelo-de-recompensa","ppo","dpo","reward-hacking","rlaif"],"children":[{"id":"modelo-de-recompensa","name":"Modelo de recompensa","en":"reward model","frase":"Un modelo que puntúa lo buena que es una respuesta, entrenado con preferencias humanas.","desc":"Suele ser un LLM con una cabeza que devuelve un número en lugar de texto. Se entrena con pares de respuestas en los que una persona eligió la mejor, de modo que la preferida obtenga más puntuación (modelo de Bradley-Terry). Sustituye a las personas durante el aprendizaje por refuerzo, que necesita millones de evaluaciones. Sus errores y sesgos se transmiten al modelo final, que puede aprender a explotarlos.","ej":"Entre dos explicaciones de un mismo concepto, el modelo de recompensa da 2,1 a la clara y concisa y −0,8 a la que divaga.","py":[{"c":"trl.RewardTrainer","u":"https://huggingface.co/docs/trl/reward_trainer#trl.RewardTrainer"},{"c":"trl.RewardConfig","u":"https://huggingface.co/docs/trl/reward_trainer#trl.RewardConfig"}],"rel":["rlhf","reward-hacking","ppo","llm-as-a-judge"]},{"id":"ppo","name":"PPO","en":"PPO (proximal policy optimization)","frase":"Algoritmo de aprendizaje por refuerzo que mejora la política con pasos pequeños y recortados para no desestabilizarla.","desc":"Proximal Policy Optimization hace más probables las acciones con ventaja positiva, pero recorta el cociente entre la política nueva y la anterior para limitar cuánto cambia en cada paso. Es estable y relativamente sencillo, por lo que se convirtió en el estándar del aprendizaje por refuerzo profundo y del RLHF. En los LLM exige mantener varios modelos a la vez (política, referencia, recompensa y valor), lo que impulsó alternativas más ligeras, como DPO o GRPO.","cuando":"Para entrenar políticas con aprendizaje por refuerzo en entornos simulados o, en RLHF, para optimizar un LLM frente a un modelo de recompensa.","ej":"Un robot simulado aprende a caminar con PPO tras millones de intentos en los que cada mejora se aplica con prudencia.","hp":[["learning_rate","tamaño de paso"],["clip_range","límite al cambio de la política en cada actualización (0,2 es típico)"],["n_steps","pasos de interacción entre actualizaciones"],["gamma","factor de descuento de las recompensas futuras"]],"py":[{"c":"stable_baselines3.PPO","u":"https://stable-baselines3.readthedocs.io/en/master/modules/ppo.html"},{"c":"trl.GRPOTrainer","u":"https://huggingface.co/docs/trl/grpo_trainer#trl.GRPOTrainer"}],"rel":["rlhf","politica-y-funcion-de-valor","dpo","modelo-de-recompensa"]},{"id":"reward-hacking","name":"Reward hacking","en":"reward hacking","frase":"El modelo aprende a maximizar la recompensa explotando sus fallos, en lugar de hacer lo que se pretendía.","desc":"Cualquier recompensa es una aproximación imperfecta de lo que se quiere, y un optimizador potente encuentra atajos: respuestas más largas porque el modelo de recompensa las prefiere, un tono adulador o código que pasa los tests modificándolos en lugar de resolver el problema. Se mitiga con penalizaciones KL, recompensas mejores y más diversas, y vigilando el comportamiento, no solo la puntuación.","ej":"Un modelo optimizado para que los usuarios valoren bien sus respuestas aprende a darles siempre la razón.","rel":["rlhf","modelo-de-recompensa","alucinaciones","riesgos-y-permisos"]},{"id":"rlaif","name":"RLAIF","en":"RLAIF (reinforcement learning from AI feedback)","frase":"Como el RLHF, pero las preferencias las da otro modelo de IA siguiendo unos principios, en lugar de personas.","desc":"Recoger preferencias humanas es caro y lento. En el RLAIF, un modelo evalúa o compara respuestas guiado por una lista de principios escritos (una \"constitución\"), y esas valoraciones entrenan el modelo de recompensa o se usan directamente. Escala mucho mejor y hace explícitos los criterios, aunque hereda las limitaciones del modelo evaluador. Es la base de la IA constitucional.","cuando":"Para alinear modelos a gran escala o en dominios en los que las preferencias humanas son caras de obtener.","ej":"Un modelo juez compara dos respuestas según el principio \"elige la respuesta más útil que no ayude a causar daño\", y su veredicto se usa como señal de entrenamiento.","rel":["rlhf","llm-as-a-judge","modelo-de-recompensa","dpo"]}]},{"id":"dpo","name":"DPO","en":"DPO (direct preference optimization)","frase":"Alinear el LLM directamente con pares de respuestas preferidas y rechazadas, sin modelo de recompensa ni RL.","desc":"Direct Preference Optimization demuestra que el objetivo del RLHF se puede optimizar con una simple pérdida de clasificación sobre pares de preferencias: aumentar la probabilidad relativa de la respuesta preferida frente a la rechazada, respecto a un modelo de referencia. Elimina el modelo de recompensa y el bucle de aprendizaje por refuerzo, así que es mucho más sencillo y estable, y se usa ampliamente para alinear modelos abiertos.","cuando":"Para alinear un modelo con preferencias cuando se dispone de pares de respuestas buena y mala.","ej":"Con 10.000 pares en los que se prefiere la respuesta concisa a la verbosa, el modelo aprende a ser más directo.","hp":[["beta","intensidad de la restricción respecto al modelo de referencia; más baja, más se aleja de él"],["learning_rate","tamaño de paso, normalmente muy pequeño (del orden de 10⁻⁶)"]],"py":[{"c":"trl.DPOTrainer","u":"https://huggingface.co/docs/trl/dpo_trainer#trl.DPOTrainer"},{"c":"trl.DPOConfig","u":"https://huggingface.co/docs/trl/dpo_trainer#trl.DPOConfig"}],"rel":["rlhf","sft","modelo-de-recompensa","divergencia-de-kullback-leibler"]}]},{"id":"inferencia-y-eficiencia","name":"Inferencia y eficiencia","en":"inference & efficiency","frase":"Cómo se generan las respuestas y cómo se hace que los LLM sean más rápidos y baratos de ejecutar.","desc":"La inferencia de un LLM genera la respuesta token a token, y cada token exige recorrer el modelo entero. Su coste depende del tamaño del modelo, de la longitud del contexto y de la estrategia de decodificación. Para abaratarla se cuantizan los pesos, se reutilizan cálculos de la atención (caché KV), se agrupan peticiones y se usan modelos más pequeños o destilados, o se elige entre ejecutar el modelo en local o pagar una API.","ej":"Cuantizar un modelo de 8.000 millones de parámetros a 4 bits permite ejecutarlo en un portátil con 8 GB de memoria.","rel":["decodificacion-y-temperatura","cuantizacion","llms-locales-vs-api","destilacion-de-conocimiento"],"children":[{"id":"decodificacion-y-temperatura","name":"Decodificación y temperatura","en":"decoding & temperature","frase":"Cómo se elige cada token a partir de las probabilidades del modelo: el más probable, con temperatura o muestreando entre los mejores.","desc":"La decodificación voraz elige siempre el token más probable: es determinista, pero repetitiva. El muestreo elige al azar según las probabilidades, y la temperatura las reajusta: baja (menos de 1) concentra la elección en los tokens más probables; alta (más de 1) la reparte y aumenta la creatividad y los errores. Top-k limita el muestreo a los k tokens más probables, y top-p (nucleus), al menor conjunto que acumula una probabilidad p. La búsqueda en haz explora varias secuencias en paralelo.","cuando":"Temperatura baja para extraer datos, clasificar o programar; más alta para escritura creativa o lluvia de ideas.","ej":"Con temperatura 0, el modelo da siempre la misma respuesta; con 1,2, cada vez propone un eslogan distinto para la misma campaña.","hp":[["temperature","aleatoriedad del muestreo"],["top_p","masa de probabilidad acumulada en la que se muestrea"],["top_k","número máximo de candidatos"],["max_new_tokens","longitud máxima de la respuesta"]],"py":[{"c":"transformers.GenerationConfig","u":"https://huggingface.co/docs/transformers/main_classes/text_generation#transformers.GenerationConfig"}],"rel":["softmax","modelo-de-lenguaje","alucinaciones","generacion-con-rnn"]},{"id":"cuantizacion","name":"Cuantización (GPTQ, AWQ, GGUF)","en":"quantization (GPTQ, AWQ, GGUF)","frase":"Representar los pesos del modelo con menos bits para que ocupe menos memoria y vaya más rápido.","desc":"Los pesos se entrenan en 16 o 32 bits, pero pueden guardarse en 8, 4 o incluso menos bits con una pérdida de calidad pequeña. Reduce la memoria entre 2 y 4 veces y acelera la inferencia. GPTQ y AWQ cuantizan los pesos de forma calibrada con unos pocos datos para minimizar el error; GGUF es el formato de llama.cpp para ejecutar modelos cuantizados en CPU y portátiles. Por debajo de 4 bits, la calidad cae más deprisa.","cuando":"Para ejecutar LLM en hardware limitado, abaratar la inferencia o ajustar modelos con QLoRA.","ej":"Un modelo de 70.000 millones de parámetros ocupa 140 GB en 16 bits y unos 40 GB en 4 bits, lo que le permite caber en una sola GPU grande.","hp":[["bits","número de bits por peso (habitualmente 4 u 8)"],["load_in_4bit","cuantización a 4 bits al cargar el modelo"],["group_size","tamaño de los grupos de pesos que comparten escala"]],"py":[{"c":"transformers.BitsAndBytesConfig","u":"https://huggingface.co/docs/transformers/main_classes/quantization#transformers.BitsAndBytesConfig"},{"c":"transformers.GPTQConfig","u":"https://huggingface.co/docs/transformers/main_classes/quantization#transformers.GPTQConfig"},{"c":"transformers.AwqConfig","u":"https://huggingface.co/docs/transformers/main_classes/quantization#transformers.AwqConfig"}],"rel":["qlora","llms-locales-vs-api","despliegue-e-inferencia","cuantizacion-vectorial"]},{"id":"llms-locales-vs-api","name":"LLMs locales vs API","en":"local LLMs vs API","frase":"Ejecutar un modelo abierto en tu propia máquina o servidor frente a usar un modelo comercial a través de una API.","desc":"Las API de los proveedores dan acceso a los modelos más capaces sin infraestructura, pagando por token, pero los datos salen de tu control y dependes de un tercero. Los modelos abiertos ejecutados en local o en tu nube dan privacidad, control, coste fijo y posibilidad de ajustarlos, a cambio de gestionar el hardware y de usar modelos algo menos capaces. Herramientas como Ollama, llama.cpp o vLLM facilitan servirlos, a menudo con una API compatible con la de OpenAI.","cuando":"En local, con datos sensibles, mucho volumen o necesidad de ajustar el modelo; por API, para la máxima capacidad y para empezar rápido.","ej":"Un hospital analiza informes clínicos con un modelo abierto en sus propios servidores para que ningún dato de pacientes salga del centro.","py":[{"c":"openai.OpenAI","u":"https://github.com/openai/openai-python"},{"c":"transformers.pipeline","u":"https://huggingface.co/docs/transformers/main_classes/pipelines#transformers.pipeline"}],"rel":["cuantizacion","hugging-face","despliegue-e-inferencia","decisiones-automatizadas-y-rgpd"]}]},{"id":"uso-de-llms","name":"Uso de LLMs","en":"using LLMs","frase":"Las técnicas para obtener resultados fiables de un LLM sin reentrenarlo.","desc":"Gran parte del rendimiento depende de cómo se pide la tarea. Las técnicas incluyen redactar instrucciones claras y con contexto, dar ejemplos, pedir que razone paso a paso, fijar el formato de salida y separar las instrucciones del sistema de las del usuario. También hay que conocer sus límites, como las alucinaciones, para diseñar sistemas que los compensen.","ej":"Pedir \"clasifica este correo\" da resultados irregulares; especificar las categorías, dar tres ejemplos y exigir JSON los vuelve consistentes.","rel":["prompt-engineering","in-context-learning","salida-estructurada","alucinaciones"],"children":[{"id":"prompt-engineering","name":"Prompt engineering","en":"prompt engineering","frase":"Diseñar las instrucciones que se dan al LLM para obtener respuestas precisas y consistentes.","desc":"Un buen prompt describe la tarea con claridad, aporta el contexto necesario (quién es el usuario, para qué sirve la respuesta), especifica el formato, da ejemplos y delimita los datos de entrada, por ejemplo con etiquetas. Pedir al modelo que adopte un rol, que razone antes de responder o que reconozca cuándo no sabe algo mejora la calidad. Se itera comparando resultados sobre un conjunto de casos de prueba.","cuando":"Siempre, antes de plantearse ajustar un modelo: suele ser la forma más rápida y barata de mejorar los resultados.","ej":"Pasar de \"resume este contrato\" a \"resume este contrato de alquiler para el inquilino en 5 puntos, destacando plazos, penalizaciones y gastos\" mejora mucho el resultado.","rel":["in-context-learning","chain-of-thought","plantillas-de-chat","salida-estructurada"]},{"id":"in-context-learning","name":"Zero-shot, few-shot e in-context learning","en":"zero-shot, few-shot & in-context learning","frase":"El LLM aprende una tarea a partir de las instrucciones o los ejemplos incluidos en la propia petición, sin cambiar sus pesos.","desc":"En zero-shot, el modelo resuelve la tarea solo con la instrucción. En few-shot, se incluyen unos pocos ejemplos resueltos y el modelo imita el patrón. Este aprendizaje en contexto apareció en modelos grandes como GPT-3 y permite adaptar el modelo a tareas nuevas al instante. La elección, el orden y el formato de los ejemplos influyen en el resultado.","cuando":"Para tareas nuevas o cambiantes sin datos de entrenamiento, o como prueba rápida antes de ajustar un modelo.","ej":"Tres ejemplos de reseñas con su categoría (\"envío\", \"calidad\", \"precio\") bastan para que el modelo clasifique bien las reseñas nuevas.","rel":["prompt-engineering","gpt","chain-of-thought","que-es-un-modelo-fundacional"]},{"id":"chain-of-thought","name":"Chain-of-thought","en":"chain-of-thought (CoT)","frase":"Pedir al modelo que razone paso a paso antes de dar la respuesta final.","desc":"Al generar los pasos intermedios, el modelo dedica más cómputo al problema y cada paso condiciona el siguiente, lo que mejora mucho los resultados en aritmética, lógica y problemas de varios pasos. Basta con añadir \"piensa paso a paso\" o con dar ejemplos que incluyan el razonamiento. Los modelos de razonamiento llevan esta idea al entrenamiento. El razonamiento escrito no siempre refleja fielmente cómo llegó el modelo a la respuesta.","cuando":"Para problemas de matemáticas, lógica, planificación o análisis que requieren varios pasos.","ej":"\"Un tren sale a las 9:40 y tarda 2 h 35 min; ¿a qué hora llega?\". Razonando paso a paso, el modelo suma bien las horas y responde 12:15.","rel":["modelos-de-razonamiento","prompt-engineering","in-context-learning","alucinaciones"]},{"id":"plantillas-de-chat","name":"Plantillas de chat y prompt de sistema","en":"chat templates & system prompt","frase":"El formato con el que se codifica una conversación (sistema, usuario, asistente) para que el modelo la entienda.","desc":"Los modelos conversacionales se ajustaron con conversaciones en un formato concreto, con tokens especiales que marcan quién habla. La plantilla de chat convierte una lista de mensajes en ese texto exacto, y usar otra plantilla degrada mucho las respuestas. El prompt de sistema, al inicio, fija el rol, las reglas y el contexto para toda la conversación, y suele tener prioridad sobre las instrucciones del usuario.","cuando":"Siempre que se use un modelo conversacional directamente, sin una API que aplique la plantilla por ti.","ej":"Un prompt de sistema define: \"eres el asistente de una aseguradora; responde solo sobre pólizas y deriva las reclamaciones a una persona\".","py":[{"c":"tokenizer.apply_chat_template(mensajes, add_generation_prompt=True)","s":1}],"rel":["vocabulario-y-tokens-especiales","prompt-engineering","sft","guardrails-y-middleware"]},{"id":"salida-estructurada","name":"Salida estructurada","en":"structured output","frase":"Obligar al LLM a responder en un formato estricto, como un JSON que cumpla un esquema.","desc":"Para integrar un LLM en un programa, su salida debe poder procesarse automáticamente. Se puede pedir el formato en el prompt, pero es más fiable usar las funciones de salida estructurada de las API o la decodificación restringida, que solo permite generar tokens válidos según un esquema JSON. Definir el esquema con una clase de pydantic añade validación de tipos.","cuando":"Siempre que la respuesta del modelo alimente a otro programa, una base de datos o un flujo automatizado.","ej":"Extraer de cada factura escaneada un JSON con proveedor, fecha, importe e IVA que se inserta directamente en la contabilidad.","py":[{"c":"pydantic.BaseModel","u":"https://docs.pydantic.dev/latest/api/base_model/"},{"c":"llm.with_structured_output(Factura)","s":1}],"rel":["function-calling","prompt-engineering","agente-llm","alucinaciones"]},{"id":"alucinaciones","name":"Alucinaciones","en":"hallucinations","frase":"Cuando el modelo genera información falsa o inventada con total seguridad.","desc":"Un LLM produce el texto más plausible, no necesariamente el verdadero, así que puede inventar datos, citas, referencias o funciones de código inexistentes con la misma fluidez con la que acierta. Ocurre sobre todo con hechos poco frecuentes en sus datos, detalles precisos y preguntas fuera de su conocimiento. Se reduce con RAG, con instrucciones que le permitan decir \"no lo sé\", con verificación externa y citando fuentes.","cuando":"Hay que tenerlas en cuenta en cualquier uso con consecuencias: datos, cifras o citas legales o médicas.","ej":"En 2023, un abogado presentó ante un tribunal de Nueva York un escrito con sentencias citadas por un LLM que no existían.","rel":["rag","llm-as-a-judge","decodificacion-y-temperatura","incertidumbre","reward-hacking"]}]},{"id":"evaluacion-de-llms","name":"Evaluación de LLMs","en":"LLM evaluation","frase":"Medir lo bien que funciona un LLM: conocimiento, razonamiento, seguridad y utilidad en tu tarea concreta.","desc":"Se combinan benchmarks públicos (conocimiento, matemáticas, programación), evaluaciones con otro LLM como juez, comparaciones de preferencia humana y, sobre todo, conjuntos de prueba propios con los casos reales de la aplicación. Los benchmarks públicos se saturan y pueden estar contaminados, así que lo más fiable para decidir es evaluar con tus propios datos y criterios.","ej":"Antes de elegir el modelo de un chatbot de soporte, se comparan tres candidatos con 300 preguntas reales de clientes y sus respuestas de referencia.","rel":["benchmarks-y-saturacion","llm-as-a-judge","arenas-de-preferencia-humana","perplejidad"],"children":[{"id":"benchmarks-y-saturacion","name":"Benchmarks y saturación","en":"benchmarks & saturation","frase":"Las pruebas estándar de los LLM se quedan pequeñas en pocos años: los modelos las superan o las han visto al entrenar.","desc":"Benchmarks como MMLU (conocimiento), GSM8K (matemáticas) o HumanEval (programación) permitieron comparar modelos, pero los mejores alcanzan cifras cercanas al máximo y dejan de discriminar entre ellos (saturación). Además, sus preguntas pueden haberse filtrado en los datos de entrenamiento (contaminación), lo que infla los resultados. Se responde con pruebas más difíciles, privadas o que se renuevan con el tiempo.","ej":"En pocos años, los mejores modelos pasaron de acertar menos de la mitad de las preguntas de MMLU a superar el 90 %, y hubo que crear versiones más difíciles.","rel":["evaluacion-de-llms","benchmarks-de-nlp","fuga-de-datos","arenas-de-preferencia-humana"]},{"id":"llm-as-a-judge","name":"LLM como juez (LLM-as-a-judge)","en":"LLM-as-a-judge","frase":"Usar un LLM para evaluar las respuestas de otro modelo según unos criterios.","desc":"Un modelo potente recibe la pregunta, la respuesta y unas pautas de evaluación (una rúbrica o una respuesta de referencia) y devuelve una puntuación o elige la mejor de dos. Escala mucho mejor que la evaluación humana y se correlaciona bien con ella en muchas tareas, pero tiene sesgos conocidos: prefiere las respuestas largas, las de su misma familia de modelos y la primera opción presentada. Conviene validarlo con una muestra de juicios humanos.","cuando":"Para evaluar a gran escala respuestas abiertas, como resúmenes, respuestas de chatbots o salidas de RAG.","ej":"Un LLM juez puntúa de 1 a 5 la fidelidad de 2.000 resúmenes generados respecto a sus documentos originales.","rel":["evaluacion-de-llms","rlaif","evaluacion-de-rag","arenas-de-preferencia-humana"]},{"id":"arenas-de-preferencia-humana","name":"Arenas de preferencia humana","en":"human preference arenas","frase":"Plataformas donde las personas comparan a ciegas las respuestas de dos modelos y votan la mejor.","desc":"Los usuarios envían sus propias preguntas, reciben dos respuestas anónimas y eligen la que prefieren. Con millones de votos se calcula una clasificación de tipo Elo (modelo de Bradley-Terry). Capturan la preferencia real de los usuarios en tareas variadas y son difíciles de contaminar, aunque premian el estilo (longitud, formato, tono) además de la corrección.","ej":"Una arena pública de chatbots ordena decenas de modelos a partir de cientos de miles de comparaciones hechas por usuarios.","rel":["evaluacion-de-llms","llm-as-a-judge","rlhf","evaluacion-cualitativa"]}]}]},{"id":"rag-y-agentes","name":"RAG y agentes","en":"RAG & AI agents","frase":"Conectar un LLM con documentos y herramientas para que responda con fundamento y actúe.","desc":"Cómo convertir un LLM en un sistema útil y fiable. El RAG lo conecta con documentos externos: recupera los fragmentos relevantes y los añade al prompt para que la respuesta se apoye en ellos. Un agente da al LLM herramientas (buscar, ejecutar código, llamar a APIs) y un bucle en el que decide qué hacer en cada paso hasta completar la tarea.","cuando":"Cuando un LLM debe responder con información propia o actualizada, o completar tareas de varios pasos usando herramientas.","ej":"Un asistente que responde sobre la documentación interna de una empresa citando sus fuentes es un RAG. Si además puede abrir incidencias o enviar correos, es un agente.","rel":["rag","agentes-de-ia","alucinaciones","function-calling"],"children":[{"id":"rag","name":"RAG (generación aumentada por recuperación)","en":"RAG (retrieval-augmented generation)","frase":"Buscar la información relevante en tus documentos y dársela al LLM junto con la pregunta para que responda con ella.","desc":"La generación aumentada por recuperación combina un buscador y un LLM. Los documentos se dividen en fragmentos y se indexan, normalmente como embeddings; ante cada pregunta se recuperan los fragmentos más relevantes y se incluyen en el prompt. Así el modelo responde con información actual o privada que no conoce, reduce las alucinaciones y puede citar sus fuentes, sin reentrenar nada.","cuando":"Cuando el modelo debe responder con información propia, cambiante o demasiado extensa para su contexto, como manuales, políticas o bases de conocimiento.","ej":"Un asistente interno responde \"¿cuántos días de teletrabajo tengo?\" citando el apartado exacto del convenio de la empresa.","py":[{"c":"langchain_core.vectorstores.InMemoryVectorStore","u":"https://reference.langchain.com/python/langchain-core/vectorstores/in_memory/InMemoryVectorStore"},{"c":"vectorstore.as_retriever(search_kwargs={\"k\": 4})","s":1}],"rel":["memoria-parametrica-vs-no-parametrica","chunking","recuperacion-densa","alucinaciones","evaluacion-de-rag"],"children":[{"id":"memoria-parametrica-vs-no-parametrica","name":"Memoria paramétrica vs no paramétrica","en":"parametric vs non-parametric memory","frase":"Lo que el modelo sabe porque lo aprendió en sus pesos frente a lo que consulta en una fuente externa.","desc":"La memoria paramétrica es el conocimiento almacenado en los pesos durante el entrenamiento: es rápida, pero fija, difícil de actualizar y sin fuentes verificables. La no paramétrica es una base de documentos que se consulta en el momento: se actualiza añadiendo documentos y permite citar y controlar el acceso. RAG combina ambas: el modelo aporta el lenguaje y el razonamiento, y la base, los hechos.","ej":"Para que un asistente conozca un producto lanzado ayer, basta con añadir su ficha al índice; reentrenar el modelo sería lento y caro.","rel":["rag","fine-tuning","alucinaciones","memoria-del-agente"]},{"id":"chunking","name":"Chunking","en":"chunking","frase":"Dividir los documentos en fragmentos del tamaño adecuado para indexarlos y recuperarlos.","desc":"Los documentos largos se cortan en fragmentos (chunks) que se indexan por separado. Si son muy pequeños, pierden el contexto; si son muy grandes, su embedding mezcla temas y llenan el prompt de texto irrelevante. Se cortan por tamaño con solapamiento, respetando la estructura (párrafos, apartados, tablas) o por cambios de tema. Añadir a cada fragmento el título o un resumen del documento mejora la recuperación.","cuando":"Siempre que se indexan documentos para RAG o para búsqueda semántica.","ej":"Un manual de 300 páginas se divide en fragmentos de unos 1.000 caracteres con 200 de solapamiento, sin partir los apartados.","hp":[["chunk_size","tamaño máximo de cada fragmento"],["chunk_overlap","texto compartido entre fragmentos consecutivos"]],"py":[{"c":"langchain_text_splitters.RecursiveCharacterTextSplitter","u":"https://docs.langchain.com/oss/python/integrations/splitters/recursive_text_splitter"}],"rel":["rag","recuperacion-densa","ventana-de-contexto","modelos-de-embeddings-de-texto"]},{"id":"recuperacion-densa","name":"Recuperación densa (dual encoder)","en":"dense retrieval (dual encoder)","frase":"Buscar documentos comparando los embeddings de la pregunta y de los textos: por significado, no por palabras.","desc":"Un codificador dual convierte por separado la pregunta y cada fragmento en vectores, entrenados para que las preguntas queden cerca de los textos que las responden. Los fragmentos se codifican una sola vez y se guardan en un índice; en cada consulta solo hay que codificar la pregunta y buscar sus vecinos más cercanos. Encuentra sinónimos y paráfrasis, pero puede fallar con nombres propios, códigos o términos muy específicos.","cuando":"Como recuperador principal en RAG y en búsqueda semántica, sobre todo con consultas en lenguaje natural.","ej":"La pregunta \"¿puedo devolver un producto abierto?\" recupera el apartado de la política de devoluciones que habla de \"artículos desprecintados\".","py":[{"c":"sentence_transformers.SentenceTransformer","u":"https://sbert.net/docs/package_reference/sentence_transformer/model.html"},{"c":"faiss.IndexFlatIP","u":"https://github.com/facebookresearch/faiss/wiki/Faiss-indexes"}],"rel":["modelos-de-embeddings-de-texto","busqueda-hibrida","busqueda-aproximada-de-vecinos","re-ranking"]},{"id":"bases-de-datos-vectoriales","name":"Bases de datos vectoriales","en":"vector databases","frase":"Bases de datos diseñadas para guardar millones de embeddings y encontrar los más parecidos en milisegundos.","desc":"Almacenan vectores junto con su texto y sus metadatos, construyen índices de vecinos aproximados para buscar rápido y permiten filtrar por metadatos, como fecha, autor o perm
