anos reconstruye mal las de un motor averiado, lo que delata la avería.","rel":["cuello-de-botella","vae","deteccion-por-reconstruccion-o-prediccion","pca"],"children":[{"id":"cuello-de-botella","name":"Encoder, decoder y cuello de botella","en":"encoder, decoder & bottleneck","frase":"El codificador comprime, el código es el cuello de botella y el decodificador reconstruye.","desc":"El codificador reduce progresivamente la dimensión hasta el código o representación latente, la capa más estrecha, y el decodificador hace el camino inverso. El tamaño del cuello de botella marca el compromiso: si es muy grande, la red puede copiar la entrada sin aprender nada útil; si es muy pequeño, la reconstrucción pierde detalle. Tras el entrenamiento, el codificador se puede usar por separado como extractor de características.","ej":"Comprimir imágenes de dígitos manuscritos de 784 píxeles en un código de 32 números y reconstruirlas casi sin pérdida visible.","rel":["autoencoders","espacio-latente","autoencoder-undercomplete","extraccion-de-caracteristicas"]},{"id":"autoencoder-undercomplete","name":"Autoencoder undercomplete","en":"undercomplete autoencoder","frase":"Autoencoder con un código más pequeño que la entrada, lo que le obliga a comprimir.","desc":"Es el autoencoder básico: la restricción viene solo del tamaño del cuello de botella. Con capas lineales y error cuadrático aprende el mismo subespacio que PCA; con capas no lineales aprende una versión no lineal y más potente. Si el codificador y el decodificador son demasiado potentes, puede memorizar sin extraer una estructura útil.","cuando":"Para reducir la dimensión de forma no lineal o comprimir datos con estructura compleja.","ej":"Reducir a 10 dimensiones los espectros de 2.000 longitudes de onda de unas muestras químicas para visualizarlas y agruparlas.","rel":["pca","cuello-de-botella","autoencoder-sparse","reduccion-de-la-dimensionalidad"]},{"id":"autoencoder-sparse","name":"Autoencoder sparse","en":"sparse autoencoder","frase":"Autoencoder que obliga a que, para cada entrada, solo unas pocas neuronas del código estén activas.","desc":"En lugar de estrechar el código, o además de hacerlo, añade a la pérdida una penalización sobre las activaciones, como la norma L1 o una divergencia KL respecto a una activación media pequeña. El código puede ser incluso más grande que la entrada, pero cada neurona se especializa en un rasgo y solo se activa cuando aparece. Produce representaciones más interpretables y hoy se usa para analizar los rasgos internos de los LLM.","cuando":"Para aprender rasgos interpretables y especializados, o cuando el código puede ser grande pero se quiere disperso.","ej":"Entrenado con parches de imágenes naturales, cada neurona del código acaba respondiendo a un borde con una orientación concreta.","hp":[["activity_regularizer","penalización sobre las activaciones del código, por ejemplo L1"]],"py":[{"c":"keras.layers.Dense","u":"https://keras.io/api/layers/core_layers/dense/"},{"c":"keras.regularizers.L1","u":"https://keras.io/api/layers/regularizers/#l1-class"}],"rel":["autoencoders","penalizacion-l1-y-l2","divergencia-de-kullback-leibler","explicabilidad-en-deep-learning"]},{"id":"autoencoder-denoising","name":"Autoencoder denoising","en":"denoising autoencoder","frase":"Autoencoder que recibe la entrada corrompida y aprende a reconstruir la versión limpia.","desc":"Se añade ruido a la entrada o se borran partes, y la red debe reconstruir el original. Como no puede limitarse a copiar, aprende la estructura de los datos limpios, lo que da representaciones más robustas. La misma idea, eliminar ruido de forma gradual, está en el corazón de los modelos de difusión, y la de reconstruir lo borrado, en el preentrenamiento de BERT y de MAE.","cuando":"Para limpiar señales o imágenes ruidosas, o para aprender representaciones robustas sin etiquetas.","ej":"Limpiar documentos escaneados con manchas y arrugas para mejorar el reconocimiento de texto posterior.","hp":[["stddev","intensidad del ruido que se añade a la entrada durante el entrenamiento"]],"py":[{"c":"keras.layers.GaussianNoise","u":"https://keras.io/api/layers/regularization_layers/gaussian_noise/"}],"rel":["inyeccion-de-ruido","modelos-de-difusion","modelado-enmascarado","autoencoders"]},{"id":"autoencoder-convolucional","name":"Autoencoder convolucional","en":"convolutional autoencoder","frase":"Autoencoder con capas convolucionales, adecuado para imágenes y señales.","desc":"El codificador usa convoluciones y reducciones de resolución para comprimir la imagen en mapas de características pequeños, y el decodificador usa convoluciones transpuestas o aumento de resolución para recuperarla. Aprovecha la estructura espacial con muchos menos parámetros que un autoencoder de capas densas y reconstruye las imágenes con más detalle.","cuando":"Con imágenes, espectrogramas u otros datos con estructura espacial.","ej":"Detectar defectos en piezas fabricadas: el autoencoder, entrenado solo con piezas correctas, reconstruye mal las zonas con arañazos.","py":[{"c":"keras.layers.Conv2D","u":"https://keras.io/api/layers/convolution_layers/convolution2d/"},{"c":"keras.layers.Conv2DTranspose","u":"https://keras.io/api/layers/convolution_layers/convolution2d_transpose/"}],"rel":["autoencoders","convolucion-transpuesta","u-net","deteccion-por-reconstruccion-o-prediccion"]},{"id":"autoencoder-contractivo","name":"Autoencoder contractivo","en":"contractive autoencoder","frase":"Autoencoder que penaliza que su código cambie mucho ante pequeñas variaciones de la entrada.","desc":"Añade a la pérdida la norma de la matriz jacobiana del codificador, es decir, de las derivadas del código respecto a la entrada. Así el código es poco sensible a las direcciones de variación irrelevantes y solo sigue las que importan para reconstruir los datos, que suelen coincidir con la variedad sobre la que viven. Es una alternativa analítica al autoencoder de eliminación de ruido.","cuando":"Para aprender representaciones estables frente a pequeñas perturbaciones de la entrada.","ej":"Con fotos de dígitos, el código cambia poco si el trazo se vuelve algo más grueso y mucho si cambia el dígito.","rel":["autoencoder-denoising","manifold-learning","autoencoders","regularizacion-en-redes"]}]},{"id":"modelos-bioinspirados-y-multiescala","name":"Modelos bioinspirados y multiescala","en":"bio-inspired & multiscale models","frase":"Arquitecturas que imitan etapas del sistema visual humano o analizan la imagen a varias escalas.","desc":"Incorporan conocimiento de la neurociencia y del procesamiento de señales: no linealidades como la normalización divisiva, observada en la corteza visual, y representaciones multiescala, como las pirámides o las wavelets, que describen la imagen a distintas resoluciones. Dan modelos más pequeños, interpretables y alineados con la percepción humana, útiles en compresión de imagen y en medidas de calidad perceptual.","ej":"Una red de pocas capas inspiradas en la retina y la corteza visual predice qué distorsiones de una imagen nota más una persona.","rel":["gdn","perceptnet","modelos-multiescala","inspiracion-biologica-de-las-cnn"],"children":[{"id":"gdn","name":"Normalización divisiva generalizada (GDN)","en":"generalized divisive normalization (GDN)","frase":"No linealidad que divide cada respuesta por una combinación de las respuestas vecinas, como en la corteza visual.","desc":"La normalización divisiva generalizada divide la salida de cada canal por una suma ponderada y aprendida de las magnitudes de los demás canales. Imita la normalización divisiva de las neuronas visuales, que reduce la redundancia entre ellas, y gaussianiza y desacopla las respuestas de forma muy eficaz. Es una pieza clave de la compresión de imagen aprendida con redes neuronales.","cuando":"En compresión de imagen aprendida y en modelos que buscan representaciones visuales eficientes o perceptuales.","ej":"Los códecs de imagen basados en redes sustituyen las ReLU por capas GDN y obtienen archivos más pequeños con la misma calidad visual.","py":[{"c":"compressai.layers.GDN","u":"https://interdigitalinc.github.io/CompressAI/layers.html#compressai.layers.GDN"}],"rel":["capas-de-normalizacion","perceptnet","modelos-bioinspirados-y-multiescala","metricas-perceptuales"]},{"id":"perceptnet","name":"PerceptNet","en":"PerceptNet","frase":"Red pequeña, inspirada en las etapas del sistema visual, que mide cuán distintas percibimos dos imágenes.","desc":"Encadena capas que imitan la retina, el núcleo geniculado lateral y la corteza visual primaria, con convoluciones y normalizaciones divisivas (GDN). Se entrena para que la distancia entre las representaciones de dos imágenes coincida con la diferencia que perciben las personas. Con muchos menos parámetros que las medidas basadas en grandes redes, predice bien los juicios humanos sobre la calidad de imagen.","cuando":"Como distancia perceptual entre imágenes cuando importa la coherencia con la visión humana y el bajo coste de cálculo.","ej":"Ordenar varias versiones comprimidas de una foto según cuánto se nota la compresión, como lo haría un grupo de observadores.","rel":["gdn","metricas-perceptuales","modelos-bioinspirados-y-multiescala","calidad-de-imagen"]},{"id":"modelos-multiescala","name":"Modelos multiescala","en":"multiscale models","frase":"Analizar la entrada a varias resoluciones a la vez, de los detalles finos a la estructura global.","desc":"Muchas estructuras de una imagen o una señal solo se ven a cierta escala: los bordes, a resolución alta; las formas generales, a resolución baja. Las representaciones multiescala, como las pirámides gaussianas y laplacianas o las wavelets, descomponen la entrada por escalas. En redes neuronales, las pirámides de características combinan mapas de varias resoluciones para detectar a la vez objetos pequeños y grandes.","cuando":"Cuando los patrones de interés aparecen a tamaños muy distintos, como objetos cercanos y lejanos en una misma imagen.","ej":"Un detector de peatones con pirámide de características encuentra tanto a las personas cercanas como a las que están al fondo de la escena.","py":[{"c":"torchvision.ops.FeaturePyramidNetwork","u":"https://docs.pytorch.org/vision/stable/generated/torchvision.ops.FeaturePyramidNetwork.html"},{"c":"skimage.transform.pyramid_laplacian","u":"https://scikit-image.org/docs/stable/api/skimage.transform.html#skimage.transform.pyramid_laplacian"}],"rel":["piramides-gaussiana-y-laplaciana","wavelets","deteccion-de-objetos","modelos-bioinspirados-y-multiescala"]}]}]},{"id":"representaciones-y-modelos-fundacionales","name":"Representaciones y modelos fundacionales","en":"representation learning & foundation models","frase":"Preentrenar una vez con muchos datos y reutilizar lo aprendido en muchas tareas.","desc":"El paradigma de preentrenar y adaptar. Un modelo aprende representaciones generales (embeddings) con enormes cantidades de datos, a menudo sin etiquetas gracias al aprendizaje autosupervisado. Después se reutiliza para muchas tareas mediante transfer learning o fine-tuning. Es la base de los modelos fundacionales.","cuando":"Cuando tienes pocos datos etiquetados y existe un modelo preentrenado con datos parecidos a los tuyos.","ej":"Reutilizar un modelo preentrenado con millones de imágenes para clasificar radiografías disponiendo solo de unos cientos de ejemplos etiquetados.","rel":["embeddings","aprendizaje-autosupervisado","transfer-learning","que-es-un-modelo-fundacional"],"children":[{"id":"aprendizaje-de-representaciones","name":"Aprendizaje de representaciones","en":"representation learning","frase":"Aprender automáticamente a describir los datos con vectores útiles, en lugar de diseñar las variables a mano.","desc":"Una buena representación transforma datos brutos (píxeles, palabras, audio) en vectores en los que lo relevante para muchas tareas es fácil de extraer, por ejemplo con un clasificador lineal. Las capas intermedias de una red ya son representaciones aprendidas. Hoy se aprenden a gran escala con autosupervisión y se reutilizan en muchas tareas mediante transferencia.","ej":"Las representaciones de un modelo entrenado con millones de imágenes permiten clasificar especies de aves con solo 20 fotos de cada una.","rel":["embeddings","aprendizaje-autosupervisado","transfer-learning","feature-engineering"]},{"id":"embeddings","name":"Embeddings","en":"embeddings","frase":"Vectores numéricos que representan objetos de forma que los parecidos queden cerca.","desc":"Un embedding asigna a cada elemento (una palabra, una frase, una imagen, un usuario, un producto) un vector denso de decenas a miles de dimensiones. La geometría codifica el significado: la distancia o el coseno entre vectores mide la similitud. Se obtienen de capas de embedding, de las capas intermedias de una red o de modelos entrenados específicamente para ello, y son la base de la búsqueda semántica, los recomendadores y el RAG.","cuando":"Para comparar, buscar, agrupar o alimentar modelos con datos no estructurados, como texto o imágenes.","ej":"\"Perro\" y \"cachorro\" tienen embeddings cercanos; \"perro\" e \"hipoteca\", lejanos.","py":[{"c":"sentence_transformers.SentenceTransformer","u":"https://sbert.net/docs/package_reference/sentence_transformer/model.html"}],"rel":["espacio-latente","busqueda-por-similitud","capa-de-embedding","modelos-de-embeddings-de-texto","similitud-coseno"],"children":[{"id":"espacio-latente","name":"Espacio latente","en":"latent space","frase":"El espacio de representaciones internas de un modelo, donde los datos se describen con menos variables y más significado.","desc":"Es el espacio de los códigos o embeddings que un modelo produce internamente, como el cuello de botella de un autoencoder o el ruido de entrada de una GAN. Suele tener menos dimensiones que los datos y una estructura con sentido: direcciones asociadas a atributos y regiones que corresponden a tipos de datos. En los modelos generativos, moverse por él permite interpolar entre ejemplos y editarlos.","ej":"En una GAN de caras, avanzar en cierta dirección del espacio latente hace sonreír progresivamente a la persona generada.","rel":["embeddings","cuello-de-botella","vae","aritmetica-de-embeddings","stable-diffusion"]},{"id":"aritmetica-de-embeddings","name":"Aritmética de embeddings","en":"embedding arithmetic","frase":"Sumar y restar vectores de embeddings para combinar o trasladar significados.","desc":"En un buen espacio de embeddings, muchas relaciones se codifican como direcciones aproximadamente constantes, así que se pueden manipular con operaciones vectoriales. El ejemplo clásico de word2vec es rey − hombre + mujer ≈ reina. La misma idea permite editar imágenes en el espacio latente de un generador. Las analogías no siempre funcionan y reflejan los sesgos de los datos de entrenamiento.","ej":"Con vectores de palabras, París − Francia + Italia da un vector cuyo vecino más cercano es Roma.","py":[{"c":"gensim.models.KeyedVectors.most_similar","u":"https://radimrehurek.com/gensim/models/keyedvectors.html#gensim.models.keyedvectors.KeyedVectors.most_similar"}],"rel":["word2vec","espacio-latente","embeddings","sesgo-algoritmico-y-atributos-sensibles"]},{"id":"busqueda-por-similitud","name":"Búsqueda por similitud","en":"similarity search","frase":"Encontrar los elementos más parecidos a una consulta comparando sus embeddings.","desc":"Se convierte la consulta en un embedding y se buscan los vectores más cercanos de una colección, normalmente por similitud coseno o producto escalar. Con miles de elementos basta con compararlos todos; con millones se usan índices de vecinos aproximados, mucho más rápidos. Es la base de la búsqueda semántica, la recomendación de contenidos similares y la recuperación en RAG.","cuando":"Para buscar por significado y no por coincidencia exacta de palabras, o para encontrar productos, imágenes o documentos parecidos.","ej":"Buscar \"zapatillas para correr por montaña\" y encontrar productos descritos como \"calzado de trail running\".","py":[{"c":"sentence_transformers.util.semantic_search","u":"https://sbert.net/docs/package_reference/util/retrieval.html#sentence_transformers.util.retrieval.semantic_search"},{"c":"sklearn.neighbors.NearestNeighbors","u":"https://scikit-learn.org/stable/modules/generated/sklearn.neighbors.NearestNeighbors.html"},{"c":"faiss.IndexFlatIP","u":"https://github.com/facebookresearch/faiss/wiki/Faiss-indexes"}],"rel":["embeddings","busqueda-aproximada-de-vecinos","recuperacion-densa","similitud-coseno"]}]},{"id":"aprendizaje-autosupervisado","name":"Aprendizaje autosupervisado (SSL)","en":"self-supervised learning (SSL)","frase":"Aprender representaciones sin etiquetas, inventando tareas cuya respuesta sale de los propios datos.","desc":"En lugar de etiquetas humanas, el modelo resuelve tareas construidas a partir de los datos: predecir la palabra siguiente o una palabra oculta, reconstruir parches tapados de una imagen o reconocer que dos vistas distintas son de la misma foto. Al resolverlas aprende representaciones generales que luego se adaptan a tareas concretas con pocos ejemplos etiquetados. Así se preentrenan los LLM y los grandes modelos de visión.","cuando":"Cuando hay muchos datos sin etiquetar y pocas etiquetas, o para preentrenar modelos reutilizables.","ej":"Un hospital con un millón de radiografías sin etiquetar preentrena un modelo autosupervisado y después lo ajusta con 2.000 radiografías etiquetadas.","rel":["tarea-pretexto","aprendizaje-contrastivo","modelado-enmascarado","paradigmas-de-aprendizaje","modelos-fundacionales"],"children":[{"id":"tarea-pretexto","name":"Tarea pretexto","en":"pretext task","frase":"Una tarea artificial, con la respuesta conocida gratis, que obliga al modelo a aprender algo útil.","desc":"No interesa por sí misma, sino por lo que obliga a aprender. Ejemplos clásicos son predecir la rotación aplicada a una imagen, recomponer un puzle de parches, colorear una foto en blanco y negro o adivinar palabras ocultas. Si está bien elegida, resolverla exige entender la estructura de los datos, y esas representaciones sirven después para la tarea real.","ej":"Para adivinar si una foto está girada 90°, el modelo necesita reconocer los objetos y saber cuál es su orientación natural.","rel":["aprendizaje-autosupervisado","modelado-enmascarado","aprendizaje-contrastivo"]},{"id":"aprendizaje-contrastivo","name":"Aprendizaje contrastivo","en":"contrastive learning","frase":"Aprender acercando las representaciones de pares relacionados y alejando las de pares no relacionados.","desc":"Se construyen pares positivos, como dos versiones aumentadas de la misma imagen o una imagen y su texto, y se tratan como negativos los demás ejemplos del lote. La pérdida empuja a que los positivos tengan embeddings parecidos y los negativos, distintos. Así se aprenden representaciones sin etiquetas que capturan qué hace iguales o diferentes a los datos. Es la base de SimCLR, MoCo y CLIP.","cuando":"Para aprender embeddings sin etiquetas o a partir de pares naturales, como imagen y texto o pregunta y respuesta.","ej":"Entrenar un buscador con pares de pregunta y respuesta correcta, de forma que cada respuesta quede cerca de su pregunta.","hp":[["temperature","escala las similitudes; cuanto más baja, más se castigan los negativos difíciles"]],"py":[{"c":"lightly.loss.NTXentLoss","u":"https://docs.lightly.ai/self-supervised-learning/lightly.loss.html#lightly.loss.ntx_ent_loss.NTXentLoss"},{"c":"sentence_transformers.sentence_transformer.losses.MultipleNegativesRankingLoss","u":"https://sbert.net/docs/package_reference/sentence_transformer/losses.html#multiplenegativesrankingloss"}],"rel":["perdida-infonce","simclr-moco-byol-y-dino","clip","redes-siamesas"],"children":[{"id":"perdida-infonce","name":"Pérdida InfoNCE","en":"InfoNCE loss","frase":"La pérdida contrastiva estándar: una clasificación en la que hay que reconocer el par correcto entre muchos candidatos.","desc":"Para cada ejemplo compara la similitud con su positivo frente a las similitudes con todos los negativos del lote, divididas por una temperatura, y aplica una entropía cruzada: es como clasificar cuál de N candidatos es el compañero correcto. Maximiza una cota inferior de la información mutua entre las dos vistas. Funciona mejor con lotes grandes, porque aportan más negativos.","ej":"En un lote de 256 pares de imagen y texto, cada imagen debe identificar su descripción entre las 256 del lote.","hp":[["temperature","escala de las similitudes; valores típicos entre 0,05 y 0,5"]],"py":[{"c":"lightly.loss.NTXentLoss","u":"https://docs.lightly.ai/self-supervised-learning/lightly.loss.html#lightly.loss.ntx_ent_loss.NTXentLoss"},{"c":"F.cross_entropy(similitudes / tau, etiquetas)","s":1}],"rel":["aprendizaje-contrastivo","entropia-cruzada","informacion-mutua","clip"]},{"id":"simclr-moco-byol-y-dino","name":"SimCLR, MoCo, BYOL y DINO","en":"SimCLR, MoCo, BYOL & DINO","frase":"Cuatro métodos de referencia para aprender representaciones visuales sin etiquetas.","desc":"SimCLR aplica dos aumentos a cada imagen y usa aprendizaje contrastivo con los negativos del lote, por lo que necesita lotes enormes. MoCo guarda los negativos en una cola alimentada por un codificador que se actualiza lentamente (momentum), lo que permite lotes pequeños. BYOL y DINO prescinden de negativos: una red alumna imita a una red maestra que es una media móvil de ella misma, con mecanismos para evitar el colapso. DINOv2 da algunas de las mejores representaciones visuales de propósito general.","cuando":"Para preentrenar extractores visuales con muchas imágenes sin etiquetar o elegir un modelo preentrenado de propósito general.","ej":"Usar tal cual las características de DINOv2 para buscar imágenes similares o separar objetos del fondo, sin ajuste fino.","py":[{"c":"AutoModel.from_pretrained(\"facebook/dinov2-base\")","s":1}],"rel":["aprendizaje-contrastivo","colapso-de-la-representacion","perdida-infonce","destilacion-de-conocimiento"]}]},{"id":"modelado-enmascarado","name":"Modelado enmascarado (MAE, BEiT)","en":"masked modeling (MAE, BEiT)","frase":"Ocultar partes de la entrada y entrenar al modelo para reconstruirlas.","desc":"Se tapa una parte de los datos y el modelo debe predecirla a partir del resto. En texto, BERT oculta el 15 % de los tokens. En imagen, MAE oculta el 75 % de los parches y reconstruye sus píxeles con un decodificador ligero, y BEiT predice tokens visuales discretos de los parches ocultos. Obliga a aprender cómo se relacionan las partes de los datos y es un preentrenamiento muy eficiente.","cuando":"Para preentrenar transformers de texto, imagen o audio con datos sin etiquetar.","ej":"MAE ve solo una cuarta parte de los parches de la foto de un perro y reconstruye de forma plausible la cabeza y las patas que faltan.","hp":[["mask_ratio","fracción de parches ocultos (0,75 en MAE)"]],"py":[{"c":"transformers.ViTMAEConfig","u":"https://huggingface.co/docs/transformers/model_doc/vit_mae#transformers.ViTMAEConfig"},{"c":"transformers.ViTMAEForPreTraining","u":"https://huggingface.co/docs/transformers/model_doc/vit_mae#transformers.ViTMAEForPreTraining"}],"rel":["mlm","tarea-pretexto","vit","autoencoder-denoising"]},{"id":"colapso-de-la-representacion","name":"Colapso de la representación","en":"representation collapse","frase":"Fallo del aprendizaje autosupervisado en el que el modelo da el mismo vector a todas las entradas.","desc":"Si el objetivo solo pide que las vistas de un mismo ejemplo tengan representaciones parecidas, la solución trivial es devolver siempre lo mismo: la pérdida es mínima y la representación, inútil. Los métodos lo evitan con negativos (aprendizaje contrastivo), con asimetrías entre redes (BYOL, DINO) o con términos que fuerzan la varianza y la decorrelación entre dimensiones (VICReg, Barlow Twins).","ej":"Durante el entrenamiento, la varianza de los embeddings cae a cero y todas las imágenes acaban en el mismo punto: señal de colapso.","rel":["aprendizaje-contrastivo","simclr-moco-byol-y-dino","aprendizaje-autosupervisado","colapso-de-modos"]},{"id":"evaluacion-de-representaciones","name":"Evaluación de representaciones (linear probing, k-NN)","en":"representation evaluation (linear probing, k-NN)","frase":"Medir la calidad de una representación por lo fácil que resulta resolver tareas con ella.","desc":"Como no hay una métrica directa, se congela el modelo y se evalúan sus representaciones en tareas etiquetadas. El linear probing entrena solo un clasificador lineal encima; el k-NN clasifica por los vecinos más cercanos sin entrenar nada; el ajuste fino con pocos ejemplos mide la capacidad de adaptación. Una buena representación da buenos resultados con clasificadores simples.","cuando":"Para comparar modelos preentrenados, o checkpoints de un entrenamiento autosupervisado.","ej":"Con las representaciones congeladas de dos modelos, un clasificador lineal logra un 78 % y un 71 % de acierto en ImageNet: el primero representa mejor.","py":[{"c":"sklearn.linear_model.LogisticRegression","u":"https://scikit-learn.org/stable/modules/generated/sklearn.linear_model.LogisticRegression.html"},{"c":"sklearn.neighbors.KNeighborsClassifier","u":"https://scikit-learn.org/stable/modules/generated/sklearn.neighbors.KNeighborsClassifier.html"}],"rel":["aprendizaje-autosupervisado","extractor-de-caracteristicas","knn","regresion-logistica"]}]},{"id":"transfer-learning","name":"Aprendizaje por transferencia (transfer learning)","en":"transfer learning","frase":"Reutilizar lo que un modelo aprendió en una tarea grande para resolver otra con menos datos.","desc":"Un modelo preentrenado con muchos datos ya ha aprendido rasgos generales, como bordes y formas en imágenes o gramática y significado en texto. En lugar de entrenar desde cero, se parte de él y se adapta a la tarea nueva, ya sea como extractor de características fijo o ajustando sus pesos (fine-tuning). Reduce drásticamente los datos y el cómputo necesarios, y es la forma habitual de trabajar hoy.","cuando":"Casi siempre que existe un modelo preentrenado en un dominio parecido y tus datos etiquetados son limitados.","ej":"Adaptar una red preentrenada con ImageNet para detectar plagas en fotos de hojas con 1.500 imágenes etiquetadas.","py":[{"c":"keras.applications.ResNet50","u":"https://keras.io/api/applications/resnet/resnet_models/#resnet50-function"},{"c":"timm.create_model","u":"https://huggingface.co/docs/timm/reference/models#timm.create_model"},{"c":"torchvision.models.resnet50","u":"https://docs.pytorch.org/vision/stable/models/generated/torchvision.models.resnet50.html"}],"rel":["extractor-de-caracteristicas","fine-tuning","modelos-fundacionales","adaptacion-de-dominio"],"children":[{"id":"extractor-de-caracteristicas","name":"Modelo preentrenado como extractor de características","en":"pretrained model as feature extractor","frase":"Usar un modelo preentrenado y congelado para convertir los datos en vectores y entrenar encima un modelo simple.","desc":"Se pasa cada dato por el modelo preentrenado sin su cabeza de clasificación y se guardan las activaciones de una capa final como vector de características. Sobre esos vectores se entrena un clasificador ligero, como una regresión logística o una capa densa. Es rápido, barato y robusto con muy pocos datos, aunque rinde menos que el ajuste fino si el dominio es muy distinto.","cuando":"Con muy pocos datos, poco cómputo o un dominio parecido al del preentrenamiento.","ej":"Extraer con una ResNet50 un vector de 2.048 dimensiones de cada foto de producto y entrenar una regresión logística que las clasifique en 30 categorías.","hp":[["include_top","si se mantiene la cabeza de clasificación original"],["pooling","cómo se resume el mapa final en un vector (media o máximo)"]],"py":[{"c":"keras.applications.ResNet50","u":"https://keras.io/api/applications/resnet/resnet_models/#resnet50-function"}],"rel":["transfer-learning","fine-tuning","embeddings","evaluacion-de-representaciones"]},{"id":"fine-tuning","name":"Ajuste fino (fine-tuning)","en":"fine-tuning","frase":"Continuar el entrenamiento de un modelo preentrenado con los datos de la tarea nueva.","desc":"Se sustituye la cabeza de salida por una adecuada a la tarea y se entrenan los pesos, todos o una parte, con un learning rate pequeño para no destruir lo aprendido. Suele dar el mejor rendimiento cuando hay datos suficientes, a costa de más cómputo y riesgo de sobreajuste y de olvido. En modelos grandes se recurre a métodos eficientes como LoRA, que solo entrenan una pequeña fracción de los parámetros.","cuando":"Cuando hay suficientes datos etiquetados (de cientos a miles) y el dominio difiere del de preentrenamiento.","ej":"Ajustar un modelo tipo BERT en español con 5.000 correos etiquetados para clasificarlos en 8 tipos de incidencia.","hp":[["learning_rate","tamaño de paso, mucho menor que al entrenar desde cero"],["num_train_epochs","pocas épocas suelen bastar"],["warmup_steps","pasos de calentamiento del learning rate"]],"py":[{"c":"transformers.Trainer","u":"https://huggingface.co/docs/transformers/main_classes/trainer#transformers.Trainer"},{"c":"transformers.TrainingArguments","u":"https://huggingface.co/docs/transformers/main_classes/trainer#transformers.TrainingArguments"}],"rel":["transfer-learning","congelar-y-descongelar-capas","peft","olvido-catastrofico","sft"]},{"id":"congelar-y-descongelar-capas","name":"Congelar y descongelar capas","en":"freezing & unfreezing layers","frase":"Decidir qué capas del modelo preentrenado se quedan fijas y cuáles se reentrenan.","desc":"Congelar una capa impide que sus pesos cambien. Lo habitual es congelar el modelo base, entrenar primero la cabeza nueva y después descongelar las capas superiores, más específicas, para ajustarlas con un learning rate bajo. Las capas inferiores capturan rasgos genéricos y se suelen mantener. Con batch normalization conviene mantener congeladas sus estadísticas.","cuando":"Al ajustar un modelo preentrenado con pocos datos, para no destruir lo aprendido al inicio del entrenamiento.","ej":"Entrenar durante 5 épocas solo la cabeza de una EfficientNet y después descongelar sus 20 últimas capas otras 10 épocas con un learning rate diez veces menor.","py":[{"c":"capa.trainable = False","s":1},{"c":"parametro.requires_grad = False","s":1}],"rel":["fine-tuning","learning-rates-discriminativos","transfer-learning","olvido-catastrofico"]},{"id":"learning-rates-discriminativos","name":"Learning rates discriminativos","en":"discriminative learning rates","frase":"Usar learning rates distintos por capa: pequeños en las capas genéricas y mayores en las nuevas.","desc":"Las capas inferiores de un modelo preentrenado contienen rasgos generales que conviene tocar poco, mientras que las superiores y la cabeza nueva necesitan adaptarse más. Asignar a cada grupo de capas su propio learning rate, creciente hacia la salida, ajusta el modelo sin destruir su conocimiento previo. Combina bien con descongelar las capas de forma gradual.","cuando":"Al ajustar modelos preentrenados de visión o de lenguaje cuando el ajuste uniforme sobreajusta u olvida.","ej":"Un learning rate de 10⁻⁵ en el cuerpo de un modelo de lenguaje y de 10⁻³ en su nueva cabeza de clasificación.","py":[{"c":"torch.optim.AdamW([{\"params\": cuerpo.parameters(), \"lr\": 1e-5}, {\"params\": cabeza.parameters(), \"lr\": 1e-3}])","s":1}],"rel":["fine-tuning","congelar-y-descongelar-capas","learning-rate","lr-schedulers"]},{"id":"adaptacion-de-dominio","name":"Adaptación de dominio","en":"domain adaptation","frase":"Hacer que un modelo entrenado con un tipo de datos funcione en otro distinto, a menudo sin etiquetas del nuevo.","desc":"Cuando los datos de uso (dominio destino) difieren de los de entrenamiento (dominio origen), el rendimiento cae aunque la tarea sea la misma. La adaptación de dominio reduce esa diferencia: alineando las representaciones de ambos dominios, por ejemplo con un discriminador que no debe poder distinguirlos (DANN), ajustando con los pocos datos etiquetados disponibles o autoetiquetando los datos del destino.","cuando":"Cuando el modelo debe funcionar con datos de otra fuente, sensor, hospital o época y allí hay pocas etiquetas.","ej":"Un detector de peatones entrenado con imágenes sintéticas de videojuegos se adapta a las fotos reales de cámaras de tráfico.","rel":["transfer-learning","deriva-de-datos","ood","datos-sinteticos"]},{"id":"olvido-catastrofico","name":"Olvido catastrófico","en":"catastrophic forgetting","frase":"Al aprender una tarea nueva, la red pierde lo que sabía hacer en las anteriores.","desc":"Ajustar todos los pesos para una tarea nueva sobrescribe los que eran importantes para las anteriores, y el rendimiento en estas se desploma. Se mitiga con learning rates bajos y pocas épocas, mezclando datos antiguos con los nuevos (repetición), penalizando los cambios en los pesos importantes (EWC) o entrenando solo parámetros añadidos (adaptadores, LoRA). Es el principal obstáculo del aprendizaje continuo.","ej":"Tras ajustar un LLM solo con textos médicos, empeora en conversación general y en programación.","rel":["fine-tuning","peft","aprendizaje-online","congelar-y-descongelar-capas"]},{"id":"destilacion-de-conocimiento","name":"Destilación de conocimiento","en":"knowledge distillation","frase":"Entrenar un modelo pequeño (alumno) para que imite las salidas de uno grande (profesor).","desc":"El alumno aprende a reproducir las probabilidades que da el profesor, no solo las etiquetas. Esas probabilidades, suavizadas con una temperatura, contienen información rica, como qué clases se parecen entre sí. La pérdida combina la divergencia KL con el profesor y la entropía cruzada con las etiquetas reales. Así se obtienen modelos mucho más pequeños y rápidos que conservan buena parte del rendimiento.","cuando":"Para desplegar un modelo grande en móviles o con poca latencia, o para abaratar la inferencia.","ej":"DistilBERT conserva alrededor del 97 % de la capacidad de comprensión de BERT con un 40 % menos de parámetros y un 60 % más de velocidad.","py":[{"c":"torch.nn.KLDivLoss","u":"https://docs.pytorch.org/docs/stable/generated/torch.nn.KLDivLoss.html"},{"c":"keras.losses.KLDivergence","u":"https://keras.io/api/losses/probabilistic_losses/#kldivergence-class"}],"rel":["divergencia-de-kullback-leibler","despliegue-e-inferencia","cuantizacion","destilacion-de-difusion"]}]},{"id":"modelos-fundacionales","name":"Modelos fundacionales","en":"foundation models","frase":"Modelos enormes, preentrenados con datos masivos, que sirven de base para muchas tareas distintas.","desc":"Se entrenan una vez, con enormes cantidades de datos generalmente sin etiquetar, y después se adaptan a multitud de tareas mediante instrucciones, ejemplos o ajuste fino. Incluyen los LLM, los modelos de visión como DINOv2 o SAM, los multimodales como CLIP y los de series temporales. Han cambiado la forma de trabajar: hoy casi siempre se parte de uno de ellos.","ej":"El mismo LLM resume contratos, escribe código y clasifica correos sin haberse entrenado específicamente para ninguna de esas tareas.","py":[{"c":"transformers.AutoModel","u":"https://huggingface.co/docs/transformers/model_doc/auto#transformers.AutoModel"}],"rel":["que-es-un-modelo-fundacional","leyes-de-escalado","llm","transfer-learning"],"children":[{"id":"que-es-un-modelo-fundacional","name":"Qué es un modelo fundacional","en":"what is a foundation model","frase":"Un modelo general, entrenado a gran escala, que se convierte en la base sobre la que se construyen aplicaciones.","desc":"El término, acuñado en 2021, destaca tres rasgos: escala (miles de millones de parámetros y de datos), generalidad (sirve para tareas para las que no se entrenó explícitamente) y homogeneización (muchas aplicaciones dependen de unos pocos modelos base, lo que también concentra sus defectos y sesgos). Suelen mostrar capacidades emergentes, como aprender de los ejemplos incluidos en la instrucción.","ej":"Una empresa construye su asistente interno, su clasificador de incidencias y su buscador sobre el mismo modelo base de un proveedor.","rel":["modelos-fundacionales","leyes-de-escalado","in-context-learning","sesgo-algoritmico-y-atributos-sensibles"]},{"id":"leyes-de-escalado","name":"Leyes de escalado (scaling laws)","en":"scaling laws","frase":"Relaciones predecibles entre el error de un modelo y su tamaño, sus datos y su cómputo.","desc":"Empíricamente, la pérdida de los modelos de lenguaje disminuye como una ley de potencias al aumentar los parámetros, los datos o el cómputo, de forma muy regular a lo largo de muchos órdenes de magnitud. Esto permite predecir el resultado de un entrenamiento caro a partir de otros pequeños y repartir el presupuesto: el trabajo Chinchilla mostró que, para un cómputo dado, conviene escalar parámetros y datos en proporción, con unos 20 tokens por parámetro.","ej":"Con el mismo cómputo, un modelo de 70.000 millones de parámetros entrenado con 1,4 billones de tokens superó a otro de 280.000 millones entrenado con muchos menos datos.","rel":["modelos-fundacionales","llm","preentrenamiento-de-llms","gpu-y-tpu"]}]}]},{"id":"ia-generativa","name":"IA generativa","en":"generative AI","frase":"Modelos que aprenden cómo son los datos para crear ejemplos nuevos y realistas.","desc":"Modelos que aprenden la distribución de los datos para generar ejemplos nuevos y realistas: imágenes, texto, audio o datos sintéticos. Las grandes familias son los modelos autorregresivos, los VAE, las GAN, los flujos normalizantes y los modelos de difusión. Cada una resuelve a su manera cómo modelar y muestrear una distribución de muy alta dimensión.","cuando":"Cuando necesitas crear contenido nuevo (imágenes, texto, audio) o datos sintéticos realistas.","ej":"Stable Diffusion genera una imagen a partir de una frase: parte de ruido aleatorio y lo va eliminando paso a paso.","rel":["modelo-generativo-vs-discriminativo","modelos-de-difusion","gan","vae"],"children":[{"id":"modelo-generativo-vs-discriminativo","name":"Modelo generativo vs discriminativo","en":"generative vs discriminative models","frase":"Un modelo discriminativo aprende a separar las clases; uno generativo, cómo se generan los datos.","desc":"Un modelo discriminativo estima directamente P(y|x), la frontera entre clases, como hace la regresión logística. Uno generativo modela la distribución de los datos, P(x) o P(x|y), y por eso puede crear ejemplos nuevos, estimar lo probable que es un dato o clasificar aplicando Bayes, como Naive Bayes. Los discriminativos suelen clasificar mejor con muchos datos; los generativos permiten crear contenido y detectar lo inusual.","ej":"Un modelo discriminativo distingue fotos de perros y de gatos; uno generativo puede además pintar un perro que no existe.","py":[{"c":"sklearn.naive_bayes.GaussianNB","u":"https://scikit-learn.org/stable/modules/generated/sklearn.naive_bayes.GaussianNB.html"},{"c":"sklearn.linear_model.LogisticRegression","u":"https://scikit-learn.org/stable/modules/generated/sklearn.linear_model.LogisticRegression.html"}],"rel":["teorema-de-bayes","densidad-explicita-vs-implicita","estimacion-de-densidad","regresion-logistica"]},{"id":"densidad-explicita-vs-implicita","name":"Densidad explícita vs implícita","en":"explicit vs implicit density","frase":"Algunos modelos generativos dan la probabilidad de cada dato; otros solo saben generar muestras.","desc":"Los modelos de densidad explícita permiten calcular, de forma exacta o aproximada, la probabilidad de un dato: los autorregresivos y los flujos, de forma exacta; los VAE y la difusión, mediante cotas. Los de densidad implícita, como las GAN, solo aprenden a muestrear: generan ejemplos realistas, pero no dicen lo probable que es un dato concreto. Tener la densidad sirve para comparar modelos, detectar anomalías y comprimir.","ej":"Un flujo normalizante puede indicar que una imagen es muy improbable y marcarla como anómala; una GAN no puede hacerlo.","rel":["modelo-generativo-vs-discriminativo","normalizing-flows","gan","verosimilitud-vs-calidad-de-muestras"]},{"id":"muestreo-por-transformada-inversa","name":"Muestreo por transformada inversa","en":"inverse transform sampling","frase":"Generar muestras de cualquier distribución transformando números uniformes con la inversa de su función de distribución.","desc":"Si U es uniforme entre 0 y 1 y F es la función de distribución acumulada de la variable que se quiere simular, F⁻¹(U) sigue exactamente esa distribución. Es el método más básico para generar números aleatorios no uniformes y la idea de fondo de muchos modelos generativos: transformar ruido simple en datos complejos mediante una función, que en esos modelos se aprende.","cuando":"Para simular variables cuya función de distribución se puede invertir, como la exponencial o una distribución empírica.","ej":"Para simular tiempos entre llegadas exponenciales con una media de 2 minutos, se calcula −2·ln(1 − U) con U uniforme.","py":[{"c":"scipy.stats.rv_continuous.ppf","u":"https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.rv_continuous.ppf.html"},{"c":"numpy.random.Generator.uniform","u":"https://numpy.org/doc/stable/reference/random/generated/numpy.random.Generator.uniform.html"}],"rel":["distribuciones-de-probabilidad","normalizing-flows","cambio-de-variable-y-jacobiano","transformaciones-de-distribucion"]},{"id":"modelos-autorregresivos","name":"Modelos autorregresivos","en":"autoregressive models","frase":"Generan los datos elemento a elemento, prediciendo cada uno a partir de los anteriores.","desc":"Descomponen la probabilidad de una secuencia en un producto de probabilidades condicionadas y aprenden a predecir el siguiente elemento. Para generar, muestrean un elemento, lo añaden a la entrada y repiten. Dan la verosimilitud exacta y son la base de los LLM, aunque la generación es lenta porque no se puede paralelizar y los errores pueden acumularse.","cuando":"Para generar secuencias (texto, audio, código) o modelar datos con un orden natural.","ej":"Un LLM escribe su respuesta token a token, eligiendo cada uno en función de los anteriores.","py":[{"c":"transformers.AutoModelForCausalLM","u":"https://huggingface.co/docs/transformers/model_doc/auto#transformers.AutoModelForCausalLM"}],"rel":["regla-de-la-cadena-probabilidad","gpt","prediccion-autorregresiva","perplejidad"],"children":[{"id":"regla-de-la-cadena-probabilidad","name":"Factorización por regla de la cadena","en":"chain rule of probability","frase":"Toda distribución conjunta se puede escribir como un producto de condicionales: P(x₁,…,xₙ) = ∏ P(xᵢ | x₁,…,xᵢ₋₁).","desc":"Es una identidad exacta de la teoría de la probabilidad, no una aproximación. Convierte el problema, inabordable, de modelar directamente la distribución de secuencias enteras en una serie de problemas de clasificación: predecir el siguiente elemento dados los anteriores. Los modelos autorregresivos aprenden precisamente esas condicionales con una red compartida.","ej":"P(\"el gato duerme\") = P(\"el\") · P(\"gato\" | \"el\") · P(\"duerme\" | \"el gato\").","rel":["modelos-autorregresivos","probabilidad-condicional","clm","perplejidad"]},{"id":"generacion-con-rnn","name":"Generación con RNN","en":"RNN-based generation","frase":"Usar una red recurrente para generar texto, música o señales paso a paso, alimentándola con su propia salida.","desc":"La RNN se entrena para predecir el siguiente elemento de una secuencia. Para generar, se le da un comienzo, se muestrea el siguiente elemento de su distribución de salida, se añade a la entrada y se repite. La temperatura controla el equilibrio entre seguridad y creatividad. Fue el enfoque estándar de generación de texto antes de los transformers.","cuando":"Para generar secuencias con modelos pequeños o en dispositivos con pocos recursos.","ej":"Una LSTM entrenada carácter a carácter con obras de teatro genera diálogos con nombres de personajes y formato teatral convincentes.","py":[{"c":"keras.layers.LSTM","u":"https://keras.io/api/layers/recurrent_layers/lstm/"},{"c":"np.random.choice(len(probs), p=probs)","s":1}],"rel":["rnn","lstm","modelos-autorregresivos","decodificacion-y-temperatura"]},{"id":"pixelcnn","name":"PixelCNN","en":"PixelCNN","frase":"Modelo autorregresivo que genera imágenes píxel a píxel con convoluciones enmascaradas.","desc":"Ordena los píxeles de izquierda a derecha y de arriba abajo y predice la distribución de cada uno a partir de los anteriores. Para respetar ese orden usa convoluciones enmascaradas, que no ven los píxeles futuros y permiten entrenar en paralelo. Da verosimilitudes exactas y fue un referente en estimación de densidad de imágenes, pero genera muy despacio, píxel a píxel. Su idea reaparece como componente de otros modelos, como el VQ-VAE.","ej":"Completar la mitad inferior de la foto de una cara a partir de la mitad superior, píxel a píxel.","rel":["modelos-autorregresivos","convolucion","mascara-causal","verosimilitud-vs-calidad-de-muestras"]},{"id":"perplejidad","name":"Perplejidad","en":"perplexity","frase":"Entre cuántas opciones equiprobables duda, de media, un modelo de lenguaje en cada paso: cuanto menor, mejor.","desc":"Es la exponencial de la entropía cruzada media por token sobre un texto de prueba. Una perplejidad de 20 significa que el modelo está tan inseguro como si eligiera entre 20 opciones igual de probables en cada paso. Sirve para comparar modelos de lenguaje con el mismo tokenizador, pero no mide directamente la utilidad ni la veracidad de lo que generan.","ej":"Si la pérdida media de validación es de 2,3 nats por token, la perplejidad es e^2,3 ≈ 10.","py":[{"c":"math.exp(perdida_media)","s":1}],"rel":["entropia-cruzada","nll","modelos-autorregresivos","evaluacion-de-llms"]}]},{"id":"vae","name":"Autoencoder variacional (VAE)","en":"variational autoencoder (VAE)","frase":"Autoencoder probabilístico cuyo espacio latente está organizado para poder generar datos nuevos muestreando en él.","desc":"El codificador no produce un punto, sino una distribución gaussiana (media y varianza) sobre el espacio latente, y el decodificador reconstruye a partir de una muestra de ella. La pérdida combina el error de reconstrucción con una divergencia KL que acerca esas distribuciones a una normal estándar. Así el espacio latente queda continuo y bien rellenado, y basta con muestrear ruido normal y decodificarlo para generar datos nuevos. Sus muestras suelen ser algo borrosas.","cuando":"Para generar datos con un espacio latente continuo e interpretable, o como compresor dentro de otros generativos, como la difusión latente.","ej":"Un VAE entrenado con moléculas propone candidatos a fármaco moviéndose por el espacio latente hacia regiones con la propiedad deseada.","py":[{"c":"torch.distributions.Normal","u":"https://docs.pytorch.org/docs/stable/distributions.html#torch.distributions.normal.Normal"},{"c":"torch.distributions.kl_divergence","u":"https://docs.pytorch.org/docs/stable/distributions.html#torch.distributions.kl.kl_divergence"}],"rel":["elbo","truco-de-reparametrizacion","autoencoders","espacio-latente","stable-diffusion"],"children":[{"id":"elbo","name":"ELBO","en":"ELBO (evidence lower bound)","frase":"La cota inferior de la verosimilitud que se maximiza al entrenar un VAE: reconstruir bien sin alejarse del prior.","desc":"La verosimilitud de un modelo con variables latentes no se puede calcular directamente. El ELBO (evidence lower bound) es una cota inferior manejable: la reconstrucción esperada menos la divergencia KL entre la distribución que da el codificador y el prior. Maximizarlo equilibra la fidelidad de la reconstrucción y la regularidad del espacio latente; dar más peso al término KL (β-VAE) favorece latentes más separables.","ej":"Si se elimina el término KL, el VAE se convierte en un autoencoder normal y muestrear del prior deja de generar datos válidos.","py":[{"c":"torch.distributions.kl_divergence","u":"https://docs.pytorch.org/docs/stable/distributions.html#torch.distributions.kl.kl_divergence"}],"rel":["vae","divergencia-de-kullback-leibler","maxima-verosimilitud","truco-de-reparametrizacion"]},{"id":"truco-de-reparametrizacion","name":"Truco de reparametrización","en":"reparameterization trick","frase":"Escribir la muestra aleatoria como media más desviación por ruido para poder retropropagar a través de ella.","desc":"Muestrear z de una normal con media μ y desviación σ es una operación aleatoria que no deja pasar el gradiente. El truco la reescribe como z = μ + σ·ε, con ε una normal estándar independiente de los parámetros: el azar queda fuera de la red y el gradiente fluye hacia μ y σ. Es lo que permite entrenar un VAE con descenso por gradiente.","ej":"En lugar de \"muestrear z\", el codificador produce μ y σ, se genera ε aparte y se calcula μ + σ·ε como un cálculo determinista más.","py":[{"c":"torch.distributions.Normal.rsample","u":"https://docs.pytorch.org/docs/stable/distributions.html#torch.distributions.normal.Normal.rsample"}],"rel":["vae","elbo","backpropagation"]}]},{"id":"gan","name":"Redes generativas adversarias (GAN)","en":"generative adversarial networks (GAN)","frase":"Dos redes que compiten: un generador que crea datos falsos y un discriminador que intenta detectarlos.","desc":"El generador transforma ruido aleatorio en datos y el discriminador clasifica cada muestra como real o generada. Se entrenan por turnos: el discriminador mejora detectando falsificaciones y el generador mejora engañándolo, hasta que sus muestras son indistinguibles de las reales. Producen imágenes muy nítidas, pero su entrenamiento es inestable y propenso al colapso de modos; la difusión las ha superado en la mayoría de tareas.","cuando":"Para generar imágenes realistas en un solo paso, muy rápido, o para traducir imágenes entre dominios.","ej":"Generar caras de personas que no existen, indistinguibles de fotos reales a simple vista.","rel":["generador-y-discriminador","colapso-de-modos","dcgan","densidad-explicita-vs-implicita","modelos-de-difusion"],"children":[{"id":"generador-y-discriminador","name":"Generador y discriminador (juego minimax)","en":"generator & discriminator (minimax game)","frase":"El falsificador y el detective: un juego minimax en el que cada red mejora a costa de la otra.","desc":"El discriminador D maximiza la probabilidad de acertar si una muestra es real o falsa; el generador G minimiza esa misma cantidad, es decir, intenta que D se equivoque. En el equilibrio teórico, G reproduce la distribución de los datos y D no puede hacer nada mejor que responder 0,5. En la práctica, G suele entrenarse con una variante no saturante, maximizar log D(G(z)), porque da gradientes útiles cuando D todavía gana con facilidad.","ej":"Al principio, D distingue sin esfuerzo el ruido de las fotos; poco a poco, G aprende bordes, texturas y, finalmente, caras completas.","rel":["gan","colapso-de-modos","wasserstein-gan","entropia-cruzada"]},{"id":"colapso-de-modos","name":"Colapso de modos (mode collapse)","en":"mode collapse","frase":"El generador produce solo unos pocos tipos de muestras y deja sin cubrir el resto de la variedad de los datos.","desc":"Si el generador encuentra una salida que engaña al discriminador, puede limitarse a variaciones de ella e ignorar el resto de la distribución: las muestras son realistas, pero poco diversas. Es el fallo típico de las GAN. Lo mitigan pérdidas como la de Wasserstein, la discriminación por minilotes, el entrenamiento progresivo y la regularización del discriminador.","ej":"Una GAN de dígitos que genera unos y sietes perfectos, pero nunca un ocho.","rel":["gan","mode-drop-y-cobertura","wasserstein-gan","colapso-de-la-representacion"]},{"id":"dcgan","name":"DCGAN","en":"DCGAN","frase":"La primera receta estable de GAN convolucional, que sentó las bases de las GAN de imágenes.","desc":"La Deep Convolutional GAN (2015) fijó pautas de arquitectura que hicieron las GAN mucho más estables: convoluciones con stride en lugar de pooling, convoluciones transpuestas en el generador, batch normalization, ReLU en el generador, Leaky ReLU en el discriminador y ninguna capa densa oculta. Mostró además que su espacio latente tiene estructura aritmética.","cuando":"Como punto de partida para generar imágenes pequeñas o para aprender cómo se construye una GAN.","ej":"Una DCGAN entrenada con fotos de dormitorios genera dormitorios nuevos de 64 × 64 píxeles.","py":[{"c":"keras.layers.Conv2DTranspose","u":"https://keras.io/api/layers/convolution_layers/convolution2d_transpose/"},{"c":"keras.layers.LeakyReLU","u":"https://keras.io/api/layers/activation_layers/leaky_relu/"},{"c":"keras.layers.BatchNormalization","u":"https://keras.io/api/layers/normalization_layers/batch_normalization/"}],"rel":["gan","convolucion-transpuesta","capas-de-normalizacion","aritmetica-de-embeddings"]},{"id":"wasserstein-gan","name":"Wasserstein GAN (WGAN)","en":"Wasserstein GAN (WGAN)","frase":"GAN que mide la distancia entre distribuciones con la distancia de Wasserstein: más estable de entrenar.","desc":"Sustituye la clasificación entre real y falso por una estimación de la distancia de Wasserstein, o del transportista: cuánta masa de probabilidad hay que mover, y a qué distancia, para convertir la distribución generada en la real. El discriminador, llamado crítico, da una puntuación sin sigmoide y debe ser 1-Lipschitz, lo que se impone recortando sus pesos o, mejor, con una penalización del gradiente (WGAN-GP). Da gradientes útiles aunque las distribuciones no se solapen, y su pérdida acompaña a la calidad de las muestras.","cuando":"Cuando una GAN estándar es inestable o sufre colapso de modos.","ej":"Al pasar a WGAN-GP, una GAN que oscilaba sin converger entrena de forma estable y la pérdida del crítico baja a medida que mejoran las imágenes.","py":[{"c":"torch.autograd.grad","u":"https://docs.pytorch.org/docs/stable/generated/torch.autograd.grad.html"}],"rel":["gan","colapso-de-modos","generador-y-discriminador","divergencia-de-kullback-leibler"]},{"id":"otras-variantes-de-gan","name":"Otras variantes de GAN","en":"other GAN variants (ProGAN, StyleGAN, BigGAN)","frase":"Las mejoras que llevaron a las GAN a la alta resolución y al fotorrealismo.","desc":"ProGAN entrena aumentando la resolución poco a poco. StyleGAN inyecta el código latente como un estilo en cada capa, lo que controla por separado rasgos gruesos (la pose) y finos (pecas, pelo), y genera caras fotorrealistas. BigGAN escala el tamaño del modelo y del lote para generar por clases. SAGAN añade autoatención, y LSGAN usa una pérdida cuadrática más estable.","ej":"StyleGAN genera retratos de 1024 × 1024 indistinguibles de fotos y permite combinar la pose de una cara con la textura de otra.","rel":["gan","dcgan","wasserstein-gan","gan-condicional"]},{"id":"gan-condicional","name":"GAN condicional (cGAN)","en":"conditional GAN (cGAN)","frase":"GAN que genera según una condición dada, como una clase, un texto o una imagen.","desc":"Tanto el generador como el discriminador reciben la condición, por ejemplo una etiqueta convertida en embedding o una imagen de entrada. El generador aprende a producir muestras coherentes con ella y el discriminador, a rechazar las que no lo son. Así se controla qué se genera: un dígito concreto, una clase de objeto o la traducción de una imagen.","cuando":"Cuando se quiere controlar lo que se genera, en lugar de obtener muestras al azar.","ej":"Pedir a una GAN condicional entrenada con dígitos que genere cien variantes distintas del número 7.","rel":["gan","pix2pix","guia-difusion","capa-de-embedding"]},{"id":"pix2pix","name":"Pix2Pix","en":"Pix2Pix","frase":"GAN condicional que traduce una imagen en otra aprendiendo de pares de ejemplos alineados.","desc":"Aprende la correspondencia entre dos dominios a partir de pares de imágenes. El generador es una U-Net y el discriminador, un PatchGAN que juzga si cada parche de la imagen es realista. La pérdida combina el término adversario con un término L1 que mantiene la salida cerca de la imagen objetivo. Sirve para cualquier traducción de la que haya pares disponibles.","cuando":"Para traducir imágenes de un dominio a otro cuando se dispone de pares alineados.","ej":"Convertir bocetos de bolsos en fotos realistas, o mapas en vistas aéreas.","rel":["gan-condicional","cyclegan","u-net","superresolucion-inpainting-y-colorizacion"]},{"id":"cyclegan","name":"CycleGAN","en":"CycleGAN","frase":"Traduce imágenes entre dos dominios sin necesitar pares, exigiendo que la ida y la vuelta devuelvan la original.","desc":"Entrena dos generadores, de A a B y de B a A, cada uno con su discriminador. Como no hay pares, añade una pérdida de consistencia cíclica: traducir una imagen a B y devolverla a A debe recuperar la original, lo que impide que el generador invente contenido sin relación con la entrada. Permite traducir estilos con dos colecciones de fotos sin correspondencia.","cuando":"Para traducir entre dominios de imagen cuando no hay pares alineados.","ej":"Convertir fotos de caballos en cebras, o paisajes de verano en paisajes nevados.","rel":["pix2pix","gan","transferencia-de-estilo-neuronal","adaptacion-de-dominio"]},{"id":"srgan","name":"SRGAN","en":"SRGAN","frase":"GAN para superresolución que recupera texturas realistas en lugar de imágenes borrosas.","desc":"Las redes de superresolución entrenadas con error cuadrático producen resultados suaves y borrosos, porque promedian todas las texturas posibles. SRGAN combina una pérdida perceptual, calculada con las características de una red VGG, con una pérdida adversaria que empuja hacia imágenes naturales. Sus sucesoras, como ESRGAN, mejoraron la nitidez y redujeron los artefactos.","cuando":"Para ampliar imágenes cuando importa la apariencia realista más que la fidelidad exacta píxel a píxel.","ej":"Ampliar cuatro veces fotos antiguas de baja resolución y obtener texturas creíbles de piel y de tela.","rel":["superresolucion-inpainting-y-colorizacion","perdidas-perceptuales","gan","psnr-y-ssim"]}]},{"id":"normalizing-flows","name":"Flujos normalizantes (normalizing flows)","en":"normalizing flows","frase":"Transforman una distribución simple en otra compleja con una cadena de funciones invertibles, y dan la densidad exacta.","desc":"Parten de una distribución sencilla, normalmente una gaussiana, y le aplican una secuencia de transformaciones invertibles y diferenciables aprendidas. Gracias a la fórmula del cambio de variable, la densidad de cualquier dato se calcula exactamente, y para generar basta con muestrear la gaussiana y aplicar la cadena. La exigencia de invertibilidad limita las arquitecturas y suele dar muestras de menor calidad que la difusión.","cuando":"Cuando se necesita la densidad exacta además de generar: detección de anomalías, inferencia bayesiana o modelado de variables físicas.","ej":"Un flujo entrenado con los datos de un detector de partículas calcula lo probable que es cada colisión y genera colisiones simuladas.","py":[{"c":"nflows.flows.base.Flow","u":"https://github.com/bayesiains/nflows"},{"c":"torch.distributions.TransformedDistribution","u":"https://docs.pytorch.org/docs/stable/distributions.html#torch.distributions.transformed_distribution.TransformedDistribution"}],"rel":["cambio-de-variable-y-jacobiano","flujos-autorregresivos-y-de-acoplamiento","rbig","densidad-explicita-vs-implicita"],"children":[{"id":"cambio-de-variable-y-jacobiano","name":"Cambio de variable y jacobiano","en":"change of variables & Jacobian","frase":"La fórmula que dice cómo cambia una densidad al transformar sus variables: se corrige con el determinante del jacobiano.","desc":"Si x = f(z) con f invertible, la densidad de x es la de z en f⁻¹(x) multiplicada por el valor absoluto del determinante del jacobiano de f⁻¹. Ese determinante mide cuánto estira o comprime la transformación el volumen alrededor de cada punto. Los flujos se diseñan para que sea barato de calcular, por ejemplo con jacobianos triangulares.","ej":"Si se multiplican por 2 todos los valores de una variable, su probabilidad se reparte en el doble de espacio y la densidad se divide por 2.","py":[{"c":"torch.autograd.functional.jacobian","u":"https://docs.pytorch.org/docs/stable/generated/torch.autograd.functional.jacobian.html"},{"c":"torch.distributions.TransformedDistribution","u":"https://docs.pytorch.org/docs/stable/distributions.html#torch.distributions.transformed_distribution.TransformedDistribution"}],"rel":["normalizing-flows","muestreo-por-transformada-inversa","flujos-autorregresivos-y-de-acoplamiento"]},{"id":"flujos-autorregresivos-y-de-acoplamiento","name":"Flujos autorregresivos y de acoplamiento (MAF, RealNVP, Glow)","en":"autoregressive & coupling flows (MAF, RealNVP, Glow)","frase":"Transformaciones invertibles con jacobiano triangular, cuyo determinante es barato: MAF, RealNVP y Glow.","desc":"En una capa de acoplamiento (RealNVP, Glow), la mitad de las variables pasa sin cambios y determina una transformación afín de la otra mitad: invertirla es inmediato y el determinante es el producto de las escalas. En los flujos autorregresivos (MAF), cada variable se transforma en función de las anteriores, lo que da más flexibilidad pero hace lento uno de los dos sentidos. Glow añade convoluciones de 1 × 1 invertibles para mezclar los canales.","cuando":"Para construir flujos normalizantes expresivos sobre datos de alta dimensión.","ej":"Glow genera caras de alta resolución y permite modificar atributos como la sonrisa moviéndose por su espacio latente.","hp":[["hidden_features","tamaño de las redes que calculan cada transformación"],["num_blocks","número de bloques de cada red interna"]],"py":[{"c":"nflows.transforms.autoregressive.MaskedAffineAutoregressiveTransform","u":"https://github.com/bayesiains/nflows"},{"c":"nflows.transforms.coupling.AffineCouplingTransform","u":"https://github.com/bayesiains/nflows"}],"rel":["normalizing-flows","cambio-de-variable-y-jacobiano","modelos-autorregresivos","descuantizacion"]},{"id":"descuantizacion","name":"Descuantización","en":"dequantization","frase":"Añadir ruido a datos discretos, como píxeles enteros, para poder modelarlos con densidades continuas.","desc":"Los píxeles toman valores enteros de 0 a 255, y un modelo de densidad continua podría asignarles una densidad infinita concentrando toda la probabilidad en esos puntos. Para evitarlo se suma a cada valor un ruido uniforme en [0, 1), de modo que la densidad continua aprendida da una cota inferior válida de la verosimilitud discreta. La descuantización variacional aprende un ruido más ajustado y mejora la cota.","cuando":"Al entrenar flujos u otros modelos de densidad continua con datos discretos, como imágenes o audio cuantizado.","ej":"Un píxel de valor 128 pasa a ser un número entre 128 y 129 antes de entrenar el flujo.","py":[{"c":"x = (x + torch.rand_like(x)) / 256","s":1}],"rel":["normalizing-flows","flujos-autorregresivos-y-de-acoplamiento","verosimilitud-vs-calidad-de-muestras"]},{"id":"rbig","name":"Gaussianización (RBIG)","en":"rotation-based iterative Gaussianization (RBIG)","frase":"Gaussianizar datos aplicando repetidamente una gaussianización por variable seguida de una rotación.","desc":"La gaussianización iterativa basada en rotaciones (RBIG) transforma cada variable por separado en una gaussiana y después rota los datos, por ejemplo con PCA, para mezclarlas; repite hasta que el conjunto es una gaussiana multivariante. Es un flujo normalizante que no se entrena por gradiente: da la densidad de los datos y permite estimar medidas de información, como la correlación total o la información mutua, en muchas dimensiones.","cuando":"Para estimar densidades y medidas de información (entropía, correlación total, información mutua) en datos multivariantes.","ej":"Medir cuánta información comparten las variables climáticas de distintas regiones del planeta gaussianizándolas con RBIG.","rel":["normalizing-flows","correlacion-total","informacion-mutua","pca"]},{"id":"flow-matching","name":"Flow Matching","en":"flow matching","frase":"Entrenar un campo de velocidades que transporta el ruido hasta los datos por trayectorias simples.","desc":"En lugar de una cadena de transformaciones discretas, aprende un campo vectorial que, integrado como una ecuación diferencial, lleva muestras de ruido hasta los datos. Se entrena con una simple regresión: en puntos intermedios entre una muestra de ruido y un dato, la red debe predecir la velocidad de la trayectoria que los une. Generaliza la difusión, es estable y sencillo de entrenar, y lo usan modelos de imagen recientes como Stable Diffusion 3 y Flux.","cuando":"Para entrenar generativos de imagen, audio o moléculas con la calidad de la difusión y trayectorias de muestreo más rectas.","ej":"Un modelo de texto a imagen basado en flow matching genera una imagen de calidad con unas 30 integraciones del campo de velocidades.","py":[{"c":"diffusers.FlowMatchEulerDiscreteScheduler","u":"https://huggingface.co/docs/diffusers/api/schedulers/flow_match_euler_discrete#diffusers.FlowMatchEulerDiscreteScheduler"}],"rel":["rectified-flow","modelos-de-difusion","normalizing-flows","stable-diffusion"]},{"id":"rectified-flow","name":"Rectified Flow (ReFlow)","en":"rectified flow (ReFlow)","frase":"Variante de flow matching con trayectorias rectas, que pueden enderezarse aún más para generar en muy pocos pasos.","desc":"Usa como trayectoria la línea recta entre cada muestra de ruido y cada dato, recorrida a velocidad constante. El reflujo (ReFlow) reentrena el modelo con los pares de ruido e imagen que él mismo genera, lo que hace las trayectorias todavía más rectas, de modo que bastan pocos pasos de integración, o incluso uno, para generar. Es la base de modelos como Stable Diffusion 3.","cuando":"Cuando se busca generar con calidad en muy pocos pasos de muestreo.","ej":"Tras varias rondas de reflujo, un modelo de imagen pasa de necesitar 50 pasos a generar en 1 o 2.","py":[{"c":"diffusers.StableDiffusion3Pipeline","u":"https://huggingface.co/docs/diffusers/api/pipelines/stable_diffusion/stable_diffusion_3#diffusers.StableDiffusion3Pipeline"},{"c":"diffusers.FlowMatchEulerDiscreteScheduler","u":"https://huggingface.co/docs/diffusers/api/schedulers/flow_match_euler_discrete#diffusers.FlowMatchEulerDiscreteScheduler"}],"rel":["flow-matching","destilacion-de-difusion","modelos-de-difusion"]}]},{"id":"modelos-de-difusion","name":"Modelos de difusión","en":"diffusion models","frase":"Aprenden a eliminar ruido paso a paso: generan partiendo de ruido puro y limpiándolo gradualmente.","desc":"Durante el entrenamiento se corrompen los datos con ruido creciente y una red aprende a predecir y eliminar ese ruido en cualquier nivel. Para generar, se parte de ruido gaussiano y se aplica la red repetidamente hasta obtener una muestra limpia. Son estables de entrenar, cubren bien la diversidad de los datos y logran la mejor calidad en imagen, vídeo y audio, a costa de un muestreo de muchos pasos.","cuando":"Para generar o editar imágenes, vídeo o audio de alta calidad, con condiciones como un texto o una imagen de referencia.","ej":"Generar una ilustración a partir de la descripción \"un faro en un acantilado al atardecer, estilo acuarela\".","py":[{"c":"diffusers.DiffusionPipeline","u":"https://huggingface.co/docs/diffusers/api/pipelines/overview#diffusers.DiffusionPipeline"},{"c":"diffusers.UNet2DModel","u":"https://huggingface.co/docs/diffusers/api/models/unet2d#diffusers.UNet2DModel"}],"rel":["proceso-directo-e-inverso","ddpm","stable-diffusion","el-denoiser-como-prior-implicito","gan"],"children":[{"id":"proceso-directo-e-inverso","name":"Proceso directo e inverso","en":"forward & reverse diffusion processes","frase":"El directo añade ruido a los datos hasta destruirlos; el inverso, aprendido, recorre el camino de vuelta.","desc":"El proceso directo es fijo: en cada paso añade un poco de ruido gaussiano, de modo que tras muchos pasos solo queda ruido puro, y permite saltar directamente a cualquier nivel de ruido. El proceso inverso es el que se aprende: en cada paso, una red estima el ruido presente o la imagen limpia, y con esa estimación se avanza hacia datos menos ruidosos.","ej":"La foto de un gato pasa por 1.000 pasos de ruido hasta convertirse en estática; el modelo aprende a deshacer cada uno de esos pasos.","py":[{"c":"diffusers.DDPMScheduler","u":"https://huggingface.co/docs/diffusers/api/schedulers/ddpm#diffusers.DDPMScheduler"}],"rel":["modelos-de-difusion","ddpm","planificacion-del-ruido","autoencoder-denoising"]},{"id":"el-denoiser-como-prior-implicito","name":"El denoiser como prior implícito","en":"the denoiser as an implicit prior","frase":"Un buen eliminador de ruido contiene, de forma implícita, todo lo que sabe sobre cómo son las imágenes.","desc":"Para eliminar ruido de forma óptima hay que saber qué imágenes son probables. De hecho, el residuo de un eliminador de ruido óptimo es proporcional al gradiente del logaritmo de la densidad de las imágenes ruidosas, la llamada puntuación (score). Por eso un mismo eliminador de ruido, entrenado una sola vez, sirve para generar imágenes y para resolver problemas inversos, como quitar desenfoque, rellenar huecos o aumentar la resolución, sin reentrenar para cada tarea.","ej":"Un eliminador de ruido entrenado solo para quitar ruido gaussiano reconstruye una foto a partir del 10 % de sus píxeles, guiado por los valores conocidos.","rel":["modelos-de-difusion","autoencoder-denoising","superresolucion-inpainting-y-colorizacion","prior-verosimilitud-y-posterior"]},{"id":"ddpm","name":"DDPM","en":"DDPM (denoising diffusion probabilistic models)","frase":"El modelo de difusión clásico: una red predice el ruido añadido y se generan muestras en cientos o miles de pasos.","desc":"Los Denoising Diffusion Probabilistic Models (2020) definieron la receta moderna: una U-Net aprende a predecir el ruido que se añadió a una imagen en el paso t, con un simple error cuadrático. Para generar se recorren hacia atrás todos los pasos del proceso, típicamente 1.000, añadiendo un poco de ruido nuevo en cada uno. La calidad es excelente, pero el muestreo es lento.","cuando":"Como formulación de referencia para entrenar modelos de difusión.","ej":"Un DDPM entrenado con fotos de iglesias genera iglesias nuevas recorriendo 1.000 pasos de eliminación de ruido.","hp":[["num_train_timesteps","número de pasos de ruido del proceso (1.000 por defecto)"],["beta_schedule","cómo crece el ruido a lo largo de los pasos"]],"py":[{"c":"diffusers.DDPMScheduler","u":"https://huggingface.co/docs/diffusers/api/schedulers/ddpm#diffusers.DDPMScheduler"},{"c":"diffusers.DDPMPipeline","u":"https://huggingface.co/docs/diffusers/api/pipelines/ddpm#diffusers.DDPMPipeline"}],"rel":["modelos-de-difusion","ddim","planificacion-del-ruido","u-net"]},{"id":"ddim","name":"DDIM","en":"DDIM (denoising diffusion implicit models)","frase":"Muestreo de difusión más rápido y determinista: genera en decenas de pasos con el mismo modelo entrenado.","desc":"Los Denoising Diffusion Implicit Models reformulan el proceso inverso para saltar pasos sin reentrenar: un modelo entrenado como DDPM puede generar en 20 o 50 pasos en lugar de 1.000. Con su parámetro η = 0, el muestreo es determinista: el mismo ruido inicial da siempre la misma imagen, lo que permite interpolar en el ruido y recuperar el ruido de una imagen real (inversión), algo muy útil para editar.","cuando":"Para generar más rápido con un modelo de difusión ya entrenado o para editar imágenes reales mediante inversión.","ej":"Una imagen que con DDPM requería 1.000 pasos se genera con DDIM en 50, con una calidad similar.","py":[{"c":"diffusers.DDIMScheduler","u":"https://huggingface.co/docs/diffusers/api/schedulers/ddim#diffusers.DDIMScheduler"}],"rel":["ddpm","destilacion-de-difusion","modelos-de-difusion","planificacion-del-ruido"]},{"id":"planificacion-del-ruido","name":"Planificación del ruido (noise schedule)","en":"noise schedule","frase":"Cómo se reparte el ruido a lo largo de los pasos de la difusión: un detalle que cambia mucho la calidad.","desc":"La planificación fija cuánto ruido hay en cada paso del proceso. La lineal original destruye la información demasiado pronto en imágenes pequeñas; la de coseno la degrada de forma más gradual y mejora los resultados. También se ajusta al muestrear: qué pasos se recorren y con qué espaciado. Debe adaptarse a la resolución, porque las imágenes grandes necesitan más ruido para destruir la misma información.","ej":"Cambiar la planificación lineal por la de coseno mejora un modelo de difusión de imágenes de 64 × 64 sin tocar nada más.","hp":[["beta_schedule","forma de la planificación (lineal, coseno…)"],["beta_start / beta_end","ruido en el primer y en el último paso"]],"py":[{"c":"diffusers.DDPMScheduler","u":"https://huggingface.co/docs/diffusers/api/schedulers/ddpm#diffusers.DDPMScheduler"}],"rel":["ddpm","ddim","proceso-directo-e-inverso","lr-schedulers"]},{"id":"guia-difusion","name":"Guía por clasificador y classifier-free guidance","en":"classifier & classifier-free guidance","frase":"Técnicas para que la generación se ciña más a la condición, como el texto, a cambio de algo de diversidad.","desc":"La guía por clasificador usa el gradiente de un clasificador entrenado con imágenes ruidosas para empujar la muestra hacia la clase deseada. La guía sin clasificador (classifier-free guidance), la estándar hoy, entrena un mismo modelo con y sin condición y, al generar, extrapola desde la predicción sin condición hacia la condicionada. La escala de guía controla el compromiso: más alta, más fidelidad al texto y menos variedad.","cuando":"Siempre que se genera con condiciones, como un texto o una clase, para controlar cuánto se respeta la condición.","ej":"Con una escala de guía de 1, las imágenes de \"un perro con sombrero\" a veces olvidan el sombrero; con 7,5, casi siempre aparece.","py":[{"c":"diffusers.StableDiffusionPipeline","u":"https://huggingface.co/docs/diffusers/api/pipelines/stable_diffusion/text2img#diffusers.StableDiffusionPipeline"},{"c":"pipe(prompt, guidance_scale=7.5)","s":1}],"rel":["stable-diffusion","gan-condicional","modelos-de-difusion","decodificacion-y-temperatura"]},{"id":"stable-diffusion","name":"Difusión latente (Stable Diffusion)","en":"latent diffusion (Stable Diffusion)","frase":"Difusión en el espacio latente comprimido de un autoencoder, guiada por texto: generación de imágenes al alcance de todos.","desc":"En lugar de eliminar ruido sobre los píxeles, un autoencoder comprime la imagen en un espacio latente unas 48 veces más pequeño y la difusión ocurre ahí, lo que abarata enormemente el cálculo. El texto se codifica con un modelo como CLIP y se inyecta mediante atención cruzada en la red que elimina el ruido. Al final, el decodificador devuelve la imagen a píxeles. Su publicación en abierto, en 2022, popularizó la generación de imágenes.","cuando":"Para generar o editar imágenes a partir de texto en hardware de consumo, o como base para ajustes y extensiones.","ej":"Generar en unos segundos, con una GPU de consumo, una imagen de 512 × 512 a partir de la frase \"una ciudad flotante entre las nubes\".","py":[{"c":"diffusers.StableDiffusionPipeline","u":"https://huggingface.co/docs/diffusers/api/pipelines/stable_diffusion/text2img#diffusers.StableDiffusionPipeline"},{"c":"diffusers.AutoencoderKL","u":"https://huggingface.co/docs/diffusers/api/models/autoencoderkl#diffusers.AutoencoderKL"}],"rel":["modelos-de-difusion","espacio-latente","atencion-cruzada","clip","texto-a-imagen"]},{"id":"controlnet","name":"ControlNet","en":"ControlNet","frase":"Añade a un modelo de difusión preentrenado un control preciso mediante una imagen guía: bordes, pose o profundidad.","desc":"Duplica la parte codificadora de la red de difusión en una copia entrenable que recibe la imagen de control, y conecta ambas mediante convoluciones inicializadas a cero, de modo que al principio no altera el modelo original. Así aprende a respetar la estructura de la guía sin dañar lo que el modelo ya sabe y con relativamente pocos datos. Permite fijar la composición y dejar que el texto decida el contenido y el estilo.","cuando":"Cuando se necesita controlar la composición, la pose o la estructura de la imagen generada, no solo su contenido.","ej":"A partir del esqueleto de una pose de baile y el texto \"astronauta en la Luna\", generar un astronauta exactamente en esa postura.","py":[{"c":"diffusers.ControlNetModel","u":"https://huggingface.co/docs/diffusers/api/models/controlnet#diffusers.ControlNetModel"},{"c":"diffusers.StableDiffusionControlNetPipeline","u":"https://huggingface.co/docs/diffusers/api/pipelines/controlnet#diffusers.StableDiffusionControlNetPipeline"}],"rel":["stable-diffusion","guia-difusion","estimacion-de-pose-y-profundidad","fine-tuning"]},{"id":"dreambooth","name":"DreamBooth","en":"DreamBooth","frase":"Ajustar un modelo de texto a imagen con unas pocas fotos para que aprenda un sujeto concreto.","desc":"Con entre 3 y 5 imágenes de un sujeto, como una persona, una mascota o un producto, se ajusta el modelo asociándolo a un identificador poco común, por ejemplo \"un perro sks\". Una pérdida de preservación, que mezcla imágenes genéricas de la clase, evita que el modelo olvide cómo son los perros en general. Después se puede generar el sujeto en escenas nuevas. Suele combinarse con LoRA para ajustar muy pocos parámetros.","cuando":"Para personalizar un generador con un sujeto concreto a partir de pocas fotos.","ej":"Con 5 fotos de una mochila, generar anuncios con esa misma mochila en la cima de una montaña o en una playa.","rel":["stable-diffusion","fine-tuning","lora","olvido-catastrofico"]},{"id":"destilacion-de-difusion","name":"Destilación de difusión (consistency models, SD Turbo)","en":"diffusion distillation (consistency models, SD Turbo)","frase":"Comprimir los muchos pasos de la difusión en unos pocos, o en uno solo, entrenando un modelo alumno.","desc":"El muestreo con decenas de pasos es el gran coste de la difusión. La destilación entrena un modelo que imita en pocos pasos lo que el original hace en muchos. Los modelos de consistencia aprenden a llevar cualquier punto de una trayectoria directamente a su imagen final; la destilación adversaria, usada en SD Turbo, añade un discriminador para mantener la calidad en 1 a 4 pasos. Permite generar en tiempo real.","cuando":"Cuando la velocidad de generación es crítica: aplicaciones interactivas, tiempo real o dispositivos con poca potencia.","ej":"SD Turbo genera una imagen en un solo paso, lo bastante rápido como para actualizarla mientras el usuario escribe la descripción.","py":[{"c":"diffusers.LCMScheduler","u":"https://huggingface.co/docs/diffusers/api/schedulers/lcm#diffusers.LCMScheduler"},{"c":"diffusers.AutoPipelineForText2Image","u":"https://huggingface.co/docs/diffusers/api/pipelines/auto_pipeline#diffusers.AutoPipelineForText2Image"}],"rel":["destilacion-de-conocimiento","ddim","rectified-flow","stable-diffusion"]},{"id":"difusion-de-video","name":"Difusión de vídeo","en":"video diffusion","frase":"Extender la difusión al tiempo para generar vídeos coherentes fotograma a fotograma.","desc":"Se añade una dimensión temporal a la red que elimina el ruido, con atención o convoluciones entre fotogramas, para que los objetos se muevan de forma coherente y no parpadeen. Los modelos actuales usan transformers de difusión sobre parches espacio-temporales de un espacio latente comprimido. Pueden generar a partir de texto, de una imagen inicial o de otro vídeo; el gran reto es mantener la coherencia en duraciones largas.","cuando":"Para generar clips a partir de texto o imágenes, animar una imagen fija o editar vídeos existentes.","ej":"Animar la foto de un paisaje para que el agua de la cascada fluya y las nubes se desplacen.","py":[{"c":"diffusers.CogVideoXPipeline","u":"https://huggingface.co/docs/diffusers/api/pipelines/cogvideox#diffusers.CogVideoXPi
