gundos de muestra y controlar la emoción. Plantean riesgos de suplantación de identidad.","cuando":"Para lectura en voz alta, asistentes de voz, doblaje, accesibilidad o audiolibros.","ej":"Un periódico ofrece cada noticia también en audio, leída por una voz sintética natural.","py":[{"c":"transformers.VitsModel","u":"https://huggingface.co/docs/transformers/model_doc/vits#transformers.VitsModel"},{"c":"pipeline(\"text-to-speech\")","s":1}],"rel":["audio-y-voz","espectrograma-de-mel","modelos-any-to-any","generacion-de-musica"]},{"id":"clap","name":"CLAP (audio-texto)","en":"CLAP (contrastive language-audio pretraining)","frase":"El equivalente de CLIP para el audio: relaciona sonidos y descripciones en un espacio común.","desc":"CLAP (Contrastive Language-Audio Pretraining) entrena un codificador de audio y uno de texto con aprendizaje contrastivo sobre pares de sonido y descripción. Permite buscar sonidos con texto, clasificar audio sin ejemplos y servir de guía, o de medida de fidelidad, en los modelos de generación de audio.","cuando":"Para buscar sonidos mediante texto, clasificar audio sin ejemplos o evaluar la coherencia entre un audio generado y su descripción.","ej":"Buscar en una biblioteca de efectos de sonido \"puerta de madera que cruje al abrirse\" sin depender de etiquetas manuales.","py":[{"c":"transformers.ClapModel","u":"https://huggingface.co/docs/transformers/model_doc/clap#transformers.ClapModel"}],"rel":["clip","aprendizaje-contrastivo","audio-y-voz","clasificacion-zero-shot"]},{"id":"generacion-de-musica","name":"Generación de música","en":"music generation","frase":"Generar música a partir de una descripción, una melodía o un fragmento inicial.","desc":"Los modelos actuales representan la música como tokens de un códec neuronal de audio y la generan con transformers autorregresivos, como MusicGen, o con difusión, condicionados por un texto, una melodía o un estilo de referencia. Pueden producir piezas de varios minutos con una instrumentación coherente. Plantean cuestiones abiertas sobre los derechos de autor de los datos de entrenamiento y la autoría.","cuando":"Para bandas sonoras de vídeos, prototipos musicales, música adaptativa en videojuegos o exploración creativa.","ej":"\"Música de piano tranquila con lluvia de fondo para estudiar\" genera una pieza original de dos minutos.","py":[{"c":"transformers.MusicgenForConditionalGeneration","u":"https://huggingface.co/docs/transformers/model_doc/musicgen#transformers.MusicgenForConditionalGeneration"}],"rel":["modelos-autorregresivos","audio-y-voz","cuantizacion-vectorial","generacion-multimodal"]}]}]},{"id":"series-temporales","name":"Series temporales","en":"time series","frase":"Datos ordenados en el tiempo: anticipar lo que viene y entender su dinámica.","desc":"Datos ordenados en el tiempo, donde cada valor depende de los anteriores: ventas, temperatura, tráfico o señales de sensores. Los problemas típicos son predecir valores futuros (forecasting), clasificar secuencias y detectar comportamientos anómalos. Exigen validar respetando el orden temporal.","cuando":"Cuando el orden temporal importa y quieres anticipar valores futuros o entender cómo evoluciona algo.","ej":"Predecir la demanda eléctrica de las próximas 24 horas a partir del consumo de las últimas semanas y la previsión meteorológica.","rel":["prediccion-multipaso","enventanado","modelos-fundacionales-de-series","validacion-en-series-temporales"],"children":[{"id":"componentes-de-una-serie","name":"Componentes de una serie (tendencia, estacionalidad)","en":"time series components (trend, seasonality)","frase":"Descomponer una serie temporal en tendencia, estacionalidad y resto.","desc":"Una serie suele combinar una tendencia (su evolución a largo plazo), una o varias estacionalidades (patrones que se repiten con un periodo fijo: diario, semanal, anual) y un residuo irregular. Separarlas, de forma aditiva o multiplicativa, ayuda a entender la serie, a eliminar efectos conocidos antes de modelar y a detectar anomalías en el residuo. STL es el método robusto más usado.","cuando":"Al empezar a analizar cualquier serie, y para desestacionalizar antes de modelar o de comparar periodos.","ej":"Las ventas de una heladería muestran una tendencia creciente, un pico cada verano y un patrón semanal con máximos en el fin de semana.","hp":[["period","longitud del ciclo estacional (7 en datos diarios con patrón semanal, 12 en datos mensuales con patrón anual)"],["seasonal","suavizado del componente estacional en STL"]],"py":[{"c":"statsmodels.tsa.seasonal.STL","u":"https://www.statsmodels.org/stable/generated/statsmodels.tsa.stl._stl.STL.html"},{"c":"statsmodels.tsa.seasonal.seasonal_decompose","u":"https://www.statsmodels.org/stable/generated/statsmodels.tsa.seasonal._seasonal.seasonal_decompose.html"}],"rel":["estacionariedad","autocorrelacion","deteccion-por-reconstruccion-o-prediccion","eda"]},{"id":"estacionariedad","name":"Estacionariedad","en":"stationarity","frase":"Una serie es estacionaria si sus propiedades estadísticas (media, varianza, autocorrelación) no cambian con el tiempo.","desc":"Muchos modelos clásicos, como ARIMA, suponen estacionariedad, porque permite aprender del pasado relaciones que siguen valiendo en el futuro. Las series con tendencia o estacionalidad no lo son, y se transforman diferenciando (restando el valor anterior), eliminando la estacionalidad o tomando logaritmos. Los tests de Dickey-Fuller aumentado y KPSS, con hipótesis nulas opuestas, ayudan a comprobarlo.","cuando":"Antes de aplicar modelos clásicos de series, tests de causalidad de Granger o correlaciones entre series.","ej":"El precio de una vivienda no es estacionario, pero su variación mensual en porcentaje lo es aproximadamente.","py":[{"c":"statsmodels.tsa.stattools.adfuller","u":"https://www.statsmodels.org/stable/generated/statsmodels.tsa.stattools._stattools.adfuller.html"},{"c":"statsmodels.tsa.stattools.kpss","u":"https://www.statsmodels.org/stable/generated/statsmodels.tsa.stattools._stattools.kpss.html"}],"rel":["componentes-de-una-serie","autocorrelacion","correlacion-espuria","causalidad-de-granger"]},{"id":"autocorrelacion","name":"Autocorrelación","en":"autocorrelation (ACF, PACF)","frase":"Cuánto se parece una serie a sí misma desplazada en el tiempo: la memoria de la serie.","desc":"La función de autocorrelación (ACF) mide la correlación entre la serie y sus propios valores retrasados k pasos; la autocorrelación parcial (PACF) mide la parte de esa relación que no explican los retardos intermedios. Sus gráficos revelan estacionalidades (picos en el periodo), persistencia y qué retardos conviene usar en un modelo autorregresivo. En los residuos de un buen modelo no debería quedar autocorrelación.","cuando":"Para identificar estacionalidades, elegir los retardos de un modelo o comprobar que sus residuos son ruido.","ej":"El consumo eléctrico horario tiene picos de autocorrelación en el retardo 24 (la misma hora del día anterior) y en el 168 (la misma hora de la semana anterior).","hp":[["nlags / lags","número de retardos que se calculan o se representan"]],"py":[{"c":"statsmodels.tsa.stattools.acf","u":"https://www.statsmodels.org/stable/generated/statsmodels.tsa.stattools._stattools.acf.html"},{"c":"statsmodels.graphics.tsaplots.plot_acf","u":"https://www.statsmodels.org/stable/generated/statsmodels.graphics.tsaplots.plot_acf.html"},{"c":"statsmodels.graphics.tsaplots.plot_pacf","u":"https://www.statsmodels.org/stable/generated/statsmodels.graphics.tsaplots.plot_pacf.html"}],"rel":["estacionariedad","prediccion-autorregresiva","componentes-de-una-serie","correlacion-de-pearson"]},{"id":"enventanado","name":"Enventanado","en":"windowing (sliding windows)","frase":"Convertir una serie en ejemplos de entrenamiento: cada ventana de valores pasados predice el siguiente.","desc":"Los modelos de ML esperan pares de entrada y salida. El enventanado recorre la serie con una ventana deslizante: los últimos n valores son la entrada y el valor siguiente, o los h siguientes, la salida. La longitud de la ventana define cuánta historia ve el modelo, y el paso entre ventanas, cuántos ejemplos se generan. Las ventanas deben crearse después de dividir en entrenamiento y test, para no mezclar periodos.","cuando":"Siempre que se use un modelo de ML genérico, como árboles o redes, para predecir series.","ej":"Con 30 días de historia por ventana, una serie de 1.000 días de ventas genera unos 970 ejemplos para entrenar un modelo que predice el día siguiente.","hp":[["sequence_length","longitud de cada ventana"],["sequence_stride","desplazamiento entre ventanas consecutivas"]],"py":[{"c":"keras.utils.timeseries_dataset_from_array","u":"https://keras.io/api/data_loading/timeseries/#timeseriesdatasetfromarray-function"},{"c":"numpy.lib.stride_tricks.sliding_window_view","u":"https://numpy.org/doc/stable/reference/generated/numpy.lib.stride_tricks.sliding_window_view.html"}],"rel":["prediccion-multipaso","validacion-en-series-temporales","redes-neuronales-para-series","feature-engineering"]},{"id":"prediccion-multipaso","name":"Predicción a uno y varios pasos","en":"one-step & multi-step forecasting","frase":"Predecir no solo el siguiente valor, sino varios pasos del futuro.","desc":"Hay tres estrategias principales. La recursiva usa un modelo de un paso y realimenta sus propias predicciones: es sencilla, pero acumula errores. La directa entrena un modelo distinto para cada horizonte. La multisalida predice todo el horizonte de una vez con un único modelo, como una red con h salidas o un modelo de secuencia a secuencia. Cuanto más lejano es el horizonte, mayor es la incertidumbre.","cuando":"Cuando hay que planificar con antelación: la demanda de la próxima semana, la producción de los próximos días o la capacidad del mes.","ej":"Un operador eléctrico predice el consumo de cada una de las próximas 48 horas para programar sus centrales.","py":[{"c":"sklearn.multioutput.MultiOutputRegressor","u":"https://scikit-learn.org/stable/modules/generated/sklearn.multioutput.MultiOutputRegressor.html"},{"c":"sklearn.multioutput.RegressorChain","u":"https://scikit-learn.org/stable/modules/generated/sklearn.multioutput.RegressorChain.html"}],"rel":["prediccion-autorregresiva","enventanado","topologias-de-secuencia","validacion-en-series-temporales"]},{"id":"prediccion-autorregresiva","name":"Predicción autorregresiva","en":"autoregressive forecasting (AR, ARIMA)","frase":"Predecir cada valor de la serie como una combinación de sus valores anteriores.","desc":"Un modelo AR(p) predice el valor actual como una combinación lineal de los p anteriores más un ruido. ARIMA añade diferenciación para la tendencia (I) y medias móviles de los errores pasados (MA), y SARIMA, términos estacionales. Son interpretables, funcionan bien con pocas series y poco ruido, y son la línea base clásica. La idea autorregresiva reaparece en las redes recurrentes y en los modelos de lenguaje.","cuando":"Como línea base para series individuales con pocos datos o cuando se necesita un modelo interpretable con intervalos de predicción.","ej":"Predecir el número mensual de pasajeros de un aeropuerto con un SARIMA que capta la tendencia y el pico de cada verano.","hp":[["lags","retardos que incluye el modelo AR"],["order","órdenes (p, d, q) de ARIMA"]],"py":[{"c":"statsmodels.tsa.ar_model.AutoReg","u":"https://www.statsmodels.org/stable/generated/statsmodels.tsa.ar_model.AutoReg.html"},{"c":"statsmodels.tsa.arima.model.ARIMA","u":"https://www.statsmodels.org/stable/generated/statsmodels.tsa.arima.model.ARIMA.html"}],"rel":["autocorrelacion","modelos-autorregresivos","estacionariedad","linea-base"]},{"id":"redes-neuronales-para-series","name":"Redes neuronales para series","en":"neural networks for time series","frase":"RNN, convoluciones 1D y transformers aplicados a predecir o clasificar series temporales.","desc":"Las redes aprenden patrones no lineales y combinan muchas series y variables a la vez. Las LSTM y las GRU procesan la secuencia paso a paso; las convoluciones 1D y las redes convolucionales temporales captan patrones locales en paralelo; los transformers, y variantes especializadas como el Temporal Fusion Transformer, relacionan horizontes largos. Brillan con muchas series relacionadas o variables externas; con una sola serie corta, los modelos clásicos suelen ganar.","cuando":"Con muchas series relacionadas, abundantes variables externas o patrones complejos y no lineales.","ej":"Predecir la demanda diaria de 10.000 productos de una cadena de supermercados con un único modelo que aprende de todos a la vez.","py":[{"c":"keras.layers.LSTM","u":"https://keras.io/api/layers/recurrent_layers/lstm/"},{"c":"keras.layers.Conv1D","u":"https://keras.io/api/layers/convolution_layers/convolution1d/"}],"rel":["lstm","convolucion-1d","enventanado","modelos-fundacionales-de-series"]},{"id":"modelos-fundacionales-de-series","name":"Modelos fundacionales de series (TimesFM, Chronos)","en":"time series foundation models (TimesFM, Chronos)","frase":"Modelos preentrenados con enormes cantidades de series que predicen series nuevas sin entrenar (zero-shot).","desc":"Siguiendo la receta de los LLM, se preentrenan transformers con miles de millones de puntos de series muy diversas (energía, tráfico, ventas, clima). Chronos convierte los valores en tokens y los predice como un modelo de lenguaje; TimesFM y Moirai trabajan con parches de la serie. Dan predicciones probabilísticas razonables sin entrenamiento y se pueden ajustar con los datos propios.","cuando":"Para obtener predicciones rápidas sin entrenar, con series cortas o como línea base fuerte frente a modelos propios.","ej":"Predecir las visitas diarias de una web nueva, con solo dos meses de historia, usando Chronos sin ajustar nada.","py":[{"c":"chronos.BaseChronosPipeline","u":"https://github.com/amazon-science/chronos-forecasting"},{"c":"chronos.Chronos2Pipeline","u":"https://github.com/amazon-science/chronos-forecasting"}],"rel":["modelos-fundacionales","redes-neuronales-para-series","prediccion-multipaso","incertidumbre"]},{"id":"dtw","name":"Dynamic Time Warping (DTW)","en":"Dynamic Time Warping (DTW)","frase":"Comparar dos series permitiendo estirar y encoger el tiempo, para alinear patrones desfasados.","desc":"La distancia euclídea compara punto a punto y penaliza cualquier desfase. Dynamic Time Warping busca, mediante programación dinámica, el alineamiento entre los puntos de las dos series que minimiza la distancia total, de modo que dos patrones iguales que transcurren a distinta velocidad resultan cercanos. Una banda de Sakoe-Chiba limita cuánto se puede deformar el tiempo y acelera el cálculo.","cuando":"Para comparar, agrupar o clasificar series cuyos patrones aparecen desplazados o a distinta velocidad.","ej":"Reconocer la misma palabra pronunciada por dos personas, una más deprisa que la otra, comparando sus señales de audio.","hp":[["global_constraint","restricción del alineamiento (banda de Sakoe-Chiba o paralelogramo de Itakura)"],["sakoe_chiba_radius","anchura máxima de la deformación temporal"]],"py":[{"c":"tslearn.metrics.dtw","u":"https://tslearn.readthedocs.io/en/stable/gen_modules/metrics/tslearn.metrics.dtw.html"},{"c":"tslearn.clustering.TimeSeriesKMeans","u":"https://tslearn.readthedocs.io/en/stable/gen_modules/clustering/tslearn.clustering.TimeSeriesKMeans.html"}],"rel":["distancia-euclidea","k-means","distancia-y-similitud","series-como-imagenes"]},{"id":"series-como-imagenes","name":"Series como imágenes (GAF, wavelets, espectrograma)","en":"time series as images (GAF, wavelets, spectrograms)","frase":"Transformar una serie en una imagen para aprovechar las CNN y los modelos de visión.","desc":"Varias transformaciones convierten una serie 1D en una imagen 2D que conserva su información temporal: los campos angulares de Gram (GAF) codifican la relación entre cada par de instantes; los gráficos de recurrencia marcan cuándo la serie vuelve a estados parecidos; los escalogramas wavelet y los espectrogramas muestran la energía por frecuencia a lo largo del tiempo. Sobre esas imágenes se aplican CNN, a menudo preentrenadas.","cuando":"Para clasificar series o detectar patrones con CNN, sobre todo si se quiere aprovechar el transfer learning de visión.","ej":"Clasificar el estado de un rodamiento a partir de los espectrogramas de su vibración con una CNN preentrenada con imágenes.","hp":[["image_size","tamaño de la imagen resultante"],["method","en GAF, suma o diferencia de ángulos"]],"py":[{"c":"pyts.image.GramianAngularField","u":"https://pyts.readthedocs.io/en/stable/generated/pyts.image.GramianAngularField.html"},{"c":"pyts.image.RecurrencePlot","u":"https://pyts.readthedocs.io/en/stable/generated/pyts.image.RecurrencePlot.html"}],"rel":["espectrograma-de-mel","wavelets","cnn","transfer-learning"]}]},{"id":"sistemas-de-recomendacion","name":"Sistemas de recomendación","en":"recommender systems","frase":"Predecir qué le interesará a cada usuario a partir de su comportamiento y el de otros.","desc":"Sistemas que predicen qué ítems (películas, productos, canciones) interesarán a cada usuario a partir de su historial y del de usuarios parecidos. Combinan filtrado basado en contenido, filtrado colaborativo, factorización de matrices y modelos profundos basados en embeddings.","cuando":"Cuando hay muchos ítems entre los que elegir y quieres mostrar a cada usuario los más relevantes para él.","ej":"Netflix recomienda series según lo que has visto y lo que vieron usuarios con gustos similares, y hasta elige qué portada enseñarte.","rel":["filtrado-colaborativo","factorizacion-de-matrices","embeddings","recall-k-y-hitrate-k"],"children":[{"id":"el-problema-de-la-recomendacion","name":"El problema de la recomendación","en":"the recommendation problem","frase":"Predecir qué elementos interesarán a cada usuario entre miles o millones de opciones.","desc":"Un recomendador estima, para cada par de usuario e ítem, cuánto le gustará o lo probable que es que interactúe, y ordena los ítems para mostrar los mejores. El problema tiene rasgos propios: la mayoría de pares no tiene datos, los usuarios y los ítems nuevos no tienen historial, las preferencias cambian y lo que se muestra condiciona los datos futuros. En la práctica se aborda como un problema de ordenación (ranking), no solo de predicción.","ej":"Una plataforma de vídeo elige, entre 50.000 títulos, los 10 que muestra en la portada de cada usuario.","rel":["matriz-de-utilidad","filtrado-colaborativo","filtrado-basado-en-contenido","evaluacion-de-recomendadores"]},{"id":"matriz-de-utilidad","name":"Matriz de utilidad (usuario-ítem)","en":"utility matrix (user-item)","frase":"La tabla de usuarios por ítems con las valoraciones o interacciones conocidas, casi toda vacía.","desc":"Cada fila es un usuario, cada columna un ítem y cada celda, una valoración o una interacción (compra, clic, tiempo de visionado). Es extremadamente dispersa: un usuario típico interactúa con una fracción ínfima del catálogo, a menudo menos del 1 %. Recomendar equivale a rellenar las celdas vacías con predicciones; se guarda en formato disperso para no almacenar los ceros.","ej":"Una tienda con un millón de clientes y 100.000 productos tiene una matriz de 100.000 millones de celdas, de las que solo unos pocos millones tienen datos.","py":[{"c":"scipy.sparse.csr_matrix","u":"https://docs.scipy.org/doc/scipy/reference/generated/scipy.sparse.csr_matrix.html"}],"rel":["el-problema-de-la-recomendacion","factorizacion-de-matrices","feedback-explicito-vs-implicito","filtrado-colaborativo"]},{"id":"feedback-explicito-vs-implicito","name":"Feedback explícito vs implícito","en":"explicit vs implicit feedback","frase":"Valoraciones que el usuario da a propósito frente a señales que se deducen de su comportamiento.","desc":"El feedback explícito (estrellas, \"me gusta\") es claro, pero escaso y sesgado: pocos usuarios valoran, y suelen hacerlo los muy satisfechos o los muy enfadados. El implícito (clics, compras, tiempo de visionado, reproducciones) es abundante, pero ambiguo: no ver algo no significa que no guste, y un clic no implica satisfacción. Los modelos para feedback implícito dan menos confianza a la ausencia de interacción que a su presencia.","ej":"En una plataforma de música, escuchar una canción entera diez veces es una señal más fiable que la mayoría de las valoraciones con estrellas.","rel":["matriz-de-utilidad","factorizacion-de-matrices","filtrado-colaborativo","calidad-y-etiquetado-de-datos"]},{"id":"filtrado-basado-en-contenido","name":"Filtrado basado en contenido","en":"content-based filtering","frase":"Recomendar ítems que, por sus características, se parecen a los que el usuario ya ha valorado bien.","desc":"Describe cada ítem con atributos (género, autor, ingredientes, el texto de su descripción o embeddings) y construye un perfil del usuario a partir de los ítems que le gustaron; después recomienda los ítems más parecidos a ese perfil. No necesita datos de otros usuarios, así que funciona con ítems nuevos y es fácil de explicar, pero tiende a recomendar más de lo mismo y depende de la calidad de los atributos.","cuando":"Con ítems nuevos, catálogos con buenas descripciones o pocos usuarios.","ej":"A un lector de novela negra nórdica se le recomiendan otras novelas con descripciones parecidas, aunque nadie más las haya leído.","py":[{"c":"sklearn.feature_extraction.text.TfidfVectorizer","u":"https://scikit-learn.org/stable/modules/generated/sklearn.feature_extraction.text.TfidfVectorizer.html"},{"c":"sklearn.metrics.pairwise.cosine_similarity","u":"https://scikit-learn.org/stable/modules/generated/sklearn.metrics.pairwise.cosine_similarity.html"}],"rel":["filtrado-colaborativo","sistemas-hibridos","similitud-coseno","arranque-en-frio"]},{"id":"filtrado-colaborativo","name":"Filtrado colaborativo","en":"collaborative filtering","frase":"Recomendar a partir de lo que les gustó a usuarios con gustos parecidos, sin mirar el contenido.","desc":"Se basa solo en la matriz de interacciones. La versión basada en usuarios busca usuarios similares y recomienda lo que les gustó a ellos; la basada en ítems recomienda ítems parecidos a los que el usuario valoró, midiendo la similitud por quién los consume. Los métodos de factorización generalizan la idea. Descubre relaciones que el contenido no muestra, pero sufre con los usuarios y los ítems nuevos.","cuando":"Cuando hay abundante historial de interacciones y el contenido de los ítems es difícil de describir.","ej":"\"Los clientes que compraron esta tienda de campaña también compraron este hornillo\".","hp":[["k","número de vecinos que se consideran"],["sim_options","medida de similitud y si se compara por usuarios o por ítems"]],"py":[{"c":"surprise.KNNBasic","u":"https://surprise.readthedocs.io/en/stable/knn_inspired.html"}],"rel":["factorizacion-de-matrices","filtrado-basado-en-contenido","knn","arranque-en-frio"]},{"id":"factorizacion-de-matrices","name":"Factorización de matrices","en":"matrix factorization","frase":"Representar usuarios e ítems con vectores latentes cuyo producto escalar predice la afinidad.","desc":"Aproxima la matriz de utilidad como el producto de dos matrices estrechas: una con un vector de factores latentes por usuario y otra con uno por ítem. Los factores se aprenden con las celdas conocidas, por descenso por gradiente o por mínimos cuadrados alternos (ALS), con regularización. Capturan dimensiones ocultas de los gustos, como \"acción frente a drama\", y fueron la técnica ganadora del premio Netflix.","cuando":"Como modelo de referencia de filtrado colaborativo con muchas interacciones, explícitas o implícitas.","ej":"Con 50 factores latentes por usuario y por película, el modelo predice qué nota pondrá cada usuario a las películas que no ha visto.","hp":[["n_factors / factors","número de factores latentes"],["reg_all / regularization","fuerza de la regularización"],["n_epochs / iterations","pasadas de entrenamiento"]],"py":[{"c":"surprise.SVD","u":"https://surprise.readthedocs.io/en/stable/matrix_factorization.html"},{"c":"implicit.als.AlternatingLeastSquares","u":"https://github.com/benfred/implicit"},{"c":"sklearn.decomposition.NMF","u":"https://scikit-learn.org/stable/modules/generated/sklearn.decomposition.NMF.html"}],"rel":["matriz-de-utilidad","filtrado-colaborativo","embeddings","pca"]},{"id":"sistemas-hibridos","name":"Sistemas híbridos","en":"hybrid recommender systems","frase":"Combinar filtrado colaborativo y basado en contenido para aprovechar las ventajas de ambos.","desc":"Los sistemas híbridos mezclan las predicciones de varios recomendadores, usan los atributos del contenido como entradas adicionales de un modelo colaborativo o cambian de estrategia según la situación: contenido para los ítems nuevos y colaborativo cuando ya hay historial. Reducen el problema del arranque en frío y suelen ser más precisos. La mayoría de los recomendadores reales son híbridos.","cuando":"Casi siempre en producción, sobre todo si llegan ítems o usuarios nuevos con frecuencia.","ej":"Una plataforma de noticias recomienda los artículos recién publicados por su contenido y, cuando acumulan lecturas, también por lo que leen los usuarios parecidos.","hp":[["no_components","dimensión de los embeddings de usuarios e ítems"],["loss","función de pérdida (WARP, BPR o logística)"]],"py":[{"c":"lightfm.LightFM","u":"https://github.com/lyst/lightfm"}],"rel":["filtrado-basado-en-contenido","filtrado-colaborativo","arranque-en-frio","ensembles"]},{"id":"recomendacion-basada-en-sesion","name":"Recomendación basada en sesión","en":"session-based recommendation","frase":"Recomendar a partir de lo que el usuario está haciendo en la visita actual, aunque sea anónimo.","desc":"Muchos usuarios no inician sesión o cambian de intención en cada visita. Los modelos basados en sesión tratan la secuencia de clics de la visita actual como una frase y predicen el siguiente ítem, con redes recurrentes (GRU4Rec), transformers (SASRec, BERT4Rec) o reglas de coocurrencia. Capturan la intención inmediata mejor que los perfiles a largo plazo.","cuando":"En comercio electrónico, noticias o música, con muchos usuarios anónimos o intenciones que cambian entre visitas.","ej":"Un visitante anónimo mira tres zapatillas de trail en cinco minutos y la tienda le muestra calcetines técnicos y mochilas de hidratación.","rel":["modelos-autorregresivos","rnn","el-problema-de-la-recomendacion","arranque-en-frio"]},{"id":"arranque-en-frio","name":"Arranque en frío (cold start)","en":"cold start","frase":"Cómo recomendar a usuarios nuevos, o recomendar ítems nuevos de los que aún no hay interacciones.","desc":"El filtrado colaborativo no sabe nada de quien no tiene historial. Para los usuarios nuevos se recurre a lo más popular, a preguntas iniciales sobre sus gustos o a datos de contexto (ubicación, dispositivo); para los ítems nuevos, a su contenido o a mostrarlos a una pequeña fracción de usuarios para explorar. Los bandits equilibran explotar lo conocido y explorar lo nuevo.","cuando":"En cualquier recomendador con altas frecuentes de usuarios o de ítems, desde el primer día.","ej":"Una app de música pregunta al registrarse por tres artistas favoritos para tener algo con lo que empezar a recomendar.","rel":["filtrado-basado-en-contenido","sistemas-hibridos","multi-armed-bandits","exploracion-vs-explotacion"]},{"id":"recomendacion-con-deep-learning","name":"Recomendación con deep learning","en":"deep learning recommenders","frase":"Redes neuronales que aprenden las interacciones entre usuarios, ítems y su contexto.","desc":"Generalizan la factorización de matrices sustituyendo el producto escalar por redes que modelan interacciones no lineales, e incorporan con facilidad texto, imágenes, secuencias y contexto. Los sistemas a gran escala suelen tener dos etapas: un modelo de recuperación, a menudo de dos torres (una para usuarios y otra para ítems), que selecciona cientos de candidatos entre millones, y un modelo de ordenación más rico que los puntúa.","cuando":"Con catálogos y volúmenes de datos grandes y señales variadas (texto, imágenes, contexto, secuencias).","ej":"Una red social elige entre millones de publicaciones unas 500 candidatas con un modelo de dos torres y las ordena con una red que tiene en cuenta cientos de señales.","rel":["autorec","ncf","dcn","scoring-y-re-ranking","embeddings"],"children":[{"id":"autorec","name":"AutoRec","en":"AutoRec","frase":"Un autoencoder que reconstruye las valoraciones de un ítem, o de un usuario, y al hacerlo predice las que faltan.","desc":"Toma como entrada el vector de valoraciones conocidas de un ítem (o de un usuario), lo comprime en un cuello de botella y lo reconstruye; la pérdida solo se calcula sobre las valoraciones observadas. Las salidas en las celdas vacías son las predicciones. Es una generalización no lineal de la factorización de matrices y una de las primeras aplicaciones del deep learning a la recomendación.","cuando":"Como modelo colaborativo no lineal sencillo cuando hay valoraciones explícitas.","ej":"A partir de las notas que 2.000 usuarios han dado a una película, AutoRec reconstruye las que le pondrían los usuarios que aún no la han visto.","rel":["autoencoders","factorizacion-de-matrices","recomendacion-con-deep-learning","cuello-de-botella"]},{"id":"ncf","name":"Neural Collaborative Filtering (GMF, NeuMF)","en":"Neural Collaborative Filtering (GMF, NeuMF)","frase":"Sustituir el producto escalar de la factorización de matrices por una red neuronal que aprende la interacción.","desc":"Neural Collaborative Filtering representa usuarios e ítems con embeddings y combina dos ramas: GMF, una factorización generalizada (producto elemento a elemento con pesos aprendidos), y un MLP sobre los embeddings concatenados, que capta interacciones no lineales. NeuMF fusiona ambas. Se entrena con feedback implícito como una clasificación (interactuó o no), muestreando ejemplos negativos.","cuando":"Con abundante feedback implícito, cuando la factorización lineal se queda corta.","ej":"Una tienda online predice la probabilidad de que cada cliente compre cada producto combinando las dos ramas de NeuMF.","py":[{"c":"keras.layers.Embedding","u":"https://keras.io/api/layers/core_layers/embedding/"},{"c":"keras.layers.Dot","u":"https://keras.io/api/layers/merging_layers/dot/"}],"rel":["factorizacion-de-matrices","mlp","capa-de-embedding","negative-sampling"]},{"id":"dcn","name":"Deep & Cross Network (DCN)","en":"Deep & Cross Network (DCN)","frase":"Red que aprende automáticamente combinaciones explícitas entre variables (cruces) junto a una red profunda.","desc":"En recomendación y publicidad, muchas señales son interacciones entre variables, como \"usuario joven\" y \"categoría videojuegos\". La Deep & Cross Network combina una red de cruces, que en cada capa multiplica la entrada original por la salida de la capa anterior y genera de forma eficiente interacciones de orden creciente, con una red profunda convencional. Sustituye la creación manual de cruces de variables.","cuando":"Para predecir clics o compras con muchas variables categóricas y numéricas cuyas interacciones importan.","ej":"Predecir la probabilidad de clic en un anuncio combinando automáticamente el país, la hora, el tipo de dispositivo y la categoría del anuncio.","hp":[["projection_dim","dimensión de la proyección de rango bajo de la capa de cruce, que reduce los parámetros"]],"py":[{"c":"keras_rs.layers.FeatureCross","u":"https://keras.io/keras_rs/api/feature_interaction_layers/feature_cross/"}],"rel":["recomendacion-con-deep-learning","regresion-polinomica-e-interacciones","feature-engineering","mlp"]}]},{"id":"scoring-y-re-ranking","name":"Scoring y re-ranking","en":"scoring & re-ranking","frase":"Puntuar los candidatos con un modelo preciso y reordenarlos según objetivos de negocio y de diversidad.","desc":"Tras recuperar los candidatos, un modelo de puntuación más rico estima para cada uno la probabilidad de clic, de compra o de satisfacción. Después, el reordenamiento ajusta la lista final con criterios que el modelo no ve: diversidad, novedad, frescura, reglas de negocio o equidad entre proveedores, y evita mostrar seguidos ítems casi idénticos. La lista final es un compromiso entre la relevancia y otros objetivos.","cuando":"En cualquier recomendador en producción con catálogos grandes y objetivos que van más allá de la relevancia inmediata.","ej":"Tras puntuar 500 vídeos, el sistema evita mostrar cinco seguidos del mismo creador y reserva un hueco para un contenido nuevo.","py":[{"c":"keras_rs.layers.BruteForceRetrieval","u":"https://keras.io/keras_rs/api/retrieval_layers/brute_force_retrieval/"}],"rel":["recomendacion-con-deep-learning","re-ranking","diversidad-novedad-y-serendipia","burbuja-de-filtro"]},{"id":"burbuja-de-filtro","name":"Burbuja de filtro","en":"filter bubble","frase":"El recomendador solo muestra lo que confirma los gustos del usuario y acaba encerrándolo en una burbuja.","desc":"Como el sistema aprende de lo que el usuario consume, y el usuario consume lo que el sistema le muestra, se crea un bucle de retroalimentación que estrecha progresivamente la variedad de lo recomendado. Puede empobrecer la experiencia, amplificar la polarización en noticias y redes sociales y favorecer siempre a los ítems populares. Se mitiga con diversidad, exploración y métricas que vayan más allá del clic inmediato.","ej":"Un usuario que ve dos vídeos sobre una dieta extrema empieza a recibir casi exclusivamente contenidos cada vez más extremos sobre el tema.","rel":["diversidad-novedad-y-serendipia","exploracion-vs-explotacion","sesgo-algoritmico-y-atributos-sensibles","scoring-y-re-ranking"]},{"id":"evaluacion-de-recomendadores","name":"Evaluación de recomendadores","en":"recommender evaluation","frase":"Medir si las recomendaciones son relevantes, están bien ordenadas, son variadas y útiles para el negocio.","desc":"Offline se mide sobre interacciones históricas reservadas: métricas de error si se predicen valoraciones y, más útiles, métricas de ordenación como Recall@K, NDCG o MAP, que premian colocar arriba los ítems relevantes; también la diversidad, la novedad y la cobertura del catálogo. Como los datos históricos dependen de lo que se mostró en su día, la prueba definitiva es un test A/B online con métricas de negocio.","ej":"Un modelo nuevo mejora el NDCG@10 offline, pero el test A/B muestra que no aumenta el tiempo de visionado, así que no se despliega.","py":[{"c":"sklearn.metrics.ndcg_score","u":"https://scikit-learn.org/stable/modules/generated/sklearn.metrics.ndcg_score.html"},{"c":"keras_rs.metrics.NDCG","u":"https://keras.io/keras_rs/api/metrics/ndcg/"}],"rel":["recall-k-y-hitrate-k","diversidad-novedad-y-serendipia","contraste-de-hipotesis","metricas-de-evaluacion"],"children":[{"id":"recall-k-y-hitrate-k","name":"Recall@K y HitRate@K","en":"Recall@K & HitRate@K","frase":"Qué fracción de los ítems relevantes aparece entre las K primeras recomendaciones, o si aparece al menos uno.","desc":"Recall@K divide el número de ítems relevantes que aparecen en el top-K entre el total de ítems relevantes del usuario. HitRate@K vale 1 si al menos uno de los relevantes está en el top-K y 0 si no, y se promedia sobre los usuarios; es habitual cuando se oculta una sola interacción por usuario. Precision@K mide qué fracción del top-K es relevante. Ninguna tiene en cuenta la posición exacta dentro del top-K; NDCG sí.","cuando":"Para evaluar recomendadores y sistemas de recuperación, incluido RAG, cuando solo se muestran los K primeros resultados.","ej":"Si un usuario compró 4 productos en el periodo de test y 2 aparecen entre sus 10 recomendaciones, su Recall@10 es 0,5 y su HitRate@10, 1.","py":[{"c":"keras_rs.metrics.RecallAtK","u":"https://keras.io/keras_rs/api/metrics/"},{"c":"len(set(top_k) & relevantes) / len(relevantes)","s":1}],"rel":["evaluacion-de-recomendadores","precision-y-recall","evaluacion-de-rag","re-ranking"]},{"id":"diversidad-novedad-y-serendipia","name":"Diversidad, novedad y serendipia","en":"diversity, novelty & serendipity","frase":"Más allá de acertar: recomendar cosas variadas, poco conocidas y gratamente inesperadas.","desc":"La diversidad mide lo distintos que son entre sí los ítems de una lista; la novedad, lo poco populares o desconocidos que son para el usuario; la serendipia, lo sorprendentes y a la vez relevantes que resultan. Un recomendador que solo optimiza la precisión tiende a sugerir lo obvio y lo popular. Estas métricas ayudan a equilibrar la relevancia con el descubrimiento y la cobertura del catálogo.","cuando":"Para evaluar y ajustar recomendadores en los que importan el descubrimiento y la satisfacción a largo plazo.","ej":"Recomendar a un fan de los Beatles otro disco de los Beatles es preciso pero obvio; recomendarle un grupo poco conocido con un sonido parecido aporta serendipia.","rel":["burbuja-de-filtro","scoring-y-re-ranking","evaluacion-de-recomendadores","exploracion-vs-explotacion"]}]}]},{"id":"deteccion-de-anomalias","name":"Detección de anomalías","en":"anomaly detection","frase":"Encontrar lo raro: datos que no encajan con el comportamiento normal.","desc":"Identificar observaciones que se desvían del comportamiento normal: fraudes, averías, intrusiones o errores de medida. Como las anomalías son raras y casi nunca están etiquetadas, se suele modelar la normalidad (por distancia, probabilidad o reconstrucción) y marcar lo que no encaja.","cuando":"Cuando buscas casos raros (fraude, averías, errores) y apenas tienes ejemplos etiquetados de ellos.","ej":"Un autoencoder entrenado solo con transacciones normales reconstruye mal una fraudulenta, y ese error de reconstrucción alto la delata.","rel":["outliers","deteccion-por-reconstruccion-o-prediccion","isolation-forest","ood"],"children":[{"id":"anomalia-outlier-ruido-y-novedad","name":"Anomalía, outlier, ruido y novedad","en":"anomaly, outlier, noise & novelty","frase":"Conceptos cercanos con matices: lo raro que interesa, el valor extremo, la variación sin interés y lo nuevo que aparece.","desc":"Una anomalía es una observación que no encaja con el comportamiento normal y suele tener interés, como un fraude o una avería. Outlier es el término estadístico para un valor extremo, que puede ser una anomalía o un error. El ruido es variabilidad aleatoria sin interés que conviene filtrar. Una novedad es un patrón nuevo que no estaba en los datos de entrenamiento: se detecta entrenando solo con datos normales y vigilando lo que llega después.","ej":"En los datos de un sensor, un pico aislado por una interferencia es ruido; un patrón de vibración nunca visto antes de una rotura es una novedad que interesa detectar.","rel":["outliers","ood","enfoques-deteccion-anomalias","deriva-de-datos"]},{"id":"ood","name":"Detección fuera de distribución (OOD)","en":"out-of-distribution (OOD) detection","frase":"Detectar entradas muy distintas de los datos de entrenamiento, para las que las predicciones del modelo no son fiables.","desc":"Un modelo entrenado con fotos de perros y gatos seguirá respondiendo una de las dos clases, a menudo con mucha confianza, si se le enseña un coche. La detección fuera de distribución identifica esas entradas para rechazarlas o derivarlas a una persona. Se usan la confianza máxima de la softmax, la energía de los logits, la distancia en el espacio de embeddings o modelos de densidad, aunque ningún método es infalible.","cuando":"En cualquier sistema desplegado en un entorno abierto, sobre todo en medicina, conducción o seguridad.","ej":"Un clasificador de lesiones de la piel rechaza la foto de una uña porque, en su espacio de embeddings, queda lejos de todas las imágenes de entrenamiento.","rel":["anomalia-outlier-ruido-y-novedad","deriva-de-datos","incertidumbre","verosimilitud-vs-calidad-de-muestras"]},{"id":"enfoques-deteccion-anomalias","name":"Enfoques supervisado, semisupervisado y no supervisado","en":"supervised, semi-supervised & unsupervised anomaly detection","frase":"Supervisado si hay anomalías etiquetadas, semisupervisado si solo hay datos normales y no supervisado si no hay etiquetas.","desc":"Con ejemplos etiquetados de ambos tipos, es un problema de clasificación muy desbalanceado, que solo detecta los tipos de anomalía ya vistos. Con datos solo normales, se modela la normalidad y se marca lo que se aparta de ella (detección de novedades). Sin etiquetas, se supone que las anomalías son pocas y distintas, y se buscan los puntos aislados o de baja densidad. En la práctica se combinan, y las pocas etiquetas disponibles se usan para validar y fijar umbrales.","cuando":"Para elegir la estrategia según las etiquetas disponibles y según si las anomalías futuras se parecerán a las pasadas.","ej":"Un banco combina un clasificador entrenado con fraudes conocidos y un detector no supervisado que avisa de patrones nunca vistos.","rel":["desbalanceo-de-clases","isolation-forest","deteccion-por-reconstruccion-o-prediccion","aprendizaje-semisupervisado"]},{"id":"deteccion-basada-en-distancia","name":"Detección basada en distancia","en":"distance-based anomaly detection","frase":"Un punto es anómalo si está lejos de sus vecinos más cercanos.","desc":"Es la idea más directa: calcular para cada punto la distancia a su k-ésimo vecino más cercano, o la media de las distancias a sus k vecinos, y marcar como anómalos los más alejados. Es intuitiva y no supone ninguna distribución, pero depende de la escala de las variables y de la medida de distancia, sufre en alta dimensión y falla cuando hay zonas de densidades muy distintas, algo que resuelve el LOF.","cuando":"Con datos numéricos de dimensión moderada y bien escalados.","ej":"Marcar como sospechosas las transacciones cuyo importe, hora y comercio las alejan de todas las transacciones habituales del cliente.","hp":[["n_neighbors","número de vecinos"],["method","distancia al k-ésimo vecino o media de las distancias"]],"py":[{"c":"pyod.models.knn.KNN","u":"https://pyod.readthedocs.io/"},{"c":"sklearn.neighbors.NearestNeighbors","u":"https://scikit-learn.org/stable/modules/generated/sklearn.neighbors.NearestNeighbors.html"}],"rel":["knn","lof","maldicion-de-la-dimensionalidad","distancia-y-similitud"]},{"id":"deteccion-basada-en-probabilidad","name":"Detección basada en probabilidad","en":"probabilistic anomaly detection","frase":"Modelar la distribución de los datos normales y marcar como anómalo lo improbable.","desc":"Se estima la densidad de los datos con una gaussiana, una mezcla de gaussianas, una KDE u otro modelo, y se consideran anómalos los puntos con densidad muy baja. Con una única gaussiana multivariante equivale a usar la distancia de Mahalanobis. Es interpretable y da una puntuación con sentido probabilístico, pero depende de que el modelo de densidad sea adecuado y de estimarlo bien en alta dimensión.","cuando":"Cuando los datos normales siguen una distribución que se puede modelar bien, sobre todo en pocas dimensiones.","ej":"Un sistema de control de calidad marca las piezas cuyas medidas son muy improbables según la distribución de las piezas buenas.","hp":[["contamination","proporción esperada de anomalías, que fija el umbral"]],"py":[{"c":"sklearn.covariance.EllipticEnvelope","u":"https://scikit-learn.org/stable/modules/generated/sklearn.covariance.EllipticEnvelope.html"},{"c":"pyod.models.ecod.ECOD","u":"https://pyod.readthedocs.io/"}],"rel":["estimacion-de-densidad","gmm","distancia-de-mahalanobis","kde"]},{"id":"deteccion-teoria-informacion","name":"Detección basada en teoría de la información","en":"information-theoretic anomaly detection","frase":"Una observación es anómala si aporta mucha información, es decir, si resulta muy sorprendente.","desc":"Desde la teoría de la información, lo anómalo que es un punto se mide por su sorpresa, −log p(x): cuanto menos probable, más información aporta. También puede medirse cuánto aumenta la complejidad o la longitud de descripción del conjunto al incluir el punto, o cuánto cambia la entropía de un grupo al quitarlo. Este enfoque unifica la detección por densidad y la detección por compresión.","cuando":"Cuando se dispone de un modelo de densidad o de compresión de los datos normales y se quiere una puntuación de rareza con interpretación clara.","ej":"En el tráfico de una red, una conexión que añade mucha información a un modelo comprimido del tráfico normal se marca como posible intrusión.","py":[{"c":"-modelo.score_samples(X)","s":1}],"rel":["informacion-shannon","entropia","deteccion-basada-en-probabilidad","estimacion-de-densidad"]},{"id":"deteccion-por-reconstruccion-o-prediccion","name":"Detección por reconstrucción o predicción","en":"reconstruction- and prediction-based detection","frase":"Entrenar un modelo con datos normales y marcar como anómalo lo que no consigue reconstruir o predecir bien.","desc":"Un autoencoder o un PCA entrenados solo con datos normales reconstruyen bien lo normal y mal lo anómalo, así que el error de reconstrucción sirve como puntuación. En series temporales, un modelo de predicción aprende la dinámica normal, y un error de predicción grande indica una anomalía. Funciona con datos complejos, como imágenes, señales o registros, sin necesidad de etiquetas de anomalías.","cuando":"Con datos complejos (imágenes, señales, series multivariantes) y abundantes ejemplos de funcionamiento normal.","ej":"Un autoencoder entrenado con el sonido de motores sanos detecta una avería porque reconstruye mal el ruido de un rodamiento dañado.","hp":[["contamination","proporción esperada de anomalías"],["n_components","en PCA, componentes con las que se reconstruye"]],"py":[{"c":"pyod.models.pca.PCA","u":"https://pyod.readthedocs.io/"},{"c":"pyod.models.auto_encoder.AutoEncoder","u":"https://pyod.readthedocs.io/"}],"rel":["autoencoders","pca","prediccion-multipaso","eleccion-del-umbral"]},{"id":"lof","name":"Local Outlier Factor (LOF)","en":"Local Outlier Factor (LOF)","frase":"Compara la densidad local de cada punto con la de sus vecinos: es anómalo si es mucho menos denso que ellos.","desc":"El Local Outlier Factor mide, para cada punto, lo concentrados que están sus vecinos a su alrededor en comparación con lo concentrados que están alrededor de esos mismos vecinos. Un valor cercano a 1 indica un punto normal; uno muy superior, un punto aislado respecto a su zona. Al ser local, detecta anomalías en datos con grupos de densidades distintas, donde un umbral global de distancia fallaría.","cuando":"Con datos numéricos de dimensión moderada y grupos de distinta densidad.","ej":"En un mapa de precios de alquiler, un piso barato en un barrio caro es anómalo aunque su precio sea normal para el conjunto de la ciudad.","hp":[["n_neighbors","tamaño de la vecindad"],["contamination","proporción esperada de anomalías"],["novelty","permite puntuar datos nuevos tras entrenar"]],"py":[{"c":"sklearn.neighbors.LocalOutlierFactor","u":"https://scikit-learn.org/stable/modules/generated/sklearn.neighbors.LocalOutlierFactor.html"}],"rel":["deteccion-basada-en-distancia","knn","dbscan","isolation-forest"]},{"id":"isolation-forest","name":"Isolation Forest","en":"Isolation Forest","frase":"Aísla cada punto con cortes aleatorios: las anomalías quedan aisladas con muy pocos cortes.","desc":"Construye muchos árboles que dividen los datos con variables y umbrales elegidos al azar hasta aislar cada punto. Como las anomalías son pocas y distintas, quedan aisladas cerca de la raíz, con caminos cortos; los puntos normales, en zonas densas, necesitan muchos cortes. La longitud media del camino da la puntuación. Es rápido, escala a muchos datos y variables y no necesita escalarlas.","cuando":"Como primera opción de detección no supervisada en datos tabulares, también con muchos datos y muchas variables.","ej":"Detectar transacciones con tarjeta inusuales entre millones de operaciones diarias, sin etiquetas de fraude.","hp":[["n_estimators","número de árboles"],["max_samples","muestras con las que se construye cada árbol"],["contamination","proporción esperada de anomalías"]],"py":[{"c":"sklearn.ensemble.IsolationForest","u":"https://scikit-learn.org/stable/modules/generated/sklearn.ensemble.IsolationForest.html"},{"c":"pyod.models.iforest.IForest","u":"https://pyod.readthedocs.io/"}],"rel":["random-forest","lof","enfoques-deteccion-anomalias","eleccion-del-umbral"]},{"id":"deteccion-con-modelos-generativos","name":"Detección con modelos generativos","en":"generative-model-based anomaly detection","frase":"Usar un modelo generativo de los datos normales para puntuar lo raro que es cada dato nuevo.","desc":"Los VAE, los flujos normalizantes y los modelos de difusión aprenden la distribución de los datos normales y permiten puntuar cada dato nuevo por su verosimilitud, por su error de reconstrucción o por la dificultad de eliminarle el ruido. Los flujos y los modelos autorregresivos dan la verosimilitud exacta aunque, paradójicamente, a veces asignan más probabilidad a datos de otro dominio, por lo que se combinan con otras puntuaciones.","cuando":"Con datos complejos y de alta dimensión, como imágenes médicas o industriales, y muchos ejemplos normales.","ej":"Un modelo de difusión entrenado con resonancias cerebrales sanas \"repara\" la imagen de un paciente, y la diferencia con el original resalta la lesión.","py":[{"c":"pyod.models.vae.VAE","u":"https://pyod.readthedocs.io/"}],"rel":["vae","normalizing-flows","verosimilitud-vs-calidad-de-muestras","deteccion-por-reconstruccion-o-prediccion"]},{"id":"eleccion-del-umbral","name":"Elección del umbral","en":"threshold selection","frase":"Decidir a partir de qué puntuación una observación se marca como anomalía.","desc":"Los detectores dan una puntuación continua y hay que fijar un corte. Se puede usar una proporción esperada de anomalías (la contaminación), un percentil de las puntuaciones de los datos normales, reglas estadísticas o, si hay algunas etiquetas, el punto que mejor equilibra detecciones y falsas alarmas en una curva precisión-recall. Conviene revisarlo con el tiempo, porque los datos cambian.","cuando":"Siempre que un detector pase a producción y haya que convertir sus puntuaciones en alertas.","ej":"Un equipo de seguridad puede revisar 50 alertas al día, así que fija el umbral en el percentil que genera, de media, esa cantidad.","py":[{"c":"numpy.quantile","u":"https://numpy.org/doc/stable/reference/generated/numpy.quantile.html"}],"rel":["umbral-de-decision","curva-precision-recall","isolation-forest","deriva-de-datos"]}]},{"id":"ia-fiable-y-responsable","name":"IA fiable y responsable","en":"trustworthy & responsible AI","frase":"Que la IA sea explicable, justa, robusta, consciente de su incertidumbre y legal.","desc":"Lo que hace falta para que la IA sea digna de confianza. Hay que entender por qué decide lo que decide (explicabilidad), evitar que discrimine (equidad), que resista manipulaciones (robustez), que sepa cuándo no está segura (incertidumbre) y que cumpla la regulación (RGPD, AI Act).","cuando":"Cuando un modelo toma decisiones que afectan a personas o hay que justificarlas, auditarlas o adaptarlas a la regulación.","ej":"Si un modelo deniega un préstamo, SHAP muestra qué variables pesaron en la decisión. Una explicación contrafactual indica qué tendría que cambiar para aprobarlo.","rel":["xai","equidad","robustez","ai-act"],"children":[{"id":"xai","name":"Explicabilidad (XAI)","en":"explainable AI (XAI)","frase":"Técnicas para entender por qué un modelo decide lo que decide, en general o en cada caso.","desc":"Buscan que las decisiones de un modelo resulten comprensibles para quienes lo desarrollan, lo supervisan o se ven afectados por él. Hay dos caminos: usar modelos interpretables por diseño o aplicar métodos post hoc a un modelo ya entrenado, que lo explican en conjunto (explicaciones globales) o predicción a predicción (explicaciones locales). Sirven para depurar modelos, detectar sesgos y atajos, generar confianza y cumplir requisitos legales.","cuando":"Cuando hay que justificar decisiones, auditar un modelo o comprobar que no se apoya en patrones espurios.","ej":"Antes de usar un modelo que prioriza pacientes en urgencias, el hospital comprueba con SHAP que se apoya en las constantes vitales y los síntomas, y no en el tipo de seguro médico del paciente.","rel":["taxonomia-de-metodos-xai","interpretabilidad-vs-explicabilidad","shap","correlacion-espuria","decisiones-automatizadas-y-rgpd"],"children":[{"id":"caja-negra-vs-caja-blanca","name":"Caja negra vs caja blanca","en":"black box vs white box (glass box)","frase":"Modelos cuyo funcionamiento se puede seguir frente a modelos opacos que solo se observan desde fuera.","desc":"Un modelo de caja blanca, como una regresión lineal, un árbol pequeño o una lista de reglas, permite seguir cómo llega a cada predicción. Uno de caja negra, como una red profunda o un ensemble de cientos de árboles, solo puede explicarse desde fuera, con métodos post hoc. Suele suponerse que la opacidad se paga con más precisión, pero en datos tabulares un modelo interpretable bien construido a menudo rinde casi igual.","ej":"Un protocolo de triaje basado en cinco reglas se puede auditar entero en una tarde; uno basado en una red neuronal necesita herramientas como SHAP para saber en qué se apoya.","rel":["modelos-interpretables-por-diseno","transparencia","arboles-de-decision","mlp","xai"]},{"id":"interpretabilidad-vs-explicabilidad","name":"Interpretabilidad vs explicabilidad","en":"interpretability vs explainability","frase":"Entender el modelo directamente frente a necesitar una explicación externa de lo que hace.","desc":"Se usan a menudo como sinónimos, pero conviene distinguirlos. Un modelo es interpretable si una persona puede entender su mecanismo directamente, como los coeficientes de una regresión. La explicabilidad consiste en producir explicaciones comprensibles de un modelo, sea interpretable o no, normalmente con métodos post hoc. Esas explicaciones son aproximaciones y pueden no ser fieles al modelo; un modelo interpretable, en cambio, se muestra tal como es.","ej":"Los coeficientes de una regresión logística que predice el reingreso hospitalario se interpretan por sí mismos; un gráfico SHAP de una red neuronal entrenada para lo mismo es una explicación.","rel":["caja-negra-vs-caja-blanca","transparencia","evaluacion-de-explicaciones","regresion-logistica"]},{"id":"transparencia","name":"Transparencia (simulable, descomponible, algorítmica)","en":"transparency (simulatability, decomposability, algorithmic transparency)","frase":"Tres niveles: poder simular el modelo de cabeza, entender cada pieza y entender cómo aprende.","desc":"La simulabilidad es que una persona pueda reproducir el cálculo completo del modelo en un tiempo razonable. La descomponibilidad, que cada parte (entradas, parámetros y cálculos) tenga un significado intuitivo. La transparencia algorítmica, que se entienda el procedimiento de aprendizaje y sus garantías, como que el ajuste de un modelo lineal converge a una solución única. Un modelo puede cumplir unos niveles y no otros.","ej":"Una regresión lineal con tres variables es simulable y descomponible; con 500 términos polinómicos sigue siendo algorítmicamente transparente, pero ya nadie puede calcularla de cabeza.","rel":["caja-negra-vs-caja-blanca","interpretabilidad-vs-explicabilidad","modelos-interpretables-por-diseno","regresion-lineal"]},{"id":"taxonomia-de-metodos-xai","name":"Taxonomía de métodos XAI","en":"taxonomy of XAI methods","frase":"Los métodos de explicación se clasifican por cuándo actúan, qué alcance tienen y si dependen del modelo.","desc":"Pueden ser intrínsecos, si el propio modelo es interpretable, o post hoc, si se aplican a un modelo ya entrenado. Globales, si describen el comportamiento general, o locales, si explican una predicción. Agnósticos, si solo necesitan consultar el modelo, como LIME o SHAP, o específicos, si aprovechan su estructura interna, como los gradientes de una red. También varía el formato: importancias de variables, reglas, ejemplos o contrafactuales.","ej":"Grad-CAM es un método post hoc, local y específico de las redes convolucionales; la importancia por permutación es post hoc, global y agnóstica.","rel":["explicaciones-locales","explicaciones-globales","modelos-interpretables-por-diseno","explicabilidad-en-deep-learning"]},{"id":"modelos-interpretables-por-diseno","name":"Modelos interpretables por diseño","en":"interpretable-by-design (glass-box) models","frase":"Modelos cuya estructura ya es la explicación: reglas, árboles pequeños y modelos lineales o aditivos.","desc":"En lugar de explicar una caja negra a posteriori, se entrena directamente un modelo legible: una regresión lineal o logística, un árbol poco profundo, una lista de reglas o un modelo aditivo generalizado. Sus explicaciones son exactas, no aproximaciones, y facilitan detectar errores y variables problemáticas. Propuestas modernas como RuleFit o EBM añaden interacciones y no linealidades sin perder legibilidad.","cuando":"En decisiones de alto impacto (salud, justicia, empleo) o que deban auditarse, si un modelo legible alcanza un rendimiento suficiente.","ej":"Una lista de reglas para estimar el riesgo de ictus se puede aplicar a mano en la consulta y rinde casi como modelos mucho más complejos.","rel":["caja-negra-vs-caja-blanca","arboles-de-decision","gam","regresion-logistica","transparencia"],"children":[{"id":"reglas-de-decision","name":"Reglas de decisión (RIPPER)","en":"decision rules (RIPPER)","frase":"Aprender una lista corta de reglas si-entonces que describen cuándo un caso pertenece a una clase.","desc":"Los algoritmos de cobertura secuencial aprenden una regla que cubre muchos casos de la clase objetivo con pocos errores, apartan los casos cubiertos y repiten. RIPPER es el más conocido: hace crecer cada regla añadiendo condiciones, la poda con datos reservados y optimiza el conjunto final con un criterio de longitud de descripción. El resultado es un modelo que cualquiera puede leer y aplicar a mano.","cuando":"Para clasificación tabular cuando el modelo debe poder leerse como reglas, por ejemplo para validarlo con expertos del dominio.","ej":"Un filtro de correo aprende reglas como \"si el mensaje contiene la palabra gratis y más de tres enlaces, es spam\", que el equipo puede revisar una a una.","hp":[["k","número de pasadas de optimización del conjunto de reglas"],["prune_size","fracción de datos reservada para podar"],["max_rules","número máximo de reglas"]],"py":[{"c":"wittgenstein.RIPPER","u":"https://github.com/imoscovitz/wittgenstein"}],"rel":["arboles-de-decision","poda-y-criterios-de-parada","rulefit","anchors","modelos-interpretables-por-diseno"]},{"id":"rulefit","name":"RuleFit","en":"RuleFit","frase":"Un modelo lineal disperso sobre reglas extraídas de árboles: capta interacciones y sigue siendo legible.","desc":"RuleFit entrena un ensemble de árboles, convierte el camino desde la raíz hasta cada nodo en una regla binaria, como edad > 60 y fumador, y ajusta una regresión con penalización Lasso sobre esas reglas y las variables originales. El Lasso deja solo unas pocas reglas con peso distinto de cero, así que el modelo final es una suma legible de efectos lineales y de reglas que capturan interacciones.","cuando":"En datos tabulares, cuando un modelo lineal se queda corto pero hace falta poder leer el modelo.","ej":"Un modelo de riesgo de reingreso hospitalario queda en 15 reglas con su peso, como \"más de tres ingresos previos y más de 75 años\", además del efecto lineal de cada variable.","hp":[["max_rules","número máximo de reglas del modelo final"],["tree_size","tamaño de los árboles que generan las reglas, que limita su longitud"]],"py":[{"c":"imodels.RuleFitClassifier","u":"https://github.com/csinva/imodels"},{"c":"imodels.RuleFitRegressor","u":"https://github.com/csinva/imodels"}],"rel":["ridge-lasso-y-elastic-net","gradient-boosting","reglas-de-decision","ebm","regresion-polinomica-e-interacciones"]},{"id":"ebm","name":"Explainable Boosting Machine (EBM)","en":"Explainable Boosting Machine (EBM)","frase":"Un modelo aditivo entrenado con boosting: una curva por variable y por par de variables.","desc":"La Explainable Boosting Machine es un modelo aditivo generalizado con interacciones: la predicción es la suma de una función de cada variable y de unas pocas funciones de pares de variables. Cada función se aprende con boosting de árboles diminutos, recorriendo las variables por turnos con una tasa de aprendizaje muy baja. En datos tabulares suele rendir cerca de los mejores modelos de caja negra, y cada curva se puede inspeccionar y corregir.","cuando":"En datos tabulares, cuando se quiere una precisión cercana a la de gradient boosting con un modelo totalmente interpretable.","ej":"Un modelo de este tipo que predecía la mortalidad por neumonía mostró en su curva de asma que los asmáticos parecían tener menos riesgo, un artefacto de que recibían atención más intensiva, y los médicos pudieron corregirlo.","hp":[["interactions","número de interacciones entre pares que se añaden"],["learning_rate","tasa de aprendizaje del boosting"],["max_bins","número de intervalos en que se discretiza cada variable"]],"py":[{"c":"interpret.glassbox.ExplainableBoostingClassifier","u":"https://interpret.ml/docs/ebm.html"},{"c":"interpret.glassbox.ExplainableBoostingRegressor","u":"https://interpret.ml/docs/ebm.html"}],"rel":["gam","gradient-boosting","analisis-de-interacciones","modelos-interpretables-por-diseno","pdp"]}]},{"id":"explicaciones-locales","name":"Explicaciones locales","en":"local explanations","frase":"Explican una predicción concreta: qué variables la han empujado y qué tendría que cambiar.","desc":"Se centran en un caso: por qué este paciente tiene un riesgo alto o por qué esta imagen se clasifica como gato. Pueden dar la contribución de cada variable (SHAP, LIME), una regla que basta para sostener la predicción (Anchors), el cambio mínimo que la invertiría (contrafactuales) o casos parecidos de referencia (prototipos). Son las explicaciones que suelen necesitar las personas afectadas por una decisión.","cuando":"Para justificar decisiones individuales, revisar casos dudosos o depurar errores concretos del modelo.","ej":"Un sistema de cribado de currículos descarta una candidatura, y la explicación local muestra que pesaron sobre todo los años de experiencia y la falta de una certificación.","rel":["explicaciones-globales","shap","lime","explicaciones-contrafactuales","taxonomia-de-metodos-xai"],"children":[{"id":"perfiles-ceteris-paribus","name":"Perfiles Ceteris Paribus","en":"Ceteris Paribus profiles","frase":"Cómo cambiaría la predicción de un caso si se moviera una sola variable, con todo lo demás fijo.","desc":"Se toma una observación, se recorre una de sus variables por una rejilla de valores manteniendo las demás constantes (ceteris paribus significa \"lo demás igual\") y se calcula la predicción en cada punto. El perfil responde a preguntas de tipo qué pasaría si para ese caso concreto. Superponer los perfiles de muchas observaciones da las curvas ICE. Si la variable está muy correlacionada con otras, el perfil recorre combinaciones irreales.","cuando":"Para explorar cómo respondería el modelo a cambios en una variable para un caso concreto, por ejemplo al revisarlo con un experto.","ej":"Para un paciente de 55 años, el perfil muestra que su riesgo cardiovascular predicho bajaría del 18 % al 9 % si su presión sistólica pasara de 160 a 120.","hp":[["grid_points","número de valores en los que se evalúa cada variable"],["variable_splits_type","rejilla uniforme o basada en cuantiles"]],"py":[{"c":"dalex.Explainer","u":"https://dalex.drwhy.ai/python/api/#dalex.Explainer"},{"c":"dalex.Explainer.predict_profile","u":"https://dalex.drwhy.ai/python/api/#dalex.Explainer"}],"rel":["ice","pdp","explicaciones-contrafactuales","correlacion-de-pearson"]},{"id":"ice","name":"ICE (Individual Conditional Expectation)","en":"Individual Conditional Expectation (ICE)","frase":"Una curva por observación que muestra cómo cambia su predicción al variar una variable.","desc":"Las curvas ICE dibujan, para cada observación, la predicción del modelo al recorrer los valores de una variable con el resto fijo. Su media es el PDP. Verlas por separado revela efectos heterogéneos e interacciones que el promedio oculta, como curvas que suben para unos casos y bajan para otros. La versión centrada las alinea en su primer punto para comparar mejor sus formas.","cuando":"Junto al PDP, para comprobar si el efecto de una variable es el mismo para todos los casos o depende de otras variables.","ej":"En un modelo de precios de vivienda, las curvas ICE de la superficie suben con fuerza para los pisos del centro y apenas para los de las afueras, una interacción que el PDP promedio oculta.","hp":[["kind","individual dibuja solo las curvas ICE y both las superpone al PDP"],["centered","alinea las curvas en su primer punto"]],"py":[{"c":"sklearn.inspection.PartialDependenceDisplay.from_estimator","u":"https://scikit-learn.org/stable/modules/generated/sklearn.inspection.PartialDependenceDisplay.html#sklearn.inspection.PartialDependenceDisplay.from_estimator"}],"rel":["pdp","perfiles-ceteris-paribus","analisis-de-interacciones","ale"]},{"id":"lime","name":"LIME","en":"LIME (Local Interpretable Model-agnostic Explanations)","frase":"Explica una predicción ajustando un modelo lineal sencillo alrededor de ese caso con datos perturbados.","desc":"LIME genera muchas versiones perturbadas de la observación, por ejemplo cambiando valores, quitando palabras u ocultando zonas de una imagen, obtiene la predicción del modelo para cada una y ajusta un modelo lineal ponderado por su cercanía al caso original. Los coeficientes de ese modelo local son la explicación. Funciona con cualquier modelo y con tablas, texto o imágenes, pero sus resultados dependen del muestreo y de la anchura del vecindario.","cuando":"Para explicar predicciones individuales de cualquier modelo, sobre todo de texto o imágenes, cuando basta una aproximación local.","ej":"Un clasificador de reseñas marca una como negativa, y LIME señala las palabras decepcionante y nunca como las que más han pesado.","hp":[["kernel_width","anchura del vecindario que pondera las muestras"],["num_samples","número de muestras perturbadas"],["num_features","número de variables que muestra la explicación"]],"py":[{"c":"lime.lime_tabular.LimeTabularExplainer","u":"https://lime-ml.readthedocs.io/en/stable/lime.html#lime.lime_tabular.LimeTabularExplainer"},{"c":"lime.lime_tabular.LimeTabularExplainer.explain_instance","u":"https://lime-ml.readthedocs.io/en/stable/lime.html#lime.lime_tabular.LimeTabularExplainer.explain_instance"},{"c":"lime.lime_text.LimeTextExplainer","u":"https://lime-ml.readthedocs.io/en/stable/lime.html#lime.lime_text.LimeTextExplainer"}],"rel":["shap","anchors","modelo-subrogado-global","regresion-lineal","analisis-de-sentimiento"]},{"id":"anchors","name":"Anchors (reglas acotadas)","en":"Anchors (scoped rules)","frase":"Explica una predicción con una regla que la mantiene casi siempre, cambie lo que cambie el resto.","desc":"Un anchor es una regla, como edad > 60 y fumador, que mientras se cumpla sostiene la predicción aunque varíen las demás variables. El método busca reglas que alcancen una precisión mínima, por ejemplo del 95 %, y entre ellas prefiere las de mayor cobertura, es decir, las que se aplican a más casos. A diferencia de LIME, deja claro hasta dónde llega la explicación: fuera de la regla no promete nada.","cuando":"Para explicar predicciones individuales con reglas fáciles de comunicar y saber a qué otros casos se aplica la misma explicación.","ej":"Un modelo predice que un paciente faltará a su cita, y el anchor es \"cita pedida con más de 30 días de antelación y sin recordatorio\": cuando se cumple, la predicción se mantiene en el 96 % de los casos.","hp":[["threshold","precisión mínima que debe tener la regla"]],"py":[{"c":"alibi.explainers.AnchorTabular","u":"https://docs.seldon.ai/alibi-explain/explanations/methods/anchors"},{"c":"alibi.explainers.AnchorTabular.explain","u":"https://docs.seldon.ai/alibi-explain/explanations/methods/anchors"}],"rel":["lime","reglas-de-decision","explicaciones-contrafactuales","explicaciones-locales"]},{"id":"valores-de-shapley","name":"Valores de Shapley","en":"Shapley values","frase":"Reparto justo de un resultado entre jugadores según su contribución media en todas las coaliciones.","desc":"Vienen de la teoría de juegos cooperativos. El valor de Shapley de un jugador es su contribución marginal media al unirse a todas las coaliciones posibles de los demás. Es el único reparto que cumple a la vez eficiencia (las partes suman el total), simetría, jugador nulo y aditividad. En explicabilidad, los jugadores son las variables y el resultado es la predicción menos su valor medio; su cálculo exacto es exponencial en el número de variables.","cuando":"Para repartir una predicción entre las variables de cualquier modelo con un criterio con garantías; con muchas variables se estima por muestreo.","ej":"Dos voluntarios recogen por separado 10 y 20 kg de basura, y juntos 40 kg; el valor de Shapley reparte a partes iguales los 10 kg extra: 15 para el primero y 25 para el segundo.","hp":[["nsamples","número de coaliciones evaluadas en cada explicación, que gana precisión a cambio de tiempo"]],"py":[{"c":"shap.KernelExplainer","u":"https://shap.readthedocs.io/en/latest/generated/shap.KernelExplainer.html"},{"c":"shap.ExactExplainer","u":"https://shap.readthedocs.io/en/latest/generated/shap.ExactExplainer.html"}],"rel":["shap","lime","importancia-por-permutacion","analisis-de-interacciones"]},{"id":"shap","name":"SHAP","en":"SHAP (SHapley Additive exPlanations)","frase":"Explica cada predicción repartiéndola entre las variables según sus valores de Shapley.","desc":"SHAP expresa cada predicción como el valor medio del modelo más una contribución por variable, calculada con valores de Shapley. Tiene algoritmos rápidos para cada familia de modelos: exacto y eficiente para árboles (TreeSHAP), basado en gradientes para redes y basado en muestreo para cualquier modelo (KernelSHAP). Agregando las explicaciones locales se obtienen vistas globales, como la importancia media. Con variables correlacionadas, el reparto depende de cómo se simulan las ausentes.","cuando":"Como método de referencia para explicar modelos tabulares, sobre todo ensembles de árboles, tanto caso a caso como en conjunto.","ej":"Un modelo de gradient boosting predice 7,2 días de estancia hospitalaria para un paciente cuando la media es 4,5; SHAP atribuye +1,9 días a la edad, +1,2 a una cirugía previa y −0,4 a haber ingresado por la mañana.","py":[{"c":"shap.TreeExplainer","u":"https://shap.readthedocs.io/en/latest/generated/shap.TreeExplainer.html"},{"c":"shap.Explainer","u":"https://shap.readthedocs.io/en/latest/generated/shap.Explainer.html"},{"c":"shap.plots.waterfall","u":"https://shap.readthedocs.io/en/latest/generated/shap.plots.waterfall.html"},{"c":"shap.plots.beeswarm","u":"https://shap.readthedocs.io/en/latest/generated/shap.plots.beeswarm.html"}],"rel":["valores-de-shapley","xgboost-y-lightgbm","lime","importancia-por-permutacion","analisis-de-interacciones"]},{"id":"explicaciones-contrafactuales","name":"Explicaciones contrafactuales","en":"counterfactual explanations","frase":"El cambio más pequeño en las entradas que haría que el modelo diera otra respuesta.","desc":"Un contrafactual responde a qué tendría que haber sido distinto para obtener otro resultado. Se busca un punto cercano al original que cambie la predicción, con pocas variables modificadas, valores realistas y solo variables que la persona pueda cambiar: la edad o el país de nacimiento no deberían aparecer. Suelen generarse varios, diversos, para ofrecer alternativas, y no exigen revelar cómo funciona el modelo por dentro.","cuando":"Para dar a una persona afectada por una decisión automática una explicación accionable de cómo obtener otro resultado.","ej":"Un sistema de admisión rechaza a un estudiante, y el contrafactual indica que habría sido admitido con un 7,8 en matemáticas en lugar de un 7,1, o con un curso de verano adicional.","hp":[["method","estrategia de búsqueda (aleatoria, genética o por vecinos cercanos)"],["total_CFs","número de contrafactuales que se generan"],["features_to_vary","variables que se permite cambiar"]],"py":[{"c":"dice_ml.Dice","u":"https://interpret.ml/DiCE/dice_ml.html#dice_ml.Dice"},{"c":"dice_ml.Dice.generate_counterfactuals","u":"https://interpret.ml/DiCE/dice_ml.explainer_interfaces.html#dice_ml.explainer_interfaces.explainer_base.ExplainerBase.generate_counterfactuals"}],"rel":["perfiles-ceteris-paribus","anchors","decisiones-automatizadas-y-rgpd","ejemplos-adversarios","causalidad"]},{"id":"prototipos-y-excepciones","name":"Prototipos y excepciones","en":"prototypes & criticisms","frase":"Explicar unos datos o un modelo con casos reales representativos y con los que no encajan.","desc":"Los prototipos son observaciones reales que representan bien una parte de los datos; las excepciones (criticisms) son las que esos prototipos representan mal. Mostrar ambos ayuda a entender los datos y el comportamiento del modelo con ejemplos concretos, que a las personas les resultan más intuitivos que los pesos. Métodos como MMD-critic o ProtoSelect los eligen automáticamente, y una predicción puede justificarse con los casos de entrenamiento más parecidos.","cuando":"Para entender un conjunto de datos o un modelo a través de ejemplos, o para justificar una predicción con casos similares ya conocidos.","ej":"Un clasificador de razas de perro se resume con tres fotos prototipo por raza, y las excepciones muestran fotos de perros disfrazados o en blanco y negro que el modelo confunde.","hp":[["eps","radio dentro del cual un prototipo cubre a otros puntos"],["lambda_penalty","penalización por prototipo, que reduce cuántos se eligen"]],"py":[{"c":"alibi.prototypes.ProtoSelect","u":"https://docs.seldon.ai/alibi-explain/api-reference/prototypes/protoselect"}],"rel":["k-medoids-y-k-median","knn","explicaciones-locales","calidad-y-etiquetado-de-datos"]}]},{"id":"explicaciones-globales","name":"Explicaciones globales","en":"global explanations","frase":"Describen el comportamiento del modelo en conjunto: qué variables importan y cómo influyen.","desc":"Responden a preguntas sobre el modelo entero: qué variables usa más, qué forma tiene el efecto de cada una (lineal, con un umbral, en forma de U) y qué interacciones ha aprendido. Las herramientas habituales son la importancia por permutación, los gráficos PDP y ALE, el análisis de interacciones y los modelos subrogados. Sirven para validar el modelo con expertos, detectar fugas de datos o relaciones absurdas y documentarlo.","cuando":"Para validar un modelo antes de desplegarlo, detectar variables problemáticas o documentar cómo se comporta en general.","ej":"El análisis global de un modelo de reingresos hospitalarios revela que su variable más importante es el identificador del hospital, señal de una fuga de datos o de diferencias de registro entre centros.","rel":["explicaciones-locales","importancia-por-permutacion","pdp","fuga-de-datos","modelo-subrogado-global"],"children":[{"id":"pdp","name":"PDP (dependencia parcial)","en":"partial dependence plot (PDP)","frase":"El efecto medio de una variable: la predicción promedio al fijarla en cada uno de sus valores.","desc":"Se fija una variable en un valor para todas las observaciones, se promedian las predicciones y se repite a lo largo de una rejilla de valores. La curva resultante muestra el efecto medio de la variable y, con dos variables, su interacción en un mapa de calor. Es intuitivo, pero supone que la variable es independiente de las demás: si no lo es, evalúa combinaciones irreales. Además, el promedio oculta efectos heterogéneos.","cuando":"Para ver la forma del efecto medio de una o dos variables en cualquier modelo, si no están muy correlacionadas con el resto.","ej":"El PDP de un modelo de alquiler de bicicletas muestra que la demanda sube con la temperatura hasta unos 25 °C y baja a partir de ahí.","hp":[["grid_resolution","número de valores de la variable en los que se evalúa"],["percentiles","rango de la variable que se recorre, para evitar extremos con pocos datos"]],"py":[{"c":"sklearn.inspection.PartialDependenceDisplay.from_estimator","u":"https://scikit-learn.org/stable/modules/generated/sklearn.inspection.PartialDependenceDisplay.html#sklearn.inspection.PartialDependenceDisplay.from_estimator"},{"c":"sklearn.inspection.partial_dependence","u":"https://scikit-learn.org/stable/modules/generated/sklearn.inspection.partial_dependence.html"}],"rel":["ice","ale","perfiles-ceteris-paribus","gam","independencia-estadistica"]},{"id":"ale","name":"ALE (efectos locales acumulados)","en":"accumulated local effects (ALE)","frase":"El efecto de una variable calculado con diferencias locales, fiable aunque haya variables correlacionadas.","desc":"El gráfico ALE divide la variable en intervalos y, en cada uno, calcula cuánto cambia la predicción al mover la variable del extremo inferior al superior, usando solo las observaciones de ese intervalo; después acumula esas diferencias. Como trabaja con datos reales y cambios pequeños, evita las combinaciones irreales del PDP cuando hay correlación, y además es más rápido. A cambio, su lectura es algo menos intuitiva.","cuando":"En lugar del PDP cuando las variables están correlacionadas, que es lo habitual en datos reales.","ej":"En un modelo de precios de vivienda, superficie y número de habitaciones van juntas: el PDP evalúa pisos de 30 m² con cinco habitaciones, mientras que el ALE solo compara pisos parecidos a los reales.","hp":[["min_bin_points","número mínimo de observaciones por intervalo"]],"py":[{"c":"alibi.explainers.ALE","u":"https://docs.seldon.ai/alibi-explain/explanations/methods/ale"},{"c":"alibi.explainers.ALE.explain","u":"https://docs.seldon.ai/alibi-explain/explanations/methods/ale"}],"rel":["pdp","ice","correlacion-de-pearson","explicaciones-globales"]},{"id":"importancia-por-permutacion","name":"Importancia por permutación","en":"permutation feature importance","frase":"Cuánto empeora el modelo al barajar los valores de una variable y romper su relación con el objetivo.","desc":"Se mide el rendimiento del modelo, se permutan al azar los valores de una variable en los datos de evaluación y se vuelve a medir: la caída es su importancia. Funciona con cualquier modelo, es fácil de entender y, calculada sobre datos de test, refleja lo que el modelo usa para generalizar. Con variables correlacionadas reparte la importancia entre ellas y puede infravalorarlas, y al permutar crea combinaciones irreales.","cuando":"Para saber qué variables usa un modelo cualquiera, midiendo sobre validación o test en lugar de fiarse de la importancia interna de los árboles.","ej":"Al barajar la tensión arterial, el AUC de un modelo de riesgo cardiovascular cae de 0,84 a 0,71; al barajar el código postal, no cambia.","hp":[["n_repeats","número de permutaciones por variable, que se promedian"],["scoring","métrica cuya caída se mide"]],"py":[{"c":"sklearn.inspection.permutation_importance","u":"https://scikit-learn.org/stable/modules/generated/sklearn.inspection.permutation_importance.html"}],"rel":["seleccion-de-caracteristicas","random-forest","shap","metricas-de-evaluacion"]},{"id":"modelo-subrogado-global","name":"Modelo subrogado global","en":"global surrogate model","frase":"Un modelo interpretable entrenado para imitar las predicciones de una caja negra.","desc":"Se entrena un modelo sencillo, como un árbol poco profundo, usando como objetivo las predicciones del modelo complejo en lugar de las etiquetas reales. Si lo imita bien, sus reglas o coeficientes describen aproximadamente el comporta
