<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Mapa interactivo de IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Recursive:wght,MONO@300..1000,0..1&display=swap">
<style>
/* Layout: el mapa es un grafo de nodos y cables (como un editor de nodos de ML) sobre una retícula de puntos;
   la ficha del concepto vive fija a la derecha y, en móvil, en una hoja inferior. Áreas coloreadas con viridis. */
:root {
  --bg: #eef1f0;        /* lienzo: gris frío con sesgo hacia el teal del acento */
  --surface: #fbfcfc;   /* nodos, barra y panel */
  --ink: #13201e;       /* texto principal */
  --muted: #5a6a66;     /* texto secundario */
  --line: #cfd8d5;      /* bordes */
  --grid: #c2cdca;      /* puntos de la retícula */
  --accent: #1d7c77;    /* selección e interacción (teal de viridis, oscurecido) */
  --code-bg: #e9efed;
  --shadow: rgba(19, 32, 30, .16);
  --tip-bg: #16302c;    /* tarjeta flotante "en una frase": invertida respecto al lienzo */
  --tip-fg: #eef5f3;
  --font-ui: "Recursive", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "Recursive", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  /* 18 áreas en orden del árbol, muestreadas de la escala viridis (tramo legible sobre fondo claro) */
  --a0:#440154; --a1:#471365; --a2:#482475; --a3:#46337f; --a4:#414287; --a5:#3b518b;
  --a6:#355e8d; --a7:#2f6b8e; --a8:#2a778e; --a9:#26828e; --a10:#218f8d; --a11:#1e9b8a;
  --a12:#21a685; --a13:#2db27d; --a14:#40bd72; --a15:#58c765; --a16:#75d054; --a17:#95d840;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1312; --surface: #151d1c; --ink: #e2ebe9; --muted: #92a39f;
    --line: #283331; --grid: #22302d; --accent: #49beb2; --code-bg: #1d2826; --shadow: rgba(0, 0, 0, .5);
    --tip-bg: #e4efec; --tip-fg: #10201d;
    --a0:#433e85; --a1:#3e4c8a; --a2:#38598c; --a3:#31668e; --a4:#2c718e; --a5:#287d8e;
    --a6:#23898e; --a7:#1f948c; --a8:#1fa088; --a9:#25ac82; --a10:#34b679; --a11:#48c16e;
    --a12:#63cb5f; --a13:#7fd34e; --a14:#9dd93b; --a15:#c0df25; --a16:#dfe318; --a17:#fde725;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1312; --surface: #151d1c; --ink: #e2ebe9; --muted: #92a39f;
  --line: #283331; --grid: #22302d; --accent: #49beb2; --code-bg: #1d2826; --shadow: rgba(0, 0, 0, .5);
  --tip-bg: #e4efec; --tip-fg: #10201d;
  --a0:#433e85; --a1:#3e4c8a; --a2:#38598c; --a3:#31668e; --a4:#2c718e; --a5:#287d8e;
  --a6:#23898e; --a7:#1f948c; --a8:#1fa088; --a9:#25ac82; --a10:#34b679; --a11:#48c16e;
  --a12:#63cb5f; --a13:#7fd34e; --a14:#9dd93b; --a15:#c0df25; --a16:#dfe318; --a17:#fde725;
  color-scheme: dark;
}

html { box-sizing: border-box; height: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font: 400 14px/1.45 var(--font-ui); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); }

/* ---------- Barra superior ---------- */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 24px; padding: 12px 20px;
       background: var(--surface); border-bottom: 1px solid var(--line); position: relative; z-index: 5; }
.brand h1 { margin: 0; font: 850 22px/1.05 var(--font-ui); letter-spacing: -0.02em; }
.meta { margin: 4px 0 0; color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.pill { font-size: 11.5px; padding: 2px 8px; border-radius: 999px; border: 1px dashed var(--muted); color: var(--muted); }
.search { position: relative; flex: 1 1 260px; max-width: 440px; }
.search input { width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 7px;
                background: var(--bg); color: var(--ink); font: 450 14px/1.2 var(--font-ui); }
.search input::placeholder { color: var(--muted); }
#resultados { position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 30; margin: 0; padding: 4px;
              list-style: none; background: var(--surface); border: 1px solid var(--line); border-radius: 9px;
              box-shadow: 0 12px 32px var(--shadow); max-height: min(60vh, 440px); overflow: auto; }
#resultados button { display: grid; grid-template-columns: 8px minmax(0, 1fr) auto; column-gap: 10px; row-gap: 2px;
                     align-items: baseline; width: 100%; padding: 8px 10px; border: 0;
                     border-radius: 6px; background: none; text-align: left; cursor: pointer; }
#resultados button[aria-selected="true"], #resultados button:hover { background: var(--bg); }
#resultados .dot { align-self: center; }
.r-name { min-width: 0; font-weight: 560; }
.r-area { color: var(--muted); font-size: 12px; text-align: right; max-width: 14em; }
.r-frase { grid-column: 2 / 4; color: var(--muted); font-size: 12.5px; line-height: 1.35;
           white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#resultados .vacio { padding: 10px; color: var(--muted); }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-left: auto; }
.btn { padding: 8px 11px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface);
       font-size: 13px; line-height: 1; cursor: pointer; }
.btn:hover:not(:disabled) { border-color: var(--muted); }
.btn:disabled { opacity: .45; cursor: default; }
.zoom { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); }
.zoom button { width: 32px; height: 31px; border: 0; background: none; font-size: 16px; cursor: pointer; }
#z-nivel { min-width: 48px; text-align: center; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* ---------- Escenario: mapa + ficha ---------- */
.stage { display: grid; grid-template-columns: minmax(0, 1fr) clamp(330px, 31vw, 440px); min-height: 0; }
.viewport { overflow: auto; min-height: 0; overscroll-behavior: contain;
            background-color: var(--bg);
            background-image: radial-gradient(circle at 1px 1px, var(--grid) 1.1px, transparent 1.5px);
            background-size: 22px 22px; background-attachment: local; }
.sizer { position: relative; }
.canvas { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#wires { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
.w { fill: none; stroke-width: 1.4; opacity: .4; }
.w.on { opacity: 1; stroke-width: 2.6; }
.w.draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .4s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }

/* Nodos: caja con puerto de entrada (izquierda) y de salida (derecha, solo si tiene hijos) */
.node { position: absolute; left: 0; top: 0; width: 216px; display: flex; align-items: center; gap: 8px;
        padding: 8px 14px 8px 13px; border: 1px solid var(--line); border-radius: 7px;
        background: var(--surface); font: 430 13.5px/1.3 var(--font-ui); text-align: left; cursor: pointer; }
.node:hover { border-color: var(--muted); }
.node .label { flex: 1; min-width: 0; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.node .nw { white-space: nowrap; }
.node .count { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.port { position: absolute; top: 50%; width: 10px; height: 10px; margin-top: -5px; border-radius: 50%;
        background: var(--c, var(--accent)); }
.port.in { left: -5.5px; }
.port.out { right: -5.5px; background: var(--surface); border: 2px solid var(--c, var(--accent)); }
.node.open .port.out { background: var(--c, var(--accent)); }
.node.d0 { width: 168px; padding: 14px 16px; border-color: var(--ink); font: 850 17px/1.15 var(--font-ui); letter-spacing: -0.01em; }
.node.d0 .port.in { display: none; }
.node.d1 { font-weight: 640; font-size: 14.5px; }
.node.pending .label { color: var(--muted); }
.node.pending { border-style: dashed; }
.node.path { border-color: var(--c, var(--accent)); }
.node.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent);
            background: color-mix(in oklab, var(--accent) 9%, var(--surface)); }
.node.sel .label { color: var(--ink); }
.node.enter { animation: entra .3s cubic-bezier(.2, .7, .2, 1) both; animation-delay: calc(var(--i, 0) * 14ms); }
@keyframes entra { from { opacity: 0; translate: -14px 0; } to { opacity: 1; translate: 0 0; } }

/* "En una frase": tarjeta flotante al pasar el ratón (o enfocar con teclado). No captura el ratón. */
.tip { position: fixed; z-index: 40; max-width: 300px; padding: 10px 13px 11px; border-radius: 9px;
       background: var(--tip-bg); color: var(--tip-fg); box-shadow: 0 10px 28px var(--shadow);
       font-size: 13.5px; line-height: 1.42; pointer-events: none;
       opacity: 0; translate: 0 -3px; transition: opacity .14s ease, translate .14s ease; }
.tip.down { translate: 0 3px; }
.tip.on { opacity: 1; translate: 0 0; }
.tip p { margin: 0; display: flex; gap: 9px; align-items: baseline; }
.tip .dot { position: relative; top: -1px; }
.tip::before { content: ""; position: absolute; left: var(--ax, 24px); width: 10px; height: 10px; margin-left: -5px;
               background: var(--tip-bg); transform: rotate(45deg); }
.tip:not(.down)::before { top: -4px; }
.tip.down::before { bottom: -4px; }

/* ---------- Ficha ---------- */
.panel { position: relative; min-height: 0; overflow: auto; background: var(--surface); border-left: 1px solid var(--line); }
.handle { display: none; }
#ficha { padding: 22px 26px 30px; max-width: 64ch; }
.crumbs { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 6px; font-size: 12.5px; color: var(--muted); }
.crumbs button { padding: 0; border: 0; background: none; color: var(--muted); cursor: pointer; text-align: left; }
.crumbs button:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
#ficha h2 { margin: 10px 0 0; font: 800 27px/1.1 var(--font-ui); letter-spacing: -0.02em; text-wrap: balance; }
.area-tag { display: inline-flex; align-items: center; gap: 7px; margin-top: 8px; font-size: 12.5px; color: var(--muted); }
.en { margin: 4px 0 0; color: var(--muted); font-size: 13.5px; }
.lead { margin: 14px 0 0; font-size: 17px; font-weight: 520; line-height: 1.42; text-wrap: pretty; }
.desc { margin: 12px 0 0; font-size: 15px; line-height: 1.6; }
.blk { margin-top: 22px; }
.blk h3 { margin: 0 0 8px; font: 650 13px/1.2 var(--font-ui); color: var(--muted); }
.blk > p { margin: 0; font-size: 14.5px; line-height: 1.55; }
.cuando { padding: 12px 14px 13px; border-radius: 9px; background: color-mix(in oklab, var(--accent) 9%, var(--surface)); }
.cuando h3 { color: var(--accent); }
.hp { display: grid; grid-template-columns: minmax(0, max-content) minmax(0, 1fr); gap: 7px 14px; margin: 0; font-size: 14px; line-height: 1.45; }
.hp dt { min-width: 0; }
.hp dt code { display: inline-block; padding: 2px 6px; border-radius: 5px; background: var(--code-bg); font-size: 12.5px; overflow-wrap: anywhere; }
.hp dd { margin: 0; min-width: 0; color: var(--ink); }
.pending-note { margin: 16px 0 0; padding: 12px 14px; border: 1px dashed var(--line); border-radius: 8px; color: var(--muted); }
code { font-family: var(--font-mono); font-variation-settings: "MONO" 1; font-size: .92em; }
.desc code, .ej code { padding: 1px 5px; border-radius: 4px; background: var(--code-bg); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px 5px 9px; border: 1px solid var(--line);
        border-radius: 999px; background: var(--bg); font-size: 12.5px; line-height: 1.25; text-align: left; cursor: pointer; }
.chip:hover { border-color: var(--c, var(--muted)); }
.dot { width: 8px; height: 8px; flex: none; border-radius: 50%; background: var(--c, var(--accent)); }
.py { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.py li { display: flex; align-items: center; gap: 8px; min-width: 0; padding: 5px 5px 5px 11px; border-radius: 7px; background: var(--code-bg); }
.py code { flex: 1; min-width: 0; overflow-x: auto; white-space: nowrap; font-size: 12.5px; padding-block: 3px; }
.copy, .docs { flex: none; display: inline-flex; align-items: center; gap: 5px; padding: 5px 9px; border: 1px solid var(--line);
               border-radius: 6px; background: var(--surface); color: var(--ink); font-size: 12px; line-height: 1.2;
               text-decoration: none; cursor: pointer; }
.copy:hover, .docs:hover { border-color: var(--muted); }
.docs svg { width: 11px; height: 11px; }
.seq { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 30px; padding-top: 14px; border-top: 1px solid var(--line); }
.seq .pos { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.foot { margin-top: 18px; color: var(--muted); font-size: 12px; line-height: 1.5; }
.foot kbd { font-family: var(--font-mono); font-variation-settings: "MONO" 1; padding: 0 4px; border: 1px solid var(--line); border-radius: 4px; }

/* ---------- Móvil: la ficha pasa a una hoja inferior (asomada / abierta) ---------- */
@media (max-width: 860px) {
  .bar { padding: 10px 16px; gap: 10px 12px; }
  .brand { flex: 1 1 auto; min-width: 0; }
  .brand h1 { font-size: 19px; }
  .tools { flex: none; align-self: flex-start; }
  .search { order: 3; flex-basis: 100%; max-width: none; }
  .btn-rama, .zoom { display: none; }
  .stage { grid-template-columns: minmax(0, 1fr); }
  /* Hoja inferior en dos tiempos: asomada (nombre + frase) y abierta (ficha completa) */
  .sizer { margin-bottom: calc(var(--peek, 84px) + 16px); }
  .panel { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; max-height: 78%;
           border-left: 0; border-top: 1px solid var(--line); border-radius: 14px 14px 0 0;
           box-shadow: 0 -10px 30px var(--shadow); padding-bottom: env(safe-area-inset-bottom, 0px);
           transform: translateY(calc(100% - var(--peek, 84px) - env(safe-area-inset-bottom, 0px))); transition: transform .3s ease; }
  .panel[data-state="open"] { transform: none; }
  .handle { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 12px; width: 100%;
            padding: 16px 18px 12px; border: 0; border-bottom: 1px solid var(--line); background: var(--surface); text-align: left; cursor: pointer; }
  .handle::before { content: ""; position: absolute; top: 6px; left: 50%; width: 36px; height: 4px; margin-left: -18px; border-radius: 2px; background: var(--line); }
  .peek-text { flex: 1; min-width: 0; display: grid; gap: 2px; }
  #peek-title { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #peek-frase { color: var(--muted); font-size: 13px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #peek-accion { flex: none; color: var(--accent); font-size: 13px; font-weight: 600; }
  .panel[data-state="open"] #peek-frase { display: none; }
  .tip { display: none; }
  #ficha { padding: 16px 18px 26px; }
  #ficha h2 { font-size: 23px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand">
      <h1>Mapa interactivo de IA</h1>
      <p class="meta"><span>Conceptos, herramientas y guía de uso</span><span class="pill" id="m-estado" hidden></span></p>
    </div>
    <div class="search" role="search">
      <label for="q" class="sr">Buscar un concepto</label>
      <input id="q" type="search" placeholder="Buscar un concepto" autocomplete="off" spellcheck="false"
             role="combobox" aria-expanded="false" aria-controls="resultados" aria-autocomplete="list">
      <ul id="resultados" role="listbox" hidden></ul>
    </div>
    <div class="tools">
      <button class="btn" id="b-general" type="button">Vista general</button>
      <button class="btn btn-rama" id="b-rama" type="button">Expandir rama</button>
      <div class="zoom" role="group" aria-label="Zoom del mapa">
        <button id="z-menos" type="button" aria-label="Alejar">−</button>
        <span id="z-nivel" aria-live="polite">100 %</span>
        <button id="z-mas" type="button" aria-label="Acercar">+</button>
      </div>
    </div>
  </header>

  <main class="stage">
    <div class="viewport" id="viewport" aria-label="Mapa de conceptos">
      <div class="sizer" id="sizer">
        <div class="canvas" id="canvas">
          <svg id="wires" aria-hidden="true"></svg>
          <div id="nodes"></div>
        </div>
      </div>
    </div>
    <aside class="panel" id="panel" data-state="peek" aria-labelledby="ficha-titulo">
      <button class="handle" id="handle" type="button" aria-controls="ficha" aria-expanded="false">
        <span class="peek-text"><span id="peek-title"></span><span id="peek-frase"></span></span><span id="peek-accion">Ver ficha</span>
      </button>
      <article id="ficha"></article>
    </aside>
  </main>
</div>

<script type="application/json" id="datos">{"id":"inteligencia-artificial","name":"Inteligencia artificial","en":"artificial intelligence","frase":"Sistemas que perciben, razonan, aprenden o generan contenido; hoy casi siempre aprendiendo de datos.","desc":"Campo que construye sistemas capaces de realizar tareas que asociamos con la inteligencia: percibir, razonar, aprender, predecir o generar contenido. Casi toda la IA actual se basa en aprendizaje automático, es decir, en modelos que aprenden patrones a partir de datos en lugar de seguir reglas escritas a mano.","ej":"Un asistente que entiende tu pregunta, busca en documentos y redacta la respuesta combina varias ramas de este mapa: lenguaje, recuperación de información y agentes.","rel":["ia-ml-dl","breve-historia-de-la-ia","cuatro-ingredientes"],"children":[{"id":"fundamentos","name":"Fundamentos","en":"foundations","frase":"Las ideas comunes a todo modelo: aprender de los datos y generalizar a casos nuevos.","desc":"Las ideas que comparten todos los modelos: aprender de los datos optimizando un objetivo y generalizar a casos que el modelo no ha visto. Aquí están también los paradigmas de aprendizaje y las nociones de distancia y similitud que reaparecen por todo el mapa.","ej":"Un modelo que acierta el 99 % en entrenamiento y el 70 % con datos nuevos ilustra el problema central de la disciplina: el sobreajuste.","rel":["generalizacion","cuatro-ingredientes","paradigmas-de-aprendizaje"],"children":[{"id":"ia-ml-dl","name":"IA, machine learning y deep learning: cómo encajan"},{"id":"programacion-vs-ml","name":"Programación clásica vs aprendizaje automático"},{"id":"breve-historia-de-la-ia","name":"Breve historia de la IA"},{"id":"cuatro-ingredientes","name":"Los cuatro ingredientes: datos, modelo, objetivo y optimización"},{"id":"parametros-e-hiperparametros","name":"Parámetros e hiperparámetros"},{"id":"teoria-de-la-decision","name":"Teoría de la decisión","children":[{"id":"riesgo-de-bayes","name":"Riesgo de Bayes"},{"id":"minimizacion-del-riesgo-empirico","name":"Minimización del riesgo empírico"}]},{"id":"generalizacion","name":"Generalización","children":[{"id":"sobreajuste","name":"Sobreajuste (overfitting)"},{"id":"infraajuste","name":"Infraajuste (underfitting)"},{"id":"compromiso-sesgo-varianza","name":"Compromiso sesgo-varianza"},{"id":"regularizacion","name":"Regularización (idea general)"}]},{"id":"distancia-y-similitud","name":"Distancia y similitud","children":[{"id":"distancia-euclidea","name":"Distancia euclídea (L2)"},{"id":"distancia-manhattan","name":"Distancia Manhattan (L1) y normas Lp"},{"id":"similitud-coseno","name":"Similitud coseno"},{"id":"distancia-de-mahalanobis","name":"Distancia de Mahalanobis"}]},{"id":"paradigmas-de-aprendizaje","name":"Paradigmas de aprendizaje","children":[{"id":"aprendizaje-semisupervisado","name":"Aprendizaje semisupervisado","children":[{"id":"cluster-then-label","name":"Cluster-then-label"}]},{"id":"supervision-debil","name":"Supervisión débil","children":[{"id":"etiquetas-ruidosas","name":"Etiquetas ruidosas"},{"id":"etiquetas-parciales","name":"Etiquetas parciales"},{"id":"proporciones-de-etiquetas","name":"Aprendizaje con proporciones de etiquetas"}]},{"id":"aprendizaje-activo","name":"Aprendizaje activo"},{"id":"aprendizaje-online","name":"Aprendizaje online"}]}]},{"id":"probabilidad-informacion-y-causalidad","name":"Probabilidad, información y causalidad","en":"probability, information theory & causality","frase":"Las matemáticas para razonar con incertidumbre, medir información y separar causa de correlación.","desc":"El lenguaje matemático de la incertidumbre. La probabilidad permite razonar con datos ruidosos. La teoría de la información mide cuánta información contiene una variable y cuánta comparte con otra. Los modelos gráficos y la causalidad ayudan a distinguir qué influye en qué, más allá de la simple correlación.","cuando":"Cuando necesitas cuantificar la incertidumbre, medir cuánto dependen unas variables de otras o razonar sobre causas y efectos.","ej":"Que dos variables estén correlacionadas no dice cuál causa la otra. Los métodos de descubrimiento causal intentan orientar esa flecha a partir de los datos.","rel":["teorema-de-bayes","entropia","red-bayesiana","correlacion-no-implica-causalidad"],"children":[{"id":"probabilidad-y-estadistica","name":"Probabilidad y estadística","children":[{"id":"probabilidad-frecuentista-vs-bayesiana","name":"Probabilidad frecuentista vs bayesiana"},{"id":"probabilidad-condicional","name":"Probabilidad condicional"},{"id":"teorema-de-bayes","name":"Teorema de Bayes"},{"id":"prior-verosimilitud-y-posterior","name":"Prior, verosimilitud y posterior"},{"id":"distribuciones-de-probabilidad","name":"Distribuciones de probabilidad"},{"id":"maxima-verosimilitud","name":"Máxima verosimilitud (MLE)"},{"id":"nll","name":"Log-verosimilitud negativa (NLL)"},{"id":"contraste-de-hipotesis","name":"Contraste de hipótesis","children":[{"id":"p-valor","name":"p-valor"},{"id":"intervalo-de-confianza","name":"Intervalo de confianza"},{"id":"test-chi-cuadrado","name":"Test chi-cuadrado"}]}]},{"id":"teoria-de-la-informacion","name":"Teoría de la información","children":[{"id":"informacion-shannon","name":"Información (Shannon)"},{"id":"entropia","name":"Entropía"},{"id":"divergencia-de-kullback-leibler","name":"Divergencia de Kullback-Leibler"},{"id":"informacion-mutua","name":"Información mutua"},{"id":"correlacion-total","name":"Correlación total"}]},{"id":"medidas-de-dependencia","name":"Medidas de dependencia","children":[{"id":"independencia-estadistica","name":"Independencia estadística"},{"id":"correlacion-de-pearson","name":"Correlación de Pearson"},{"id":"correlacion-de-spearman","name":"Correlación de Spearman"},{"id":"icc","name":"Coeficiente de correlación de información (ICC)"},{"id":"hsic","name":"HSIC (dependencia con kernels)"},{"id":"dependencia-condicional","name":"Dependencia condicional"}]},{"id":"modelos-graficos-probabilisticos","name":"Modelos gráficos probabilísticos","children":[{"id":"red-bayesiana","name":"Red bayesiana"},{"id":"aprendizaje-de-estructura","name":"Aprendizaje de estructura","children":[{"id":"algoritmo-pc","name":"Algoritmo PC"},{"id":"hill-climbing","name":"Búsqueda por ascenso de colinas (hill climbing)"}]},{"id":"regresion-lineal-bayesiana","name":"Regresión lineal bayesiana"},{"id":"hmm","name":"Modelo oculto de Márkov (HMM)"}]},{"id":"causalidad","name":"Causalidad","children":[{"id":"correlacion-no-implica-causalidad","name":"Correlación no implica causalidad"},{"id":"correlacion-espuria","name":"Correlación espuria"},{"id":"causalidad-de-granger","name":"Causalidad de Granger"},{"id":"informacion-dirigida","name":"Información dirigida"},{"id":"modelos-de-ruido-aditivo","name":"Modelos de ruido aditivo (causalidad desde residuos)"},{"id":"descubrimiento-causal","name":"Descubrimiento causal"}]}]},{"id":"flujo-de-trabajo-en-ml","name":"Flujo de trabajo en ML","en":"ML workflow","frase":"Todo lo que rodea al modelo: datos, validación, métricas, ajuste y puesta en producción.","desc":"Todo lo que rodea al modelo en un proyecto real: preparar los datos, separar entrenamiento y test, elegir métricas, ajustar hiperparámetros, desplegar y vigilar el modelo en producción. Los errores de esta parte, como la fuga de datos o una métrica mal elegida, suelen pesar más que la elección del algoritmo.","ej":"Un detector de fraude con un 99,9 % de accuracy puede ser inútil si solo el 0,1 % de las operaciones son fraudes; aquí la métrica que importa es el recall o la curva precisión-recall.","rel":["ciclo-de-vida-ml","fuga-de-datos","validacion-cruzada","mlops"],"children":[{"id":"ciclo-de-vida-ml","name":"Ciclo de vida de un proyecto de ML"},{"id":"linea-base","name":"Línea base (baseline)"},{"id":"datos-y-preprocesado","name":"Datos y preprocesado","children":[{"id":"eda","name":"Análisis exploratorio (EDA) y auditoría de datos"},{"id":"calidad-y-etiquetado-de-datos","name":"Calidad y etiquetado de datos"},{"id":"valores-faltantes-e-imputacion","name":"Valores faltantes e imputación"},{"id":"outliers","name":"Valores atípicos (outliers)"},{"id":"escalado-de-variables","name":"Escalado de variables","children":[{"id":"estandarizacion","name":"Estandarización (z-score)"},{"id":"normalizacion-min-max","name":"Normalización min-max"}]},{"id":"transformaciones-de-distribucion","name":"Transformaciones de distribución (log, cuantiles)"},{"id":"codificacion-de-variables-categoricas","name":"Codificación de variables categóricas"},{"id":"feature-engineering","name":"Ingeniería de características (feature engineering)"},{"id":"desbalanceo-de-clases","name":"Desbalanceo de clases","children":[{"id":"sobremuestreo","name":"Sobremuestreo (SMOTE, ADASYN)"},{"id":"submuestreo-y-ponderacion-de-clases","name":"Submuestreo y ponderación de clases"}]},{"id":"fuga-de-datos","name":"Fuga de datos (data leakage)"},{"id":"data-augmentation","name":"Aumento de datos (data augmentation)"},{"id":"pipelines-de-preprocesado","name":"Pipelines de preprocesado"}]},{"id":"particion-y-validacion","name":"Partición y validación","children":[{"id":"entrenamiento-validacion-y-test","name":"Entrenamiento, validación y test"},{"id":"validacion-cruzada","name":"Validación cruzada (k-fold)"},{"id":"validacion-en-series-temporales","name":"Validación en series temporales"}]},{"id":"metricas-de-evaluacion","name":"Métricas de evaluación","children":[{"id":"funcion-de-perdida-vs-metrica","name":"Función de pérdida vs métrica"},{"id":"metricas-de-regresion","name":"Métricas de regresión","children":[{"id":"mse-rmse-y-mae","name":"MSE, RMSE y MAE"},{"id":"r2","name":"Coeficiente de determinación (R²)"}]},{"id":"metricas-de-clasificacion","name":"Métricas de clasificación","children":[{"id":"matriz-de-confusion","name":"Matriz de confusión"},{"id":"accuracy","name":"Exactitud (accuracy) y exactitud balanceada"},{"id":"precision-y-recall","name":"Precisión y recall"},{"id":"f1-score","name":"F1-score"},{"id":"curva-roc-y-auc","name":"Curva ROC y AUC"},{"id":"curva-precision-recall","name":"Curva precisión-recall"},{"id":"umbral-de-decision","name":"Umbral de decisión"},{"id":"promedios-macro-y-micro","name":"Promedios macro y micro"}]}]},{"id":"ajuste-de-hiperparametros-y-automl","name":"Ajuste de hiperparámetros y AutoML","children":[{"id":"busqueda-en-rejilla-y-aleatoria","name":"Búsqueda en rejilla y aleatoria"},{"id":"optimizacion-bayesiana-de-hiperparametros","name":"Optimización bayesiana de hiperparámetros"},{"id":"automl","name":"AutoML"},{"id":"nas","name":"Búsqueda de arquitecturas neuronales (NAS)"}]},{"id":"despliegue-y-mlops","name":"Despliegue y MLOps","children":[{"id":"mlops","name":"MLOps"},{"id":"despliegue-e-inferencia","name":"Despliegue e inferencia"},{"id":"deriva-de-datos","name":"Monitorización y deriva de datos"}]},{"id":"herramientas-y-hardware","name":"Herramientas y hardware","children":[{"id":"gpu-y-tpu","name":"GPU y TPU"},{"id":"frameworks-de-ml","name":"Frameworks de ML (scikit-learn, Keras/TensorFlow, PyTorch, JAX)"},{"id":"hugging-face","name":"Hugging Face (Hub y librerías)"},{"id":"seguimiento-de-experimentos","name":"Seguimiento de experimentos (TensorBoard, W&B)"}]}]},{"id":"aprendizaje-supervisado","name":"Aprendizaje supervisado","en":"supervised learning","frase":"Aprender a predecir una respuesta conocida a partir de ejemplos etiquetados.","desc":"El modelo aprende, a partir de ejemplos etiquetados (X, y), una función que asigna una salida a cada entrada, y después la aplica para predecir casos nuevos. Si la salida es un número, el problema es de regresión; si es una categoría, de clasificación. Es el paradigma más usado en la industria.","cuando":"Cuando tienes ejemplos históricos con la respuesta correcta y quieres predecirla en casos nuevos.","ej":"Con miles de correos marcados como spam o no spam, entrenar un modelo que filtre los correos nuevos. Con viviendas ya vendidas, predecir el precio de una nueva.","py":[{"c":"modelo.fit(X_train, y_train)","s":1},{"c":"modelo.predict(X_test)","s":1}],"rel":["regresion-vs-clasificacion","aprendizaje-no-supervisado","entrenamiento-validacion-y-test","funcion-de-perdida-vs-metrica"],"children":[{"id":"regresion-vs-clasificacion","name":"Regresión vs clasificación","en":"regression vs classification","frase":"Predecir un número (regresión) o una categoría (clasificación).","desc":"Son los dos tipos de problema supervisado. En regresión la salida es un valor numérico continuo, como un precio o una temperatura. En clasificación es una categoría, como spam/no spam o la especie de una flor. Muchos clasificadores devuelven en realidad una probabilidad por clase, y la etiqueta final sale de aplicar un umbral.","ej":"Predecir el precio de una vivienda es regresión. Predecir si se venderá en menos de un mes es clasificación binaria.","py":[{"c":"sklearn.linear_model.LinearRegression","u":"https://scikit-learn.org/stable/modules/generated/sklearn.linear_model.LinearRegression.html"},{"c":"sklearn.linear_model.LogisticRegression","u":"https://scikit-learn.org/stable/modules/generated/sklearn.linear_model.LogisticRegression.html"}],"rel":["metricas-de-regresion","metricas-de-clasificacion","umbral-de-decision","regresion-logistica"]},{"id":"clasificacion-multiclase-y-multietiqueta","name":"Clasificación multiclase y multietiqueta","en":"multiclass & multilabel classification","frase":"Elegir una clase entre varias, o asignar varias etiquetas a la vez.","desc":"En la clasificación multiclase cada ejemplo pertenece a una sola de K clases, y el modelo suele dar K probabilidades con una softmax. En la multietiqueta un ejemplo puede tener varias etiquetas a la vez, y cada una se predice por separado con una sigmoide. La estrategia One-vs-Rest convierte cualquier clasificador binario en multiclase entrenando un modelo por clase.","cuando":"Cuando hay más de dos clases posibles o cada ejemplo puede tener varias etiquetas simultáneas.","ej":"Reconocer qué dígito del 0 al 9 aparece en una imagen es multiclase. Etiquetar una película como \"comedia\" y \"romántica\" a la vez es multietiqueta.","py":[{"c":"sklearn.multiclass.OneVsRestClassifier","u":"https://scikit-learn.org/stable/modules/generated/sklearn.multiclass.OneVsRestClassifier.html"},{"c":"sklearn.multioutput.MultiOutputClassifier","u":"https://scikit-learn.org/stable/modules/generated/sklearn.multioutput.MultiOutputClassifier.html"}],"rel":["softmax","promedios-macro-y-micro","entropia-cruzada","regresion-logistica"]},{"id":"modelos-lineales","name":"Modelos lineales","en":"linear models","frase":"Predicción como suma ponderada de las variables: simple, rápida e interpretable.","desc":"Modelos cuya predicción es una combinación lineal de las variables, ŷ = w₀ + w₁x₁ + … + wₙxₙ, a veces pasada por una función como la sigmoide. Son rápidos, estables e interpretables, porque cada peso indica el efecto de su variable. Suelen ser la primera línea base que conviene probar.","cuando":"Como primera línea base y cuando necesitas un modelo fácil de explicar con relaciones aproximadamente lineales.","ej":"Estimar el consumo de un coche a partir de su peso y su potencia, y leer directamente cuántos litros añade cada 100 kg.","py":[{"c":"sklearn.linear_model","u":"https://scikit-learn.org/stable/api/sklearn.linear_model.html"}],"rel":["regresion-lineal","regresion-logistica","glm","linea-base"],"children":[{"id":"regresion-lineal","name":"Regresión lineal (mínimos cuadrados)","en":"linear regression (ordinary least squares)","frase":"La recta que mejor se ajusta a los datos minimizando el error al cuadrado.","desc":"Ajusta la recta o el hiperplano que minimiza la suma de los errores al cuadrado entre predicción y valor real. Tiene solución analítica (las ecuaciones normales), aunque también se puede resolver por descenso por gradiente. Supone relación lineal, errores independientes y varianza constante.","cuando":"Para predecir una variable numérica cuando la relación es aproximadamente lineal o necesitas interpretar el efecto de cada variable.","ej":"Predecir el precio de una vivienda como una constante más 2.000 € por m² y 15.000 € por cada habitación.","py":[{"c":"sklearn.linear_model.LinearRegression","u":"https://scikit-learn.org/stable/modules/generated/sklearn.linear_model.LinearRegression.html"},{"c":"statsmodels.api.OLS","u":"https://www.statsmodels.org/stable/generated/statsmodels.regression.linear_model.OLS.html"}],"rel":["mse-rmse-y-mae","ridge-lasso-y-elastic-net","descenso-por-gradiente","regresion-lineal-bayesiana"]},{"id":"regresion-polinomica-e-interacciones","name":"Regresión polinómica e interacciones","en":"polynomial regression & interaction terms","frase":"Añadir potencias y productos de variables para captar curvas e interacciones.","desc":"Extiende el modelo lineal añadiendo como variables nuevas potencias (x², x³) y productos entre variables (x₁·x₂). Sigue siendo lineal en los parámetros, pero capta curvas e interacciones, es decir, efectos de una variable que dependen del valor de otra. Con muchos términos crece el riesgo de sobreajuste.","cuando":"Cuando un modelo lineal se queda corto porque la relación es curva o el efecto de una variable depende de otra.","ej":"La publicidad puede vender más en temporada alta. El término publicidad × temporada recoge esa interacción.","hp":[["degree","grado del polinomio; más grado, más flexibilidad y más riesgo de sobreajuste"],["interaction_only","genera solo productos entre variables, sin potencias"]],"py":[{"c":"sklearn.preprocessing.PolynomialFeatures","u":"https://scikit-learn.org/stable/modules/generated/sklearn.preprocessing.PolynomialFeatures.html"}],"rel":["regresion-lineal","feature-engineering","sobreajuste","gam"]},{"id":"ridge-lasso-y-elastic-net","name":"Ridge, Lasso y Elastic Net","en":"Ridge, Lasso & Elastic Net","frase":"Regresión lineal con penalización de los pesos para evitar el sobreajuste.","desc":"Versiones regularizadas de la regresión lineal que penalizan los pesos grandes para reducir el sobreajuste. Ridge (L2) encoge todos los coeficientes hacia cero. Lasso (L1) lleva algunos exactamente a cero, y con ello selecciona variables. Elastic Net combina ambas penalizaciones. La fuerza de la penalización, α, es un hiperparámetro.","cuando":"Cuando tienes muchas variables, correlacionadas entre sí o con pocos datos; Lasso, además, cuando quieres que el modelo seleccione variables.","ej":"Con 500 variables candidatas y pocos datos, Lasso se queda con las 20 que tienen efecto real y anula el resto.","hp":[["alpha","fuerza de la penalización; más alta, coeficientes más pequeños"],["l1_ratio","en Elastic Net, mezcla de penalizaciones (0 = Ridge, 1 = Lasso)"]],"py":[{"c":"sklearn.linear_model.Ridge","u":"https://scikit-learn.org/stable/modules/generated/sklearn.linear_model.Ridge.html"},{"c":"sklearn.linear_model.Lasso","u":"https://scikit-learn.org/stable/modules/generated/sklearn.linear_model.Lasso.html"},{"c":"sklearn.linear_model.ElasticNet","u":"https://scikit-learn.org/stable/modules/generated/sklearn.linear_model.ElasticNet.html"}],"rel":["regularizacion","regresion-lineal","metodos-integrados","penalizacion-l1-y-l2"]},{"id":"regresion-logistica","name":"Regresión logística","en":"logistic regression","frase":"Modelo lineal que convierte una suma ponderada en la probabilidad de una clase.","desc":"Modelo lineal de clasificación binaria. Calcula una combinación lineal de las variables y la transforma con la sigmoide en una probabilidad entre 0 y 1. Se entrena minimizando la entropía cruzada, lo que equivale a máxima verosimilitud. Sus coeficientes se leen en log-odds, por eso se usa mucho cuando hay que explicar las decisiones.","cuando":"Para clasificación binaria como línea base sólida, sobre todo si necesitas probabilidades fiables y explicar el peso de cada variable.","ej":"Estimar la probabilidad de que un paciente tenga diabetes a partir de su edad, su IMC y su glucosa, y marcarlo como positivo si supera 0,5.","hp":[["C","inversa de la regularización; más pequeño, modelo más simple"],["l1_ratio","tipo de penalización (0 = L2, 1 = L1, valores intermedios = Elastic Net)"],["class_weight","compensa clases desbalanceadas (\"balanced\")"]],"py":[{"c":"sklearn.linear_model.LogisticRegression","u":"https://scikit-learn.org/stable/modules/generated/sklearn.linear_model.LogisticRegression.html"}],"rel":["odds-y-odds-ratio","sigmoide-y-tanh","entropia-cruzada","glm"],"children":[{"id":"odds-y-odds-ratio","name":"Odds y odds ratio","en":"odds & odds ratio","frase":"Por cuánto se multiplican las probabilidades a favor de un suceso al cambiar una variable.","desc":"Las odds son el cociente p/(1−p) entre la probabilidad de que ocurra un suceso y la de que no ocurra. En la regresión logística, cada coeficiente β dice cuánto cambian las log-odds por cada unidad de su variable. e^β es el odds ratio, el factor por el que se multiplican las odds; un odds ratio de 2 significa que se duplican.","cuando":"Para interpretar y comunicar el efecto de cada variable en una regresión logística.","ej":"Si fumar tiene un odds ratio de 3 en un modelo de enfermedad cardíaca, las odds de un fumador triplican las de un no fumador con el resto de variables iguales.","py":[{"c":"np.exp(modelo.coef_)","s":1}],"rel":["regresion-logistica","modelos-interpretables-por-diseno","intervalo-de-confianza"]}]},{"id":"glm","name":"Modelos lineales generalizados (GLM)","en":"generalized linear models","frase":"Regresión lineal generalizada a conteos, proporciones o cantidades positivas mediante una función de enlace.","desc":"Generalizan la regresión lineal a respuestas que no siguen una normal. Conectan una combinación lineal de las variables con la media de la respuesta mediante una función de enlace, y suponen una distribución de la familia exponencial. La regresión lineal (enlace identidad, normal) y la logística (logit, binomial) son casos particulares; la de Poisson modela conteos.","cuando":"Cuando la variable a predecir no es normal: conteos (Poisson), sí/no (binomial) o cantidades positivas y asimétricas (gamma).","ej":"Predecir cuántos siniestros tendrá un conductor en un año con una regresión de Poisson y enlace logarítmico.","hp":[["alpha","fuerza de la regularización en los modelos de scikit-learn"],["family","distribución de la respuesta y su enlace en statsmodels (Poisson, Binomial, Gamma)"]],"py":[{"c":"sklearn.linear_model.PoissonRegressor","u":"https://scikit-learn.org/stable/modules/generated/sklearn.linear_model.PoissonRegressor.html"},{"c":"statsmodels.api.GLM","u":"https://www.statsmodels.org/stable/generated/statsmodels.genmod.generalized_linear_model.GLM.html"}],"rel":["regresion-lineal","regresion-logistica","glmm","gam"]},{"id":"glmm","name":"Modelos mixtos (GLMM)","en":"(generalized) linear mixed models","frase":"Modelos lineales con efectos aleatorios para datos agrupados o medidas repetidas.","desc":"Modelos lineales (o generalizados) que añaden efectos aleatorios para datos agrupados, jerárquicos o con medidas repetidas. Los efectos fijos son comunes a todos los datos, mientras que los aleatorios dejan que cada grupo (un paciente, un colegio, una tienda) tenga su propia desviación. Así se recoge la correlación entre observaciones del mismo grupo.","cuando":"Cuando las observaciones vienen en grupos (pacientes, colegios, tiendas) que comparten características dentro de cada grupo.","ej":"Analizar las notas de alumnos de muchos colegios dejando que cada colegio tenga su propio nivel de partida (intercepto aleatorio).","hp":[["groups","variable que define los grupos"],["re_formula","qué efectos varían de un grupo a otro (por defecto, solo el intercepto)"]],"py":[{"c":"statsmodels.formula.api.mixedlm","u":"https://www.statsmodels.org/stable/generated/statsmodels.formula.api.mixedlm.html"},{"c":"statsmodels.genmod.bayes_mixed_glm.BinomialBayesMixedGLM","u":"https://www.statsmodels.org/stable/generated/statsmodels.genmod.bayes_mixed_glm.BinomialBayesMixedGLM.html"}],"rel":["glm","regresion-lineal-bayesiana","modelos-interpretables-por-diseno"]},{"id":"gam","name":"Modelos aditivos generalizados (GAM)","en":"generalized additive models","frase":"Suma de curvas suaves, una por variable: no lineal pero interpretable.","desc":"Sustituyen cada término lineal βⱼxⱼ por una función suave fⱼ(xⱼ), normalmente un spline, y suman los efectos: g(E[y]) = β₀ + f₁(x₁) + … + fₙ(xₙ). Captan relaciones no lineales sin perder interpretabilidad, porque el efecto de cada variable se puede dibujar por separado.","cuando":"Cuando las relaciones no son lineales pero necesitas ver y explicar el efecto de cada variable por separado.","ej":"Modelar el riesgo de hospitalización según la edad con una curva en U, más alta en niños y ancianos, algo que una recta no puede captar.","hp":[["n_splines","número de tramos de cada curva; más tramos, curvas más flexibles"],["lam","penalización de la rugosidad; más alta, curvas más suaves"]],"py":[{"c":"pygam.LinearGAM","u":"https://github.com/dswah/pyGAM"},{"c":"interpret.glassbox.ExplainableBoostingClassifier","u":"https://interpret.ml/docs/ebm.html"}],"rel":["glm","ebm","regresion-polinomica-e-interacciones"]}]},{"id":"knn","name":"k vecinos más cercanos (k-NN)","en":"k-nearest neighbors","frase":"Predice copiando a los k ejemplos más parecidos.","desc":"Para predecir un caso nuevo, busca los k ejemplos de entrenamiento más cercanos según una distancia. Después vota su clase (clasificación) o promedia su valor (regresión). No entrena ningún modelo: memoriza los datos, y el coste está en la predicción. Es sensible a la escala de las variables y a la maldición de la dimensionalidad.","cuando":"Con conjuntos pequeños o medianos y pocas variables, cuando los casos parecidos suelen tener resultados parecidos.","ej":"Estimar el alquiler de un piso promediando el de los 5 pisos más parecidos en tamaño, barrio y planta.","hp":[["n_neighbors","número de vecinos; pocos, predicción nerviosa; muchos, predicción suavizada"],["weights","si los vecinos cercanos pesan más (distance) o todos igual (uniform)"],["metric","distancia con la que se mide el parecido"]],"py":[{"c":"sklearn.neighbors.KNeighborsClassifier","u":"https://scikit-learn.org/stable/modules/generated/sklearn.neighbors.KNeighborsClassifier.html"},{"c":"sklearn.neighbors.KNeighborsRegressor","u":"https://scikit-learn.org/stable/modules/generated/sklearn.neighbors.KNeighborsRegressor.html"}],"rel":["distancia-y-similitud","escalado-de-variables","maldicion-de-la-dimensionalidad","busqueda-por-similitud"]},{"id":"arboles-de-decision","name":"Árboles de decisión","en":"decision trees","frase":"Una cadena de preguntas sí/no que termina en una predicción.","desc":"Dividen el espacio de las variables con preguntas sucesivas del tipo \"¿x₃ > 5?\" hasta llegar a hojas que dan la predicción. Se leen como un diagrama de flujo, captan no linealidades e interacciones y no necesitan escalar los datos. Su punto débil es la inestabilidad, porque pequeños cambios en los datos cambian mucho el árbol, y la tendencia a sobreajustar si crece demasiado.","cuando":"Cuando necesitas reglas fáciles de explicar, o como pieza base de ensembles como Random Forest y gradient boosting.","ej":"Triaje en urgencias: \"¿fiebre > 39 °C?\" → sí → \"¿dificultad para respirar?\" → sí → prioridad alta.","hp":[["max_depth","profundidad máxima; limita la complejidad del árbol"],["min_samples_leaf","mínimo de ejemplos por hoja; suaviza las predicciones"],["criterion","medida de impureza para elegir las divisiones (gini, entropy)"]],"py":[{"c":"sklearn.tree.DecisionTreeClassifier","u":"https://scikit-learn.org/stable/modules/generated/sklearn.tree.DecisionTreeClassifier.html"},{"c":"sklearn.tree.DecisionTreeRegressor","u":"https://scikit-learn.org/stable/modules/generated/sklearn.tree.DecisionTreeRegressor.html"},{"c":"sklearn.tree.plot_tree","u":"https://scikit-learn.org/stable/modules/generated/sklearn.tree.plot_tree.html"}],"rel":["criterios-de-division","poda-y-criterios-de-parada","random-forest","gradient-boosting"],"children":[{"id":"criterios-de-division","name":"Criterios de división: Gini y entropía","en":"split criteria: Gini impurity & entropy","frase":"Cómo elige el árbol la mejor pregunta: la que deja los grupos más puros.","desc":"En cada nodo, el árbol elige la variable y el umbral que dejan los grupos resultantes lo más puros posible. En clasificación, la impureza se mide con el índice de Gini (la probabilidad de clasificar mal un elemento al azar) o con la entropía; la ganancia de información es cuánto reduce la entropía una división. En regresión se usa la reducción de la varianza (MSE).","ej":"Un nodo con un 50 % de cada clase tiene un Gini de 0,5. Si una división lo parte en dos nodos 90/10, cada uno baja a 0,18.","py":[{"c":"sklearn.tree.DecisionTreeClassifier(criterion=\"gini\" | \"entropy\")","u":"https://scikit-learn.org/stable/modules/generated/sklearn.tree.DecisionTreeClassifier.html"}],"rel":["arboles-de-decision","entropia","informacion-mutua"]},{"id":"poda-y-criterios-de-parada","name":"Poda y criterios de parada","en":"pruning & stopping criteria","frase":"Frenar o recortar el crecimiento del árbol para que no memorice el ruido.","desc":"Un árbol que crece sin límite acaba con casi una hoja por ejemplo y memoriza el ruido. Se evita parando antes (profundidad máxima, mínimo de muestras por hoja o mejora mínima exigida) o podando después: se construye el árbol completo y se quitan las ramas que no mejoran la validación, por ejemplo con la poda por coste-complejidad.","cuando":"Siempre que entrenes un árbol individual, para controlar el sobreajuste.","ej":"Limitar la profundidad a 4 baja algo el acierto en entrenamiento, pero a menudo mejora el de test.","hp":[["ccp_alpha","intensidad de la poda por coste-complejidad"],["max_depth","profundidad máxima del árbol"],["min_samples_split","mínimo de ejemplos para dividir un nodo"]],"py":[{"c":"sklearn.tree.DecisionTreeClassifier(max_depth=…, min_samples_leaf=…, ccp_alpha=…)","u":"https://scikit-learn.org/stable/modules/generated/sklearn.tree.DecisionTreeClassifier.html"}],"rel":["arboles-de-decision","sobreajuste","compromiso-sesgo-varianza"]}]},{"id":"metodos-kernel","name":"Métodos kernel","en":"kernel methods","frase":"Resolver problemas no lineales con herramientas lineales trabajando con similitudes entre puntos.","desc":"Familia de métodos que trabajan con similitudes entre pares de puntos, llamadas kernels, en lugar de con las variables originales. Equivale a proyectar los datos a un espacio de muchas más dimensiones, donde un problema no lineal se vuelve lineal, sin llegar a calcular esa proyección. Aquí entran las SVM, las SVR, la kernel ridge regression y los procesos gaussianos.","cuando":"Con conjuntos pequeños o medianos y fronteras no lineales, cuando no hay datos suficientes para una red neuronal.","ej":"Dos clases dispuestas en círculos concéntricos no se separan con una recta, pero un kernel RBF las separa sin problema.","py":[{"c":"sklearn.metrics.pairwise.rbf_kernel","u":"https://scikit-learn.org/stable/modules/generated/sklearn.metrics.pairwise.rbf_kernel.html"}],"rel":["truco-del-kernel","svm","procesos-gaussianos","hsic"],"children":[{"id":"truco-del-kernel","name":"Truco del kernel","en":"kernel trick","frase":"Calcular similitudes como si los datos vivieran en un espacio enorme, sin construirlo.","desc":"Muchos algoritmos solo necesitan productos escalares entre puntos. Si se sustituyen por una función kernel k(x, x′), el resultado es el mismo que si los datos se hubieran transformado a un espacio de mayor dimensión, pero sin construir esa transformación. Los kernels más comunes son el lineal, el polinómico y el RBF (gaussiano).","ej":"El kernel RBF mide la similitud como exp(−γ‖x−x′‖²), lo que equivale a trabajar en un espacio de dimensión infinita.","py":[{"c":"sklearn.svm.SVC(kernel=\"rbf\")","u":"https://scikit-learn.org/stable/modules/generated/sklearn.svm.SVC.html"}],"rel":["metodos-kernel","svm","distancia-euclidea"]},{"id":"svm","name":"Máquinas de vectores soporte (SVM)","en":"support vector machines","frase":"Separa las clases con la frontera de máximo margen.","desc":"Clasificador que busca el hiperplano que separa las clases con el máximo margen, es decir, lo más lejos posible de los puntos más cercanos de cada clase (los vectores soporte). Con margen blando, controlado por el parámetro C, tolera algunos errores, y con kernels traza fronteras no lineales. Rinde muy bien con conjuntos medianos y de alta dimensión.","cuando":"Para clasificar conjuntos pequeños o medianos, incluso con muchísimas variables, como textos o datos genómicos.","ej":"Clasificar noticias en deportes o política a partir de miles de variables TF-IDF fue durante años terreno clásico de las SVM lineales.","hp":[["C","cuánto se penalizan los errores; alto, frontera más pegada a los datos"],["kernel","forma de la frontera (linear, rbf, poly)"],["gamma","alcance de cada punto en el kernel RBF; alto, frontera más irregular"]],"py":[{"c":"sklearn.svm.SVC","u":"https://scikit-learn.org/stable/modules/generated/sklearn.svm.SVC.html"},{"c":"sklearn.svm.LinearSVC","u":"https://scikit-learn.org/stable/modules/generated/sklearn.svm.LinearSVC.html"}],"rel":["truco-del-kernel","svr","regresion-logistica","tf-idf"]},{"id":"svr","name":"Regresión de vectores soporte (SVR)","en":"support vector regression","frase":"Regresión que ignora los errores pequeños y penaliza solo los grandes.","desc":"Versión de las SVM para regresión. Ajusta una función que deja la mayoría de los puntos dentro de un tubo de anchura ε alrededor de la predicción y solo penaliza los que quedan fuera. Ignorar los errores pequeños la hace robusta al ruido, y con kernels capta relaciones no lineales.","cuando":"Para regresión no lineal con conjuntos pequeños o medianos y datos con ruido moderado.","ej":"Predecir la demanda horaria de un servicio de bicicletas con un kernel RBF, sin penalizar desviaciones menores de 5 bicis (ε = 5).","hp":[["C","cuánto se penalizan los errores fuera del tubo"],["epsilon","anchura del tubo de errores tolerados"],["kernel","forma de la función (linear, rbf, poly)"],["gamma","alcance de cada punto en el kernel RBF"]],"py":[{"c":"sklearn.svm.SVR","u":"https://scikit-learn.org/stable/modules/generated/sklearn.svm.SVR.html"}],"rel":["svm","truco-del-kernel","kernel-ridge-regression"]},{"id":"kernel-ridge-regression","name":"Kernel ridge regression","en":"kernel ridge regression","frase":"Regresión Ridge con kernels: no lineal y con solución exacta.","desc":"Combina la regresión Ridge con el truco del kernel: una regresión lineal regularizada en el espacio que induce el kernel, con solución cerrada. Su predicción coincide con la media de un proceso gaussiano equivalente, pero no da incertidumbre. En conjuntos medianos suele entrenar más rápido que una SVR.","cuando":"Para regresión no lineal y suave con hasta unos pocos miles de datos.","ej":"Ajustar una curva suave y no lineal a 2.000 medidas de un sensor con un kernel RBF y una sola línea de código.","hp":[["alpha","fuerza de la regularización"],["kernel","tipo de kernel (rbf, polynomial, linear)"],["gamma","alcance del kernel"]],"py":[{"c":"sklearn.kernel_ridge.KernelRidge","u":"https://scikit-learn.org/stable/modules/generated/sklearn.kernel_ridge.KernelRidge.html"}],"rel":["ridge-lasso-y-elastic-net","truco-del-kernel","procesos-gaussianos","svr"]},{"id":"procesos-gaussianos","name":"Procesos gaussianos (GP)","en":"Gaussian processes","frase":"Predicciones acompañadas de su incertidumbre, modelando una distribución sobre funciones.","desc":"Modelo bayesiano no paramétrico que define una distribución sobre funciones: cualquier conjunto de puntos sigue una normal multivariante cuya covarianza la marca un kernel. Al condicionar en los datos, cada predicción nueva sale acompañada de su incertidumbre. Escala mal con muchos datos, porque su coste crece con el cubo de n.","cuando":"Cuando tienes pocos datos y necesitas saber cuánto fiarte de cada predicción, como en la optimización bayesiana o en experimentos caros.","ej":"En la optimización bayesiana de hiperparámetros, un GP modela el rendimiento del modelo en función de los hiperparámetros y propone dónde probar a continuación.","hp":[["kernel","forma de la covarianza (RBF, Matern o periódico)"],["alpha","ruido supuesto en las observaciones"],["n_restarts_optimizer","reinicios al ajustar los parámetros del kernel"]],"py":[{"c":"sklearn.gaussian_process.GaussianProcessRegressor","u":"https://scikit-learn.org/stable/modules/generated/sklearn.gaussian_process.GaussianProcessRegressor.html"}],"rel":["metodos-kernel","kernel-ridge-regression","optimizacion-bayesiana-de-hiperparametros","incertidumbre"]}]},{"id":"ensembles","name":"Ensembles","en":"ensemble methods","frase":"Combinar varios modelos para que juntos acierten más que cada uno.","desc":"Combinan varios modelos para lograr predicciones más precisas y estables que las de cualquiera de ellos por separado. Hay tres estrategias principales. El bagging entrena modelos en paralelo sobre remuestreos y promedia, y reduce la varianza. El boosting entrena en secuencia corrigiendo errores, y reduce el sesgo. El stacking aprende cómo combinar los modelos.","cuando":"Cuando quieres exprimir el rendimiento o estabilizar un modelo inestable; con datos tabulares son la opción más competitiva.","ej":"En las competiciones de Kaggle con datos tabulares, las soluciones ganadoras suelen ser ensembles de varios modelos de gradient boosting.","py":[{"c":"sklearn.ensemble","u":"https://scikit-learn.org/stable/api/sklearn.ensemble.html"}],"rel":["bagging","boosting","stacking","por-que-funcionan-los-ensembles"],"children":[{"id":"por-que-funcionan-los-ensembles","name":"Por qué funcionan los ensembles","en":"why ensembles work","frase":"Si los modelos se equivocan de forma distinta, al combinarlos los errores se compensan.","desc":"Si los modelos se equivocan de forma distinta, con errores poco correlacionados, al combinarlos esos errores se compensan: baja la varianza del promedio y el voto mayoritario acierta más que cada miembro. Por eso la diversidad (distintos datos, variables o algoritmos) importa tanto como la calidad individual.","ej":"Cinco clasificadores independientes que aciertan un 70 % cada uno llegan a cerca de un 84 % votando por mayoría.","rel":["compromiso-sesgo-varianza","bagging","combinacion-por-votacion"]},{"id":"combinacion-por-votacion","name":"Combinación por votación (mayoría, Borda, BKS)","en":"voting: majority, Borda count, BKS","frase":"Cada modelo vota una clase y gana la opción más respaldada.","desc":"Formas de combinar las etiquetas que predicen varios clasificadores. En el voto por mayoría gana la clase más votada, y el voto puede ponderarse según la calidad de cada modelo. En el recuento de Borda cada modelo ordena las clases y se suman puntos según la posición. El Behavior Knowledge Space (BKS) asigna, con una tabla aprendida en entrenamiento, la clase real más frecuente a cada combinación de votos.","cuando":"Cuando ya tienes varios clasificadores razonables y diversos y quieres combinarlos de la forma más sencilla.","ej":"Tres modelos votan \"gato\", \"gato\" y \"perro\": por mayoría, la predicción final es \"gato\".","hp":[["voting","hard (vota la etiqueta) o soft (promedia las probabilidades)"],["weights","peso de cada modelo en la votación"]],"py":[{"c":"sklearn.ensemble.VotingClassifier","u":"https://scikit-learn.org/stable/modules/generated/sklearn.ensemble.VotingClassifier.html"}],"rel":["combinadores-algebraicos","stacking","ensembles"]},{"id":"combinadores-algebraicos","name":"Combinadores algebraicos","en":"algebraic combiners","frase":"Promediar, multiplicar o tomar la mediana de las probabilidades de varios modelos.","desc":"Combinan las salidas continuas de los modelos, como probabilidades o puntuaciones, con una operación algebraica: media, media ponderada, mediana, máximo, mínimo o producto. La media es robusta y casi siempre funciona bien. El producto castiga mucho a cualquier modelo muy seguro de que la clase es incorrecta, y la mediana resiste a los modelos atípicos.","cuando":"Cuando los modelos dan probabilidades o puntuaciones y quieres combinarlas sin entrenar nada más.","ej":"Promediar las probabilidades de fraude de tres modelos (0,9, 0,6 y 0,7) da 0,73, que después se compara con el umbral.","hp":[["weights","peso de cada modelo en la media"]],"py":[{"c":"sklearn.ensemble.VotingClassifier(voting=\"soft\")","u":"https://scikit-learn.org/stable/modules/generated/sklearn.ensemble.VotingClassifier.html"}],"rel":["combinacion-por-votacion","stacking","ensembles"]},{"id":"stacking","name":"Stacking","en":"stacked generalization","frase":"Un metamodelo aprende a combinar las predicciones de otros modelos.","desc":"También llamado generalización apilada. Entrena varios modelos base y, encima, un metamodelo que aprende a combinar sus predicciones. Para que el metamodelo no aprenda de predicciones sobreajustadas, se entrena con predicciones fuera de muestra obtenidas por validación cruzada. Suele aportar mejoras pequeñas a cambio de más complejidad.","cuando":"Cuando tienes modelos diversos con rendimientos parecidos y quieres sacar la última mejora de precisión.","ej":"Combinar un Random Forest, un XGBoost y una red neuronal mediante una regresión logística que aprende cuánto fiarse de cada uno.","hp":[["final_estimator","el metamodelo que combina las predicciones"],["cv","cómo se generan las predicciones fuera de muestra"],["passthrough","si el metamodelo ve también las variables originales"]],"py":[{"c":"sklearn.ensemble.StackingClassifier","u":"https://scikit-learn.org/stable/modules/generated/sklearn.ensemble.StackingClassifier.html"},{"c":"sklearn.ensemble.StackingRegressor","u":"https://scikit-learn.org/stable/modules/generated/sklearn.ensemble.StackingRegressor.html"}],"rel":["combinacion-por-votacion","validacion-cruzada","mezcla-de-expertos","fuga-de-datos"]},{"id":"mezcla-de-expertos","name":"Mezcla de expertos (MoE)","en":"mixture of experts","frase":"Expertos especializados y una compuerta que decide a cuál escuchar en cada caso.","desc":"Varios modelos expertos se especializan en distintas regiones del espacio de entrada, y una red de compuerta (gating) decide cuánto pesa cada uno para cada entrada concreta. A diferencia de un voto fijo, la combinación depende de la entrada. Hoy es una pieza clave de muchos LLMs: en cada capa solo se activan unos pocos expertos por token, lo que permite modelos enormes con un coste de cómputo moderado.","cuando":"Cuando los datos tienen regímenes muy distintos y conviene especializar un modelo en cada uno; en los LLMs, para crecer sin multiplicar el cómputo.","ej":"Mixtral 8x7B tiene 8 expertos por capa y activa 2 en cada token, de modo que solo usa una fracción de sus parámetros en cada paso.","rel":["stacking","ensembles","llm"]},{"id":"bagging","name":"Bagging","en":"bootstrap aggregating","frase":"Muchos modelos entrenados con remuestreos de los datos y promediados.","desc":"Abreviatura de bootstrap aggregating. Entrena muchos modelos del mismo tipo, cada uno con una muestra bootstrap (con reemplazo) de los datos, y promedia o vota sus predicciones. Reduce sobre todo la varianza, por eso funciona muy bien con modelos inestables como los árboles profundos. Los ejemplos que no entran en cada muestra (out-of-bag) permiten estimar el error sin un conjunto de validación aparte.","cuando":"Cuando tu modelo base es potente pero inestable, como un árbol profundo, y quieres reducir su varianza.","ej":"Entrenar 100 árboles de regresión, cada uno con un remuestreo distinto de los datos, y promediar sus predicciones del precio de una casa.","hp":[["n_estimators","número de modelos"],["max_samples","tamaño de cada remuestreo"],["max_features","fracción de variables que ve cada modelo"]],"py":[{"c":"sklearn.ensemble.BaggingClassifier","u":"https://scikit-learn.org/stable/modules/generated/sklearn.ensemble.BaggingClassifier.html"},{"c":"sklearn.ensemble.BaggingRegressor","u":"https://scikit-learn.org/stable/modules/generated/sklearn.ensemble.BaggingRegressor.html"}],"rel":["random-forest","por-que-funcionan-los-ensembles","compromiso-sesgo-varianza","arboles-de-decision"]},{"id":"random-forest","name":"Random Forest","en":"random forest","frase":"Muchos árboles distintos que votan: más estable y preciso que uno solo.","desc":"Bagging de árboles de decisión con un ingrediente extra: en cada división el árbol solo puede elegir entre un subconjunto aleatorio de variables. Eso hace que los árboles se parezcan menos entre sí y que el promedio sea más eficaz. Es robusto, necesita poco ajuste y ofrece de serie una estimación del error (out-of-bag) y de la importancia de cada variable.","cuando":"Como primera opción robusta con datos tabulares, cuando quieres buen rendimiento con muy poco ajuste.","ej":"Clasificar los usos del suelo (cultivo, bosque, ciudad) en imágenes de satélite con 500 árboles, cada uno entrenado con datos y variables distintos.","hp":[["n_estimators","número de árboles; más árboles estabilizan el resultado a cambio de tiempo"],["max_features","variables candidatas en cada división; cuantas menos, más distintos son los árboles"],["max_depth","profundidad máxima de cada árbol"],["min_samples_leaf","mínimo de ejemplos por hoja; suaviza las predicciones"]],"py":[{"c":"sklearn.ensemble.RandomForestClassifier","u":"https://scikit-learn.org/stable/modules/generated/sklearn.ensemble.RandomForestClassifier.html"},{"c":"sklearn.ensemble.RandomForestRegressor","u":"https://scikit-learn.org/stable/modules/generated/sklearn.ensemble.RandomForestRegressor.html"}],"rel":["bagging","arboles-de-decision","importancia-por-permutacion","gradient-boosting"]},{"id":"boosting","name":"Boosting","en":"boosting","frase":"Modelos débiles en cadena, cada uno corrigiendo los errores del anterior.","desc":"Construye el ensemble en secuencia: cada nuevo modelo débil, normalmente un árbol pequeño, se centra en los errores de los anteriores, y la predicción final es una suma ponderada de todos. Reduce sobre todo el sesgo. Es la familia más potente para datos tabulares, aunque más sensible al ruido y a los hiperparámetros que el bagging.","cuando":"Cuando buscas la máxima precisión con datos tabulares y puedes dedicar tiempo a ajustar hiperparámetros.","ej":"Cada árbol nuevo corrige un poco lo que los anteriores predijeron mal, hasta sumar cientos de árboles pequeños que juntos son muy precisos.","hp":[["max_iter","número de árboles (iteraciones)"],["learning_rate","cuánto aporta cada árbol"],["max_leaf_nodes","tamaño de cada árbol"]],"py":[{"c":"sklearn.ensemble.HistGradientBoostingClassifier","u":"https://scikit-learn.org/stable/modules/generated/sklearn.ensemble.HistGradientBoostingClassifier.html"}],"rel":["adaboost","gradient-boosting","xgboost-y-lightgbm","bagging"],"children":[{"id":"adaboost","name":"AdaBoost","en":"adaptive boosting","frase":"Boosting que da más peso, en cada ronda, a los ejemplos mal clasificados.","desc":"Adaptive Boosting, propuesto por Freund y Schapire. Entrena clasificadores débiles en secuencia y, tras cada uno, sube el peso de los ejemplos mal clasificados para que el siguiente se fije más en ellos. Cada clasificador recibe un peso según su error, y la predicción final es un voto ponderado. Equivale a minimizar una pérdida exponencial.","cuando":"Con clasificadores débiles muy simples y datos poco ruidosos, cuando quieres un boosting clásico y ligero.","ej":"En el detector de caras de Viola-Jones, AdaBoost combina miles de rasgos muy simples, cada uno apenas mejor que el azar, en un detector rápido y preciso.","hp":[["n_estimators","número de clasificadores débiles"],["learning_rate","cuánto aporta cada uno"],["estimator","el modelo débil (por defecto, un árbol de un solo nivel)"]],"py":[{"c":"sklearn.ensemble.AdaBoostClassifier","u":"https://scikit-learn.org/stable/modules/generated/sklearn.ensemble.AdaBoostClassifier.html"},{"c":"sklearn.ensemble.AdaBoostRegressor","u":"https://scikit-learn.org/stable/modules/generated/sklearn.ensemble.AdaBoostRegressor.html"}],"rel":["boosting","gradient-boosting","combinacion-por-votacion"]},{"id":"gradient-boosting","name":"Gradient Boosting","en":"gradient boosting","frase":"Cada árbol nuevo corrige el error que dejan los anteriores, como un descenso por gradiente.","desc":"Generaliza el boosting a cualquier función de pérdida diferenciable. Cada árbol nuevo se ajusta al gradiente negativo de la pérdida (con MSE, simplemente a los residuos) y se suma al modelo multiplicado por una tasa de aprendizaje pequeña. Es, en esencia, descenso por gradiente en el espacio de funciones.","cuando":"Con datos tabulares cuando necesitas la máxima precisión, para regresión, clasificación o ranking.","ej":"Predecir el tiempo de entrega de un pedido: el primer árbol da una estimación gruesa y cada uno de los 300 siguientes corrige parte del error que queda.","hp":[["n_estimators","número de árboles"],["learning_rate","tamaño de cada paso; más bajo, más árboles y mejor generalización"],["max_depth","profundidad de cada árbol"],["subsample","fracción de datos por árbol; por debajo de 1 añade aleatoriedad y regulariza"]],"py":[{"c":"sklearn.ensemble.GradientBoostingRegressor","u":"https://scikit-learn.org/stable/modules/generated/sklearn.ensemble.GradientBoostingRegressor.html"},{"c":"sklearn.ensemble.HistGradientBoostingRegressor","u":"https://scikit-learn.org/stable/modules/generated/sklearn.ensemble.HistGradientBoostingRegressor.html"}],"rel":["boosting","xgboost-y-lightgbm","descenso-por-gradiente","learning-rate"]},{"id":"xgboost-y-lightgbm","name":"XGBoost y LightGBM","en":"XGBoost & LightGBM","frase":"Gradient boosting industrial: rápido, escalable y estándar con datos tabulares.","desc":"Implementaciones muy optimizadas de gradient boosting y estándar de facto con datos tabulares. XGBoost añade regularización en los árboles, manejo nativo de valores faltantes y paralelización. LightGBM acelera el entrenamiento agrupando las variables en histogramas y haciendo crecer los árboles hoja a hoja. CatBoost, una tercera opción, destaca con variables categóricas.","cuando":"Con datos tabulares medianos o grandes, cuando quieres el mejor rendimiento en un tiempo de entrenamiento razonable.","ej":"Predecir qué usuarios harán clic en un anuncio a partir de millones de registros y cientos de variables, con un entrenamiento de minutos en LightGBM.","hp":[["n_estimators","número de árboles"],["learning_rate","tamaño del paso de cada árbol"],["max_depth / num_leaves","tamaño de cada árbol (en XGBoost / en LightGBM)"],["subsample / colsample_bytree","fracción de filas / de columnas que ve cada árbol"],["reg_lambda","regularización L2 de las hojas"]],"py":[{"c":"xgboost.XGBClassifier","u":"https://xgboost.readthedocs.io/en/stable/python/python_api.html#xgboost.XGBClassifier"},{"c":"lightgbm.LGBMClassifier","u":"https://lightgbm.readthedocs.io/en/stable/pythonapi/lightgbm.LGBMClassifier.html"}],"rel":["gradient-boosting","valores-faltantes-e-imputacion","shap","codificacion-de-variables-categoricas"]}]}]}]},{"id":"aprendizaje-no-supervisado","name":"Aprendizaje no supervisado","en":"unsupervised learning","frase":"Descubrir estructura en datos sin etiquetas: grupos, dimensiones ocultas o densidades.","desc":"Aprender la estructura de los datos sin etiquetas. Agrupa casos parecidos (clustering), comprime muchas variables en pocas (reducción de dimensionalidad) o estima cómo se distribuyen los datos (densidad). Las etiquetas son caras y los datos sin etiquetar abundan, así que resulta clave para explorar y para preparar otros modelos.","cuando":"Cuando no tienes etiquetas y quieres explorar los datos, agruparlos, resumirlos o prepararlos para otro modelo.","ej":"Segmentar a los clientes de una tienda online en grupos con hábitos de compra parecidos sin decirle al algoritmo qué grupos buscar.","rel":["clustering","reduccion-de-la-dimensionalidad","estimacion-de-densidad","aprendizaje-autosupervisado"],"children":[{"id":"reduccion-de-la-dimensionalidad","name":"Reducción de la dimensionalidad","children":[{"id":"maldicion-de-la-dimensionalidad","name":"Maldición de la dimensionalidad"},{"id":"seleccion-de-caracteristicas","name":"Selección de características","children":[{"id":"metodos-filtro","name":"Métodos filtro (filter)"},{"id":"metodos-envoltorio","name":"Métodos envoltorio (wrapper)"},{"id":"metodos-integrados","name":"Métodos integrados (embedded)"}]},{"id":"extraccion-de-caracteristicas","name":"Extracción de características"},{"id":"pca","name":"PCA (análisis de componentes principales)"},{"id":"ica","name":"ICA (análisis de componentes independientes)"},{"id":"lda","name":"LDA (análisis discriminante lineal)"},{"id":"mds","name":"MDS (escalado multidimensional)"},{"id":"manifold-learning","name":"Aprendizaje de variedades (manifold learning)","children":[{"id":"lle-y-pca-local","name":"LLE y PCA local"},{"id":"isomap","name":"Isomap"},{"id":"t-sne","name":"t-SNE"},{"id":"umap","name":"UMAP"},{"id":"curvas-principales","name":"Curvas principales"}]}]},{"id":"clustering","name":"Clustering","children":[{"id":"clustering-basado-en-centroides","name":"Clustering basado en centroides","children":[{"id":"k-means","name":"k-means"},{"id":"k-medoids-y-k-median","name":"k-medoids y k-median"},{"id":"cuantizacion-vectorial","name":"Cuantización vectorial (VQ)"}]},{"id":"clustering-jerarquico","name":"Clustering jerárquico","children":[{"id":"dendrograma","name":"Dendrograma"},{"id":"criterios-de-enlace","name":"Criterios de enlace (linkage)"}]},{"id":"clustering-basado-en-densidad","name":"Clustering basado en densidad","children":[{"id":"dbscan","name":"DBSCAN"},{"id":"mean-shift","name":"Mean Shift"}]},{"id":"spectral-clustering","name":"Spectral clustering"},{"id":"gmm","name":"Modelos de mezcla gaussiana (GMM)"},{"id":"metodo-del-codo","name":"Elección del número de clusters (método del codo)"},{"id":"evaluacion-del-clustering","name":"Evaluación del clustering","children":[{"id":"coeficiente-de-silueta","name":"Coeficiente de silueta"},{"id":"indice-de-calinski-harabasz","name":"Índice de Calinski-Harabasz"},{"id":"indice-de-davies-bouldin","name":"Índice de Davies-Bouldin"}]}]},{"id":"estimacion-de-densidad","name":"Estimación de densidad","children":[{"id":"histograma","name":"Histograma"},{"id":"kde","name":"Estimación kernel de densidad (KDE / ventanas de Parzen)"}]}]},{"id":"redes-neuronales","name":"Redes neuronales: cómo aprenden","en":"neural networks: how they learn","frase":"Cómo una red ajusta millones de pesos para reducir su error, paso a paso.","desc":"Cómo aprende una red neuronal. Las neuronas combinan sus entradas con pesos y aplican una activación no lineal; una función de pérdida mide el error, y un optimizador ajusta millones de pesos mediante descenso por gradiente y retropropagación. Incluye también la regularización y los trucos prácticos que hacen que el entrenamiento funcione.","cuando":"Cuando los datos son complejos (imágenes, texto, audio) o muy abundantes y los modelos clásicos se quedan cortos.","ej":"Entrenar un MLP para reconocer dígitos escritos a mano: en cada época la red ve todas las imágenes, calcula su error y corrige un poco los pesos en la dirección que lo reduce.","py":[{"c":"keras.Sequential","u":"https://keras.io/api/models/sequential/"},{"c":"torch.nn.Module","u":"https://docs.pytorch.org/docs/stable/generated/torch.nn.Module.html"}],"rel":["mlp","descenso-por-gradiente","backpropagation","arquitecturas-de-redes-neuronales"],"children":[{"id":"neurona-artificial","name":"Neurona biológica y neurona artificial"},{"id":"perceptron","name":"Perceptrón"},{"id":"mlp","name":"Perceptrón multicapa (MLP)"},{"id":"funciones-de-activacion","name":"Funciones de activación","children":[{"id":"sigmoide-y-tanh","name":"Sigmoide y tanh"},{"id":"relu-y-variantes","name":"ReLU y variantes (Leaky ReLU, ELU)"},{"id":"gelu","name":"GELU"},{"id":"softmax","name":"Softmax"}]},{"id":"funciones-de-perdida","name":"Funciones de pérdida","children":[{"id":"perdidas-de-regresion","name":"Pérdidas de regresión (MSE, MAE, Huber)"},{"id":"entropia-cruzada","name":"Entropía cruzada (binaria y categórica)"},{"id":"perdidas-perceptuales","name":"Pérdidas perceptuales"}]},{"id":"optimizacion","name":"Optimización","children":[{"id":"descenso-por-gradiente","name":"Descenso por gradiente"},{"id":"backpropagation","name":"Retropropagación (backpropagation)"},{"id":"diferenciacion-automatica","name":"Diferenciación automática"},{"id":"batch-mini-batch-y-sgd","name":"Batch, mini-batch y SGD"},{"id":"epoca-y-tamano-de-lote","name":"Época y tamaño de lote"},{"id":"learning-rate","name":"Tasa de aprendizaje (learning rate)"},{"id":"lr-schedulers","name":"Programación de la tasa de aprendizaje"},{"id":"momentum","name":"Momentum"},{"id":"rmsprop-y-adagrad","name":"RMSprop y Adagrad"},{"id":"adam-y-adamw","name":"Adam y AdamW"},{"id":"metodos-de-segundo-orden","name":"Métodos de segundo orden (Newton)"},{"id":"inicializacion-de-pesos","name":"Inicialización de pesos"},{"id":"desvanecimiento-y-explosion-del-gradiente","name":"Desvanecimiento y explosión del gradiente"}]},{"id":"regularizacion-en-redes","name":"Regularización en redes","children":[{"id":"penalizacion-l1-y-l2","name":"Penalización L1 y L2 (weight decay)"},{"id":"dropout","name":"Dropout"},{"id":"early-stopping","name":"Early stopping"},{"id":"inyeccion-de-ruido","name":"Inyección de ruido"}]},{"id":"entrenamiento-en-la-practica","name":"Entrenamiento en la práctica","children":[{"id":"receta-de-entrenamiento","name":"Receta de entrenamiento"},{"id":"curvas-de-aprendizaje","name":"Curvas de aprendizaje"},{"id":"callbacks","name":"Callbacks"},{"id":"reproducibilidad-y-semillas","name":"Reproducibilidad y semillas"}]},{"id":"construccion-de-modelos","name":"Construcción de modelos","children":[{"id":"api-secuencial","name":"API secuencial"},{"id":"api-funcional","name":"API funcional"},{"id":"capas-y-perdidas-personalizadas","name":"Capas y pérdidas personalizadas"},{"id":"redes-siamesas","name":"Redes siamesas (pesos compartidos)"},{"id":"multi-entrada-salida","name":"Modelos multi-entrada y multi-salida"}]}]},{"id":"arquitecturas-de-redes-neuronales","name":"Arquitecturas de redes neuronales","en":"neural network architectures","frase":"Las formas de red adaptadas a cada tipo de dato: imágenes, secuencias o texto.","desc":"Las formas que puede tomar una red según el tipo de dato. Las CNN aprovechan la estructura espacial de las imágenes y las RNN la secuencial del texto o las series. Los Transformers relacionan todos los elementos entre sí mediante atención, y los autoencoders comprimen y reconstruyen. Cada arquitectura incorpora un sesgo inductivo distinto.","ej":"Para clasificar imágenes se suele usar una CNN o un Vision Transformer; para traducir texto, un Transformer encoder-decoder.","rel":["cnn","rnn","atencion-y-transformers","autoencoders"],"children":[{"id":"bloques-comunes","name":"Bloques comunes","children":[{"id":"conexion-residual","name":"Conexión residual (skip connection)"},{"id":"capas-de-normalizacion","name":"Capas de normalización (batch, layer, group)"},{"id":"capa-de-embedding","name":"Capa de embedding"}]},{"id":"cnn","name":"Redes convolucionales (CNN)","children":[{"id":"convolucion","name":"Convolución"},{"id":"filtros-y-mapas-de-caracteristicas","name":"Filtros y mapas de características"},{"id":"padding-y-stride","name":"Padding y stride"},{"id":"pooling","name":"Pooling"},{"id":"campo-receptivo","name":"Campo receptivo"},{"id":"equivarianza-e-invarianza","name":"Equivarianza e invarianza"},{"id":"convolucion-1d","name":"Convolución 1D"},{"id":"convolucion-separable","name":"Convolución separable"},{"id":"convolucion-transpuesta","name":"Convolución transpuesta (upsampling)"},{"id":"inspiracion-biologica-de-las-c Normalización divisiva generalizada (GDN)"},{"id":"perceptnet","name":"PerceptNet"},{"id":"modelos-multiescala","name":"Modelos multiescala"}]}]},{"id":"representaciones-y-modelos-fundacionales","name":"Representaciones y modelos fundacionales","en":"representation learning & foundation models","frase":"Preentrenar una vez con muchos datos y reutilizar lo aprendido en muchas tareas.","desc":"El paradigma de preentrenar y adaptar. Un modelo aprende representaciones generales (embeddings) con enormes cantidades de datos, a menudo sin etiquetas gracias al aprendizaje autosupervisado. Después se reutiliza para muchas tareas mediante transfer learning o fine-tuning. Es la base de los modelos fundacionales.","cuando":"Cuando tienes pocos datos etiquetados y existe un modelo preentrenado con datos parecidos a los tuyos.","ej":"Reutilizar un modelo preentrenado con millones de imágenes para clasificar radiografías disponiendo solo de unos cientos de ejemplos etiquetados.","rel":["embeddings","aprendizaje-autosupervisado","transfer-learning","que-es-un-modelo-fundacional"],"children":[{"id":"aprendizaje-de-representaciones","name":"Aprendizaje de representaciones"},{"id":"embeddings","name":"Embeddings","children":[{"id":"espacio-latente","name":"Espacio latente"},{"id":"aritmetica-de-embeddings","name":"Aritmética de embeddings"},{"id":"busqueda-por-similitud","name":"Búsqueda por similitud"}]},{"id":"aprendizaje-autosupervisado","name":"Aprendizaje autosupervisado (SSL)","children":[{"id":"tarea-pretexto","name":"Tarea pretexto"},{"id":"aprendizaje-contrastivo","name":"Aprendizaje contrastivo","children":[{"id":"perdida-infonce","name":"Pérdida InfoNCE"},{"id":"simclr-moco-byol-y-dino","name":"SimCLR, MoCo, BYOL y DINO"}]},{"id":"modelado-enmascarado","name":"Modelado enmascarado (MAE, BEiT)"},{"id":"colapso-de-la-representacion","name":"Colapso de la representación"},{"id":"evaluacion-de-representaciones","name":"Evaluación de representaciones (linear probing, k-NN)"}]},{
