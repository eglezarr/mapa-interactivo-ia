) o promedia su valor (regresión). No entrena ningún modelo: memoriza los datos, y el coste está en la predicción. Es sensible a la escala de las variables y a la maldición de la dimensionalidad.","cuando":"Con conjuntos pequeños o medianos y pocas variables, cuando los casos parecidos suelen tener resultados parecidos.","ej":"Estimar el alquiler de un piso promediando el de los 5 pisos más parecidos en tamaño, barrio y planta.","hp":[["n_neighbors","número de vecinos; pocos, predicción nerviosa; muchos, predicción suavizada"],["weights","si los vecinos cercanos pesan más (distance) o todos igual (uniform)"],["metric","distancia con la que se mide el parecido"]],"py":[{"c":"sklearn.neighbors.KNeighborsClassifier","u":"https://scikit-learn.org/stable/modules/generated/sklearn.neighbors.KNeighborsClassifier.html"},{"c":"sklearn.neighbors.KNeighborsRegressor","u":"https://scikit-learn.org/stable/modules/generated/sklearn.neighbors.KNeighborsRegressor.html"}],"rel":["distancia-y-similitud","escalado-de-variables","maldicion-de-la-dimensionalidad","busqueda-por-similitud"]},{"id":"arboles-de-decision","name":"Árboles de decisión","en":"decision trees","frase":"Una cadena de preguntas sí/no que termina en una predicción.","desc":"Dividen el espacio de las variables con preguntas sucesivas del tipo \"¿x₃ > 5?\" hasta llegar a hojas que dan la predicción. Se leen como un diagrama de flujo, captan no linealidades e interacciones y no necesitan escalar los datos. Su punto débil es la inestabilidad, porque pequeños cambios en los datos cambian mucho el árbol, y la tendencia a sobreajustar si crece demasiado.","cuando":"Cuando necesitas reglas fáciles de explicar, o como pieza base de ensembles como Random Forest y gradient boosting.","ej":"Triaje en urgencias: \"¿fiebre > 39 °C?\" → sí → \"¿dificultad para respirar?\" → sí → prioridad alta.","hp":[["max_depth","profundidad máxima; limita la complejidad del árbol"],["min_samples_leaf","mínimo de ejemplos por hoja; suaviza las predicciones"],["criterion","medida de impureza para elegir las divisiones (gini, entropy)"]],"py":[{"c":"sklearn.tree.DecisionTreeClassifier","u":"https://scikit-learn.org/stable/modules/generated/sklearn.tree.DecisionTreeClassifier.html"},{"c":"sklearn.tree.DecisionTreeRegressor","u":"https://scikit-learn.org/stable/modules/generated/sklearn.tree.DecisionTreeRegressor.html"},{"c":"sklearn.tree.plot_tree","u":"https://scikit-learn.org/stable/modules/generated/sklearn.tree.plot_tree.html"}],"rel":["criterios-de-division","poda-y-criterios-de-parada","random-forest","gradient-boosting"],"children":[{"id":"criterios-de-division","name":"Criterios de división: Gini y entropía","en":"split criteria: Gini impurity & entropy","frase":"Cómo elige el árbol la mejor pregunta: la que deja los grupos más puros.","desc":"En cada nodo, el árbol elige la variable y el umbral que dejan los grupos resultantes lo más puros posible. En clasificación, la impureza se mide con el índice de Gini (la probabilidad de clasificar mal un elemento al azar) o con la entropía; la ganancia de información es cuánto reduce la entropía una división. En regresión se usa la reducción de la varianza (MSE).","ej":"Un nodo con un 50 % de cada clase tiene un Gini de 0,5. Si una división lo parte en dos nodos 90/10, cada uno baja a 0,18.","py":[{"c":"sklearn.tree.DecisionTreeClassifier(criterion=\"gini\" | \"entropy\")","u":"https://scikit-learn.org/stable/modules/generated/sklearn.tree.DecisionTreeClassifier.html"}],"rel":["arboles-de-decision","entropia","informacion-mutua"]},{"id":"poda-y-criterios-de-parada","name":"Poda y criterios de parada","en":"pruning & stopping criteria","frase":"Frenar o recortar el crecimiento del árbol para que no memorice el ruido.","desc":"Un árbol que crece sin límite acaba con casi una hoja por ejemplo y memoriza el ruido. Se evita parando antes (profundidad máxima, mínimo de muestras por hoja o mejora mínima exigida) o podando después: se construye el árbol completo y se quitan las ramas que no mejoran la validación, por ejemplo con la poda por coste-complejidad.","cuando":"Siempre que entrenes un árbol individual, para controlar el sobreajuste.","ej":"Limitar la profundidad a 4 baja algo el acierto en entrenamiento, pero a menudo mejora el de test.","hp":[["ccp_alpha","intensidad de la poda por coste-complejidad"],["max_depth","profundidad máxima del árbol"],["min_samples_split","mínimo de ejemplos para dividir un nodo"]],"py":[{"c":"sklearn.tree.DecisionTreeClassifier(max_depth=…, min_samples_leaf=…, ccp_alpha=…)","u":"https://scikit-learn.org/stable/modules/generated/sklearn.tree.DecisionTreeClassifier.html"}],"rel":["arboles-de-decision","sobreajuste","compromiso-sesgo-varianza"]}]},{"id":"metodos-kernel","name":"Métodos kernel","en":"kernel methods","frase":"Resolver problemas no lineales con herramientas lineales trabajando con similitudes entre puntos.","desc":"Familia de métodos que trabajan con similitudes entre pares de puntos, llamadas kernels, en lugar de con las variables originales. Equivale a proyectar los datos a un espacio de muchas más dimensiones, donde un problema no lineal se vuelve lineal, sin llegar a calcular esa proyección. Aquí entran las SVM, las SVR, la kernel ridge regression y los procesos gaussianos.","cuando":"Con conjuntos pequeños o medianos y fronteras no lineales, cuando no hay datos suficientes para una red neuronal.","ej":"Dos clases dispuestas en círculos concéntricos no se separan con una recta, pero un kernel RBF las separa sin problema.","py":[{"c":"sklearn.metrics.pairwise.rbf_kernel","u":"https://scikit-learn.org/stable/modules/generated/sklearn.metrics.pairwise.rbf_kernel.html"}],"rel":["truco-del-kernel","svm","procesos-gaussianos","hsic"],"children":[{"id":"truco-del-kernel","name":"Truco del kernel","en":"kernel trick","frase":"Calcular similitudes como si los datos vivieran en un espacio enorme, sin construirlo.","desc":"Muchos algoritmos solo necesitan productos escalares entre puntos. Si se sustituyen por una función kernel k(x, x′), el resultado es el mismo que si los datos se hubieran transformado a un espacio de mayor dimensión, pero sin construir esa transformación. Los kernels más comunes son el lineal, el polinómico y el RBF (gaussiano).","ej":"El kernel RBF mide la similitud como exp(−γ‖x−x′‖²), lo que equivale a trabajar en un espacio de dimensión infinita.","py":[{"c":"sklearn.svm.SVC(kernel=\"rbf\")","u":"https://scikit-learn.org/stable/modules/generated/sklearn.svm.SVC.html"}],"rel":["metodos-kernel","svm","distancia-euclidea"]},{"id":"svm","name":"Máquinas de vectores soporte (SVM)","en":"support vector machines","frase":"Separa las clases con la frontera de máximo margen.","desc":"Clasificador que busca el hiperplano que separa las clases con el máximo margen, es decir, lo más lejos posible de los puntos más cercanos de cada clase (los vectores soporte). Con margen blando, controlado por el parámetro C, tolera algunos errores, y con kernels traza fronteras no lineales. Rinde muy bien con conjuntos medianos y de alta dimensión.","cuando":"Para clasificar conjuntos pequeños o medianos, incluso con muchísimas variables, como textos o datos genómicos.","ej":"Clasificar noticias en deportes o política a partir de miles de variables TF-IDF fue durante años terreno clásico de las SVM lineales.","hp":[["C","cuánto se penalizan los errores; alto, frontera más pegada a los datos"],["kernel","forma de la frontera (linear, rbf, poly)"],["gamma","alcance de cada punto en el kernel RBF; alto, frontera más irregular"]],"py":[{"c":"sklearn.svm.SVC","u":"https://scikit-learn.org/stable/modules/generated/sklearn.svm.SVC.html"},{"c":"sklearn.svm.LinearSVC","u":"https://scikit-learn.org/stable/modules/generated/sklearn.svm.LinearSVC.html"}],"rel":["truco-del-kernel","svr","regresion-logistica","tf-idf"]},{"id":"svr","name":"Regresión de vectores soporte (SVR)","en":"support vector regression","frase":"Regresión que ignora los errores pequeños y penaliza solo los grandes.","desc":"Versión de las SVM para regresión. Ajusta una función que deja la mayoría de los puntos dentro de un tubo de anchura ε alrededor de la predicción y solo penaliza los que quedan fuera. Ignorar los errores pequeños la hace robusta al ruido, y con kernels capta relaciones no lineales.","cuando":"Para regresión no lineal con conjuntos pequeños o medianos y datos con ruido moderado.","ej":"Predecir la demanda horaria de un servicio de bicicletas con un kernel RBF, sin penalizar desviaciones menores de 5 bicis (ε = 5).","hp":[["C","cuánto se penalizan los errores fuera del tubo"],["epsilon","anchura del tubo de errores tolerados"],["kernel","forma de la función (linear, rbf, poly)"],["gamma","alcance de cada punto en el kernel RBF"]],"py":[{"c":"sklearn.svm.SVR","u":"https://scikit-learn.org/stable/modules/generated/sklearn.svm.SVR.html"}],"rel":["svm","truco-del-kernel","kernel-ridge-regression"]},{"id":"kernel-ridge-regression","name":"Kernel ridge regression","en":"kernel ridge regression","frase":"Regresión Ridge con kernels: no lineal y con solución exacta.","desc":"Combina la regresión Ridge con el truco del kernel: una regresión lineal regularizada en el espacio que induce el kernel, con solución cerrada. Su predicción coincide con la media de un proceso gaussiano equivalente, pero no da incertidumbre. En conjuntos medianos suele entrenar más rápido que una SVR.","cuando":"Para regresión no lineal y suave con hasta unos pocos miles de datos.","ej":"Ajustar una curva suave y no lineal a 2.000 medidas de un sensor con un kernel RBF y una sola línea de código.","hp":[["alpha","fuerza de la regularización"],["kernel","tipo de kernel (rbf, polynomial, linear)"],["gamma","alcance del kernel"]],"py":[{"c":"sklearn.kernel_ridge.KernelRidge","u":"https://scikit-learn.org/stable/modules/generated/sklearn.kernel_ridge.KernelRidge.html"}],"rel":["ridge-lasso-y-elastic-net","truco-del-kernel","procesos-gaussianos","svr"]},{"id":"procesos-gaussianos","name":"Procesos gaussianos (GP)","en":"Gaussian processes","frase":"Predicciones acompañadas de su incertidumbre, modelando una distribución sobre funciones.","desc":"Modelo bayesiano no paramétrico que define una distribución sobre funciones: cualquier conjunto de puntos sigue una normal multivariante cuya covarianza la marca un kernel. Al condicionar en los datos, cada predicción nueva sale acompañada de su incertidumbre. Escala mal con muchos datos, porque su coste crece con el cubo de n.","cuando":"Cuando tienes pocos datos y necesitas saber cuánto fiarte de cada predicción, como en la optimización bayesiana o en experimentos caros.","ej":"En la optimización bayesiana de hiperparámetros, un GP modela el rendimiento del modelo en función de los hiperparámetros y propone dónde probar a continuación.","hp":[["kernel","forma de la covarianza (RBF, Matern o periódico)"],["alpha","ruido supuesto en las observaciones"],["n_restarts_optimizer","reinicios al ajustar los parámetros del kernel"]],"py":[{"c":"sklearn.gaussian_process.GaussianProcessRegressor","u":"https://scikit-learn.org/stable/modules/generated/sklearn.gaussian_process.GaussianProcessRegressor.html"}],"rel":["metodos-kernel","kernel-ridge-regression","optimizacion-bayesiana-de-hiperparametros","incertidumbre"]}]},{"id":"ensembles","name":"Ensembles","en":"ensemble methods","frase":"Combinar varios modelos para que juntos acierten más que cada uno.","desc":"Combinan varios modelos para lograr predicciones más precisas y estables que las de cualquiera de ellos por separado. Hay tres estrategias principales. El bagging entrena modelos en paralelo sobre remuestreos y promedia, y reduce la varianza. El boosting entrena en secuencia corrigiendo errores, y reduce el sesgo. El stacking aprende cómo combinar los modelos.","cuando":"Cuando quieres exprimir el rendimiento o estabilizar un modelo inestable; con datos tabulares son la opción más competitiva.","ej":"En las competiciones de Kaggle con datos tabulares, las soluciones ganadoras suelen ser ensembles de varios modelos de gradient boosting.","py":[{"c":"sklearn.ensemble","u":"https://scikit-learn.org/stable/api/sklearn.ensemble.html"}],"rel":["bagging","boosting","stacking","por-que-funcionan-los-ensembles"],"children":[{"id":"por-que-funcionan-los-ensembles","name":"Por qué funcionan los ensembles","en":"why ensembles work","frase":"Si los modelos se equivocan de forma distinta, al combinarlos los errores se compensan.","desc":"Si los modelos se equivocan de forma distinta, con errores poco correlacionados, al combinarlos esos errores se compensan: baja la varianza del promedio y el voto mayoritario acierta más que cada miembro. Por eso la diversidad (distintos datos, variables o algoritmos) importa tanto como la calidad individual.","ej":"Cinco clasificadores independientes que aciertan un 70 % cada uno llegan a cerca de un 84 % votando por mayoría.","rel":["compromiso-sesgo-varianza","bagging","combinacion-por-votacion"]},{"id":"combinacion-por-votacion","name":"Combinación por votación (mayoría, Borda, BKS)","en":"voting: majority, Borda count, BKS","frase":"Cada modelo vota una clase y gana la opción más respaldada.","desc":"Formas de combinar las etiquetas que predicen varios clasificadores. En el voto por mayoría gana la clase más votada, y el voto puede ponderarse según la calidad de cada modelo. En el recuento de Borda cada modelo ordena las clases y se suman puntos según la posición. El Behavior Knowledge Space (BKS) asigna, con una tabla aprendida en entrenamiento, la clase real más frecuente a cada combinación de votos.","cuando":"Cuando ya tienes varios clasificadores razonables y diversos y quieres combinarlos de la forma más sencilla.","ej":"Tres modelos votan \"gato\", \"gato\" y \"perro\": por mayoría, la predicción final es \"gato\".","hp":[["voting","hard (vota la etiqueta) o soft (promedia las probabilidades)"],["weights","peso de cada modelo en la votación"]],"py":[{"c":"sklearn.ensemble.VotingClassifier","u":"https://scikit-learn.org/stable/modules/generated/sklearn.ensemble.VotingClassifier.html"}],"rel":["combinadores-algebraicos","stacking","ensembles"]},{"id":"combinadores-algebraicos","name":"Combinadores algebraicos","en":"algebraic combiners","frase":"Promediar, multiplicar o tomar la mediana de las probabilidades de varios modelos.","desc":"Combinan las salidas continuas de los modelos, como probabilidades o puntuaciones, con una operación algebraica: media, media ponderada, mediana, máximo, mínimo o producto. La media es robusta y casi siempre funciona bien. El producto castiga mucho a cualquier modelo muy seguro de que la clase es incorrecta, y la mediana resiste a los modelos atípicos.","cuando":"Cuando los modelos dan probabilidades o puntuaciones y quieres combinarlas sin entrenar nada más.","ej":"Promediar las probabilidades de fraude de tres modelos (0,9, 0,6 y 0,7) da 0,73, que después se compara con el umbral.","hp":[["weights","peso de cada modelo en la media"]],"py":[{"c":"sklearn.ensemble.VotingClassifier(voting=\"soft\")","u":"https://scikit-learn.org/stable/modules/generated/sklearn.ensemble.VotingClassifier.html"}],"rel":["combinacion-por-votacion","stacking","ensembles"]},{"id":"stacking","name":"Stacking","en":"stacked generalization","frase":"Un metamodelo aprende a combinar las predicciones de otros modelos.","desc":"También llamado generalización apilada. Entrena varios modelos base y, encima, un metamodelo que aprende a combinar sus predicciones. Para que el metamodelo no aprenda de predicciones sobreajustadas, se entrena con predicciones fuera de muestra obtenidas por validación cruzada. Suele aportar mejoras pequeñas a cambio de más complejidad.","cuando":"Cuando tienes modelos diversos con rendimientos parecidos y quieres sacar la última mejora de precisión.","ej":"Combinar un Random Forest, un XGBoost y una red neuronal mediante una regresión logística que aprende cuánto fiarse de cada uno.","hp":[["final_estimator","el metamodelo que combina las predicciones"],["cv","cómo se generan las predicciones fuera de muestra"],["passthrough","si el metamodelo ve también las variables originales"]],"py":[{"c":"sklearn.ensemble.StackingClassifier","u":"https://scikit-learn.org/stable/modules/generated/sklearn.ensemble.StackingClassifier.html"},{"c":"sklearn.ensemble.StackingRegressor","u":"https://scikit-learn.org/stable/modules/generated/sklearn.ensemble.StackingRegressor.html"}],"rel":["combinacion-por-votacion","validacion-cruzada","mezcla-de-expertos","fuga-de-datos"]},{"id":"mezcla-de-expertos","name":"Mezcla de expertos (MoE)","en":"mixture of experts","frase":"Expertos especializados y una compuerta que decide a cuál escuchar en cada caso.","desc":"Varios modelos expertos se especializan en distintas regiones del espacio de entrada, y una red de compuerta (gating) decide cuánto pesa cada uno para cada entrada concreta. A diferencia de un voto fijo, la combinación depende de la entrada. Hoy es una pieza clave de muchos LLMs: en cada capa solo se activan unos pocos expertos por token, lo que permite modelos enormes con un coste de cómputo moderado.","cuando":"Cuando los datos tienen regímenes muy distintos y conviene especializar un modelo en cada uno; en los LLMs, para crecer sin multiplicar el cómputo.","ej":"Mixtral 8x7B tiene 8 expertos por capa y activa 2 en cada token, de modo que solo usa una fracción de sus parámetros en cada paso.","rel":["stacking","ensembles","llm"]},{"id":"bagging","name":"Bagging","en":"bootstrap aggregating","frase":"Muchos modelos entrenados con remuestreos de los datos y promediados.","desc":"Abreviatura de bootstrap aggregating. Entrena muchos modelos del mismo tipo, cada uno con una muestra bootstrap (con reemplazo) de los datos, y promedia o vota sus predicciones. Reduce sobre todo la varianza, por eso funciona muy bien con modelos inestables como los árboles profundos. Los ejemplos que no entran en cada muestra (out-of-bag) permiten estimar el error sin un conjunto de validación aparte.","cuando":"Cuando tu modelo base es potente pero inestable, como un árbol profundo, y quieres reducir su varianza.","ej":"Entrenar 100 árboles de regresión, cada uno con un remuestreo distinto de los datos, y promediar sus predicciones del precio de una casa.","hp":[["n_estimators","número de modelos"],["max_samples","tamaño de cada remuestreo"],["max_features","fracción de variables que ve cada modelo"]],"py":[{"c":"sklearn.ensemble.BaggingClassifier","u":"https://scikit-learn.org/stable/modules/generated/sklearn.ensemble.BaggingClassifier.html"},{"c":"sklearn.ensemble.BaggingRegressor","u":"https://scikit-learn.org/stable/modules/generated/sklearn.ensemble.BaggingRegressor.html"}],"rel":["random-forest","por-que-funcionan-los-ensembles","compromiso-sesgo-varianza","arboles-de-decision"]},{"id":"random-forest","name":"Random Forest","en":"random forest","frase":"Muchos árboles distintos que votan: más estable y preciso que uno solo.","desc":"Bagging de árboles de decisión con un ingrediente extra: en cada división el árbol solo puede elegir entre un subconjunto aleatorio de variables. Eso hace que los árboles se parezcan menos entre sí y que el promedio sea más eficaz. Es robusto, necesita poco ajuste y ofrece de serie una estimación del error (out-of-bag) y de la importancia de cada variable.","cuando":"Como primera opción robusta con datos tabulares, cuando quieres buen rendimiento con muy poco ajuste.","ej":"Clasificar los usos del suelo (cultivo, bosque, ciudad) en imágenes de satélite con 500 árboles, cada uno entrenado con datos y variables distintos.","hp":[["n_estimators","número de árboles; más árboles estabilizan el resultado a cambio de tiempo"],["max_features","variables candidatas en cada división; cuantas menos, más distintos son los árboles"],["max_depth","profundidad máxima de cada árbol"],["min_samples_leaf","mínimo de ejemplos por hoja; suaviza las predicciones"]],"py":[{"c":"sklearn.ensemble.RandomForestClassifier","u":"https://scikit-learn.org/stable/modules/generated/sklearn.ensemble.RandomForestClassifier.html"},{"c":"sklearn.ensemble.RandomForestRegressor","u":"https://scikit-learn.org/stable/modules/generated/sklearn.ensemble.RandomForestRegressor.html"}],"rel":["bagging","arboles-de-decision","importancia-por-permutacion","gradient-boosting"]},{"id":"boosting","name":"Boosting","en":"boosting","frase":"Modelos débiles en cadena, cada uno corrigiendo los errores del anterior.","desc":"Construye el ensemble en secuencia: cada nuevo modelo débil, normalmente un árbol pequeño, se centra en los errores de los anteriores, y la predicción final es una suma ponderada de todos. Reduce sobre todo el sesgo. Es la familia más potente para datos tabulares, aunque más sensible al ruido y a los hiperparámetros que el bagging.","cuando":"Cuando buscas la máxima precisión con datos tabulares y puedes dedicar tiempo a ajustar hiperparámetros.","ej":"Cada árbol nuevo corrige un poco lo que los anteriores predijeron mal, hasta sumar cientos de árboles pequeños que juntos son muy precisos.","hp":[["max_iter","número de árboles (iteraciones)"],["learning_rate","cuánto aporta cada árbol"],["max_leaf_nodes","tamaño de cada árbol"]],"py":[{"c":"sklearn.ensemble.HistGradientBoostingClassifier","u":"https://scikit-learn.org/stable/modules/generated/sklearn.ensemble.HistGradientBoostingClassifier.html"}],"rel":["adaboost","gradient-boosting","xgboost-y-lightgbm","bagging"],"children":[{"id":"adaboost","name":"AdaBoost","en":"adaptive boosting","frase":"Boosting que da más peso, en cada ronda, a los ejemplos mal clasificados.","desc":"Adaptive Boosting, propuesto por Freund y Schapire. Entrena clasificadores débiles en secuencia y, tras cada uno, sube el peso de los ejemplos mal clasificados para que el siguiente se fije más en ellos. Cada clasificador recibe un peso según su error, y la predicción final es un voto ponderado. Equivale a minimizar una pérdida exponencial.","cuando":"Con clasificadores débiles muy simples y datos poco ruidosos, cuando quieres un boosting clásico y ligero.","ej":"En el detector de caras de Viola-Jones, AdaBoost combina miles de rasgos muy simples, cada uno apenas mejor que el azar, en un detector rápido y preciso.","hp":[["n_estimators","número de clasificadores débiles"],["learning_rate","cuánto aporta cada uno"],["estimator","el modelo débil (por defecto, un árbol de un solo nivel)"]],"py":[{"c":"sklearn.ensemble.AdaBoostClassifier","u":"https://scikit-learn.org/stable/modules/generated/sklearn.ensemble.AdaBoostClassifier.html"},{"c":"sklearn.ensemble.AdaBoostRegressor","u":"https://scikit-learn.org/stable/modules/generated/sklearn.ensemble.AdaBoostRegressor.html"}],"rel":["boosting","gradient-boosting","combinacion-por-votacion"]},{"id":"gradient-boosting","name":"Gradient Boosting","en":"gradient boosting","frase":"Cada árbol nuevo corrige el error que dejan los anteriores, como un descenso por gradiente.","desc":"Generaliza el boosting a cualquier función de pérdida diferenciable. Cada árbol nuevo se ajusta al gradiente negativo de la pérdida (con MSE, simplemente a los residuos) y se suma al modelo multiplicado por una tasa de aprendizaje pequeña. Es, en esencia, descenso por gradiente en el espacio de funciones.","cuando":"Con datos tabulares cuando necesitas la máxima precisión, para regresión, clasificación o ranking.","ej":"Predecir el tiempo de entrega de un pedido: el primer árbol da una estimación gruesa y cada uno de los 300 siguientes corrige parte del error que queda.","hp":[["n_estimators","número de árboles"],["learning_rate","tamaño de cada paso; más bajo, más árboles y mejor generalización"],["max_depth","profundidad de cada árbol"],["subsample","fracción de datos por árbol; por debajo de 1 añade aleatoriedad y regulariza"]],"py":[{"c":"sklearn.ensemble.GradientBoostingRegressor","u":"https://scikit-learn.org/stable/modules/generated/sklearn.ensemble.GradientBoostingRegressor.html"},{"c":"sklearn.ensemble.HistGradientBoostingRegressor","u":"https://scikit-learn.org/stable/modules/generated/sklearn.ensemble.HistGradientBoostingRegressor.html"}],"rel":["boosting","xgboost-y-lightgbm","descenso-por-gradiente","learning-rate"]},{"id":"xgboost-y-lightgbm","name":"XGBoost y LightGBM","en":"XGBoost & LightGBM","frase":"Gradient boosting industrial: rápido, escalable y estándar con datos tabulares.","desc":"Implementaciones muy optimizadas de gradient boosting y estándar de facto con datos tabulares. XGBoost añade regularización en los árboles, manejo nativo de valores faltantes y paralelización. LightGBM acelera el entrenamiento agrupando las variables en histogramas y haciendo crecer los árboles hoja a hoja. CatBoost, una tercera opción, destaca con variables categóricas.","cuando":"Con datos tabulares medianos o grandes, cuando quieres el mejor rendimiento en un tiempo de entrenamiento razonable.","ej":"Predecir qué usuarios harán clic en un anuncio a partir de millones de registros y cientos de variables, con un entrenamiento de minutos en LightGBM.","hp":[["n_estimators","número de árboles"],["learning_rate","tamaño del paso de cada árbol"],["max_depth / num_leaves","tamaño de cada árbol (en XGBoost / en LightGBM)"],["subsample / colsample_bytree","fracción de filas / de columnas que ve cada árbol"],["reg_lambda","regularización L2 de las hojas"]],"py":[{"c":"xgboost.XGBClassifier","u":"https://xgboost.readthedocs.io/en/stable/python/python_api.html#xgboost.XGBClassifier"},{"c":"lightgbm.LGBMClassifier","u":"https://lightgbm.readthedocs.io/en/stable/pythonapi/lightgbm.LGBMClassifier.html"}],"rel":["gradient-boosting","valores-faltantes-e-imputacion","shap","codificacion-de-variables-categoricas"]}]}]}]},{"id":"aprendizaje-no-supervisado","name":"Aprendizaje no supervisado","en":"unsupervised learning","frase":"Descubrir estructura en datos sin etiquetas: grupos, dimensiones ocultas o densidades.","desc":"Aprender la estructura de los datos sin etiquetas. Agrupa casos parecidos (clustering), comprime muchas variables en pocas (reducción de dimensionalidad) o estima cómo se distribuyen los datos (densidad). Las etiquetas son caras y los datos sin etiquetar abundan, así que resulta clave para explorar y para preparar otros modelos.","cuando":"Cuando no tienes etiquetas y quieres explorar los datos, agruparlos, resumirlos o prepararlos para otro modelo.","ej":"Segmentar a los clientes de una tienda online en grupos con hábitos de compra parecidos sin decirle al algoritmo qué grupos buscar.","rel":["clustering","reduccion-de-la-dimensionalidad","estimacion-de-densidad","aprendizaje-autosupervisado"],"children":[{"id":"reduccion-de-la-dimensionalidad","name":"Reducción de la dimensionalidad","en":"dimensionality reduction","frase":"Representar los datos con menos variables conservando lo esencial de su estructura.","desc":"Con cientos o miles de variables, los datos son difíciles de visualizar, almacenar y modelar, y muchas variables son redundantes. La reducción de la dimensionalidad elige un subconjunto de variables (selección) o crea otras nuevas que combinan las originales (extracción), de forma lineal, como PCA, o no lineal, como t-SNE o UMAP. Se usa para visualizar, comprimir, quitar ruido y acelerar otros modelos.","ej":"Resumir los 20.000 genes medidos en cada paciente en 50 componentes que conservan casi toda la variación entre pacientes.","rel":["maldicion-de-la-dimensionalidad","pca","seleccion-de-caracteristicas","manifold-learning"],"children":[{"id":"maldicion-de-la-dimensionalidad","name":"Maldición de la dimensionalidad","en":"curse of dimensionality","frase":"Al crecer el número de dimensiones, los datos se vuelven escasos y las distancias pierden significado.","desc":"El volumen del espacio crece exponencialmente con las dimensiones, así que cualquier cantidad de datos se vuelve escasa. En muchas dimensiones las distancias entre puntos tienden a parecerse, lo que perjudica a los métodos basados en vecinos, y crece el riesgo de sobreajuste. Por suerte, los datos reales suelen vivir cerca de estructuras de dimensión mucho menor.","ej":"Cubrir un cubo con una rejilla de 10 puntos por eje requiere 100 puntos en 2 dimensiones y 10²⁰ en 20 dimensiones.","rel":["reduccion-de-la-dimensionalidad","knn","sobreajuste","manifold-learning","distancia-euclidea"]},{"id":"seleccion-de-caracteristicas","name":"Selección de características","en":"feature selection","frase":"Quedarse con las variables útiles y descartar las irrelevantes o redundantes.","desc":"A diferencia de la extracción, conserva variables originales, así que el modelo sigue siendo interpretable. Reduce el sobreajuste y el coste de entrenamiento. Hay tres familias: los filtros puntúan cada variable por separado, los envoltorios evalúan subconjuntos entrenando el modelo y los métodos integrados seleccionan durante el propio entrenamiento.","cuando":"Cuando hay muchas variables candidatas, algunas probablemente irrelevantes, y quieres un modelo más simple, rápido o interpretable.","ej":"De 300 indicadores de un sensor industrial, quedarse con los 15 que de verdad anticipan una avería.","py":[{"c":"sklearn.feature_selection","u":"https://scikit-learn.org/stable/api/sklearn.feature_selection.html"}],"rel":["metodos-filtro","metodos-envoltorio","metodos-integrados","extraccion-de-caracteristicas"],"children":[{"id":"metodos-filtro","name":"Métodos filtro (filter)","en":"filter methods","frase":"Puntuar cada variable por su relación con el objetivo, sin entrenar el modelo final.","desc":"Ordenan las variables según una medida estadística, como la correlación, la información mutua, el test chi-cuadrado o el estadístico F del ANOVA, y se quedan con las mejores. Son rápidos y escalan a miles de variables, pero evalúan cada variable por separado: no detectan redundancias ni variables que solo son útiles en combinación con otras.","cuando":"Como primer cribado rápido cuando hay muchísimas variables.","ej":"En clasificación de textos con 50.000 palabras posibles, quedarse con las 2.000 de mayor chi-cuadrado respecto a la categoría.","hp":[["k","número de variables que se conservan"],["score_func","medida con la que se puntúa cada variable"]],"py":[{"c":"sklearn.feature_selection.SelectKBest","u":"https://scikit-learn.org/stable/modules/generated/sklearn.feature_selection.SelectKBest.html"},{"c":"sklearn.feature_selection.mutual_info_classif","u":"https://scikit-learn.org/stable/modules/generated/sklearn.feature_selection.mutual_info_classif.html"}],"rel":["seleccion-de-caracteristicas","informacion-mutua","test-chi-cuadrado","correlacion-de-pearson"]},{"id":"metodos-envoltorio","name":"Métodos envoltorio (wrapper)","en":"wrapper methods","frase":"Elegir variables probando subconjuntos con el propio modelo y midiendo su rendimiento.","desc":"Tratan la selección como una búsqueda: añaden variables una a una (selección hacia delante), las quitan (eliminación hacia atrás) o eliminan recursivamente las menos importantes (RFE), evaluando cada subconjunto con validación cruzada. Tienen en cuenta las interacciones y el modelo concreto, pero son costosos y pueden sobreajustar la propia selección.","cuando":"Con un número moderado de variables y un modelo rápido de entrenar, cuando importa encontrar el mejor subconjunto.","ej":"Eliminar recursivamente variables de un modelo de abandono de clientes hasta encontrar las 10 que maximizan el AUC en validación cruzada.","hp":[["n_features_to_select","número de variables que se quieren conservar"],["direction","en la selección secuencial, hacia delante o hacia atrás"]],"py":[{"c":"sklearn.feature_selection.RFECV","u":"https://scikit-learn.org/stable/modules/generated/sklearn.feature_selection.RFECV.html"},{"c":"sklearn.feature_selection.SequentialFeatureSelector","u":"https://scikit-learn.org/stable/modules/generated/sklearn.feature_selection.SequentialFeatureSelector.html"}],"rel":["seleccion-de-caracteristicas","validacion-cruzada","metodos-integrados","metodos-filtro"]},{"id":"metodos-integrados","name":"Métodos integrados (embedded)","en":"embedded methods","frase":"Modelos que seleccionan variables por sí solos mientras se entrenan.","desc":"La selección ocurre dentro del entrenamiento. Lasso anula los coeficientes de las variables poco útiles, y los modelos de árboles calculan la importancia de cada variable según cuánto reduce el error. Son más baratos que los envoltorios y tienen en cuenta el modelo, aunque la importancia de los árboles puede estar sesgada hacia variables con muchos valores distintos.","cuando":"Cuando ya vas a entrenar un modelo con regularización L1 o de árboles y quieres aprovecharlo para seleccionar.","ej":"Entrenar un Lasso sobre 400 variables macroeconómicas y conservar las 25 con coeficiente distinto de cero.","hp":[["threshold","importancia mínima para conservar una variable"],["max_features","número máximo de variables seleccionadas"]],"py":[{"c":"sklearn.feature_selection.SelectFromModel","u":"https://scikit-learn.org/stable/modules/generated/sklearn.feature_selection.SelectFromModel.html"},{"c":"sklearn.linear_model.LassoCV","u":"https://scikit-learn.org/stable/modules/generated/sklearn.linear_model.LassoCV.html"}],"rel":["ridge-lasso-y-elastic-net","random-forest","importancia-por-permutacion","seleccion-de-caracteristicas"]}]},{"id":"extraccion-de-caracteristicas","name":"Extracción de características","en":"feature extraction","frase":"Crear variables nuevas que combinan las originales y concentran su información en menos dimensiones.","desc":"En lugar de elegir variables, construye otras nuevas como combinaciones o transformaciones de las originales. Puede ser lineal (PCA, ICA, LDA) o no lineal (kernel PCA, autoencoders, métodos de variedades). Comprime mucho mejor que la selección, pero las nuevas variables son más difíciles de interpretar.","cuando":"Cuando las variables están muy correlacionadas o son muy numerosas y la interpretabilidad de cada una no es prioritaria.","ej":"Convertir imágenes de caras de 64 × 64 píxeles (4.096 valores) en 100 componentes que bastan para reconocerlas.","py":[{"c":"sklearn.decomposition.PCA","u":"https://scikit-learn.org/stable/modules/generated/sklearn.decomposition.PCA.html"},{"c":"sklearn.decomposition.KernelPCA","u":"https://scikit-learn.org/stable/modules/generated/sklearn.decomposition.KernelPCA.html"}],"rel":["pca","autoencoders","seleccion-de-caracteristicas","embeddings"]},{"id":"pca","name":"PCA (análisis de componentes principales)","en":"principal component analysis (PCA)","frase":"Rota los datos para encontrar las direcciones de máxima varianza y se queda con las principales.","desc":"El análisis de componentes principales busca nuevos ejes ortogonales, combinaciones lineales de las variables, ordenados por la varianza que capturan. Quedarse con los primeros comprime los datos con la mínima pérdida en error cuadrático. Se calcula con la descomposición en valores singulares, es sensible a la escala de las variables y solo capta estructura lineal.","cuando":"Para comprimir variables numéricas correlacionadas, visualizar en 2D o 3D, eliminar ruido o acelerar otros modelos.","ej":"Con medidas corporales muy correlacionadas (altura, envergadura, talla de pie…), la primera componente resume el tamaño general de cada persona.","hp":[["n_components","número de componentes, o fracción de varianza que se quiere conservar"],["whiten","escala las componentes a varianza unidad"]],"py":[{"c":"sklearn.decomposition.PCA","u":"https://scikit-learn.org/stable/modules/generated/sklearn.decomposition.PCA.html"}],"rel":["estandarizacion","ica","autoencoder-undercomplete","extraccion-de-caracteristicas","reduccion-de-la-dimensionalidad"]},{"id":"ica","name":"ICA (análisis de componentes independientes)","en":"independent component analysis (ICA)","frase":"Separa una mezcla de señales en sus fuentes originales, estadísticamente independientes.","desc":"El análisis de componentes independientes supone que los datos son mezclas lineales de fuentes independientes y no gaussianas, y busca la transformación que las recupera. A diferencia de PCA, que solo descorrelaciona, ICA exige independencia, lo que permite separar señales superpuestas. No determina el orden ni la escala de las fuentes.","cuando":"Para separar señales mezcladas, como el audio de varios micrófonos o registros fisiológicos con artefactos.","ej":"El problema del cóctel: con dos micrófonos en una sala donde hablan dos personas, ICA recupera cada voz por separado.","hp":[["n_components","número de fuentes que se buscan"],["fun","función con la que se aproxima la no gaussianidad"]],"py":[{"c":"sklearn.decomposition.FastICA","u":"https://scikit-learn.org/stable/modules/generated/sklearn.decomposition.FastICA.html"}],"rel":["pca","independencia-estadistica","correlacion-total","extraccion-de-caracteristicas"]},{"id":"lda","name":"LDA (análisis discriminante lineal)","en":"linear discriminant analysis (LDA)","frase":"Proyección supervisada que separa al máximo las clases: lejos entre sí y compactas por dentro.","desc":"El análisis discriminante lineal busca las direcciones que maximizan la separación entre las medias de las clases respecto a la dispersión dentro de cada clase. Con K clases da como mucho K − 1 componentes. A diferencia de PCA usa las etiquetas, así que sirve para reducir la dimensión antes de clasificar y también como clasificador. No hay que confundirlo con el LDA de modelado de temas (Latent Dirichlet Allocation).","cuando":"Para reducir la dimensión o visualizar datos etiquetados cuando lo que importa es separar las clases.","ej":"Proyectar las medidas de flores de tres especies en un plano donde las especies aparecen claramente separadas.","hp":[["n_components","dimensiones de la proyección (como mucho, número de clases − 1)"],["solver","método de cálculo (svd, lsqr o eigen)"],["shrinkage","regularización de la covarianza cuando hay pocos datos"]],"py":[{"c":"sklearn.discriminant_analysis.LinearDiscriminantAnalysis","u":"https://scikit-learn.org/stable/modules/generated/sklearn.discriminant_analysis.LinearDiscriminantAnalysis.html"}],"rel":["pca","regresion-logistica","reduccion-de-la-dimensionalidad","distancia-de-mahalanobis"]},{"id":"mds","name":"MDS (escalado multidimensional)","en":"multidimensional scaling (MDS)","frase":"Coloca los puntos en pocas dimensiones respetando lo mejor posible las distancias entre ellos.","desc":"El escalado multidimensional recibe una matriz de distancias o disimilitudes y busca coordenadas en 2 o 3 dimensiones cuyas distancias se parezcan lo más posible a las originales. Solo necesita las distancias, no las variables, así que sirve cuando únicamente se sabe cuánto se parecen los objetos. La versión clásica con distancias euclídeas equivale a PCA.","cuando":"Para visualizar objetos de los que solo se conoce cuánto se parecen entre sí.","ej":"A partir de la tabla de distancias por carretera entre ciudades, reconstruir un mapa aproximado de su posición.","hp":[["n_components","dimensiones de la representación"],["metric_mds","respetar las distancias en sí (MDS métrico) o solo su orden (no métrico)"]],"py":[{"c":"sklearn.manifold.MDS","u":"https://scikit-learn.org/stable/modules/generated/sklearn.manifold.MDS.html"}],"rel":["isomap","pca","distancia-y-similitud","t-sne"]},{"id":"manifold-learning","name":"Aprendizaje de variedades (manifold learning)","en":"manifold learning","frase":"Métodos que suponen que los datos viven sobre una superficie curva de pocas dimensiones y la despliegan.","desc":"Los datos de alta dimensión suelen ocupar una variedad (manifold) de dimensión mucho menor: una superficie curvada dentro del espacio. Estos métodos no lineales tratan de desenrollarla preservando relaciones locales, como los vecinos de cada punto o las distancias medidas sobre la superficie. Son muy útiles para visualizar, pero sensibles a sus hiperparámetros.","cuando":"Para visualizar o reducir datos con estructura no lineal que PCA no capta.","ej":"Fotos de una cara que gira la cabeza: aunque cada imagen tiene miles de píxeles, solo varían en una dimensión, el ángulo de giro.","py":[{"c":"sklearn.manifold","u":"https://scikit-learn.org/stable/api/sklearn.manifold.html"}],"rel":["lle-y-pca-local","isomap","t-sne","umap","maldicion-de-la-dimensionalidad"],"children":[{"id":"lle-y-pca-local","name":"LLE y PCA local","en":"LLE & local PCA","frase":"Desplegar la variedad aproximándola por trozos lineales alrededor de cada punto.","desc":"La idea es que, vista de cerca, una superficie curva parece plana. LLE (Locally Linear Embedding) reconstruye cada punto como combinación lineal de sus vecinos y busca una representación de baja dimensión que conserve esos mismos pesos. El PCA local aplica PCA en pequeñas vecindades para estimar la geometría local. Ambos captan curvaturas que un PCA global no ve.","cuando":"Para desplegar variedades suaves y bien muestreadas cuando importa conservar la geometría local.","ej":"Desenrollar el clásico \"rollo suizo\", una hoja enrollada en 3D, sobre un plano.","hp":[["n_neighbors","tamaño de la vecindad local"],["n_components","dimensión de la representación"]],"py":[{"c":"sklearn.manifold.LocallyLinearEmbedding","u":"https://scikit-learn.org/stable/modules/generated/sklearn.manifold.LocallyLinearEmbedding.html"}],"rel":["manifold-learning","pca","isomap","knn"]},{"id":"isomap","name":"Isomap","en":"Isomap","frase":"Despliega la variedad conservando las distancias medidas a lo largo de su superficie.","desc":"Construye un grafo uniendo cada punto con sus vecinos cercanos y calcula las distancias geodésicas como caminos más cortos en ese grafo, es decir, distancias recorridas sobre la superficie. Después aplica MDS a esas distancias. Así, dos puntos cercanos en línea recta pero lejanos sobre la variedad quedan separados.","cuando":"Para desplegar variedades no lineales cuando importa la estructura global y no hay agujeros ni ruido excesivo.","ej":"En el rollo suizo, dos puntos de capas contiguas están cerca en 3D, pero Isomap los coloca lejos porque sobre la hoja lo están.","hp":[["n_neighbors","vecinos con los que se construye el grafo"],["n_components","dimensión de la representación"]],"py":[{"c":"sklearn.manifold.Isomap","u":"https://scikit-learn.org/stable/modules/generated/sklearn.manifold.Isomap.html"}],"rel":["mds","manifold-learning","lle-y-pca-local","knn"]},{"id":"t-sne","name":"t-SNE","en":"t-SNE","frase":"Visualización en 2D que mantiene juntos a los vecinos cercanos y separa los grupos.","desc":"Convierte las distancias en probabilidades de ser vecinos, tanto en el espacio original como en el reducido, y minimiza la divergencia de Kullback-Leibler entre ambas. En el espacio reducido usa una distribución t de Student, que separa bien los grupos. Conserva la estructura local, pero no la global: los tamaños de los grupos y las distancias entre ellos no significan nada.","cuando":"Para visualizar datos de alta dimensión, como embeddings, e identificar grupos; no para alimentar otros modelos.","ej":"Visualizar en 2D los embeddings de 10.000 imágenes de dígitos y ver diez nubes, una por dígito.","hp":[["perplexity","número efectivo de vecinos considerados; valores típicos entre 5 y 50"],["learning_rate","tamaño de paso de la optimización"]],"py":[{"c":"sklearn.manifold.TSNE","u":"https://scikit-learn.org/stable/modules/generated/sklearn.manifold.TSNE.html"}],"rel":["umap","divergencia-de-kullback-leibler","embeddings","manifold-learning"]},{"id":"umap","name":"UMAP","en":"UMAP","frase":"Reducción no lineal rápida que conserva la estructura local y más estructura global que t-SNE.","desc":"Construye un grafo difuso de vecinos en el espacio original y busca una representación de baja dimensión cuyo grafo se parezca lo más posible. Es más rápido que t-SNE, escala a millones de puntos, conserva mejor la estructura global y puede transformar datos nuevos, así que también sirve como paso previo a otros modelos.","cuando":"Para visualizar o reducir grandes conjuntos de datos de alta dimensión, también como preprocesado para clustering.","ej":"Visualizar los perfiles de expresión génica de un millón de células y ver aparecer los tipos celulares como grupos.","hp":[["n_neighbors","tamaño de la vecindad; más alto, más estructura global"],["min_dist","lo juntos que pueden quedar los puntos en la proyección"],["metric","distancia usada en el espacio original"]],"py":[{"c":"umap.UMAP","u":"https://umap-learn.readthedocs.io/en/latest/api.html#umap.umap_.UMAP"}],"rel":["t-sne","manifold-learning","clustering","embeddings"]},{"id":"curvas-principales","name":"Curvas principales","en":"principal curves","frase":"Una curva suave que pasa por el centro de los datos: la versión no lineal de la primera componente principal.","desc":"Una curva principal es aquella en la que cada punto es la media de los datos que se proyectan sobre él. Generaliza la primera componente de PCA de una recta a una curva y permite describir datos que siguen una trayectoria curvada con una sola coordenada: la posición a lo largo de la curva. Existen extensiones secuenciales que encadenan varias curvas para obtener más dimensiones.","cuando":"Para resumir con una sola coordenada datos que siguen una trayectoria curva, como un proceso de desarrollo o de degradación.","ej":"Ordenar células según su avance en un proceso de diferenciación a partir de su expresión génica (pseudotiempo).","rel":["pca","manifold-learning","lle-y-pca-local"]}]}]},{"id":"clustering","name":"Clustering","en":"clustering","frase":"Agrupar los datos en conjuntos de elementos parecidos, sin etiquetas previas.","desc":"El clustering busca grupos tales que sus elementos se parezcan entre sí más que a los de otros grupos. No hay una única definición de grupo: por centroides, por jerarquía, por densidad o por distribuciones de probabilidad, y cada familia descubre formas distintas. El resultado depende de la medida de similitud, del escalado y del número de grupos.","cuando":"Para descubrir segmentos o estructura en datos sin etiquetar, como clientes, documentos o patrones de uso.","ej":"Segmentar a los clientes por su comportamiento de compra para diseñar una campaña distinta para cada grupo.","py":[{"c":"sklearn.cluster","u":"https://scikit-learn.org/stable/api/sklearn.cluster.html"}],"rel":["k-means","clustering-jerarquico","dbscan","gmm","evaluacion-del-clustering"],"children":[{"id":"clustering-basado-en-centroides","name":"Clustering basado en centroides","en":"centroid-based clustering","frase":"Cada grupo se representa por un punto central y cada dato se asigna al centro más cercano.","desc":"Definen K centros y asignan cada punto al más cercano, alternando la asignación y la actualización de los centros hasta converger. Son rápidos y escalan a muchos datos, pero hay que fijar K de antemano y tienden a encontrar grupos compactos y de tamaño similar. El centro puede ser la media (k-means), un dato real (k-medoids) o la mediana (k-median).","cuando":"Con muchos datos y grupos aproximadamente esféricos y de tamaño parecido.","ej":"Elegir la ubicación de 5 almacenes de forma que cada tienda quede cerca de uno.","rel":["k-means","k-medoids-y-k-median","cuantizacion-vectorial","metodo-del-codo"],"children":[{"id":"k-means","name":"k-means","en":"k-means","frase":"Divide los datos en K grupos minimizando la distancia de cada punto a la media de su grupo.","desc":"Empieza con K centros, asigna cada punto al más cercano, recalcula cada centro como la media de sus puntos y repite hasta que nada cambia. Minimiza la suma de distancias al cuadrado dentro de los grupos. Es rápido y simple, pero depende de la inicialización (k-means++ la mejora), supone grupos esféricos de tamaño similar y es sensible a la escala y a los atípicos.","cuando":"Como primera opción de clustering con muchos datos numéricos escalados y grupos compactos.","ej":"Reducir los millones de colores de una foto a 16 representativos para comprimirla.","hp":[["n_clusters","número de grupos (K)"],["init","inicialización de los centros (k-means++ o aleatoria)"],["n_init","número de inicializaciones distintas; se queda con la mejor"]],"py":[{"c":"sklearn.cluster.KMeans","u":"https://scikit-learn.org/stable/modules/generated/sklearn.cluster.KMeans.html"},{"c":"sklearn.cluster.MiniBatchKMeans","u":"https://scikit-learn.org/stable/modules/generated/sklearn.cluster.MiniBatchKMeans.html"}],"rel":["clustering-basado-en-centroides","metodo-del-codo","gmm","cuantizacion-vectorial","escalado-de-variables"]},{"id":"k-medoids-y-k-median","name":"k-medoids y k-median","en":"k-medoids & k-median","frase":"Variantes de k-means con centros más robustos: un dato real (medoide) o la mediana.","desc":"k-medoids usa como centro de cada grupo un dato real, el que minimiza la distancia al resto, lo que permite usar cualquier medida de distancia y da representantes interpretables. k-median usa la mediana en cada dimensión y minimiza la distancia Manhattan. Ambos son más robustos a los atípicos que k-means, a cambio de más cálculo.","cuando":"Con atípicos, con distancias no euclídeas o cuando necesitas que cada grupo esté representado por un caso real.","ej":"Elegir 10 pacientes reales que representen los perfiles clínicos típicos de un hospital.","hp":[["n_clusters","número de grupos"],["metric","distancia entre puntos"],["method","algoritmo de búsqueda (alternate o pam)"]],"py":[{"c":"sklearn_extra.cluster.KMedoids","u":"https://scikit-learn-extra.readthedocs.io/en/stable/generated/sklearn_extra.cluster.KMedoids.html"},{"c":"kmedoids.KMedoids","u":"https://python-kmedoids.readthedocs.io/en/latest/#kmedoids.KMedoids"}],"rel":["k-means","distancia-manhattan","outliers","clustering-basado-en-centroides"]},{"id":"cuantizacion-vectorial","name":"Cuantización vectorial (VQ)","en":"vector quantization (VQ)","frase":"Representar cada vector por el más parecido de un pequeño diccionario de prototipos.","desc":"Aprende un libro de códigos con K vectores prototipo, normalmente con k-means, y sustituye cada dato por el índice de su prototipo más cercano. Comprime mucho y convierte datos continuos en símbolos discretos. Es la base de la compresión clásica de imagen y audio, y reaparece en modelos generativos modernos (VQ-VAE) y en la búsqueda vectorial aproximada (cuantización de producto).","cuando":"Para comprimir vectores o convertir señales continuas en símbolos discretos.","ej":"Comprimir una imagen guardando, para cada bloque de 4 × 4 píxeles, solo el número del bloque más parecido de un diccionario de 256.","py":[{"c":"scipy.cluster.vq.vq","u":"https://docs.scipy.org/doc/scipy/reference/generated/scipy.cluster.vq.vq.html"},{"c":"sklearn.cluster.KMeans","u":"https://scikit-learn.org/stable/modules/generated/sklearn.cluster.KMeans.html"}],"rel":["k-means","busqueda-aproximada-de-vecinos","vae","clustering-basado-en-centroides"]}]},{"id":"clustering-jerarquico","name":"Clustering jerárquico","en":"hierarchical clustering","frase":"Construye una jerarquía de grupos anidados uniendo, paso a paso, los dos más parecidos.","desc":"La versión aglomerativa empieza con cada punto como un grupo y fusiona en cada paso los dos grupos más cercanos según un criterio de enlace, hasta tener uno solo. El resultado es un árbol (dendrograma) que se corta a la altura deseada para obtener los grupos, sin fijar K de antemano. Su coste crece rápidamente con el número de datos.","cuando":"Con conjuntos de tamaño moderado, cuando interesa ver la estructura a varios niveles o no sabes cuántos grupos hay.","ej":"Construir una taxonomía de los productos de un supermercado a partir de qué se compra junto, de las categorías amplias a las subcategorías.","hp":[["n_clusters","número de grupos al cortar el árbol"],["linkage","criterio para medir la distancia entre grupos"],["distance_threshold","altura a la que se corta, en lugar de fijar el número de grupos"]],"py":[{"c":"sklearn.cluster.AgglomerativeClustering","u":"https://scikit-learn.org/stable/modules/generated/sklearn.cluster.AgglomerativeClustering.html"},{"c":"scipy.cluster.hierarchy.linkage","u":"https://docs.scipy.org/doc/scipy/reference/generated/scipy.cluster.hierarchy.linkage.html"}],"rel":["dendrograma","criterios-de-enlace","clustering","k-means"],"children":[{"id":"dendrograma","name":"Dendrograma","en":"dendrogram","frase":"El árbol que muestra en qué orden y a qué distancia se fusionan los grupos.","desc":"Cada hoja es un dato y cada unión indica la fusión de dos grupos, a una altura igual a la distancia entre ellos. Cortar el árbol con una línea horizontal da una partición: cuanto más bajo es el corte, más grupos salen. Los saltos grandes de altura sugieren un número natural de grupos.","ej":"En un dendrograma de especies animales construido a partir de su ADN, los mamíferos se unen entre sí mucho antes de unirse con las aves.","py":[{"c":"scipy.cluster.hierarchy.dendrogram","u":"https://docs.scipy.org/doc/scipy/reference/generated/scipy.cluster.hierarchy.dendrogram.html"}],"rel":["clustering-jerarquico","criterios-de-enlace","metodo-del-codo"]},{"id":"criterios-de-enlace","name":"Criterios de enlace (linkage)","en":"linkage criteria (single, complete, average, Ward)","frase":"Cómo se mide la distancia entre dos grupos para decidir cuáles se fusionan.","desc":"El enlace simple usa la distancia entre los puntos más cercanos de cada grupo y produce cadenas alargadas. El completo usa los más lejanos y produce grupos compactos. El promedio usa la media de todas las distancias entre pares. El de Ward fusiona los grupos que menos aumentan la varianza interna y suele dar los grupos más equilibrados.","cuando":"Ward, como opción por defecto con variables numéricas; el simple, cuando los grupos pueden tener formas alargadas.","ej":"Con dos grupos unidos por un puente de puntos, el enlace simple los fusiona en uno; Ward los mantiene separados.","py":[{"c":"scipy.cluster.hierarchy.linkage","u":"https://docs.scipy.org/doc/scipy/reference/generated/scipy.cluster.hierarchy.linkage.html"}],"rel":["clustering-jerarquico","dendrograma","distancia-y-similitud"]}]},{"id":"clustering-basado-en-densidad","name":"Clustering basado en densidad","en":"density-based clustering","frase":"Los grupos son regiones densas de puntos separadas por zonas vacías.","desc":"En lugar de centros, define los grupos como zonas donde los puntos están muy juntos. Encuentra grupos de cualquier forma, no necesita saber cuántos hay y deja sin asignar los puntos aislados, que trata como ruido. Le cuesta cuando los grupos tienen densidades muy distintas.","cuando":"Con grupos de formas irregulares, un número de grupos desconocido o presencia de ruido.","ej":"Detectar las zonas de una ciudad con muchos avisos de averías, ignorando los avisos aislados.","rel":["dbscan","mean-shift","kde","clustering"],"children":[{"id":"dbscan","name":"DBSCAN","en":"DBSCAN","frase":"Agrupa los puntos con suficientes vecinos cercanos y marca como ruido los aislados.","desc":"Un punto es central si tiene al menos un número mínimo de vecinos dentro de un radio ε. Los grupos se forman encadenando puntos centrales alcanzables entre sí, y los puntos que no pertenecen a ninguno quedan como ruido. Encuentra grupos de cualquier forma, pero ε y el mínimo de vecinos son difíciles de fijar si las densidades varían; HDBSCAN resuelve ese problema.","cuando":"Para grupos de forma arbitraria con ruido, cuando no conoces el número de grupos.","ej":"Agrupar las posiciones GPS de una flota de reparto para descubrir los lugares donde los vehículos se paran con frecuencia.","hp":[["eps","radio de la vecindad"],["min_samples","vecinos mínimos para que un punto sea central"]],"py":[{"c":"sklearn.cluster.DBSCAN","u":"https://scikit-learn.org/stable/modules/generated/sklearn.cluster.DBSCAN.html"},{"c":"sklearn.cluster.HDBSCAN","u":"https://scikit-learn.org/stable/modules/generated/sklearn.cluster.HDBSCAN.html"}],"rel":["clustering-basado-en-densidad","mean-shift","deteccion-basada-en-distancia","knn"]},{"id":"mean-shift","name":"Mean Shift","en":"Mean Shift","frase":"Desplaza cada punto hacia la zona más densa cercana; los que acaban en la misma cima forman un grupo.","desc":"Estima la densidad con un kernel y mueve iterativamente cada punto hacia la media de sus vecinos ponderada por el kernel, es decir, cuesta arriba en la densidad. Los puntos que convergen al mismo máximo (moda) forman un grupo. No necesita fijar el número de grupos, solo el ancho de banda, pero es costoso con muchos datos.","cuando":"Para encontrar los modos de una distribución con una cantidad moderada de datos, como en segmentación de imágenes o seguimiento de objetos.","ej":"Segmentar una imagen agrupando sus píxeles por color y posición en regiones homogéneas.","hp":[["bandwidth","anchura del kernel; más grande, menos grupos"]],"py":[{"c":"sklearn.cluster.MeanShift","u":"https://scikit-learn.org/stable/modules/generated/sklearn.cluster.MeanShift.html"},{"c":"sklearn.cluster.estimate_bandwidth","u":"https://scikit-learn.org/stable/modules/generated/sklearn.cluster.estimate_bandwidth.html"}],"rel":["kde","dbscan","clustering-basado-en-densidad","seguimiento-de-objetos"]}]},{"id":"spectral-clustering","name":"Spectral clustering","en":"spectral clustering","frase":"Agrupa usando los autovectores de un grafo de similitud entre los puntos.","desc":"Construye un grafo en el que los puntos parecidos están conectados y usa los autovectores de su matriz laplaciana para representar cada punto en pocas dimensiones, donde después aplica k-means. Así detecta grupos definidos por la conectividad, como anillos concéntricos, que k-means no separaría. Su coste crece mucho con el número de datos.","cuando":"Con grupos no convexos o definidos por la conectividad y conjuntos de tamaño moderado.","ej":"Separar dos anillos concéntricos de puntos, que k-means cortaría por la mitad.","hp":[["n_clusters","número de grupos"],["affinity","cómo se construye el grafo de similitud (kernel RBF o vecinos más cercanos)"],["gamma","anchura del kernel RBF"]],"py":[{"c":"sklearn.cluster.SpectralClustering","u":"https://scikit-learn.org/stable/modules/generated/sklearn.cluster.SpectralClustering.html"}],"rel":["k-means","truco-del-kernel","clustering","isomap"]},{"id":"gmm","name":"Modelos de mezcla gaussiana (GMM)","en":"Gaussian mixture models (GMM)","frase":"Modela los datos como una mezcla de gaussianas y da a cada punto una probabilidad de pertenecer a cada grupo.","desc":"Supone que los datos proceden de K distribuciones normales, cada una con su media, su covarianza y su peso, y las estima con el algoritmo EM. A diferencia de k-means, la asignación es blanda (probabilidades) y los grupos pueden ser elípticos y de tamaños distintos. También sirve para estimar densidades y generar datos nuevos.","cuando":"Cuando los grupos pueden ser elípticos o solaparse, o cuando necesitas probabilidades de pertenencia.","ej":"Modelar las alturas de una población adulta como la mezcla de dos gaussianas, una por sexo, y obtener para cada persona la probabilidad de pertenecer a cada una.","hp":[["n_components","número de gaussianas"],["covariance_type","forma de las covarianzas (full, diag, tied o spherical)"]],"py":[{"c":"sklearn.mixture.GaussianMixture","u":"https://scikit-learn.org/stable/modules/generated/sklearn.mixture.GaussianMixture.html"},{"c":"sklearn.mixture.BayesianGaussianMixture","u":"https://scikit-learn.org/stable/modules/generated/sklearn.mixture.BayesianGaussianMixture.html"}],"rel":["k-means","estimacion-de-densidad","maxima-verosimilitud","deteccion-basada-en-probabilidad"]},{"id":"metodo-del-codo","name":"Elección del número de clusters (método del codo)","en":"elbow method","frase":"Elegir el número de grupos donde añadir uno más deja de mejorar mucho el ajuste.","desc":"Se ejecuta el clustering para varios valores de K y se representa la inercia (suma de distancias al cuadrado dentro de los grupos) frente a K. La curva siempre baja, pero a partir de cierto punto lo hace mucho más despacio, y ese codo sugiere un K razonable. Como el codo no siempre es claro, conviene contrastarlo con la silueta u otros índices y con el sentido del problema.","cuando":"Para orientar la elección de K en k-means y métodos similares.","ej":"La inercia cae mucho de 2 a 4 grupos de clientes y casi nada a partir de 5: se eligen 4 o 5 segmentos.","py":[{"c":"KMeans(n_clusters=k).fit(X).inertia_","s":1}],"rel":["k-means","coeficiente-de-silueta","evaluacion-del-clustering","dendrograma"]},{"id":"evaluacion-del-clustering","name":"Evaluación del clustering","en":"clustering evaluation","frase":"Medir la calidad de unos grupos cuando no hay etiquetas con las que comparar.","desc":"Sin etiquetas se usan índices internos, que premian grupos compactos y bien separados, como la silueta, Calinski-Harabasz o Davies-Bouldin. Si existen etiquetas de referencia, se usan índices externos, como el índice de Rand ajustado o la información mutua normalizada. Ningún índice sustituye la pregunta clave: si los grupos son útiles para el problema.","ej":"Comparar segmentaciones de clientes con 3, 4 y 5 grupos usando la silueta y comprobar después con el equipo de marketing si los grupos tienen sentido.","py":[{"c":"sklearn.metrics.adjusted_rand_score","u":"https://scikit-learn.org/stable/modules/generated/sklearn.metrics.adjusted_rand_score.html"},{"c":"sklearn.metrics.normalized_mutual_info_score","u":"https://scikit-learn.org/stable/modules/generated/sklearn.metrics.normalized_mutual_info_score.html"}],"rel":["coeficiente-de-silueta","indice-de-calinski-harabasz","indice-de-davies-bouldin","metodo-del-codo"],"children":[{"id":"coeficiente-de-silueta","name":"Coeficiente de silueta","en":"silhouette coefficient","frase":"Compara, para cada punto, la distancia a su propio grupo con la distancia al grupo vecino más cercano.","desc":"Para cada punto calcula s = (b − a) / máx(a, b), donde a es la distancia media a los puntos de su grupo y b, la distancia media a los del grupo más cercano. Va de −1 a 1: cerca de 1, punto bien asignado; cerca de 0, en la frontera; negativo, probablemente en el grupo equivocado. La media de todos los puntos resume la calidad global y ayuda a elegir K.","cuando":"Para elegir el número de grupos y detectar puntos mal asignados.","ej":"Con K = 3 la silueta media es 0,62 y con K = 6 baja a 0,35: la partición en tres grupos es más clara.","py":[{"c":"sklearn.metrics.silhouette_score","u":"https://scikit-learn.org/stable/modules/generated/sklearn.metrics.silhouette_score.html"},{"c":"sklearn.metrics.silhouette_samples","u":"https://scikit-learn.org/stable/modules/generated/sklearn.metrics.silhouette_samples.html"}],"rel":["evaluacion-del-clustering","metodo-del-codo","k-means","indice-de-davies-bouldin"]},{"id":"indice-de-calinski-harabasz","name":"Índice de Calinski-Harabasz","en":"Calinski-Harabasz index","frase":"Cociente entre la dispersión entre grupos y la dispersión dentro de ellos: cuanto más alto, mejor.","desc":"Compara la dispersión de los centros de los grupos con la dispersión dentro de cada grupo, corregidas por el número de grupos y de puntos. Los valores altos indican grupos densos y bien separados. Es muy rápido de calcular, pero favorece los grupos convexos y esféricos, como los de k-means.","cuando":"Para comparar rápidamente distintos valores de K con muchos datos.","ej":"Calcular el índice para K entre 2 y 10 en una segmentación de un millón de clientes, donde la silueta sería demasiado lenta.","py":[{"c":"sklearn.metrics.calinski_harabasz_score","u":"https://scikit-learn.org/stable/modules/generated/sklearn.metrics.calinski_harabasz_score.html"}],"rel":["evaluacion-del-clustering","coeficiente-de-silueta","indice-de-davies-bouldin"]},{"id":"indice-de-davies-bouldin","name":"Índice de Davies-Bouldin","en":"Davies-Bouldin index","frase":"Mide cuánto se parece cada grupo a su vecino más similar: cuanto más bajo, mejor.","desc":"Para cada grupo calcula el peor cociente entre la suma de las dispersiones de dos grupos y la distancia entre sus centros, y promedia esos valores. Un valor cercano a cero indica grupos compactos y bien separados. Como Calinski-Harabasz, es rápido y favorece los grupos convexos.","cuando":"Como índice complementario a la silueta para comparar particiones.","ej":"Una segmentación con un índice de Davies-Bouldin de 0,4 es más clara que otra con 1,2.","py":[{"c":"sklearn.metrics.davies_bouldin_score","u":"https://scikit-learn.org/stable/modules/generated/sklearn.metrics.davies_bouldin_score.html"}],"rel":["evaluacion-del-clustering","coeficiente-de-silueta","indice-de-calinski-harabasz"]}]}]},{"id":"estimacion-de-densidad","name":"Estimación de densidad","en":"density estimation","frase":"Estimar, a partir de una muestra, la distribución de probabilidad de la que proceden los datos.","desc":"El objetivo es conocer la densidad p(x): qué valores son frecuentes y cuáles raros. Los métodos paramétricos suponen una forma, como una gaussiana o una mezcla de gaussianas; los no paramétricos, como el histograma o la KDE, dejan que los datos dicten la forma. Una buena estimación permite detectar anomalías, generar datos nuevos y calcular probabilidades.","cuando":"Para conocer la distribución de unos datos, detectar valores improbables o generar muestras parecidas.","ej":"Estimar la distribución de la duración de las llamadas a un servicio de atención para detectar las anormalmente largas.","rel":["histograma","kde","gmm","deteccion-basada-en-probabilidad","modelo-generativo-vs-discriminativo"],"children":[{"id":"histograma","name":"Histograma","en":"histogram","frase":"Cuenta cuántos datos caen en cada intervalo: la estimación de densidad más simple.","desc":"Divide el rango de valores en intervalos y cuenta los datos de cada uno; normalizado, aproxima la densidad. Es simple e intuitivo, pero el resultado depende mucho de la anchura y la posición de los intervalos, es escalonado y escala mal a varias dimensiones. Reglas como las de Sturges o Freedman-Diaconis ayudan a elegir el número de intervalos.","cuando":"Para una primera visión rápida de la distribución de una variable.","ej":"El histograma de los tiempos de entrega de un servicio de reparto revela dos picos: entregas en el mismo día y al día siguiente.","hp":[["bins","número de intervalos, o regla para elegirlo"]],"py":[{"c":"numpy.histogram","u":"https://numpy.org/doc/stable/reference/generated/numpy.histogram.html"},{"c":"numpy.histogram_bin_edges","u":"https://numpy.org/doc/stable/reference/generated/numpy.histogram_bin_edges.html"}],"rel":["kde","estimacion-de-densidad","eda"]},{"id":"kde","name":"Estimación kernel de densidad (KDE / ventanas de Parzen)","en":"kernel density estimation (KDE, Parzen windows)","frase":"Estima la densidad colocando una pequeña campana sobre cada dato y sumándolas.","desc":"La estimación kernel de densidad, o ventanas de Parzen, sitúa una función suave, normalmente una gaussiana, sobre cada observación y las promedia. El resultado es una curva continua y suave que no depende de la posición de unos intervalos. El ancho de banda controla el equilibrio: si es pequeño, la estimación es ruidosa; si es grande, borra la estructura.","cuando":"Para estimar densidades suaves en pocas dimensiones, visualizar distribuciones o puntuar lo raro que es un dato.","ej":"Estimar sobre un mapa la densidad de accidentes de tráfico para localizar los puntos negros de una carretera.","hp":[["bandwidth","anchura del kernel; controla la suavidad de la estimación"],["kernel","forma de la campana (gaussiana, Epanechnikov…)"]],"py":[{"c":"sklearn.neighbors.KernelDensity","u":"https://scikit-learn.org/stable/modules/generated/sklearn.neighbors.KernelDensity.html"},{"c":"scipy.stats.gaussian_kde","u":"https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.gaussian_kde.html"}],"rel":["histograma","estimacion-de-densidad","mean-shift","deteccion-basada-en-probabilidad"]}]}]},{"id":"redes-neuronales","name":"Redes neuronales: cómo aprenden","en":"neural networks: how they learn","frase":"Cómo una red ajusta millones de pesos para reducir su error, paso a paso.","desc":"Cómo aprende una red neuronal. Las neuronas combinan sus entradas con pesos y aplican una activación no lineal; una función de pérdida mide el error, y un optimizador ajusta millones de pesos mediante descenso por gradiente y retropropagación. Incluye también la regularización y los trucos prácticos que hacen que el entrenamiento funcione.","cuando":"Cuando los datos son complejos (imágenes, texto, audio) o muy abundantes y los modelos clásicos se quedan cortos.","ej":"Entrenar un MLP para reconocer dígitos escritos a mano: en cada época la red ve todas las imágenes, calcula su error y corrige un poco los pesos en la dirección que lo reduce.","py":[{"c":"keras.Sequential","u":"https://keras.io/api/models/sequential/"},{"c":"torch.nn.Module","u":"https://docs.pytorch.org/docs/stable/generated/torch.nn.Module.html"}],"rel":["mlp","descenso-por-gradiente","backpropagation","arquitecturas-de-redes-neuronales"],"children":[{"id":"neurona-artificial","name":"Neurona biológica y neurona artificial","en":"artificial neuron","frase":"Unidad que suma sus entradas ponderadas y aplica una activación; inspirada, de lejos, en la neurona biológica.","desc":"Una neurona biológica recibe señales por las dendritas y, si su suma supera un umbral, dispara un impulso por el axón. La neurona artificial imita esa idea de forma muy simplificada: calcula una suma ponderada de sus entradas más un sesgo, z = w·x + b, y le aplica una función de activación no lineal. Los pesos, que se aprenden, determinan cuánto influye cada entrada.","ej":"Una neurona que decide si un correo es spam da un peso positivo a la palabra \"gratis\" y uno negativo a que el remitente sea un contacto conocido.","py":[{"c":"keras.layers.Dense","u":"https://keras.io/api/layers/core_layers/dense/"},{"c":"torch.nn.Linear","u":"https://docs.pytorch.org/docs/stable/generated/torch.nn.Linear.html"}],"rel":["perceptron","funciones-de-activacion","mlp","inspiracion-biologica-de-las-cnn"]},{"id":"perceptron","name":"Perceptrón","en":"perceptron","frase":"La primera neurona artificial entrenable: un clasificador lineal que corrige sus pesos con cada error.","desc":"Propuesto por Rosenblatt en 1958, aplica un escalón a una suma ponderada para decidir entre dos clases. Su regla de aprendizaje ajusta los pesos cada vez que se equivoca y converge si las clases son linealmente separables. No puede resolver problemas como el XOR, una limitación que frenó el campo hasta la llegada de las redes multicapa.","ej":"Un perceptrón aprende la función lógica AND, pero ninguna recta separa los casos del XOR, así que esa no la aprende nunca.","py":[{"c":"sklearn.linear_model.Perceptron","u":"https://scikit-learn.org/stable/modules/generated/sklearn.linear_model.Perceptron.html"}],"rel":["neurona-artificial","mlp","breve-historia-de-la-ia","svm"]},{"id":"mlp","name":"Perceptrón multicapa (MLP)","en":"multilayer perceptron (MLP)","frase":"Capas de neuronas conectadas en cadena: con capas ocultas y no linealidades, aproxima casi cualquier función.","desc":"El perceptrón multicapa encadena una capa de entrada, una o más capas ocultas y una de salida, con todas las neuronas de una capa conectadas a las de la siguiente (capas densas). Las activaciones no lineales le permiten aprender relaciones no lineales, y el teorema de aproximación universal garantiza que una capa oculta suficientemente ancha puede aproximar cualquier función continua. Se entrena con retropropagación.","cuando":"Con datos tabulares o vectores de características cuando la relación es no lineal, y como cabeza de clasificación de otras redes.","ej":"Una red con dos capas ocultas de 64 neuronas que predice la probabilidad de impago a partir de 30 variables de cada cliente.","hp":[["hidden_layer_sizes","número y tamaño de las capas ocultas"],["alpha","fuerza de la regularización L2"],["learning_rate_init","tamaño de paso inicial"]],"py":[{"c":"keras.layers.Dense","u":"https://keras.io/api/layers/core_layers/dense/"},{"c":"torch.nn.Linear","u":"https://docs.pytorch.org/docs/stable/generated/torch.nn.Linear.html"},{"c":"sklearn.neural_network.MLPClassifier","u":"https://scikit-learn.org/stable/modules/generated/sklearn.neural_network.MLPClassifier.html"}],"rel":["neurona-artificial","backpropagation","funciones-de-activacion","api-secuencial"]},{"id":"funciones-de-activacion","name":"Funciones de activación","en":"activation functions","frase":"La no linealidad que se aplica a la salida de cada neurona y da a la red su capacidad expresiva.","desc":"Sin ellas, cualquier número de capas equivaldría a una sola transformación lineal. Las activaciones ocultas más usadas hoy son ReLU y sus variantes, y GELU en los transformers. En la salida, la activación depende del problema: lineal para regresión, sigmoide para clasificación binaria o multietiqueta y softmax para multiclase. Su forma influye en cómo fluye el gradiente durante el entrenamiento.","ej":"Una red que predice precios termina en una neurona lineal; una que clasifica imágenes en diez clases, en una softmax.","py":[{"c":"keras.activations.relu","u":"https://keras.io/api/layers/activations/#relu-function"},{"c":"torch.nn.functional.relu","u":"https://docs.pytorch.org/docs/stable/generated/torch.nn.functional.relu.html"}],"rel":["sigmoide-y-tanh","relu-y-variantes","gelu","softmax","desvanecimiento-y-explosion-del-gradiente"],"children":[{"id":"sigmoide-y-tanh","name":"Sigmoide y tanh","en":"sigmoid & tanh","frase":"Funciones en forma de S que comprimen la entrada al intervalo (0, 1) o al (−1, 1).","desc":"La sigmoide, σ(z) = 1/(1 + e⁻ᶻ), da valores entre 0 y 1 y se usa en la salida para probabilidades binarias o multietiqueta. La tangente hiperbólica da valores entre −1 y 1 y está centrada en cero. Ambas se saturan con entradas grandes, donde su derivada casi se anula, lo que provoca el desvanecimiento del gradiente en redes profundas; por eso en las capas ocultas se prefirió ReLU. Siguen siendo clave en las puertas de LSTM y GRU.","ej":"La salida de un detector de spam pasa por una sigmoide: un 0,93 se interpreta como un 93 % de probabilidad de spam.","py":[{"c":"keras.activations.sigmoid","u":"https://keras.io/api/layers/activations/#sigmoid-function"},{"c":"keras.activations.tanh","u":"https://keras.io/api/layers/activations/#tanh-function"},{"c":"torch.nn.Sigmoid","u":"https://docs.pytorch.org/docs/stable/generated/torch.nn.Sigmoid.html"},{"c":"torch.nn.Tanh","u":"https://docs.pytorch.org/docs/stable/generated/torch.nn.Tanh.html"}],"rel":["funciones-de-activacion","regresion-logistica","desvanecimiento-y-explosion-del-gradiente","lstm"]},{"id":"relu-y-variantes","name":"ReLU y variantes (Leaky ReLU, ELU)","en":"ReLU & variants (Leaky ReLU, ELU)","frase":"max(0, z): la activación por defecto en capas ocultas, simple y con un gradiente que no se satura.","desc":"ReLU deja pasar los valores positivos y anula los negativos. Es barata de calcular y su gradiente vale 1 en la parte positiva, lo que facilitó entrenar redes profundas. Su problema es que una neurona puede quedar \"muerta\", siempre en la zona negativa y sin gradiente. Leaky ReLU usa una pequeña pendiente para los negativos y ELU una curva exponencial suave, lo que mantiene vivo el gradiente.","cuando":"ReLU, como activación por defecto en capas ocultas de redes densas y convolucionales; sus variantes, si muchas neuronas se quedan muertas.","ej":"En una CNN que clasifica radiografías, cada convolución va seguida de una ReLU.","hp":[["negative_slope","en Leaky ReLU, pendiente para las entradas negativas"]],"py":[{"c":"keras.layers.ReLU","u":"https://keras.io/api/layers/activation_layers/relu/"},{"c":"keras.layers.LeakyReLU","u":"https://keras.io/api/layers/activation_layers/leaky_relu/"},{"c":"torch.nn.ReLU","u":"https://docs.pytorch.org/docs/stable/generated/torch.nn.ReLU.html"},{"c":"torch.nn.LeakyReLU","u":"https://docs.pytorch.org/docs/stable/generated/torch.nn.LeakyReLU.html"},{"c":"torch.nn.ELU","u":"https://docs.pytorch.org/docs/stable/generated/torch.nn.ELU.html"}],"rel":["funciones-de-activacion","gelu","desvanecimiento-y-explosion-del-gradiente","inicializacion-de-pesos"]},{"id":"gelu","name":"GELU","en":"GELU","frase":"Variante suave de ReLU que pondera cada entrada por la probabilidad de que sea positiva; estándar en transformers.","desc":"GELU multiplica la entrada por la función de distribución de una normal estándar: z·Φ(z). Se comporta como ReLU para valores grandes, pero es suave y deja pasar algo de señal en los negativos cercanos a cero. Es la activación habitual en BERT, GPT y los vision transformers. Variantes como SwiGLU, con una puerta multiplicativa, dominan en los LLM recientes.","cuando":"En las capas ocultas de transformers y de modelos modernos de lenguaje y visión.","ej":"Cada bloque feed-forward de BERT expande la representación de 768 a 3.072 dimensiones, aplica GELU y la vuelve a proyectar a 768.","py":[{"c":"keras.activations.gelu","u":"https://keras.io/api/layers/activations/#gelu-function"},{"c":"torch.nn.GELU","u":"https://docs.pytorch.org/docs/stable/generated/torch.nn.GELU.html"}],"rel":["relu-y-variantes","bloque-transformer","funciones-de-activacion","bert"]},{"id":"softmax","name":"Softmax","en":"softmax","frase":"Convierte un vector de puntuaciones en probabilidades positivas que suman 1.","desc":"Aplica la exponencial a cada puntuación (logit) y divide por la suma de todas, de modo que la mayor recibe la mayor probabilidad. Es la salida estándar de la clasificación multiclase y el núcleo del mecanismo de atención. Dividir los logits por una temperatura antes de aplicarla hace la distribución más plana (temperatura alta) o más picuda (temperatura baja).","ej":"Los logits 2,0, 1,0 y 0,1 para gato, perro y pájaro se convierten en probabilidades de 0,66, 0,24 y 0,10.","py":[{"c":"keras.activations.softmax","u":"https://keras.io/api/layers/activations/#softmax-function"},{"c":"torch.nn.Softmax","u":"https://docs.pytorch.org/docs/stable/generated/torch.nn.Softmax.html"}],"rel":["entropia-cruzada","clasificacion-multiclase-y-multietiqueta","mecanismo-de-atencion","decodificacion-y-temperatura"]}]},{"id":"funciones-de-perdida","name":"Funciones de pérdida","en":"loss functions","frase":"La medida del error que la red minimiza durante el entrenamiento.","desc":"La función de pérdida compara la predicción con el valor real y devuelve un número que el optimizador intenta reducir. Su elección depende del tipo de salida: errores cuadráticos o absolutos en regresión, entropía cruzada en clasificación, pérdidas perceptuales o adversarias en imágenes generadas. Muchas se derivan del principio de máxima verosimilitud bajo distintos supuestos sobre el ruido.","ej":"Un modelo que predice la demanda horaria minimiza el MSE; uno que clasifica tumores, la entropía cruzada.","py":[{"c":"keras.losses","u":"https://keras.io/api/losses/"},{"c":"torch.nn.functional","u":"https://docs.pytorch.org/docs/stable/nn.functional.html"}],"rel":["perdidas-de-regresion","entropia-cruzada","funcion-de-perdida-vs-metrica","maxima-verosimilitud"],"children":[{"id":"perdidas-de-regresion","name":"Pérdidas de regresión (MSE, MAE, Huber)","en":"regression losses (MSE, MAE, Huber)","frase":"MSE, MAE y Huber: tres formas de penalizar el error numérico, con distinta sensibilidad a los atípicos.","desc":"El MSE eleva los errores al cuadrado: penaliza mucho los grandes y lleva a predecir la media. El MAE usa el valor absoluto: es robusto a los atípicos y lleva a predecir la mediana, pero su gradiente no disminuye cerca del óptimo. Huber combina ambas: se comporta como el MSE con errores pequeños y como el MAE con los grandes, a partir de un umbral δ.","cuando":"MSE, por defecto; MAE o Huber, cuando hay atípicos que no deben dominar el entrenamiento.","ej":"Al predecir tiempos de entrega con algunos retrasos extremos por incidencias, Huber evita que esos
