<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Mapa interactivo de IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Recursive:wght,MONO@300..1000,0..1&display=swap">
<style>
/* Layout: el mapa es un grafo de nodos y cables (como un editor de nodos de ML) sobre una retícula de puntos;
   la ficha del concepto vive fija a la derecha y, en móvil, en una hoja inferior. Áreas coloreadas con viridis. */
:root {
  --bg: #eef1f0;        /* lienzo: gris frío con sesgo hacia el teal del acento */
  --surface: #fbfcfc;   /* nodos, barra y panel */
  --ink: #13201e;       /* texto principal */
  --muted: #5a6a66;     /* texto secundario */
  --line: #cfd8d5;      /* bordes */
  --grid: #c2cdca;      /* puntos de la retícula */
  --accent: #1d7c77;    /* selección e interacción (teal de viridis, oscurecido) */
  --code-bg: #e9efed;
  --shadow: rgba(19, 32, 30, .16);
  --tip-bg: #16302c;    /* tarjeta flotante "en una frase": invertida respecto al lienzo */
  --tip-fg: #eef5f3;
  --font-ui: "Recursive", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "Recursive", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  /* 18 áreas en orden del árbol, muestreadas de la escala viridis (tramo legible sobre fondo claro) */
  --a0:#440154; --a1:#471365; --a2:#482475; --a3:#46337f; --a4:#414287; --a5:#3b518b;
  --a6:#355e8d; --a7:#2f6b8e; --a8:#2a778e; --a9:#26828e; --a10:#218f8d; --a11:#1e9b8a;
  --a12:#21a685; --a13:#2db27d; --a14:#40bd72; --a15:#58c765; --a16:#75d054; --a17:#95d840;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1312; --surface: #151d1c; --ink: #e2ebe9; --muted: #92a39f;
    --line: #283331; --grid: #22302d; --accent: #49beb2; --code-bg: #1d2826; --shadow: rgba(0, 0, 0, .5);
    --tip-bg: #e4efec; --tip-fg: #10201d;
    --a0:#433e85; --a1:#3e4c8a; --a2:#38598c; --a3:#31668e; --a4:#2c718e; --a5:#287d8e;
    --a6:#23898e; --a7:#1f948c; --a8:#1fa088; --a9:#25ac82; --a10:#34b679; --a11:#48c16e;
    --a12:#63cb5f; --a13:#7fd34e; --a14:#9dd93b; --a15:#c0df25; --a16:#dfe318; --a17:#fde725;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1312; --surface: #151d1c; --ink: #e2ebe9; --muted: #92a39f;
  --line: #283331; --grid: #22302d; --accent: #49beb2; --code-bg: #1d2826; --shadow: rgba(0, 0, 0, .5);
  --tip-bg: #e4efec; --tip-fg: #10201d;
  --a0:#433e85; --a1:#3e4c8a; --a2:#38598c; --a3:#31668e; --a4:#2c718e; --a5:#287d8e;
  --a6:#23898e; --a7:#1f948c; --a8:#1fa088; --a9:#25ac82; --a10:#34b679; --a11:#48c16e;
  --a12:#63cb5f; --a13:#7fd34e; --a14:#9dd93b; --a15:#c0df25; --a16:#dfe318; --a17:#fde725;
  color-scheme: dark;
}

html { box-sizing: border-box; height: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font: 400 14px/1.45 var(--font-ui); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); }

/* ---------- Barra superior ---------- */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 24px; padding: 12px 20px;
       background: var(--surface); border-bottom: 1px solid var(--line); position: relative; z-index: 5; }
.brand h1 { margin: 0; font: 850 22px/1.05 var(--font-ui); letter-spacing: -0.02em; }
.meta { margin: 4px 0 0; color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.pill { font-size: 11.5px; padding: 2px 8px; border-radius: 999px; border: 1px dashed var(--muted); color: var(--muted); }
.search { position: relative; flex: 1 1 260px; max-width: 440px; }
.search input { width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 7px;
                background: var(--bg); color: var(--ink); font: 450 14px/1.2 var(--font-ui); }
.search input::placeholder { color: var(--muted); }
#resultados { position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 30; margin: 0; padding: 4px;
              list-style: none; background: var(--surface); border: 1px solid var(--line); border-radius: 9px;
              box-shadow: 0 12px 32px var(--shadow); max-height: min(60vh, 440px); overflow: auto; }
#resultados button { display: grid; grid-template-columns: 8px minmax(0, 1fr) auto; column-gap: 10px; row-gap: 2px;
                     align-items: baseline; width: 100%; padding: 8px 10px; border: 0;
                     border-radius: 6px; background: none; text-align: left; cursor: pointer; }
#resultados button[aria-selected="true"], #resultados button:hover { background: var(--bg); }
#resultados .dot { align-self: center; }
.r-name { min-width: 0; font-weight: 560; }
.r-area { color: var(--muted); font-size: 12px; text-align: right; max-width: 14em; }
.r-frase { grid-column: 2 / 4; color: var(--muted); font-size: 12.5px; line-height: 1.35;
           white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#resultados .vacio { padding: 10px; color: var(--muted); }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-left: auto; }
.btn { padding: 8px 11px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface);
       font-size: 13px; line-height: 1; cursor: pointer; }
.btn:hover:not(:disabled) { border-color: var(--muted); }
.btn:disabled { opacity: .45; cursor: default; }
.zoom { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); }
.zoom button { width: 32px; height: 31px; border: 0; background: none; font-size: 16px; cursor: pointer; }
#z-nivel { min-width: 48px; text-align: center; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* ---------- Escenario: mapa + ficha ---------- */
.stage { display: grid; grid-template-columns: minmax(0, 1fr) clamp(330px, 31vw, 440px); min-height: 0; }
.viewport { overflow: auto; min-height: 0; overscroll-behavior: contain;
            background-color: var(--bg);
            background-image: radial-gradient(circle at 1px 1px, var(--grid) 1.1px, transparent 1.5px);
            background-size: 22px 22px; background-attachment: local; }
.sizer { position: relative; }
.canvas { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#wires { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
.w { fill: none; stroke-width: 1.4; opacity: .4; }
.w.on { opacity: 1; stroke-width: 2.6; }
.w.draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .4s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }

/* Nodos: caja con puerto de entrada (izquierda) y de salida (derecha, solo si tiene hijos) */
.node { position: absolute; left: 0; top: 0; width: 216px; display: flex; align-items: center; gap: 8px;
        padding: 8px 14px 8px 13px; border: 1px solid var(--line); border-radius: 7px;
        background: var(--surface); font: 430 13.5px/1.3 var(--font-ui); text-align: left; cursor: pointer; }
.node:hover { border-color: var(--muted); }
.node .label { flex: 1; min-width: 0; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.node .nw { white-space: nowrap; }
.node .count { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.port { position: absolute; top: 50%; width: 10px; height: 10px; margin-top: -5px; border-radius: 50%;
        background: var(--c, var(--accent)); }
.port.in { left: -5.5px; }
.port.out { right: -5.5px; background: var(--surface); border: 2px solid var(--c, var(--accent)); }
.node.open .port.out { background: var(--c, var(--accent)); }
.node.d0 { width: 168px; padding: 14px 16px; border-color: var(--ink); font: 850 17px/1.15 var(--font-ui); letter-spacing: -0.01em; }
.node.d0 .port.in { display: none; }
.node.d1 { font-weight: 640; font-size: 14.5px; }
.node.pending .label { color: var(--muted); }
.node.pending { border-style: dashed; }
.node.path { border-color: var(--c, var(--accent)); }
.node.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent);
            background: color-mix(in oklab, var(--accent) 9%, var(--surface)); }
.node.sel .label { color: var(--ink); }
.node.enter { animation: entra .3s cubic-bezier(.2, .7, .2, 1) both; animation-delay: calc(var(--i, 0) * 14ms); }
@keyframes entra { from { opacity: 0; translate: -14px 0; } to { opacity: 1; translate: 0 0; } }

/* "En una frase": tarjeta flotante al pasar el ratón (o enfocar con teclado). No captura el ratón. */
.tip { position: fixed; z-index: 40; max-width: 300px; padding: 10px 13px 11px; border-radius: 9px;
       background: var(--tip-bg); color: var(--tip-fg); box-shadow: 0 10px 28px var(--shadow);
       font-size: 13.5px; line-height: 1.42; pointer-events: none;
       opacity: 0; translate: 0 -3px; transition: opacity .14s ease, translate .14s ease; }
.tip.down { translate: 0 3px; }
.tip.on { opacity: 1; translate: 0 0; }
.tip p { margin: 0; display: flex; gap: 9px; align-items: baseline; }
.tip .dot { position: relative; top: -1px; }
.tip::before { content: ""; position: absolute; left: var(--ax, 24px); width: 10px; height: 10px; margin-left: -5px;
               background: var(--tip-bg); transform: rotate(45deg); }
.tip:not(.down)::before { top: -4px; }
.tip.down::before { bottom: -4px; }

/* ---------- Ficha ---------- */
.panel { position: relative; min-height: 0; overflow: auto; background: var(--surface); border-left: 1px solid var(--line); }
.handle { display: none; }
#ficha { padding: 22px 26px 30px; max-width: 64ch; }
.crumbs { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 6px; font-size: 12.5px; color: var(--muted); }
.crumbs button { padding: 0; border: 0; background: none; color: var(--muted); cursor: pointer; text-align: left; }
.crumbs button:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
#ficha h2 { margin: 10px 0 0; font: 800 27px/1.1 var(--font-ui); letter-spacing: -0.02em; text-wrap: balance; }
.area-tag { display: inline-flex; align-items: center; gap: 7px; margin-top: 8px; font-size: 12.5px; color: var(--muted); }
.en { margin: 4px 0 0; color: var(--muted); font-size: 13.5px; }
.lead { margin: 14px 0 0; font-size: 17px; font-weight: 520; line-height: 1.42; text-wrap: pretty; }
.desc { margin: 12px 0 0; font-size: 15px; line-height: 1.6; }
.blk { margin-top: 22px; }
.blk h3 { margin: 0 0 8px; font: 650 13px/1.2 var(--font-ui); color: var(--muted); }
.blk > p { margin: 0; font-size: 14.5px; line-height: 1.55; }
.cuando { padding: 12px 14px 13px; border-radius: 9px; background: color-mix(in oklab, var(--accent) 9%, var(--surface)); }
.cuando h3 { color: var(--accent); }
.hp { display: grid; grid-template-columns: minmax(0, max-content) minmax(0, 1fr); gap: 7px 14px; margin: 0; font-size: 14px; line-height: 1.45; }
.hp dt { min-width: 0; }
.hp dt code { display: inline-block; padding: 2px 6px; border-radius: 5px; background: var(--code-bg); font-size: 12.5px; overflow-wrap: anywhere; }
.hp dd { margin: 0; min-width: 0; color: var(--ink); }
.pending-note { margin: 16px 0 0; padding: 12px 14px; border: 1px dashed var(--line); border-radius: 8px; color: var(--muted); }
code { font-family: var(--font-mono); font-variation-settings: "MONO" 1; font-size: .92em; }
.desc code, .ej code { padding: 1px 5px; border-radius: 4px; background: var(--code-bg); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px 5px 9px; border: 1px solid var(--line);
        border-radius: 999px; background: var(--bg); font-size: 12.5px; line-height: 1.25; text-align: left; cursor: pointer; }
.chip:hover { border-color: var(--c, var(--muted)); }
.dot { width: 8px; height: 8px; flex: none; border-radius: 50%; background: var(--c, var(--accent)); }
.py { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.py li { display: flex; align-items: center; gap: 8px; min-width: 0; padding: 5px 5px 5px 11px; border-radius: 7px; background: var(--code-bg); }
.py code { flex: 1; min-width: 0; overflow-x: auto; white-space: nowrap; font-size: 12.5px; padding-block: 3px; }
.copy, .docs { flex: none; display: inline-flex; align-items: center; gap: 5px; padding: 5px 9px; border: 1px solid var(--line);
               border-radius: 6px; background: var(--surface); color: var(--ink); font-size: 12px; line-height: 1.2;
               text-decoration: none; cursor: pointer; }
.copy:hover, .docs:hover { border-color: var(--muted); }
.docs svg { width: 11px; height: 11px; }
.seq { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 30px; padding-top: 14px; border-top: 1px solid var(--line); }
.seq .pos { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.foot { margin-top: 18px; color: var(--muted); font-size: 12px; line-height: 1.5; }
.foot kbd { font-family: var(--font-mono); font-variation-settings: "MONO" 1; padding: 0 4px; border: 1px solid var(--line); border-radius: 4px; }

/* ---------- Móvil: la ficha pasa a una hoja inferior (asomada / abierta) ---------- */
@media (max-width: 860px) {
  .bar { padding: 10px 16px; gap: 10px 12px; }
  .brand { flex: 1 1 auto; min-width: 0; }
  .brand h1 { font-size: 19px; }
  .tools { flex: none; align-self: flex-start; }
  .search { order: 3; flex-basis: 100%; max-width: none; }
  .btn-rama, .zoom { display: none; }
  .stage { grid-template-columns: minmax(0, 1fr); }
  /* Hoja inferior en dos tiempos: asomada (nombre + frase) y abierta (ficha completa) */
  .sizer { margin-bottom: calc(var(--peek, 84px) + 16px); }
  .panel { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; max-height: 78%;
           border-left: 0; border-top: 1px solid var(--line); border-radius: 14px 14px 0 0;
           box-shadow: 0 -10px 30px var(--shadow); padding-bottom: env(safe-area-inset-bottom, 0px);
           transform: translateY(calc(100% - var(--peek, 84px) - env(safe-area-inset-bottom, 0px))); transition: transform .3s ease; }
  .panel[data-state="open"] { transform: none; }
  .handle { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 12px; width: 100%;
            padding: 16px 18px 12px; border: 0; border-bottom: 1px solid var(--line); background: var(--surface); text-align: left; cursor: pointer; }
  .handle::before { content: ""; position: absolute; top: 6px; left: 50%; width: 36px; height: 4px; margin-left: -18px; border-radius: 2px; background: var(--line); }
  .peek-text { flex: 1; min-width: 0; display: grid; gap: 2px; }
  #peek-title { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #peek-frase { color: var(--muted); font-size: 13px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #peek-accion { flex: none; color: var(--accent); font-size: 13px; font-weight: 600; }
  .panel[data-state="open"] #peek-frase { display: none; }
  .tip { display: none; }
  #ficha { padding: 16px 18px 26px; }
  #ficha h2 { font-size: 23px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand">
      <h1>Mapa interactivo de IA</h1>
      <p class="meta"><span>Conceptos, herramientas y guía de uso</span><span class="pill" id="m-estado" hidden></span></p>
    </div>
    <div class="search" role="search">
      <label for="q" class="sr">Buscar un concepto</label>
      <input id="q" type="search" placeholder="Buscar un concepto" autocomplete="off" spellcheck="false"
             role="combobox" aria-expanded="false" aria-controls="resultados" aria-autocomplete="list">
      <ul id="resultados" role="listbox" hidden></ul>
    </div>
    <div class="tools">
      <button class="btn" id="b-general" type="button">Vista general</button>
      <button class="btn btn-rama" id="b-rama" type="button">Expandir rama</button>
      <div class="zoom" role="group" aria-label="Zoom del mapa">
        <button id="z-menos" type="button" aria-label="Alejar">−</button>
        <span id="z-nivel" aria-live="polite">100 %</span>
        <button id="z-mas" type="button" aria-label="Acercar">+</button>
      </div>
    </div>
  </header>

  <main class="stage">
    <div class="viewport" id="viewport" aria-label="Mapa de conceptos">
      <div class="sizer" id="sizer">
        <div class="canvas" id="canvas">
          <svg id="wires" aria-hidden="true"></svg>
          <div id="nodes"></div>
        </div>
      </div>
    </div>
    <aside class="panel" id="panel" data-state="peek" aria-labelledby="ficha-titulo">
      <button class="handle" id="handle" type="button" aria-controls="ficha" aria-expanded="false">
        <span class="peek-text"><span id="peek-title"></span><span id="peek-frase"></span></span><span id="peek-accion">Ver ficha</span>
      </button>
      <article id="ficha"></article>
    </aside>
  </main>
</div>

<script type="application/json" id="datos">{"id":"inteligencia-artificial","name":"Inteligencia artificial","en":"artificial intelligence","frase":"Sistemas que perciben, razonan, aprenden o generan contenido; hoy casi siempre aprendiendo de datos.","desc":"Campo que construye sistemas capaces de realizar tareas que asociamos con la inteligencia: percibir, razonar, aprender, predecir o generar contenido. Casi toda la IA actual se basa en aprendizaje automático, es decir, en modelos que aprenden patrones a partir de datos en lugar de seguir reglas escritas a mano.","ej":"Un asistente que entiende tu pregunta, busca en documentos y redacta la respuesta combina varias ramas de este mapa: lenguaje, recuperación de información y agentes.","rel":["ia-ml-dl","breve-historia-de-la-ia","cuatro-ingredientes"],"children":[{"id":"fundamentos","name":"Fundamentos","en":"foundations","frase":"Las ideas comunes a todo modelo: aprender de los datos y generalizar a casos nuevos.","desc":"Las ideas que comparten todos los modelos: aprender de los datos optimizando un objetivo y generalizar a casos que el modelo no ha visto. Aquí están también los paradigmas de aprendizaje y las nociones de distancia y similitud que reaparecen por todo el mapa.","ej":"Un modelo que acierta el 99 % en entrenamiento y el 70 % con datos nuevos ilustra el problema central de la disciplina: el sobreajuste.","rel":["generalizacion","cuatro-ingredientes","paradigmas-de-aprendizaje"],"children":[{"id":"ia-ml-dl","name":"IA, machine learning y deep learning: cómo encajan","en":"AI vs machine learning vs deep learning","frase":"La IA contiene al machine learning, que a su vez contiene al deep learning.","desc":"La inteligencia artificial es el objetivo general: máquinas capaces de hacer tareas que asociamos con la inteligencia. El machine learning es hoy la vía dominante para lograrlo: en lugar de programar reglas, el sistema las aprende de datos. El deep learning es la parte del machine learning que usa redes neuronales con muchas capas, capaces de aprender directamente de datos crudos como imágenes, texto o audio.","ej":"Un filtro antispam con reglas escritas a mano es IA sin aprendizaje. Uno entrenado con correos etiquetados es machine learning, y uno basado en un Transformer es deep learning.","rel":["programacion-vs-ml","mlp","breve-historia-de-la-ia"]},{"id":"programacion-vs-ml","name":"Programación clásica vs aprendizaje automático","en":"traditional programming vs machine learning","frase":"En la programación clásica escribes las reglas; en el machine learning se aprenden de ejemplos.","desc":"Un programa clásico recibe datos y reglas escritas por una persona y produce resultados. En el aprendizaje automático se le dan datos y los resultados esperados, y el algoritmo deduce las reglas, que forman el modelo y luego se aplican a datos nuevos. Compensa cuando las reglas son demasiado complejas para escribirlas o cambian con el tiempo.","ej":"Es inviable escribir a mano las reglas para reconocer un gato en una foto, pero un modelo las aprende a partir de miles de fotos etiquetadas.","rel":["ia-ml-dl","cuatro-ingredientes","aprendizaje-supervisado"]},{"id":"breve-historia-de-la-ia","name":"Breve historia de la IA","en":"brief history of AI","frase":"De la neurona artificial de 1943 a los LLMs, con inviernos de por medio y grandes saltos de escala.","desc":"McCulloch y Pitts proponen la neurona artificial en 1943 y el término inteligencia artificial nace con el taller de Dartmouth en 1956. Tras el perceptrón (1958) llegan los inviernos de la IA por expectativas incumplidas. La retropropagación (1986), las LSTM (1997) y, sobre todo, la unión de datos masivos y GPUs desde 2012 impulsan el deep learning, que desemboca en los Transformers (2017) y en LLMs como ChatGPT (2022).","ej":"En 2012, AlexNet bajó el error top-5 en ImageNet del 26 % del segundo clasificado a alrededor del 15 %, y marcó el arranque de la era del deep learning.","rel":["ia-ml-dl","perceptron","imagenet-y-alexnet","llm"]},{"id":"cuatro-ingredientes","name":"Los cuatro ingredientes: datos, modelo, objetivo y optimización","en":"data, model, objective & optimization","frase":"Todo modelo combina datos, una familia de modelos, un objetivo que medir y un método para optimizarlo.","desc":"Casi cualquier método de machine learning se reduce a cuatro piezas. Los datos son los ejemplos de los que aprender. El modelo es la familia de funciones candidatas, como una recta, un árbol o una red. El objetivo es la función de pérdida, que mide lo mal que lo hace. La optimización es el procedimiento que busca los parámetros que minimizan esa pérdida. Cambiar cualquiera de las cuatro cambia el resultado.","ej":"En una regresión lineal de precios de pisos, los datos son pisos vendidos, el modelo una recta, el objetivo el error cuadrático y la optimización, mínimos cuadrados o descenso por gradiente.","rel":["funciones-de-perdida","descenso-por-gradiente","minimizacion-del-riesgo-empirico","parametros-e-hiperparametros"]},{"id":"parametros-e-hiperparametros","name":"Parámetros e hiperparámetros","en":"parameters vs hyperparameters","frase":"Los parámetros los aprende el modelo; los hiperparámetros los fijas tú antes de entrenar.","desc":"Los parámetros son los valores internos que el entrenamiento ajusta a partir de los datos, como los pesos de una red o los coeficientes de una regresión. Los hiperparámetros controlan cómo se aprende y qué forma tiene el modelo, como la tasa de aprendizaje, la profundidad de un árbol o el número de vecinos. Se eligen con datos de validación, nunca con los de test.","ej":"En un Random Forest, las divisiones de cada árbol son parámetros; el número de árboles y su profundidad máxima son hiperparámetros.","py":[{"c":"modelo.get_params()","s":1},{"c":"sklearn.model_selection.GridSearchCV","u":"https://scikit-learn.org/stable/modules/generated/sklearn.model_selection.GridSearchCV.html"}],"rel":["ajuste-de-hiperparametros-y-automl","entrenamiento-validacion-y-test","learning-rate"]},{"id":"teoria-de-la-decision","name":"Teoría de la decisión","en":"decision theory","frase":"Decidir bien bajo incertidumbre, combinando la probabilidad de cada resultado con lo que cuesta equivocarse.","desc":"Marco matemático para elegir la mejor acción cuando el resultado es incierto. Combina la probabilidad de cada posible estado con una función de pérdida que dice cuánto cuesta cada tipo de error, y la decisión óptima es la que minimiza la pérdida esperada. Explica, por ejemplo, por qué el umbral de un clasificador no tiene que ser 0,5 si los errores no cuestan lo mismo.","ej":"En un cribado médico, no detectar una enfermedad cuesta mucho más que una falsa alarma, así que conviene marcar como sospechosos casos con probabilidad bastante menor del 50 %.","rel":["riesgo-de-bayes","umbral-de-decision","funciones-de-perdida"],"children":[{"id":"riesgo-de-bayes","name":"Riesgo de Bayes","en":"Bayes risk","frase":"El error mínimo que podría lograr cualquier modelo si conociera la distribución real de los datos.","desc":"El riesgo es la pérdida esperada de una regla de decisión sobre la distribución real de los datos. El riesgo de Bayes es el menor riesgo alcanzable, el del clasificador que decide con las probabilidades verdaderas. Funciona como cota inferior: si las clases se solapan, ningún modelo puede bajar de ese error, por mucho que se entrene.","ej":"Si dos especies de flor tienen exactamente las mismas medidas en una parte de los casos, ningún clasificador basado en esas medidas puede acertarlos todos: ese solapamiento fija un error que no se puede eliminar.","rel":["teoria-de-la-decision","minimizacion-del-riesgo-empirico","compromiso-sesgo-varianza"]},{"id":"minimizacion-del-riesgo-empirico","name":"Minimización del riesgo empírico","en":"empirical risk minimization (ERM)","frase":"Como no conocemos la distribución real, minimizamos el error medio sobre los datos de entrenamiento.","desc":"El riesgo real no se puede calcular porque no conocemos la distribución de los datos. Se aproxima con el riesgo empírico, el error medio sobre la muestra de entrenamiento, y se busca el modelo que lo minimiza. Es el principio detrás de casi todo el entrenamiento supervisado. Su peligro es el sobreajuste: un modelo muy flexible puede tener riesgo empírico casi nulo y generalizar mal, y por eso se añade regularización.","ej":"Entrenar una red minimizando la entropía cruzada media sobre las imágenes de entrenamiento es minimización del riesgo empírico.","rel":["riesgo-de-bayes","sobreajuste","regularizacion","funciones-de-perdida"]}]},{"id":"generalizacion","name":"Generalización","en":"generalization","frase":"Acertar con datos nuevos, no solo con los que el modelo ya ha visto.","desc":"Es el objetivo real del aprendizaje: que el modelo funcione con casos que no estaban en el entrenamiento. Se mide con datos reservados (validación y test) y depende del equilibrio entre la complejidad del modelo y la cantidad y calidad de los datos. La distancia entre el error de entrenamiento y el de test indica cuánto generaliza.","ej":"Un modelo de detección de fraude entrenado con operaciones de 2024 tiene que seguir funcionando con las de 2025.","rel":["sobreajuste","infraajuste","entrenamiento-validacion-y-test","validacion-cruzada"],"children":[{"id":"sobreajuste","name":"Sobreajuste (overfitting)","frase":"El modelo memoriza el ruido del entrenamiento y falla con datos nuevos.","desc":"Ocurre cuando el modelo es demasiado flexible para los datos disponibles: aprende los patrones reales y también el ruido y las casualidades de la muestra. Se reconoce porque el error de entrenamiento sigue bajando mientras el de validación sube. Se combate con más datos, modelos más simples, regularización, early stopping o data augmentation.","ej":"Un árbol de decisión sin límite de profundidad acierta el 100 % de los casos de entrenamiento creando casi una hoja por ejemplo, pero falla con clientes nuevos.","rel":["infraajuste","compromiso-sesgo-varianza","regularizacion","curvas-de-aprendizaje"]},{"id":"infraajuste","name":"Infraajuste (underfitting)","frase":"El modelo es demasiado simple para captar los patrones de los datos.","desc":"El modelo no tiene capacidad suficiente, o no se ha entrenado lo bastante, para representar la relación real. Se nota porque el error es alto tanto en entrenamiento como en validación. Se corrige con modelos más flexibles, mejores variables, menos regularización o más tiempo de entrenamiento.","ej":"Ajustar una recta a la relación en forma de U entre temperatura y consumo eléctrico, que sube tanto con el frío como con el calor.","rel":["sobreajuste","compromiso-sesgo-varianza","feature-engineering"]},{"id":"compromiso-sesgo-varianza","name":"Compromiso sesgo-varianza","en":"bias-variance trade-off","frase":"Los modelos simples se equivocan de forma sistemática; los complejos, de forma inestable.","desc":"El error de un modelo se descompone en sesgo (error por suposiciones demasiado simples), varianza (sensibilidad a la muestra concreta de entrenamiento) y ruido irreducible. Aumentar la complejidad reduce el sesgo pero sube la varianza, y al revés. El mejor modelo es el que equilibra ambos. Los ensembles atacan este dilema: el bagging reduce la varianza y el boosting, el sesgo.","ej":"Un k-NN con k = 1 tiene sesgo bajo y varianza alta, porque cambia mucho con cada dato; con k = 100 ocurre lo contrario.","rel":["sobreajuste","infraajuste","bagging","boosting"]},{"id":"regularizacion","name":"Regularización (idea general)","en":"regularization","frase":"Penalizar la complejidad del modelo para que generalice mejor.","desc":"Conjunto de técnicas que restringen la libertad del modelo para que no se ajuste al ruido. Puede actuar sobre los parámetros (penalizaciones L1 o L2), sobre el entrenamiento (early stopping, dropout), sobre los datos (data augmentation, ruido) o sobre la arquitectura (modelos más pequeños). Su intensidad es un hiperparámetro que se ajusta con validación.","cuando":"Cuando el modelo sobreajusta: buen resultado en entrenamiento y claramente peor en validación.","ej":"Añadir a la pérdida de una regresión el término λ·Σw² (Ridge) para que ningún coeficiente crezca sin control.","rel":["sobreajuste","ridge-lasso-y-elastic-net","regularizacion-en-redes","dropout"]}]},{"id":"distancia-y-similitud","name":"Distancia y similitud","en":"distance & similarity","frase":"Formas de medir cuánto se parecen dos datos; la elección cambia el resultado de muchos algoritmos.","desc":"Muchos métodos se basan en comparar puntos: k-NN, clustering, detección de anomalías o búsqueda con embeddings. Una distancia mide lo lejos que están dos vectores y una similitud, lo parecidos que son. La elección adecuada depende del tipo de dato y de la escala de las variables, que conviene normalizar antes.","ej":"Para comparar textos representados como embeddings se suele usar la similitud coseno; para coordenadas en un mapa, la distancia euclídea.","rel":["knn","clustering","deteccion-basada-en-distancia","escalado-de-variables"],"children":[{"id":"distancia-euclidea","name":"Distancia euclídea (L2)","frase":"La distancia en línea recta entre dos puntos.","desc":"Es la raíz cuadrada de la suma de las diferencias al cuadrado en cada dimensión, d(x, y) = √Σ(xᵢ − yᵢ)². Es la distancia por defecto en k-NN y k-means. Es sensible a la escala de las variables y a los valores extremos, y pierde capacidad de discriminar en espacios de muy alta dimensión.","cuando":"Con variables numéricas en una escala comparable y no demasiadas dimensiones.","ej":"Dos clientes de 30 y 35 años que compran 2 y 4 veces al mes están a √(5² + 2²) ≈ 5,4 unidades; sin escalar las variables, la edad domina la distancia.","py":[{"c":"sklearn.metrics.pairwise.euclidean_distances","u":"https://scikit-learn.org/stable/modules/generated/sklearn.metrics.pairwise.euclidean_distances.html"},{"c":"scipy.spatial.distance.euclidean","u":"https://docs.scipy.org/doc/scipy/reference/generated/scipy.spatial.distance.euclidean.html"}],"rel":["distancia-manhattan","escalado-de-variables","k-means","maldicion-de-la-dimensionalidad"]},{"id":"distancia-manhattan","name":"Distancia Manhattan (L1) y normas Lp","frase":"Suma lo que separa a dos puntos en cada eje, como recorrer calles en cuadrícula.","desc":"Suma los valores absolutos de las diferencias, d(x, y) = Σ|xᵢ − yᵢ|, y es menos sensible a valores extremos que la euclídea. Ambas pertenecen a la familia Lp o de Minkowski: p = 1 es Manhattan, p = 2 la euclídea y p → ∞ la de Chebyshev, que solo mira la mayor de las diferencias.","cuando":"Con datos que tienen valores extremos o en dimensiones altas, donde suele discriminar mejor que la euclídea.","ej":"En una ciudad con calles en cuadrícula, ir 3 manzanas al este y 4 al norte supone recorrer 7 manzanas, aunque en línea recta haya 5.","py":[{"c":"sklearn.metrics.pairwise.manhattan_distances","u":"https://scikit-learn.org/stable/modules/generated/sklearn.metrics.pairwise.manhattan_distances.html"},{"c":"scipy.spatial.distance.minkowski","u":"https://docs.scipy.org/doc/scipy/reference/generated/scipy.spatial.distance.minkowski.html"}],"rel":["distancia-euclidea","distancia-y-similitud","knn"]},{"id":"similitud-coseno","name":"Similitud coseno","en":"cosine similarity","frase":"Mide el ángulo entre dos vectores: si apuntan en la misma dirección, se parecen.","desc":"Es el producto escalar de dos vectores dividido por el producto de sus normas, y va de −1 (opuestos) a 1 (misma dirección). Ignora la magnitud y solo compara la dirección, lo que la hace ideal para textos y embeddings, donde importa el perfil y no el tamaño. La distancia coseno es 1 menos la similitud.","cuando":"Para comparar textos, embeddings o perfiles en los que importa la proporción entre componentes y no su tamaño total.","ej":"Dos artículos sobre fútbol, uno corto y otro largo, tienen vectores de palabras de tamaños muy distintos pero una similitud coseno cercana a 1.","py":[{"c":"sklearn.metrics.pairwise.cosine_similarity","u":"https://scikit-learn.org/stable/modules/generated/sklearn.metrics.pairwise.cosine_similarity.html"}],"rel":["embeddings","busqueda-por-similitud","tf-idf","distancia-y-similitud"]},{"id":"distancia-de-mahalanobis","name":"Distancia de Mahalanobis","en":"Mahalanobis distance","frase":"Una distancia que tiene en cuenta la escala y la correlación entre variables.","desc":"Mide lo lejos que está un punto de una distribución usando su matriz de covarianza: d = √((x − μ)ᵀ Σ⁻¹ (x − μ)). Equivale a la distancia euclídea después de blanquear los datos, es decir, de quitarles la correlación y normalizar su escala. Es muy útil para detectar anomalías en datos multivariantes con variables correlacionadas.","cuando":"Con variables correlacionadas entre sí, sobre todo para detectar casos atípicos multivariantes.","ej":"En un control de calidad, una pieza con altura y anchura normales por separado, pero en una combinación inusual, queda lejos según Mahalanobis aunque cada medida parezca correcta.","py":[{"c":"scipy.spatial.distance.mahalanobis","u":"https://docs.scipy.org/doc/scipy/reference/generated/scipy.spatial.distance.mahalanobis.html"},{"c":"sklearn.covariance.EmpiricalCovariance","u":"https://scikit-learn.org/stable/modules/generated/sklearn.covariance.EmpiricalCovariance.html"}],"rel":["deteccion-basada-en-distancia","distancia-euclidea","pca"]}]},{"id":"paradigmas-de-aprendizaje","name":"Paradigmas de aprendizaje","en":"learning paradigms","frase":"Las maneras de aprender según la información disponible: etiquetas completas, parciales, ninguna o recompensas.","desc":"Además de los tres grandes paradigmas, supervisado (datos con etiqueta), no supervisado (sin etiquetas) y por refuerzo (recompensas por acciones), hay situaciones intermedias muy habituales. Se puede aprender con pocas etiquetas, con etiquetas imperfectas, eligiendo qué etiquetar o actualizando el modelo según llegan los datos. El paradigma adecuado depende de qué información tienes y de cuánto cuesta conseguir más.","ej":"Una empresa con millones de fotos de producto y solo 500 etiquetadas puede combinar aprendizaje semisupervisado y activo en lugar de etiquetarlo todo.","rel":["aprendizaje-supervisado","aprendizaje-no-supervisado","aprendizaje-por-refuerzo","aprendizaje-autosupervisado"],"children":[{"id":"aprendizaje-semisupervisado","name":"Aprendizaje semisupervisado","en":"semi-supervised learning","frase":"Aprender con unos pocos ejemplos etiquetados y muchos sin etiquetar.","desc":"Aprovecha la estructura de los datos sin etiquetar para mejorar lo que se aprende con las pocas etiquetas disponibles. Se apoya en suposiciones como que puntos cercanos o del mismo grupo comparten clase. Técnicas típicas son el autoentrenamiento con pseudoetiquetas, la propagación de etiquetas y cluster-then-label.","cuando":"Cuando etiquetar es caro (expertos, tiempo) pero tienes abundantes datos sin etiquetar del mismo tipo.","ej":"Clasificar radiografías con 200 imágenes revisadas por un radiólogo y 20.000 sin revisar.","hp":[["threshold","confianza mínima para aceptar una pseudoetiqueta en el autoentrenamiento"],["max_iter","número máximo de rondas de autoentrenamiento"]],"py":[{"c":"sklearn.semi_supervised.SelfTrainingClassifier","u":"https://scikit-learn.org/stable/modules/generated/sklearn.semi_supervised.SelfTrainingClassifier.html"},{"c":"sklearn.semi_supervised.LabelSpreading","u":"https://scikit-learn.org/stable/modules/generated/sklearn.semi_supervised.LabelSpreading.html"}],"rel":["cluster-then-label","supervision-debil","aprendizaje-activo","aprendizaje-autosupervisado"],"children":[{"id":"cluster-then-label","name":"Cluster-then-label","frase":"Agrupar todos los datos y dar a cada grupo la etiqueta de sus pocos ejemplos conocidos.","desc":"Primero se agrupan todos los datos, etiquetados o no, con un algoritmo de clustering, a menudo sobre embeddings. Después cada grupo recibe la etiqueta mayoritaria de los ejemplos etiquetados que contiene, y esa etiqueta se extiende al resto. Funciona bien cuando los grupos naturales de los datos coinciden con las clases.","cuando":"Cuando tienes muy pocas etiquetas y los datos forman grupos bien separados que corresponden a las clases.","ej":"Agrupar 10.000 fotos de productos en 50 grupos y etiquetar a mano solo 2 o 3 fotos de cada uno para clasificar todo el catálogo.","py":[{"c":"sklearn.cluster.KMeans","u":"https://scikit-learn.org/stable/modules/generated/sklearn.cluster.KMeans.html"}],"rel":["aprendizaje-semisupervisado","k-means","embeddings"]}]},{"id":"supervision-debil","name":"Supervisión débil","en":"weak supervision","frase":"Aprender con etiquetas imperfectas: ruidosas, incompletas o agregadas.","desc":"En muchos problemas reales no hay una etiqueta exacta por ejemplo, sino etiquetas con errores, conjuntos de etiquetas posibles o solo proporciones por grupo. La supervisión débil adapta las pérdidas y los modelos a esas situaciones, por ejemplo modelando la probabilidad de que una etiqueta esté mal (matriz de mezcla). También abarca generar etiquetas con reglas o heurísticas baratas y combinarlas.","cuando":"Cuando conseguir etiquetas exactas es inviable, pero tienes etiquetas aproximadas, reglas heurísticas o información agregada.","ej":"Etiquetar automáticamente reseñas como positivas si tienen 4 o 5 estrellas, sabiendo que parte de esas etiquetas será incorrecta.","rel":["etiquetas-ruidosas","etiquetas-parciales","proporciones-de-etiquetas","calidad-y-etiquetado-de-datos"],"children":[{"id":"etiquetas-ruidosas","name":"Etiquetas ruidosas","en":"noisy labels","frase":"Etiquetas en las que una parte de los ejemplos está mal anotada.","desc":"Errores de anotación, criterios cambiantes o el etiquetado automático introducen ruido en las etiquetas, y los modelos flexibles acaban memorizándolo. Se mitiga detectando y limpiando los ejemplos sospechosos, usando pérdidas robustas al ruido o modelando con qué probabilidad se confunde cada clase con otra.","cuando":"Cuando sospechas que una parte relevante de las etiquetas es errónea, por ejemplo si vienen de varias personas o de reglas automáticas.","ej":"En un conjunto de imágenes médicas anotado por varios técnicos, un 10 % de las etiquetas discrepan; filtrar los casos dudosos mejora el modelo.","rel":["supervision-debil","calidad-y-etiquetado-de-datos","sobreajuste"]},{"id":"etiquetas-parciales","name":"Etiquetas parciales","en":"partial labels","frase":"Para cada ejemplo solo se sabe que su clase está dentro de un conjunto de candidatas.","desc":"En lugar de una etiqueta exacta, cada ejemplo trae un conjunto de clases posibles, y una de ellas es la verdadera. El modelo aprende a desambiguar usando la información de todos los ejemplos a la vez. Aparece cuando las anotaciones son ambiguas o se recogen de forma indirecta.","cuando":"Cuando los anotadores solo pueden acotar la clase a unas pocas opciones o la etiqueta procede de fuentes ambiguas.","ej":"Una foto con el pie \"Ana y Luis en la gala\": cada cara tiene como candidatos los dos nombres, y viendo muchas fotos el modelo aprende quién es quién.","rel":["supervision-debil","etiquetas-ruidosas","proporciones-de-etiquetas"]},{"id":"proporciones-de-etiquetas","name":"Aprendizaje con proporciones de etiquetas","en":"learning from label proportions","frase":"Aprender a clasificar individuos sabiendo solo qué proporción de cada clase hay en cada grupo.","desc":"Los datos llegan en bolsas y de cada bolsa solo se conoce la proporción de cada clase, no la etiqueta de cada ejemplo. El modelo se entrena para que sus predicciones, agregadas por bolsa, coincidan con esas proporciones. Es habitual cuando las etiquetas individuales son privadas o solo existen estadísticas agregadas.","cuando":"Cuando solo tienes estadísticas agregadas por grupo, como resultados por tienda, zona o lote, y no etiquetas individuales.","ej":"Conocer solo el porcentaje de clientes que se dieron de baja en cada tienda y aprender a estimar el riesgo de baja de cada cliente.","rel":["supervision-debil","etiquetas-parciales","aprendizaje-semisupervisado"]}]},{"id":"aprendizaje-activo","name":"Aprendizaje activo","en":"active learning","frase":"El modelo elige qué ejemplos conviene etiquetar para aprender más con menos etiquetas.","desc":"En vez de etiquetar datos al azar, el modelo propone en cada ronda los ejemplos sobre los que tiene más dudas o que más información aportarían; una persona los etiqueta y el modelo se reentrena. Así se alcanza la misma precisión con muchas menos etiquetas. Las estrategias típicas son el muestreo por incertidumbre y por desacuerdo entre modelos.","cuando":"Cuando etiquetar es caro, hay muchos datos sin etiquetar y una persona puede ir anotando por rondas.","ej":"Un sistema que clasifica documentos legales pide cada semana al abogado que revise solo los 50 documentos más dudosos.","rel":["aprendizaje-semisupervisado","human-in-the-loop","incertidumbre"]},{"id":"aprendizaje-online","name":"Aprendizaje online","en":"online learning","frase":"El modelo se actualiza según llegan los datos, sin reentrenar desde cero.","desc":"En el aprendizaje online o incremental, el modelo se actualiza con cada dato o pequeño lote nuevo y no necesita guardar todo el histórico. Es adecuado para flujos continuos de datos y para entornos que cambian, donde el modelo debe adaptarse. El riesgo es que olvide patrones antiguos o reaccione en exceso a los datos recientes.","cuando":"Cuando los datos llegan en flujo continuo, no caben en memoria o el comportamiento cambia con el tiempo y el modelo debe adaptarse.","ej":"Un filtro de spam que se ajusta cada vez que un usuario marca un correo como spam.","hp":[["learning_rate","cómo evoluciona el tamaño de paso con las actualizaciones"],["eta0","tamaño de paso inicial"],["alpha","fuerza de la regularización"]],"py":[{"c":"sklearn.linear_model.SGDClassifier","u":"https://scikit-learn.org/stable/modules/generated/sklearn.linear_model.SGDClassifier.html"},{"c":"modelo.partial_fit(X_lote, y_lote)","s":1}],"rel":["deriva-de-datos","batch-mini-batch-y-sgd","olvido-catastrofico"]}]}]},{"id":"probabilidad-informacion-y-causalidad","name":"Probabilidad, información y causalidad","en":"probability, information theory & causality","frase":"Las matemáticas para razonar con incertidumbre, medir información y separar causa de correlación.","desc":"El lenguaje matemático de la incertidumbre. La probabilidad permite razonar con datos ruidosos. La teoría de la información mide cuánta información contiene una variable y cuánta comparte con otra. Los modelos gráficos y la causalidad ayudan a distinguir qué influye en qué, más allá de la simple correlación.","cuando":"Cuando necesitas cuantificar la incertidumbre, medir cuánto dependen unas variables de otras o razonar sobre causas y efectos.","ej":"Que dos variables estén correlacionadas no dice cuál causa la otra. Los métodos de descubrimiento causal intentan orientar esa flecha a partir de los datos.","rel":["teorema-de-bayes","entropia","red-bayesiana","correlacion-no-implica-causalidad"],"children":[{"id":"probabilidad-y-estadistica","name":"Probabilidad y estadística","en":"probability & statistics","frase":"El lenguaje para describir la incertidumbre y sacar conclusiones fiables a partir de datos.","desc":"La probabilidad modela fenómenos inciertos; la estadística usa datos para estimar sus parámetros y contrastar hipótesis. Casi todo modelo de ML es, en el fondo, un modelo probabilístico: predice una distribución, se entrena maximizando una verosimilitud y se evalúa teniendo en cuenta la incertidumbre.","ej":"Estimar la tasa de conversión de una web a partir de 1.000 visitas y acompañarla de un intervalo de confianza.","py":[{"c":"scipy.stats","u":"https://docs.scipy.org/doc/scipy/reference/stats.html"}],"rel":["teorema-de-bayes","maxima-verosimilitud","contraste-de-hipotesis","distribuciones-de-probabilidad"],"children":[{"id":"probabilidad-frecuentista-vs-bayesiana","name":"Probabilidad frecuentista vs bayesiana","en":"frequentist vs Bayesian probability","frase":"Probabilidad como frecuencia a largo plazo o como grado de creencia que se actualiza con datos.","desc":"Para la visión frecuentista, la probabilidad es la frecuencia con la que ocurre un suceso si se repite el experimento muchas veces, y los parámetros son valores fijos desconocidos. Para la bayesiana, es un grado de creencia: los parámetros tienen una distribución que se actualiza con los datos mediante el teorema de Bayes. La primera da p-valores e intervalos de confianza; la segunda, distribuciones posteriores e intervalos de credibilidad.","ej":"Tras 7 caras en 10 lanzamientos, el frecuentista estima p = 0,7 y contrasta si la moneda es justa. El bayesiano parte de una creencia previa centrada en 0,5 y obtiene una distribución posterior para p.","rel":["teorema-de-bayes","prior-verosimilitud-y-posterior","p-valor","intervalo-de-confianza"]},{"id":"probabilidad-condicional","name":"Probabilidad condicional","en":"conditional probability","frase":"La probabilidad de un suceso cuando ya sabemos que ha ocurrido otro.","desc":"P(A|B) es la probabilidad de A restringida a los casos en que ocurre B: P(A|B) = P(A y B) / P(B). Es la base del teorema de Bayes y de casi todo modelo predictivo, que en el fondo estima P(y|x). Confundir P(A|B) con P(B|A) es uno de los errores de razonamiento más frecuentes.","ej":"La probabilidad de que un correo sea spam es del 20 %, pero entre los correos que contienen la palabra \"gratis\" sube al 70 %.","py":[{"c":"pandas.crosstab","u":"https://pandas.pydata.org/docs/reference/api/pandas.crosstab.html"}],"rel":["teorema-de-bayes","independencia-estadistica","dependencia-condicional","red-bayesiana"]},{"id":"teorema-de-bayes","name":"Teorema de Bayes","en":"Bayes' theorem","frase":"Regla para actualizar una creencia con nueva evidencia: el posterior es proporcional a verosimilitud por prior.","desc":"Relaciona las dos probabilidades condicionales: P(A|B) = P(B|A)·P(A) / P(B). Permite invertir el razonamiento, de la probabilidad de los síntomas dada la enfermedad a la de la enfermedad dados los síntomas. Es la base de la inferencia bayesiana y del clasificador Naive Bayes, que lo aplica suponiendo que las variables son independientes dentro de cada clase.","cuando":"Para actualizar una estimación con evidencia nueva o invertir una probabilidad condicional; Naive Bayes, como clasificador rápido de texto.","ej":"Una prueba que acierta el 99 % de las veces, con enfermos y con sanos, para una enfermedad que tiene 1 de cada 1.000 personas: un positivo solo implica un 9 % de probabilidad de estar enfermo.","py":[{"c":"sklearn.naive_bayes.GaussianNB","u":"https://scikit-learn.org/stable/modules/generated/sklearn.naive_bayes.GaussianNB.html"},{"c":"sklearn.naive_bayes.MultinomialNB","u":"https://scikit-learn.org/stable/modules/generated/sklearn.naive_bayes.MultinomialNB.html"}],"rel":["probabilidad-condicional","prior-verosimilitud-y-posterior","probabilidad-frecuentista-vs-bayesiana","red-bayesiana"]},{"id":"prior-verosimilitud-y-posterior","name":"Prior, verosimilitud y posterior","en":"prior, likelihood & posterior","frase":"Las tres piezas de la inferencia bayesiana: creencia previa, evidencia de los datos y creencia actualizada.","desc":"El prior P(θ) recoge lo que se cree sobre un parámetro antes de ver datos. La verosimilitud P(datos|θ) mide lo compatibles que son los datos con cada valor del parámetro. El posterior P(θ|datos) combina ambos y es el resultado de la inferencia. Con pocos datos pesa más el prior; con muchos, domina la verosimilitud.","ej":"Para la tasa de clics de un anuncio nuevo, un prior Beta(2, 98), centrado en el 2 % habitual, y 20 clics en 500 impresiones (4 %) dan un posterior Beta(22, 578), centrado en el 3,7 %.","py":[{"c":"scipy.stats.beta","u":"https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.beta.html"}],"rel":["teorema-de-bayes","maxima-verosimilitud","regresion-lineal-bayesiana","muestreo-de-thompson"]},{"id":"distribuciones-de-probabilidad","name":"Distribuciones de probabilidad","en":"probability distributions","frase":"Modelos matemáticos de cómo se reparten los valores posibles de una variable aleatoria.","desc":"Describen qué valores puede tomar una variable y con qué probabilidad. Las discretas, como la binomial o la de Poisson, asignan probabilidad a valores contables. Las continuas, como la normal o la exponencial, usan una función de densidad. Elegir la distribución adecuada para los datos o los errores es el primer paso de muchos modelos.","ej":"El número de llamadas que recibe un centro de atención en una hora suele seguir una Poisson; la altura de los adultos de un país, aproximadamente una normal.","py":[{"c":"scipy.stats.norm","u":"https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.norm.html"},{"c":"scipy.stats.binom","u":"https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.binom.html"},{"c":"scipy.stats.poisson","u":"https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.poisson.html"}],"rel":["maxima-verosimilitud","glm","estimacion-de-densidad","kde"]},{"id":"maxima-verosimilitud","name":"Máxima verosimilitud (MLE)","en":"maximum likelihood estimation (MLE)","frase":"Elegir los parámetros que hacen más probables los datos observados.","desc":"Busca los valores de los parámetros que maximizan la verosimilitud, es decir, la probabilidad de haber observado los datos que tenemos. En la práctica se maximiza su logaritmo, que convierte productos en sumas. Muchas funciones de pérdida son máxima verosimilitud encubierta: el error cuadrático corresponde a errores gaussianos y la entropía cruzada, a salidas categóricas.","cuando":"Para ajustar los parámetros de una distribución o de un modelo probabilístico a unos datos.","ej":"Si 30 de 100 clientes renuevan su suscripción, la estimación de máxima verosimilitud de la probabilidad de renovación es 0,30.","py":[{"c":"scipy.stats.rv_continuous.fit","u":"https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.rv_continuous.fit.html"},{"c":"statsmodels.base.model.GenericLikelihoodModel","u":"https://www.statsmodels.org/stable/generated/statsmodels.base.model.GenericLikelihoodModel.html"}],"rel":["nll","prior-verosimilitud-y-posterior","entropia-cruzada","funciones-de-perdida"]},{"id":"nll","name":"Log-verosimilitud negativa (NLL)","en":"negative log-likelihood (NLL)","frase":"La verosimilitud en logaritmo y con signo negativo: la pérdida que se minimiza al entrenar.","desc":"Es −log P(datos|θ). Minimizarla equivale a maximizar la verosimilitud, pero es numéricamente más estable y encaja con los optimizadores, que minimizan. Penaliza mucho las predicciones seguras y equivocadas. La entropía cruzada de clasificación es la NLL de una distribución categórica, y el MSE es, salvo constantes, la NLL de una normal.","ej":"Un clasificador que asigna una probabilidad de 0,01 a la clase correcta suma −ln(0,01) ≈ 4,6 a la pérdida; si le asigna 0,9, solo 0,1.","py":[{"c":"sklearn.metrics.log_loss","u":"https://scikit-learn.org/stable/modules/generated/sklearn.metrics.log_loss.html"},{"c":"torch.nn.GaussianNLLLoss","u":"https://docs.pytorch.org/docs/stable/generated/torch.nn.GaussianNLLLoss.html"}],"rel":["maxima-verosimilitud","entropia-cruzada","funciones-de-perdida","perplejidad"]},{"id":"contraste-de-hipotesis","name":"Contraste de hipótesis","en":"hypothesis testing","frase":"Procedimiento para decidir si los datos aportan evidencia suficiente contra una hipótesis de partida.","desc":"Se plantea una hipótesis nula (no hay efecto, no hay diferencia) y se calcula lo extraño que sería observar los datos si fuera cierta. Si resulta muy improbable, por debajo de un nivel de significación fijado de antemano (típicamente 0,05), se rechaza. Hay tests para comparar medias, proporciones, distribuciones o la independencia entre variables.","cuando":"Para decidir si una diferencia observada, como la mejora de un modelo o el resultado de un test A/B, es real o puede deberse al azar.","ej":"Un test A/B compara dos versiones de una web; el test t indica si la diferencia en el tiempo medio de permanencia es significativa.","py":[{"c":"scipy.stats.ttest_ind","u":"https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.ttest_ind.html"},{"c":"scipy.stats.mannwhitneyu","u":"https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.mannwhitneyu.html"}],"rel":["p-valor","intervalo-de-confianza","test-chi-cuadrado","probabilidad-frecuentista-vs-bayesiana"],"children":[{"id":"p-valor","name":"p-valor","en":"p-value","frase":"Probabilidad de ver un resultado al menos tan extremo como el observado si la hipótesis nula fuera cierta.","desc":"Mide la compatibilidad de los datos con la hipótesis nula: un p-valor pequeño indica que los datos serían raros si no hubiera efecto. No es la probabilidad de que la hipótesis nula sea cierta, ni mide el tamaño del efecto. Con muestras enormes, efectos irrelevantes dan p-valores minúsculos, y probar muchas hipótesis a la vez produce falsos positivos si no se corrige.","ej":"Un p-valor de 0,03 al comparar dos modelos significa que, si rindieran igual, una diferencia como la observada aparecería solo en un 3 % de las repeticiones.","py":[{"c":"scipy.stats.permutation_test","u":"https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.permutation_test.html"}],"rel":["contraste-de-hipotesis","intervalo-de-confianza","correlacion-espuria"]},{"id":"intervalo-de-confianza","name":"Intervalo de confianza","en":"confidence interval","frase":"Rango de valores plausibles para un parámetro, con un nivel de confianza asociado.","desc":"En lugar de un único número, da un rango que contiene el valor real con una confianza dada, por ejemplo del 95 %. Su interpretación es frecuentista: si se repitiera el muestreo muchas veces, el 95 % de los intervalos construidos así contendrían el valor real. El bootstrap permite calcularlo para casi cualquier métrica remuestreando los datos.","cuando":"Para informar de una métrica o una estimación junto con su incertidumbre, sobre todo con pocos datos.","ej":"\"AUC de 0,87, con intervalo de confianza del 95 % entre 0,83 y 0,91\" informa mucho más que el 0,87 a secas.","py":[{"c":"scipy.stats.bootstrap","u":"https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.bootstrap.html"},{"c":"statsmodels.stats.proportion.proportion_confint","u":"https://www.statsmodels.org/stable/generated/statsmodels.stats.proportion.proportion_confint.html"}],"rel":["p-valor","contraste-de-hipotesis","incertidumbre","validacion-cruzada"]},{"id":"test-chi-cuadrado","name":"Test chi-cuadrado","en":"chi-squared test","frase":"Test para comprobar si dos variables categóricas son independientes.","desc":"Compara las frecuencias observadas en una tabla de contingencia con las que se esperarían si las variables fueran independientes. Cuanto mayor es la discrepancia, mayor es el estadístico χ² y menor el p-valor. En ML también se usa para seleccionar variables categóricas o de conteo relacionadas con la clase.","cuando":"Para comprobar si dos variables categóricas están relacionadas o para filtrar variables de conteo antes de clasificar.","ej":"Comprobar si la tasa de abandono de clientes depende del tipo de contrato: mensual, anual o bianual.","py":[{"c":"scipy.stats.chi2_contingency","u":"https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.chi2_contingency.html"},{"c":"sklearn.feature_selection.chi2","u":"https://scikit-learn.org/stable/modules/generated/sklearn.feature_selection.chi2.html"}],"rel":["independencia-estadistica","contraste-de-hipotesis","metodos-filtro","informacion-mutua"]}]}]},{"id":"teoria-de-la-informacion","name":"Teoría de la información","en":"information theory","frase":"Matemáticas para medir la información, la incertidumbre y lo que comparten las variables.","desc":"Fundada por Claude Shannon en 1948, cuantifica la información en bits. Sus medidas clave son la entropía (incertidumbre de una variable), la información mutua (lo que una variable dice de otra) y la divergencia de Kullback-Leibler (la diferencia entre dos distribuciones). En ML aparece en las funciones de pérdida, los árboles de decisión, la selección de variables y los modelos generativos.","ej":"La entropía cruzada que se minimiza al entrenar casi cualquier clasificador es una medida de teoría de la información.","py":[{"c":"scipy.stats.entropy","u":"https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.entropy.html"}],"rel":["entropia","informacion-mutua","divergencia-de-kullback-leibler","entropia-cruzada"],"children":[{"id":"informacion-shannon","name":"Información (Shannon)","en":"Shannon information (self-information)","frase":"Cuanto menos probable es un suceso, más información aporta cuando ocurre.","desc":"La información, o sorpresa, de un suceso con probabilidad p es −log₂ p bits. Un suceso seguro no aporta nada; uno muy improbable aporta mucho. Con logaritmo en base 2 se mide en bits y con logaritmo natural, en nats. La media de la información de todos los sucesos posibles es la entropía.","ej":"Conocer el resultado de lanzar una moneda aporta 1 bit; conocer el número que sale en un dado de 8 caras, 3 bits.","py":[{"c":"-np.log2(p)","s":1}],"rel":["entropia","teoria-de-la-informacion","nll"]},{"id":"entropia","name":"Entropía","en":"entropy","frase":"La incertidumbre media de una variable: cuánta información aporta, de media, conocer su valor.","desc":"Es la información media de una variable, H(X) = −Σ p(x) log p(x). Es máxima cuando todos los valores son igual de probables y nula cuando el resultado es seguro. Los árboles de decisión la usan para elegir divisiones que reduzcan la incertidumbre sobre la clase, y la entropía cruzada se basa en ella para comparar predicciones con etiquetas.","ej":"Una moneda justa tiene 1 bit de entropía; una trucada que sale cara el 90 % de las veces, solo 0,47 bits.","py":[{"c":"scipy.stats.entropy","u":"https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.entropy.html"},{"c":"scipy.stats.differential_entropy","u":"https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.differential_entropy.html"}],"rel":["informacion-shannon","entropia-cruzada","criterios-de-division","informacion-mutua"]},{"id":"divergencia-de-kullback-leibler","name":"Divergencia de Kullback-Leibler","en":"Kullback-Leibler divergence","frase":"Mide cuánto se aleja una distribución de probabilidad de otra de referencia.","desc":"KL(P‖Q) = Σ p(x) log(p(x)/q(x)) cuantifica la información que se pierde al aproximar P con Q. Siempre es mayor o igual que cero y solo vale cero si las distribuciones son iguales, pero no es simétrica, así que no es una distancia. Aparece en la pérdida de los VAE, en la destilación de conocimiento, en t-SNE y en el ajuste de LLMs con RLHF.","ej":"En un VAE, el término KL obliga a que la distribución latente de cada imagen se parezca a una normal estándar.","py":[{"c":"scipy.special.rel_entr","u":"https://docs.scipy.org/doc/scipy/reference/generated/scipy.special.rel_entr.html"},{"c":"keras.losses.KLDivergence","u":"https://keras.io/api/losses/probabilistic_losses/#kldivergence-class"},{"c":"torch.nn.KLDivLoss","u":"https://docs.pytorch.org/docs/stable/generated/torch.nn.KLDivLoss.html"}],"rel":["entropia","elbo","destilacion-de-conocimiento","t-sne","rlhf"]},{"id":"informacion-mutua","name":"Información mutua","en":"mutual information","frase":"Cuánta información comparten dos variables: detecta cualquier dependencia, no solo la lineal.","desc":"I(X;Y) mide cuánto se reduce la incertidumbre sobre una variable al conocer la otra. Vale cero solo si son independientes y, a diferencia de la correlación de Pearson, capta relaciones no lineales. Se usa para seleccionar variables, comparar agrupamientos y como objetivo en el aprendizaje de representaciones.","cuando":"Para medir o clasificar por importancia la relación entre variables cuando puede ser no lineal, por ejemplo al seleccionar variables.","ej":"Si y = x² con x simétrica en torno a cero, la correlación de Pearson es casi nula, pero la información mutua es alta.","py":[{"c":"sklearn.feature_selection.mutual_info_classif","u":"https://scikit-learn.org/stable/modules/generated/sklearn.feature_selection.mutual_info_classif.html"},{"c":"sklearn.feature_selection.mutual_info_regression","u":"https://scikit-learn.org/stable/modules/generated/sklearn.feature_selection.mutual_info_regression.html"},{"c":"sklearn.metrics.mutual_info_score","u":"https://scikit-learn.org/stable/modules/generated/sklearn.metrics.mutual_info_score.html"}],"rel":["entropia","icc","metodos-filtro","correlacion-de-pearson","independencia-estadistica"]},{"id":"correlacion-total","name":"Correlación total","en":"total correlation (multi-information)","frase":"Generalización de la información mutua a muchas variables: cuánta redundancia hay en el conjunto.","desc":"Es la suma de las entropías de cada variable menos la entropía conjunta. Vale cero si todas las variables son independientes y crece con la redundancia entre ellas. Medirla en muchas dimensiones es difícil; métodos como la gaussianización iterativa (RBIG) la estiman transformando los datos hasta hacerlos independientes.","ej":"En una red de estaciones meteorológicas cercanas, la correlación total es alta porque muchas miden casi lo mismo.","rel":["informacion-mutua","entropia","rbig","ica"]}]},{"id":"medidas-de-dependencia","name":"Medidas de dependencia","en":"dependence measures","frase":"Herramientas para cuantificar si dos variables están relacionadas, con qué forma y con qué intensidad.","desc":"Van de lo más simple a lo más general. Pearson capta relaciones lineales; Spearman, monótonas; la información mutua y HSIC detectan cualquier dependencia, incluso no monótona. La dependencia condicional pregunta si la relación persiste al controlar por una tercera variable, el primer paso para hablar de causalidad.","ej":"La relación entre temperatura y consumo eléctrico tiene forma de U (calefacción en invierno, aire acondicionado en verano): Pearson la subestima y la información mutua la detecta.","py":[{"c":"pandas.DataFrame.corr","u":"https://pandas.pydata.org/docs/reference/api/pandas.DataFrame.corr.html"}],"rel":["correlacion-de-pearson","correlacion-de-spearman","informacion-mutua","hsic","dependencia-condicional"],"children":[{"id":"independencia-estadistica","name":"Independencia estadística","en":"statistical independence","frase":"Dos variables son independientes si conocer una no dice nada sobre la otra.","desc":"Formalmente, P(X, Y) = P(X)·P(Y). La independencia implica correlación cero, pero no al revés: dos variables pueden tener correlación nula y depender fuertemente de forma no lineal. Muchos métodos la suponen, como Naive Bayes, ICA o el supuesto de datos i.i.d. (independientes e idénticamente distribuidos).","ej":"Los resultados de dos lanzamientos de un dado son independientes; la altura y el peso de una persona, no.","py":[{"c":"scipy.stats.chi2_contingency","u":"https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.chi2_contingency.html"}],"rel":["probabilidad-condicional","dependencia-condicional","informacion-mutua","test-chi-cuadrado","hsic"]},{"id":"correlacion-de-pearson","name":"Correlación de Pearson","en":"Pearson correlation","frase":"Mide la fuerza de la relación lineal entre dos variables, de −1 a 1.","desc":"Es la covarianza dividida por el producto de las desviaciones típicas. Vale 1 o −1 si los puntos caen sobre una recta y 0 si no hay relación lineal. Es sensible a los valores atípicos y ciega a las relaciones no lineales, por eso conviene mirar siempre el diagrama de dispersión.","cuando":"Para medir relaciones aproximadamente lineales entre variables numéricas sin valores atípicos fuertes.","ej":"Entre los metros cuadrados y el precio de las viviendas de un barrio, una correlación de 0,8 indica una relación lineal fuerte y positiva.","py":[{"c":"scipy.stats.pearsonr","u":"https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.pearsonr.html"},{"c":"numpy.corrcoef","u":"https://numpy.org/doc/stable/reference/generated/numpy.corrcoef.html"}],"rel":["correlacion-de-spearman","informacion-mutua","correlacion-no-implica-causalidad","eda"]},{"id":"correlacion-de-spearman","name":"Correlación de Spearman","en":"Spearman rank correlation","frase":"Correlación entre rangos: mide relaciones monótonas aunque no sean lineales.","desc":"Calcula la correlación de Pearson sobre las posiciones (rangos) de los datos en lugar de sobre sus valores. Así detecta cualquier relación que siempre crece o siempre decrece, y es robusta a valores atípicos. La tau de Kendall es una alternativa basada en contar los pares de puntos ordenados en el mismo sentido.","cuando":"Con relaciones monótonas no lineales, datos ordinales o valores atípicos.","ej":"Si y = eˣ, la relación es perfectamente monótona: Spearman vale 1, mientras que Pearson queda claramente por debajo.","py":[{"c":"scipy.stats.spearmanr","u":"https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.spearmanr.html"},{"c":"scipy.stats.kendalltau","u":"https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.kendalltau.html"}],"rel":["correlacion-de-pearson","medidas-de-dependencia","outliers"]},{"id":"icc","name":"Coeficiente de correlación de información (ICC)","en":"information coefficient of correlation (ICC)","frase":"La información mutua reescalada para leerse como un coeficiente de correlación entre 0 y 1.","desc":"El coeficiente de correlación de información transforma la información mutua I, medida en nats, en ICC = √(1 − e^(−2I)). Para variables gaussianas coincide con el valor absoluto de la correlación de Pearson, pero sigue siendo válido cuando la relación no es lineal. Combina la generalidad de la información mutua con una escala fácil de interpretar.","ej":"Para y = sen(x) con algo de ruido en un rango amplio de x, Pearson sale cerca de 0, mientras que el ICC refleja una dependencia fuerte.","py":[{"c":"np.sqrt(1 - np.exp(-2 * mi))","s":1}],"rel":["informacion-mutua","correlacion-de-pearson","medidas-de-dependencia"]},{"id":"hsic","name":"HSIC (dependencia con kernels)","en":"Hilbert-Schmidt Independence Criterion (HSIC)","frase":"Medida de dependencia basada en kernels que detecta relaciones no lineales entre variables.","desc":"El criterio de independencia de Hilbert-Schmidt compara las matrices de similitud (kernels) de las dos variables: si sus estructuras de similitud varían juntas, hay dependencia. Con kernels adecuados, como el gaussiano, vale cero solo si las variables son independientes. Funciona en varias dimensiones sin estimar densidades y se usa en tests de independencia y en descubrimiento causal.","cuando":"Para contrastar la independencia entre variables, incluso multidimensionales, cuando la relación puede ser no lineal.","ej":"Comprobar si los residuos de una regresión son independientes de la entrada, la condición que usan los modelos de ruido aditivo para orientar causas.","py":[{"c":"hyppo.independence.Hsic","u":"https://hyppo.neurodata.io/api/generated/hyppo.independence.Hsic.html"}],"rel":["truco-del-kernel","informacion-mutua","modelos-de-ruido-aditivo","independencia-estadistica"]},{"id":"dependencia-condicional","name":"Dependencia condicional","en":"conditional dependence","frase":"Si dos variables siguen relacionadas cuando ya se conoce una tercera.","desc":"X e Y son condicionalmente independientes dado Z si, una vez conocida Z, X ya no informa sobre Y. Dos variables pueden estar correlacionadas solo porque comparten una causa común, y la relación desaparece al condicionar en ella. Los tests de independencia condicional son la pieza básica de algoritmos de descubrimiento causal como PC.","ej":"Las ventas de helados y los ahogamientos están correlacionados, pero son independientes dada la temperatura: ambos suben en verano.","py":[{"c":"pingouin.partial_corr","u":"https://pingouin-stats.org/build/html/generated/pingouin.partial_corr.html"}],"rel":["independencia-estadistica","algoritmo-pc","red-bayesiana","correlacion-espuria"]}]},{"id":"modelos-graficos-probabilisticos","name":"Modelos gráficos probabilísticos","en":"probabilistic graphical models","frase":"Grafos que representan qué variables dependen directamente de cuáles.","desc":"Combinan grafos y probabilidad: cada nodo es una variable y las aristas indican dependencias directas. La estructura del grafo descompone una distribución conjunta enorme en factores pequeños, lo que facilita aprenderla, razonar con ella e interpretarla. Los dos grandes tipos son los dirigidos (redes bayesianas) y los no dirigidos (campos aleatorios de Markov).","cuando":"Para modelar dominios con muchas variables inciertas y relaciones conocidas o interpretables entre ellas.","ej":"Un sistema de diagnóstico de averías que relaciona síntomas del coche (no arranca, luces débiles) con sus posibles causas (batería, motor de arranque).","py":[{"c":"pgmpy.models.DiscreteBayesianNetwork","u":"https://pgmpy.org/api/generated/models/pgmpy.models.DiscreteBayesianNetwork.html"}],"rel":["red-bayesiana","hmm","aprendizaje-de-estructura","causalidad"],"children":[{"id":"red-bayesiana","name":"Red bayesiana","en":"Bayesian network","frase":"Grafo dirigido sin ciclos en el que cada variable depende solo de sus padres.","desc":"Cada nodo tiene una tabla de probabilidades condicionada a sus padres en el grafo, y la distribución conjunta es el producto de todas esas tablas. Permite inferir variables no observadas a partir de las observadas en cualquier dirección: de causas a efectos y de efectos a causas. Es interpretable y admite incorporar conocimiento experto en la estructura.","cuando":"Para razonar con incertidumbre en dominios con relaciones causales conocidas, combinando datos y conocimiento experto.","ej":"Una red con Tabaquismo → Cáncer de pulmón → Tos permite calcular la probabilidad de cáncer de un paciente fumador que tose.","py":[{"c":"pgmpy.models.DiscreteBayesianNetwork","u":"https://pgmpy.org/api/generated/models/pgmpy.models.DiscreteBayesianNetwork.html"},{"c":"pgmpy.inference.VariableElimination","u":"https://pgmpy.org/api/generated/inference/pgmpy.inference.VariableElimination.html"}],"rel":["modelos-graficos-probabilisticos","teorema-de-bayes","aprendizaje-de-estructura","causalidad"]},{"id":"aprendizaje-de-estructura","name":"Aprendizaje de estructura","en":"structure learning","frase":"Descubrir a partir de los datos qué aristas tiene el grafo de un modelo gráfico.","desc":"En lugar de dibujar el grafo a mano, se infiere de los datos. Hay dos familias: los métodos basados en restricciones, como PC, eliminan aristas mediante tests de independencia condicional; los basados en puntuación, como hill climbing, buscan el grafo que maximiza una métrica como el BIC. El resultado suele dejar algunas direcciones sin fijar, porque varios grafos explican los datos igual de bien.","cuando":"Cuando no conoces las relaciones entre variables y quieres obtener un grafo inicial e interpretable a partir de los datos.","ej":"A partir de registros de pacientes, recuperar que la edad influye en la tensión arterial y esta, en el riesgo cardiaco.","py":[{"c":"pgmpy.causal_discovery.PC","u":"https://pgmpy.org/api/generated/structure_learning/pgmpy.causal_discovery.PC.html"},{"c":"pgmpy.causal_discovery.HillClimbSearch","u":"https://pgmpy.org/api/generated/structure_learning/pgmpy.causal_discovery.HillClimbSearch.html"}],"rel":["algoritmo-pc","hill-climbing","red-bayesiana","descubrimiento-causal"],"children":[{"id":"algoritmo-pc","name":"Algoritmo PC","en":"PC algorithm","frase":"Reconstruye el grafo quitando las aristas entre variables que resultan condicionalmente independientes.","desc":"Parte de un grafo completo y elimina la arista entre cada par de variables que un test declara independientes, primero sin condicionar y después condicionando en conjuntos crecientes de vecinos. Después orienta las aristas que puede mediante estructuras en V (X → Z ← Y). Escala bien con muchas variables, pero depende de la fiabilidad de los tests.","cuando":"Para obtener un primer grafo causal con muchas variables y datos suficientes para que los tests de independencia sean fiables.","ej":"Con datos de lluvia, aspersor con temporizador y césped mojado, PC detecta que lluvia y aspersor son independientes, pero dependientes dado el césped, y orienta ambas flechas hacia él.","hp":[["significance_level","nivel de significación de los tests; más bajo, menos aristas"],["ci_test","test de independencia condicional que se usa"],["max_cond_vars","tamaño máximo del conjunto de variables en que se condiciona"]],"py":[{"c":"pgmpy.causal_discovery.PC","u":"https://pgmpy.org/api/generated/structure_learning/pgmpy.causal_discovery.PC.html"},{"c":"causallearn.search.ConstraintBased.PC.pc","u":"https://causal-learn.readthedocs.io/en/latest/search_methods_index/Constraint-based%20causal%20discovery%20methods/PC.html"}],"rel":["aprendizaje-de-estructura","dependencia-condicional","descubrimiento-causal","hill-climbing"]},{"id":"hill-climbing","name":"Búsqueda por ascenso de colinas (hill climbing)","en":"hill climbing search","frase":"Busca el mejor grafo añadiendo, quitando o invirtiendo aristas mientras mejore la puntuación.","desc":"Método de aprendizaje de estructura basado en puntuación. En cada paso prueba todos los cambios de una sola arista y aplica el que más mejora una métrica como el BIC, que premia el ajuste a los datos y penaliza la complejidad. Es rápido, pero puede quedarse en óptimos locales; una lista tabú, que prohíbe deshacer los cambios recientes, ayuda a evitarlos.","cuando":"Para aprender la estructura de una red bayesiana con datos discretos o gaussianos y un número moderado de variables.","ej":"Aprender la red de dependencias entre síntomas y diagnósticos a partir de historiales clínicos.","hp":[["scoring_method","puntuación que se maximiza (BIC, K2, BDeu…)"],["max_indegree","número máximo de padres por nodo"],["tabu_length","cuántos cambios recientes no se pueden deshacer"]],"py":[{"c":"pgmpy.causal_discovery.HillClimbSearch","u":"https://pgmpy.org/api/generated/structure_learning/pgmpy.causal_discovery.HillClimbSearch.html"}],"rel":["aprendizaje-de-estructura","algoritmo-pc","red-bayesiana","optimizacion"]}]},{"id":"regresion-lineal-bayesiana","name":"Regresión lineal bayesiana","en":"Bayesian linear regression","frase":"Regresión lineal que da una distribución para los coeficientes y para cada predicción, no solo un valor.","desc":"Pone una distribución a priori sobre los pesos y obtiene su posterior a partir de los datos. Cada predicción viene con su incertidumbre, que crece lejos de los datos de entrenamiento. El prior actúa como regularización: un prior gaussiano equivale a Ridge, y la fuerza de la regularización se puede estimar a partir de los propios datos.","cuando":"Con pocos datos o cuando necesitas un intervalo de incertidumbre en cada predicción de un modelo lineal.","ej":"Predecir la demanda de un producto recién lanzado con pocas semanas de historia, con un intervalo que se estrecha a medida que llegan datos.","py":[{"c":"sklearn.linear_model.BayesianRidge","u":"https://scikit-learn.org/stable/modules/generated/sklearn.linear_model.BayesianRidge.html"},{"c":"sklearn.linear_model.ARDRegression","u":"https://scikit-learn.org/stable/modules/generated/sklearn.linear_model.ARDRegression.html"}],"rel":["regresion-lineal","ridge-lasso-y-elastic-net","prior-verosimilitud-y-posterior","procesos-gaussianos","incertidumbre"]},{"id":"hmm","name":"Modelo oculto de Márkov (HMM)","en":"hidden Markov model (HMM)","frase":"Secuencia de estados ocultos que saltan entre sí y generan las observaciones que vemos.","desc":"Supone que el sistema pasa por estados que no se observan directamente, con unas probabilidades de transición entre ellos, y que cada estado emite observaciones con su propia distribución. Se entrena con el algoritmo EM (Baum-Welch), y el algoritmo de Viterbi recupera la secuencia de estados más probable. Fue la base del reconocimiento de voz antes del deep learning.","cuando":"Para secuencias que alternan entre regímenes o estados no observables, cuando quieres un modelo interpretable de esos cambios.","ej":"Detectar con el acelerómetro de un móvil si una persona está quieta, andando o corriendo en cada momento.","hp":[["n_components","número de estados ocultos"],["covariance_type","forma de la covarianza de las emisiones de cada estado"],["n_iter","iteraciones máximas del algoritmo EM"]],"py":[{"c":"hmmlearn.hmm.GaussianHMM","u":"https://hmmlearn.readthedocs.io/en/latest/api.html#hmmlearn.hmm.GaussianHMM"},{"c":"hmmlearn.hmm.CategoricalHMM","u":"https://hmmlearn.readthedocs.io/en/latest/api.html#hmmlearn.hmm.CategoricalHMM"}],"rel":["modelos-graficos-probabilisticos","rnn","gmm","componentes-de-una-serie"]}]},{"id":"causalidad","name":"Causalidad","en":"causality","frase":"Saber qué variables provocan cambios en otras, no solo cuáles se mueven juntas.","desc":"Un modelo predictivo aprende asociaciones; una pregunta causal plantea qué pasaría si se interviniera sobre una variable. Responderla con datos observacionales exige supuestos explícitos, normalmente expresados como un grafo causal. Las pistas para construirlo son los experimentos aleatorizados, la dependencia condicional, el orden temporal y las asimetrías entre causa y efecto.","cuando":"Cuando la decisión implica intervenir (cambiar un precio, aplicar un tratamiento) y no basta con predecir.","ej":"Un modelo puede predecir bien las ventas a partir del gasto en publicidad, pero solo un análisis causal dice cuánto subirían si se duplicara ese gasto.","rel":["correlacion-no-implica-causalidad","descubrimiento-causal","red-bayesiana","causalidad-de-granger"],"children":[{"id":"correlacion-no-implica-causalidad","name":"Correlación no implica causalidad","en":"correlation does not imply causation"
