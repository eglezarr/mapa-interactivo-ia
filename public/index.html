,"frase":"Que dos variables se muevan juntas no significa que una cause la otra.","desc":"Una correlación puede deberse a una causa común (variable de confusión), a que el efecto va en sentido contrario, al azar o a cómo se seleccionaron los datos. Por eso un modelo que predice bien no sirve automáticamente para decidir intervenciones. Establecer causalidad exige experimentos o supuestos adicionales sobre cómo se generan los datos.","ej":"En los incendios a los que acuden más bomberos se producen más daños, pero no porque los bomberos los causen: ambas cosas dependen del tamaño del incendio.","rel":["correlacion-espuria","causalidad","dependencia-condicional","correlacion-de-pearson"]},{"id":"correlacion-espuria","name":"Correlación espuria","en":"spurious correlation","frase":"Correlación sin relación real, fruto del azar, de una tercera variable o de tendencias compartidas.","desc":"Surge cuando dos variables parecen relacionadas sin estarlo. Las causas típicas son una variable de confusión común, la coincidencia al explorar muchas variables y, en series temporales, la tendencia: dos series que crecen con el tiempo salen muy correlacionadas aunque no tengan nada que ver. Diferenciar las series o controlar por la variable común suele hacerla desaparecer.","ej":"En EE. UU., el consumo de queso por habitante y las muertes por enredarse en las sábanas estuvieron muy correlacionados durante una década, por pura coincidencia.","rel":["correlacion-no-implica-causalidad","estacionariedad","p-valor","dependencia-condicional"]},{"id":"causalidad-de-granger","name":"Causalidad de Granger","en":"Granger causality","frase":"X causa en sentido de Granger a Y si su pasado mejora la predicción de Y.","desc":"Compara dos modelos que predicen Y: uno solo con el pasado de Y y otro que añade el pasado de X. Si el segundo predice significativamente mejor, se dice que X causa en sentido de Granger a Y. Es causalidad predictiva, no causalidad real: una causa común no observada puede producir el mismo resultado. Supone series estacionarias y relaciones lineales.","cuando":"Para explorar qué series temporales anticipan a otras, por ejemplo al elegir variables para un modelo de predicción.","ej":"Comprobar si la temperatura de los días anteriores mejora la predicción del consumo eléctrico de mañana más allá del propio consumo pasado.","hp":[["maxlag","número máximo de retardos que se prueban"]],"py":[{"c":"statsmodels.tsa.stattools.grangercausalitytests","u":"https://www.statsmodels.org/stable/generated/statsmodels.tsa.stattools._stattools.grangercausalitytests.html"}],"rel":["informacion-dirigida","estacionariedad","autocorrelacion","causalidad"]},{"id":"informacion-dirigida","name":"Información dirigida","en":"directed information","frase":"Granger en clave de teoría de la información: cuánta información fluye del pasado de X al futuro de Y.","desc":"Mide cuánta información aporta la historia de una serie a la siguiente observación de otra, más allá de la que aporta la historia de esta última. Al basarse en la información mutua capta relaciones no lineales, y al ser asimétrica permite poner dirección a las flechas de un grafo. La transferencia de entropía es una medida estrechamente relacionada.","ej":"En una red de sensores de un río, comprobar que la información fluye de la estación de aguas arriba a la de aguas abajo y no al revés.","rel":["causalidad-de-granger","informacion-mutua","descubrimiento-causal","entropia"]},{"id":"modelos-de-ruido-aditivo","name":"Modelos de ruido aditivo (causalidad desde residuos)","en":"additive noise models (ANM)","frase":"Orientan la flecha causal comprobando en qué dirección el residuo es independiente de la causa.","desc":"Suponen que el efecto es una función de la causa más un ruido independiente: y = f(x) + n. Se ajusta una regresión en cada sentido y se examina el residuo: solo en la dirección causal correcta es independiente de la variable de entrada. Así pueden distinguir causa y efecto con solo dos variables, siempre que la relación sea no lineal o el ruido no gaussiano.","cuando":"Para decidir la dirección causal entre dos variables cuando no hay información temporal ni experimental.","ej":"Con la altitud y la temperatura media de muchas estaciones meteorológicas, el residuo solo es independiente al modelar la temperatura en función de la altitud, lo que apunta a altitud → temperatura.","py":[{"c":"causallearn.search.FCMBased.ANM.ANM.ANM","u":"https://causal-learn.readthedocs.io/en/latest/search_methods_index/Causal%20discovery%20methods%20based%20on%20constrained%20functional%20causal%20models/anm.html"}],"rel":["hsic","descubrimiento-causal","regresion-lineal","causalidad"]},{"id":"descubrimiento-causal","name":"Descubrimiento causal","en":"causal discovery","frase":"Inferir el grafo de causas y efectos entre variables a partir de datos observacionales.","desc":"Combina varias pistas para dibujar flechas causales sin hacer experimentos: independencias condicionales (algoritmo PC), puntuaciones de ajuste (GES), asimetrías entre causa y efecto (modelos de ruido aditivo, LiNGAM) y orden temporal (Granger). Todos dependen de supuestos, como que no haya causas comunes ocultas, así que el resultado es una hipótesis que conviene contrastar.","cuando":"Para generar hipótesis causales en sistemas donde no se puede experimentar, como el clima, la biología o los procesos industriales.","ej":"Inferir a partir de mediciones de expresión génica qué genes regulan a cuáles.","py":[{"c":"causallearn.search.ConstraintBased.PC.pc","u":"https://causal-learn.readthedocs.io/en/latest/search_methods_index/Constraint-based%20causal%20discovery%20methods/PC.html"},{"c":"causallearn.search.ScoreBased.GES.ges","u":"https://causal-learn.readthedocs.io/en/latest/search_methods_index/Score-based%20causal%20discovery%20methods/GES.html"},{"c":"causallearn.search.FCMBased.lingam.DirectLiNGAM","u":"https://causal-learn.readthedocs.io/en/latest/search_methods_index/Causal%20discovery%20methods%20based%20on%20constrained%20functional%20causal%20models/lingam.html"}],"rel":["algoritmo-pc","modelos-de-ruido-aditivo","aprendizaje-de-estructura","causalidad-de-granger"]}]}]},{"id":"flujo-de-trabajo-en-ml","name":"Flujo de trabajo en ML","en":"ML workflow","frase":"Todo lo que rodea al modelo: datos, validación, métricas, ajuste y puesta en producción.","desc":"Todo lo que rodea al modelo en un proyecto real: preparar los datos, separar entrenamiento y test, elegir métricas, ajustar hiperparámetros, desplegar y vigilar el modelo en producción. Los errores de esta parte, como la fuga de datos o una métrica mal elegida, suelen pesar más que la elección del algoritmo.","ej":"Un detector de fraude con un 99,9 % de accuracy puede ser inútil si solo el 0,1 % de las operaciones son fraudes; aquí la métrica que importa es el recall o la curva precisión-recall.","rel":["ciclo-de-vida-ml","fuga-de-datos","validacion-cruzada","mlops"],"children":[{"id":"ciclo-de-vida-ml","name":"Ciclo de vida de un proyecto de ML","en":"ML project lifecycle","frase":"Las fases de un proyecto de ML, desde definir el problema hasta mantener el modelo en producción.","desc":"Un proyecto típico recorre varias fases: definir el problema y la métrica de éxito, conseguir y preparar los datos, entrenar y validar modelos, desplegarlos y monitorizarlos. No es un proceso lineal: lo que se aprende en cada fase obliga a menudo a volver a las anteriores. La mayor parte del esfuerzo suele ir a los datos, no al algoritmo.","ej":"Un modelo de previsión de demanda se reentrena cada mes porque los hábitos de compra cambian; detectar ese cambio también forma parte del ciclo.","rel":["linea-base","mlops","deriva-de-datos","eda"]},{"id":"linea-base","name":"Línea base (baseline)","en":"baseline","frase":"El modelo más sencillo posible, que marca el resultado mínimo que hay que superar.","desc":"Antes de entrenar modelos complejos conviene medir lo que logra una regla trivial: predecir siempre la clase más frecuente, la media o el último valor observado. Si un modelo sofisticado no la supera con claridad, algo falla en los datos, en las variables o en la métrica. También da contexto a los resultados: un 95 % de accuracy no es nada si la línea base ya logra un 94 %.","cuando":"Siempre, como primer paso de cualquier proyecto, para saber si el modelo aporta algo.","ej":"En una serie de ventas diarias, predecir que mañana se venderá lo mismo que hoy es una línea base difícil de batir.","py":[{"c":"sklearn.dummy.DummyClassifier","u":"https://scikit-learn.org/stable/modules/generated/sklearn.dummy.DummyClassifier.html"},{"c":"sklearn.dummy.DummyRegressor","u":"https://scikit-learn.org/stable/modules/generated/sklearn.dummy.DummyRegressor.html"}],"rel":["ciclo-de-vida-ml","modelos-lineales","metricas-de-evaluacion","accuracy"]},{"id":"datos-y-preprocesado","name":"Datos y preprocesado","en":"data preprocessing","frase":"Preparar los datos para que el modelo pueda aprender de ellos: limpiar, transformar y codificar.","desc":"Los modelos esperan números limpios y en escalas comparables, y los datos reales llegan con huecos, errores, categorías de texto y escalas dispares. El preprocesado incluye explorar y auditar los datos, imputar faltantes, tratar atípicos, escalar, codificar categorías y crear variables nuevas. Todo debe ajustarse solo con los datos de entrenamiento para no introducir fugas.","ej":"Un dataset de clientes con edades vacías, ingresos en distintas monedas y provincias escritas como texto necesita imputación, conversión y codificación antes de entrenar nada.","py":[{"c":"sklearn.preprocessing","u":"https://scikit-learn.org/stable/api/sklearn.preprocessing.html"}],"rel":["eda","pipelines-de-preprocesado","fuga-de-datos","feature-engineering"],"children":[{"id":"eda","name":"Análisis exploratorio (EDA) y auditoría de datos","en":"exploratory data analysis (EDA)","frase":"Explorar los datos antes de modelar: distribuciones, relaciones, errores y sorpresas.","desc":"El análisis exploratorio resume y visualiza los datos para entenderlos: la distribución de cada variable, las relaciones entre ellas y con el objetivo, los valores faltantes, los duplicados y las anomalías. La auditoría añade comprobaciones de calidad, como rangos imposibles, identificadores repetidos o variables que no estarían disponibles en el momento de predecir. Muchos problemas del modelo se descubren aquí.","cuando":"Siempre antes de entrenar, y cada vez que llegan datos nuevos o el modelo se comporta de forma extraña.","ej":"Un histograma revela edades de 999 años: un código para \"dato desconocido\" que habría distorsionado el modelo.","py":[{"c":"pandas.DataFrame.describe","u":"https://pandas.pydata.org/docs/reference/api/pandas.DataFrame.describe.html"},{"c":"seaborn.pairplot","u":"https://seaborn.pydata.org/generated/seaborn.pairplot.html"}],"rel":["calidad-y-etiquetado-de-datos","outliers","valores-faltantes-e-imputacion","correlacion-de-pearson"]},{"id":"calidad-y-etiquetado-de-datos","name":"Calidad y etiquetado de datos","en":"data quality & labeling","frase":"Unos datos limpios y bien etiquetados importan más que el algoritmo elegido.","desc":"Errores, duplicados, sesgos de muestreo y etiquetas inconsistentes limitan lo que cualquier modelo puede aprender. Etiquetar bien exige instrucciones claras, medir el acuerdo entre anotadores y auditar muestras. Las técnicas de aprendizaje confiado (confident learning) detectan ejemplos probablemente mal etiquetados comparando las etiquetas con las predicciones de un modelo.","cuando":"Al construir o heredar un dataset etiquetado, y cuando el modelo se estanca sin razón aparente.","ej":"En un dataset de radiografías, dos radiólogos discrepan en el 15 % de los casos: medir y resolver esas discrepancias mejora el modelo más que cambiar de arquitectura.","py":[{"c":"cleanlab.filter.find_label_issues","u":"https://docs.cleanlab.ai/stable/cleanlab/filter.html#cleanlab.filter.find_label_issues"}],"rel":["etiquetas-ruidosas","eda","supervision-debil","aprendizaje-activo"]},{"id":"valores-faltantes-e-imputacion","name":"Valores faltantes e imputación","en":"missing values & imputation","frase":"Rellenar los huecos de los datos con valores razonables sin distorsionar la información.","desc":"Los datos faltantes pueden deberse al azar o a algo informativo, como un campo que solo rellenan ciertos clientes. Las opciones van de eliminar filas o columnas a imputar con la media, la mediana o la moda, con los vecinos más cercanos o con un modelo que predice cada variable a partir de las demás. Añadir una columna indicadora conserva la información de que el dato faltaba.","cuando":"Cuando el modelo no admite valores faltantes o hay demasiados huecos para eliminar filas sin perder información.","ej":"Imputar la renta que falta de un cliente con la mediana de su provincia y marcar con un indicador que era desconocida.","hp":[["strategy","cómo se rellena (media, mediana, valor más frecuente o constante)"],["n_neighbors","en la imputación por vecinos, cuántos se promedian"],["add_indicator","añade columnas que marcan qué valores faltaban"]],"py":[{"c":"sklearn.impute.SimpleImputer","u":"https://scikit-learn.org/stable/modules/generated/sklearn.impute.SimpleImputer.html"},{"c":"sklearn.impute.KNNImputer","u":"https://scikit-learn.org/stable/modules/generated/sklearn.impute.KNNImputer.html"}],"rel":["eda","pipelines-de-preprocesado","fuga-de-datos","knn"]},{"id":"outliers","name":"Valores atípicos (outliers)","en":"outliers","frase":"Observaciones muy alejadas del resto: pueden ser errores o los casos más interesantes.","desc":"Un valor atípico puede ser un error de medida o de captura, o un caso real y extremo. Se detectan con reglas simples, como quedar a más de 1,5 rangos intercuartílicos de los cuartiles o a más de 3 desviaciones típicas de la media, o con métodos multivariantes. Según su origen se corrigen, se eliminan, se acotan (winsorización) o se mantienen usando modelos y escalados robustos.","cuando":"Cuando los extremos pueden distorsionar modelos sensibles, como la regresión lineal o el escalado por media y desviación típica.","ej":"Un sueldo de 10 millones en una encuesta salarial puede ser real (un alto directivo) o un error con un cero de más; decidirlo cambia mucho la media y apenas la mediana.","py":[{"c":"scipy.stats.mstats.winsorize","u":"https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.mstats.winsorize.html"},{"c":"sklearn.preprocessing.RobustScaler","u":"https://scikit-learn.org/stable/modules/generated/sklearn.preprocessing.RobustScaler.html"}],"rel":["anomalia-outlier-ruido-y-novedad","eda","escalado-de-variables","correlacion-de-spearman"]},{"id":"escalado-de-variables","name":"Escalado de variables","en":"feature scaling","frase":"Llevar las variables numéricas a rangos comparables para que ninguna domine por su escala.","desc":"Muchos algoritmos son sensibles a la escala: los basados en distancias (k-NN, k-means, SVM), los regularizados y las redes neuronales. Si una variable va de 0 a 1 y otra de 0 a 100.000, la segunda dominará. Los métodos habituales son la estandarización, la normalización min-max y el escalado robusto con mediana y rango intercuartílico. Los árboles de decisión no lo necesitan.","cuando":"Antes de usar modelos basados en distancias, con regularización o entrenados por descenso por gradiente.","ej":"Al agrupar clientes por edad e ingresos anuales sin escalar, k-means solo tendría en cuenta los ingresos.","py":[{"c":"sklearn.preprocessing.StandardScaler","u":"https://scikit-learn.org/stable/modules/generated/sklearn.preprocessing.StandardScaler.html"},{"c":"sklearn.preprocessing.MinMaxScaler","u":"https://scikit-learn.org/stable/modules/generated/sklearn.preprocessing.MinMaxScaler.html"},{"c":"sklearn.preprocessing.RobustScaler","u":"https://scikit-learn.org/stable/modules/generated/sklearn.preprocessing.RobustScaler.html"}],"rel":["estandarizacion","normalizacion-min-max","knn","distancia-euclidea"],"children":[{"id":"estandarizacion","name":"Estandarización (z-score)","en":"standardization (z-score)","frase":"Restar la media y dividir por la desviación típica: media 0 y desviación 1.","desc":"Transforma cada variable con z = (x − μ) / σ, de modo que queda centrada en cero y con desviación típica 1. Es el escalado por defecto para la mayoría de modelos lineales, SVM, PCA y redes neuronales. No acota los valores y es sensible a los atípicos extremos, que inflan la desviación típica.","ej":"Una altura de 190 cm en una población con media de 170 cm y desviación de 10 cm se convierte en z = 2.","py":[{"c":"sklearn.preprocessing.StandardScaler","u":"https://scikit-learn.org/stable/modules/generated/sklearn.preprocessing.StandardScaler.html"}],"rel":["escalado-de-variables","normalizacion-min-max","pca","capas-de-normalizacion"]},{"id":"normalizacion-min-max","name":"Normalización min-max","en":"min-max normalization","frase":"Reescalar cada variable al intervalo [0, 1] usando su mínimo y su máximo.","desc":"Aplica x' = (x − mín) / (máx − mín), con lo que todos los valores quedan entre 0 y 1. Conserva la forma de la distribución y es habitual para los píxeles de las imágenes y las entradas de redes neuronales. Un solo valor extremo comprime al resto en un rango estrecho, y los datos nuevos pueden salirse del intervalo.","ej":"Dividir los píxeles de una imagen entre 255 para pasarlos de 0-255 a 0-1 es una normalización min-max.","py":[{"c":"sklearn.preprocessing.MinMaxScaler","u":"https://scikit-learn.org/stable/modules/generated/sklearn.preprocessing.MinMaxScaler.html"}],"rel":["escalado-de-variables","estandarizacion","outliers"]}]},{"id":"transformaciones-de-distribucion","name":"Transformaciones de distribución (log, cuantiles)","en":"distribution transforms (log, Box-Cox, quantile)","frase":"Cambiar la forma de la distribución de una variable, por ejemplo para reducir su asimetría.","desc":"Las variables muy asimétricas, como los ingresos o los precios, se comportan mejor tras transformarlas. El logaritmo comprime los valores grandes; Box-Cox y Yeo-Johnson buscan automáticamente la potencia que hace los datos más gaussianos; la transformación por cuantiles fuerza una distribución uniforme o normal. Ayudan a los modelos lineales y reducen el peso de los extremos.","cuando":"Con variables muy asimétricas o de colas largas, antes de usar modelos lineales o basados en distancias.","ej":"Predecir el logaritmo del precio de una vivienda en lugar del precio equilibra el error entre pisos baratos y caros.","hp":[["method","en la transformación de potencia, Box-Cox (solo valores positivos) o Yeo-Johnson"],["output_distribution","en la de cuantiles, la distribución de salida (uniforme o normal)"]],"py":[{"c":"sklearn.preprocessing.PowerTransformer","u":"https://scikit-learn.org/stable/modules/generated/sklearn.preprocessing.PowerTransformer.html"},{"c":"sklearn.preprocessing.QuantileTransformer","u":"https://scikit-learn.org/stable/modules/generated/sklearn.preprocessing.QuantileTransformer.html"},{"c":"numpy.log1p","u":"https://numpy.org/doc/stable/reference/generated/numpy.log1p.html"}],"rel":["escalado-de-variables","outliers","regresion-lineal","rbig"]},{"id":"codificacion-de-variables-categoricas","name":"Codificación de variables categóricas","en":"categorical encoding (one-hot, ordinal, target)","frase":"Convertir categorías de texto en números que el modelo pueda usar sin inventar un orden falso.","desc":"One-hot crea una columna binaria por categoría y es la opción segura para categorías sin orden. La codificación ordinal asigna enteros y solo tiene sentido si hay un orden real o con modelos de árboles. La codificación por objetivo (target encoding) sustituye cada categoría por la media del objetivo en ella; es útil con muchas categorías, pero debe calcularse con validación cruzada para no filtrar información.","cuando":"Siempre que haya variables categóricas; target encoding, cuando tienen cientos o miles de categorías.","ej":"El color (\"rojo\", \"verde\", \"azul\") se codifica en tres columnas binarias; la talla (\"S\", \"M\", \"L\"), como 0, 1 y 2.","hp":[["handle_unknown","qué hacer con categorías que no aparecían en entrenamiento"],["min_frequency","agrupa las categorías poco frecuentes en una sola"]],"py":[{"c":"sklearn.preprocessing.OneHotEncoder","u":"https://scikit-learn.org/stable/modules/generated/sklearn.preprocessing.OneHotEncoder.html"},{"c":"sklearn.preprocessing.OrdinalEncoder","u":"https://scikit-learn.org/stable/modules/generated/sklearn.preprocessing.OrdinalEncoder.html"},{"c":"sklearn.preprocessing.TargetEncoder","u":"https://scikit-learn.org/stable/modules/generated/sklearn.preprocessing.TargetEncoder.html"}],"rel":["feature-engineering","fuga-de-datos","capa-de-embedding","pipelines-de-preprocesado"]},{"id":"feature-engineering","name":"Ingeniería de características (feature engineering)","en":"feature engineering","frase":"Crear variables nuevas a partir de las existentes para que el modelo vea mejor el patrón.","desc":"Consiste en transformar y combinar los datos brutos usando conocimiento del dominio: ratios, diferencias, agregados por grupo, variables de calendario, tramos o interacciones. En datos tabulares suele marcar más diferencia que cambiar de modelo. El deep learning automatiza parte de este trabajo al aprender representaciones, sobre todo en imágenes, texto y audio.","cuando":"Con datos tabulares, sobre todo cuando conoces el dominio y el modelo no capta relaciones que sabes que existen.","ej":"A partir de la fecha de una compra, crear \"día de la semana\", \"es festivo\" y \"días desde la última compra\" para predecir la siguiente.","py":[{"c":"sklearn.preprocessing.FunctionTransformer","u":"https://scikit-learn.org/stable/modules/generated/sklearn.preprocessing.FunctionTransformer.html"},{"c":"sklearn.preprocessing.KBinsDiscretizer","u":"https://scikit-learn.org/stable/modules/generated/sklearn.preprocessing.KBinsDiscretizer.html"}],"rel":["regresion-polinomica-e-interacciones","codificacion-de-variables-categoricas","seleccion-de-caracteristicas","aprendizaje-de-representaciones"]},{"id":"desbalanceo-de-clases","name":"Desbalanceo de clases","en":"class imbalance","frase":"Cuando una clase es mucho más rara que otra y el modelo tiende a ignorarla.","desc":"En fraude, averías o enfermedades raras, la clase de interés puede ser el 1 % de los datos o menos, y un modelo puede lograr un 99 % de accuracy sin detectar ni un caso. Las soluciones combinan métricas adecuadas (recall, precisión, curva precisión-recall), el ajuste del umbral de decisión, la ponderación de clases y el remuestreo de los datos de entrenamiento.","ej":"En un detector de transacciones fraudulentas con un 0,2 % de fraudes, predecir siempre \"legítima\" da un 99,8 % de accuracy y no sirve para nada.","rel":["sobremuestreo","submuestreo-y-ponderacion-de-clases","curva-precision-recall","umbral-de-decision"],"children":[{"id":"sobremuestreo","name":"Sobremuestreo (SMOTE, ADASYN)","en":"oversampling (SMOTE, ADASYN)","frase":"Aumentar los ejemplos de la clase minoritaria, duplicándolos o creando otros sintéticos.","desc":"El sobremuestreo aleatorio duplica ejemplos de la clase rara. SMOTE crea ejemplos sintéticos interpolando entre un ejemplo minoritario y sus vecinos de la misma clase, y ADASYN genera más ejemplos donde la clase es más difícil de aprender. Solo debe aplicarse al conjunto de entrenamiento, nunca a validación ni a test.","cuando":"Cuando la clase minoritaria tiene pocos ejemplos y la ponderación de clases no basta.","ej":"Con 200 casos de avería frente a 20.000 normales, SMOTE genera averías sintéticas hasta equilibrar el entrenamiento del clasificador.","hp":[["sampling_strategy","proporción final deseada entre clases"],["k_neighbors","vecinos entre los que SMOTE interpola"]],"py":[{"c":"imblearn.over_sampling.SMOTE","u":"https://imbalanced-learn.org/stable/references/generated/imblearn.over_sampling.SMOTE.html"},{"c":"imblearn.over_sampling.ADASYN","u":"https://imbalanced-learn.org/stable/references/generated/imblearn.over_sampling.ADASYN.html"},{"c":"imblearn.over_sampling.RandomOverSampler","u":"https://imbalanced-learn.org/stable/references/generated/imblearn.over_sampling.RandomOverSampler.html"}],"rel":["desbalanceo-de-clases","submuestreo-y-ponderacion-de-clases","fuga-de-datos","data-augmentation"]},{"id":"submuestreo-y-ponderacion-de-clases","name":"Submuestreo y ponderación de clases","en":"undersampling & class weighting","frase":"Equilibrar las clases quitando ejemplos de la mayoritaria o dando más peso a los errores en la minoritaria.","desc":"El submuestreo elimina ejemplos de la clase mayoritaria, al azar o de forma informada, por ejemplo los pegados a la frontera entre clases (enlaces de Tomek). Es rápido, pero descarta información. La ponderación de clases no toca los datos: multiplica la pérdida de cada ejemplo por un peso, mayor en la clase rara, y la mayoría de modelos la admiten directamente.","cuando":"Ponderar, como primera opción ante clases desbalanceadas; submuestrear, cuando además sobran datos de la clase mayoritaria.","ej":"Con pesos balanceados, si el fraude es 500 veces menos frecuente, fallar un fraude cuesta en la pérdida lo mismo que fallar 500 transacciones legítimas.","hp":[["sampling_strategy","proporción final entre clases tras submuestrear"],["class_weight","pesos por clase; \"balanced\" los hace inversamente proporcionales a su frecuencia"]],"py":[{"c":"imblearn.under_sampling.RandomUnderSampler","u":"https://imbalanced-learn.org/stable/references/generated/imblearn.under_sampling.RandomUnderSampler.html"},{"c":"imblearn.under_sampling.TomekLinks","u":"https://imbalanced-learn.org/stable/references/generated/imblearn.under_sampling.TomekLinks.html"},{"c":"sklearn.utils.class_weight.compute_class_weight","u":"https://scikit-learn.org/stable/modules/generated/sklearn.utils.class_weight.compute_class_weight.html"}],"rel":["desbalanceo-de-clases","sobremuestreo","funciones-de-perdida","umbral-de-decision"]}]},{"id":"fuga-de-datos","name":"Fuga de datos (data leakage)","en":"data leakage","frase":"Cuando el modelo usa al entrenar información que no tendrá al predecir.","desc":"Produce resultados de validación excelentes que se desploman en producción. Las fugas típicas son variables que contienen la respuesta o solo se conocen después, escalar o imputar con estadísticas de todo el dataset antes de dividirlo, ejemplos del mismo paciente o cliente repartidos entre entrenamiento y test, y usar datos del futuro en series temporales. Se previene con pipelines y particiones bien diseñadas.","ej":"Un modelo que predice si un paciente tiene neumonía usa la variable \"recibió antibiótico\", que solo se conoce después del diagnóstico.","py":[{"c":"sklearn.pipeline.make_pipeline","u":"https://scikit-learn.org/stable/modules/generated/sklearn.pipeline.make_pipeline.html"},{"c":"sklearn.model_selection.GroupKFold","u":"https://scikit-learn.org/stable/modules/generated/sklearn.model_selection.GroupKFold.html"}],"rel":["pipelines-de-preprocesado","entrenamiento-validacion-y-test","validacion-en-series-temporales","validacion-cruzada"]},{"id":"data-augmentation","name":"Aumento de datos (data augmentation)","en":"data augmentation","frase":"Crear variaciones realistas de los datos de entrenamiento para que el modelo generalice mejor.","desc":"Genera ejemplos nuevos aplicando transformaciones que no cambian la etiqueta: girar, recortar o cambiar el brillo de imágenes, añadir ruido a audios o parafrasear textos. Actúa como regularización y enseña al modelo invariancias útiles. Las transformaciones deben ser realistas para el problema: voltear horizontalmente una imagen no sirve si se trata de reconocer letras.","cuando":"Con pocos datos, sobre todo en imágenes, audio y texto, o cuando quieres robustez frente a variaciones conocidas.","ej":"Para clasificar fotos de hojas enfermas tomadas con el móvil, aplicar giros, recortes y cambios de luz multiplica la variedad de cada foto.","hp":[["factor","en las capas de aumento de Keras, intensidad máxima de la transformación (rotación, zoom, contraste)"],["scale","en un recorte aleatorio, fracción del área de la imagen que se conserva"]],"py":[{"c":"keras.layers.RandomFlip","u":"https://keras.io/api/layers/preprocessing_layers/image_augmentation/random_flip/"},{"c":"keras.layers.RandomRotation","u":"https://keras.io/api/layers/preprocessing_layers/image_augmentation/random_rotation/"},{"c":"torchvision.transforms.v2.RandomResizedCrop","u":"https://docs.pytorch.org/vision/stable/generated/torchvision.transforms.v2.RandomResizedCrop.html"}],"rel":["regularizacion-en-redes","sobremuestreo","equivarianza-e-invarianza","datos-sinteticos"]},{"id":"pipelines-de-preprocesado","name":"Pipelines de preprocesado","en":"preprocessing pipelines","frase":"Encadenar preprocesado y modelo en un único objeto que se ajusta y se aplica de una vez.","desc":"Un pipeline agrupa todos los pasos, como imputar, escalar, codificar y modelar, y garantiza que cada transformación se ajusta solo con los datos de entrenamiento de cada partición. Así se evitan fugas en la validación cruzada, se pueden ajustar a la vez los hiperparámetros del preprocesado y del modelo, y se despliega un único objeto. ColumnTransformer aplica pasos distintos a las columnas numéricas y a las categóricas.","cuando":"Siempre que haya preprocesado antes del modelo, en particular al validar o al desplegar.","ej":"Un pipeline que imputa y escala las columnas numéricas, aplica one-hot a las categóricas y termina en un gradient boosting, guardado como un único archivo.","py":[{"c":"sklearn.pipeline.Pipeline","u":"https://scikit-learn.org/stable/modules/generated/sklearn.pipeline.Pipeline.html"},{"c":"sklearn.compose.ColumnTransformer","u":"https://scikit-learn.org/stable/modules/generated/sklearn.compose.ColumnTransformer.html"}],"rel":["fuga-de-datos","validacion-cruzada","despliegue-e-inferencia","codificacion-de-variables-categoricas"]}]},{"id":"particion-y-validacion","name":"Partición y validación","en":"data splitting & validation","frase":"Separar los datos para medir con honestidad cómo funcionará el modelo con casos nuevos.","desc":"Evaluar un modelo con los mismos datos con los que se entrenó da una idea falsamente optimista. Por eso se reservan datos que el modelo no ve: una partición de validación para elegir modelos e hiperparámetros, otra de test para la estimación final, y técnicas como la validación cruzada para aprovechar mejor los datos escasos. La partición debe imitar cómo llegarán los datos en producción.","ej":"Un modelo de crédito que se usará con clientes futuros se valida con los clientes de los últimos meses, no con una muestra aleatoria de todo el histórico.","py":[{"c":"sklearn.model_selection","u":"https://scikit-learn.org/stable/api/sklearn.model_selection.html"}],"rel":["entrenamiento-validacion-y-test","validacion-cruzada","validacion-en-series-temporales","generalizacion"],"children":[{"id":"entrenamiento-validacion-y-test","name":"Entrenamiento, validación y test","en":"train / validation / test split","frase":"Tres particiones: una para aprender, otra para elegir y otra para la nota final.","desc":"Con el conjunto de entrenamiento se ajustan los parámetros; con el de validación se comparan modelos y se ajustan hiperparámetros; el de test se usa una sola vez, al final, para estimar el rendimiento real. Si el test se consulta repetidamente para decidir, deja de ser una estimación honesta. Proporciones típicas son 70/15/15 u 80/10/10, estratificando por clase si hay desbalanceo.","cuando":"En cualquier proyecto con datos suficientes; con pocos datos, la partición de validación se sustituye por validación cruzada.","ej":"Con 10.000 imágenes: 8.000 para entrenar, 1.000 para elegir la arquitectura y 1.000 guardadas para el resultado final.","py":[{"c":"sklearn.model_selection.train_test_split","u":"https://scikit-learn.org/stable/modules/generated/sklearn.model_selection.train_test_split.html"}],"rel":["validacion-cruzada","sobreajuste","fuga-de-datos","early-stopping"]},{"id":"validacion-cruzada","name":"Validación cruzada (k-fold)","en":"cross-validation (k-fold)","frase":"Rotar la partición de validación k veces para estimar el rendimiento de forma más estable.","desc":"Divide los datos en k bloques, entrena k veces dejando cada vez un bloque fuera para validar y promedia los resultados. Aprovecha todos los datos y da una medida de la variabilidad. La versión estratificada mantiene la proporción de clases en cada bloque, y la agrupada mantiene juntos los ejemplos de una misma entidad, como un paciente.","cuando":"Para comparar modelos o ajustar hiperparámetros con datos limitados, cuando una sola partición sería demasiado ruidosa.","ej":"Con 5 bloques, un modelo obtiene un AUC de 0,84 ± 0,02: el promedio es más fiable que el de una única partición y la desviación indica su estabilidad.","hp":[["n_splits","número de bloques (k)"],["shuffle","barajar los datos antes de dividirlos"]],"py":[{"c":"sklearn.model_selection.cross_val_score","u":"https://scikit-learn.org/stable/modules/generated/sklearn.model_selection.cross_val_score.html"},{"c":"sklearn.model_selection.KFold","u":"https://scikit-learn.org/stable/modules/generated/sklearn.model_selection.KFold.html"},{"c":"sklearn.model_selection.StratifiedKFold","u":"https://scikit-learn.org/stable/modules/generated/sklearn.model_selection.StratifiedKFold.html"},{"c":"sklearn.model_selection.GroupKFold","u":"https://scikit-learn.org/stable/modules/generated/sklearn.model_selection.GroupKFold.html"}],"rel":["entrenamiento-validacion-y-test","validacion-en-series-temporales","busqueda-en-rejilla-y-aleatoria","fuga-de-datos"]},{"id":"validacion-en-series-temporales","name":"Validación en series temporales","en":"time series cross-validation (walk-forward)","frase":"Validar siempre con datos posteriores a los de entrenamiento, respetando el orden del tiempo.","desc":"En series temporales, barajar al azar permite entrenar con el futuro y validar con el pasado, lo que infla los resultados. Se usa una validación con origen móvil: se entrena hasta una fecha, se valida en el periodo siguiente y se avanza. Conviene dejar un hueco entre ambos periodos cuando las variables se calculan con ventanas que se solapan.","cuando":"Siempre que los datos tengan orden temporal y el modelo vaya a predecir el futuro.","ej":"Para un modelo de demanda, entrenar con 2022 y validar con enero de 2023; después, entrenar hasta enero y validar con febrero, y así sucesivamente.","hp":[["n_splits","número de cortes temporales"],["max_train_size","limita la ventana de entrenamiento (ventana deslizante)"],["gap","observaciones que se descartan entre entrenamiento y validación"]],"py":[{"c":"sklearn.model_selection.TimeSeriesSplit","u":"https://scikit-learn.org/stable/modules/generated/sklearn.model_selection.TimeSeriesSplit.html"}],"rel":["validacion-cruzada","fuga-de-datos","prediccion-multipaso","deriva-de-datos"]}]},{"id":"metricas-de-evaluacion","name":"Métricas de evaluación","en":"evaluation metrics","frase":"Números que resumen lo bien que funciona un modelo según lo que importa en el problema.","desc":"La métrica traduce el objetivo del negocio o de la investigación en un número con el que comparar modelos. Cada una mide algo distinto: el error medio, el peor caso, cuántos positivos se detectan o con cuánta fiabilidad. Elegir mal la métrica lleva a optimizar algo que no importa, como la accuracy con clases desbalanceadas.","ej":"En un filtro de spam importa no perder correos legítimos (precisión alta); en un cribado de cáncer, no dejar escapar casos (recall alto).","py":[{"c":"sklearn.metrics","u":"https://scikit-learn.org/stable/api/sklearn.metrics.html"}],"rel":["funcion-de-perdida-vs-metrica","metricas-de-regresion","metricas-de-clasificacion","linea-base"],"children":[{"id":"funcion-de-perdida-vs-metrica","name":"Función de pérdida vs métrica","en":"loss function vs metric","frase":"La pérdida guía el entrenamiento; la métrica mide lo que de verdad importa.","desc":"La función de pérdida es lo que el optimizador minimiza, y debe ser diferenciable y bien comportada, como la entropía cruzada. La métrica es lo que se reporta y se usa para decidir, como el F1 o el error en euros, y no necesita ser diferenciable. No tienen por qué coincidir: se puede entrenar con entropía cruzada y elegir el modelo por su recall.","ej":"Un clasificador de fraude se entrena minimizando la entropía cruzada, pero se evalúa por el importe de fraude detectado por cada 100 alertas.","py":[{"c":"model.compile(loss=\"binary_crossentropy\", metrics=[\"auc\"])","s":1}],"rel":["funciones-de-perdida","metricas-de-evaluacion","entropia-cruzada","umbral-de-decision"]},{"id":"metricas-de-regresion","name":"Métricas de regresión","en":"regression metrics","frase":"Miden lo lejos que quedan las predicciones numéricas de los valores reales.","desc":"Las más usadas son el MSE y su raíz (RMSE), que penalizan mucho los errores grandes; el MAE, más robusto y fácil de interpretar; el MAPE, en porcentaje, que falla cuando los valores reales son cercanos a cero; y el R², que compara el modelo con predecir siempre la media. Conviene expresarlas en las unidades del problema.","ej":"Un modelo de precios de vivienda con un MAE de 12.000 € se equivoca, de media, en 12.000 € por vivienda.","py":[{"c":"sklearn.metrics.mean_absolute_percentage_error","u":"https://scikit-learn.org/stable/modules/generated/sklearn.metrics.mean_absolute_percentage_error.html"},{"c":"sklearn.metrics.median_absolute_error","u":"https://scikit-learn.org/stable/modules/generated/sklearn.metrics.median_absolute_error.html"}],"rel":["mse-rmse-y-mae","r2","perdidas-de-regresion","funcion-de-perdida-vs-metrica"],"children":[{"id":"mse-rmse-y-mae","name":"MSE, RMSE y MAE","en":"MSE, RMSE & MAE","frase":"Error cuadrático medio, su raíz y error absoluto medio: las métricas básicas de regresión.","desc":"El MSE promedia los errores al cuadrado, por lo que castiga mucho los errores grandes; su raíz, el RMSE, vuelve a las unidades de la variable. El MAE promedia los errores en valor absoluto: es más robusto a los atípicos y se interpreta directamente como el error típico. Minimizar el MSE lleva a predecir la media condicional; minimizar el MAE, la mediana.","cuando":"RMSE, cuando los errores grandes son especialmente graves; MAE, cuando hay atípicos o se quiere un error fácil de explicar.","ej":"Errores de 1, 1, 1 y 9 °C dan un MAE de 3 °C y un RMSE de 4,6 °C: el RMSE delata el error grande.","py":[{"c":"sklearn.metrics.mean_squared_error","u":"https://scikit-learn.org/stable/modules/generated/sklearn.metrics.mean_squared_error.html"},{"c":"sklearn.metrics.root_mean_squared_error","u":"https://scikit-learn.org/stable/modules/generated/sklearn.metrics.root_mean_squared_error.html"},{"c":"sklearn.metrics.mean_absolute_error","u":"https://scikit-learn.org/stable/modules/generated/sklearn.metrics.mean_absolute_error.html"}],"rel":["metricas-de-regresion","perdidas-de-regresion","r2","outliers"]},{"id":"r2","name":"Coeficiente de determinación (R²)","en":"coefficient of determination (R²)","frase":"Qué fracción de la variabilidad de los datos explica el modelo frente a predecir siempre la media.","desc":"R² = 1 − SSE/SST compara el error del modelo con el de una predicción constante igual a la media. Vale 1 si el ajuste es perfecto y 0 si el modelo no mejora a la media; con datos nuevos puede ser negativo. Un R² alto no garantiza un buen modelo: puede haber sobreajuste, fuga de datos o errores grandes justo en los casos que importan.","ej":"Un R² de 0,75 en un modelo de consumo eléctrico indica que explica el 75 % de la variación del consumo entre hogares.","py":[{"c":"sklearn.metrics.r2_score","u":"https://scikit-learn.org/stable/modules/generated/sklearn.metrics.r2_score.html"}],"rel":["metricas-de-regresion","mse-rmse-y-mae","regresion-lineal","linea-base"]}]},{"id":"metricas-de-clasificacion","name":"Métricas de clasificación","en":"classification metrics","frase":"Miden los aciertos y los distintos tipos de error de un clasificador.","desc":"Parten de la matriz de confusión, que cuenta aciertos y errores por clase. De ella salen la exactitud, la precisión, el recall y el F1, que dependen de un umbral de decisión, y las curvas ROC y precisión-recall, que resumen el rendimiento en todos los umbrales. La elección depende del coste de cada tipo de error y del desbalanceo entre clases.","ej":"En un cribado médico, un falso negativo (un enfermo no detectado) es mucho más grave que un falso positivo, que solo implica una prueba adicional.","py":[{"c":"sklearn.metrics.classification_report","u":"https://scikit-learn.org/stable/modules/generated/sklearn.metrics.classification_report.html"}],"rel":["matriz-de-confusion","precision-y-recall","curva-roc-y-auc","desbalanceo-de-clases"],"children":[{"id":"matriz-de-confusion","name":"Matriz de confusión","en":"confusion matrix","frase":"Tabla que cruza las clases reales con las predichas y muestra cada tipo de acierto y de error.","desc":"En clasificación binaria tiene cuatro casillas: verdaderos positivos, falsos positivos, falsos negativos y verdaderos negativos. Con más clases, muestra qué clases se confunden entre sí. Es el punto de partida de casi todas las métricas de clasificación y la forma más directa de ver dónde se equivoca el modelo.","ej":"Un clasificador de dígitos manuscritos que confunde a menudo el 4 con el 9 lo muestra como una casilla destacada fuera de la diagonal.","py":[{"c":"sklearn.metrics.confusion_matrix","u":"https://scikit-learn.org/stable/modules/generated/sklearn.metrics.confusion_matrix.html"},{"c":"sklearn.metrics.ConfusionMatrixDisplay","u":"https://scikit-learn.org/stable/modules/generated/sklearn.metrics.ConfusionMatrixDisplay.html"}],"rel":["metricas-de-clasificacion","precision-y-recall","accuracy","umbral-de-decision"]},{"id":"accuracy","name":"Exactitud (accuracy) y exactitud balanceada","en":"accuracy & balanced accuracy","frase":"Proporción de predicciones correctas; engañosa cuando las clases están desbalanceadas.","desc":"La exactitud divide los aciertos entre el total de casos. Es intuitiva, pero con clases desbalanceadas premia ignorar la clase rara. La exactitud balanceada promedia el recall de cada clase, de modo que todas cuentan lo mismo y una predicción constante obtiene 1/K (0,5 en un problema binario).","ej":"Si el 95 % de los pacientes están sanos, decir siempre \"sano\" da un 95 % de accuracy, pero solo un 50 % de exactitud balanceada.","py":[{"c":"sklearn.metrics.accuracy_score","u":"https://scikit-learn.org/stable/modules/generated/sklearn.metrics.accuracy_score.html"},{"c":"sklearn.metrics.balanced_accuracy_score","u":"https://scikit-learn.org/stable/modules/generated/sklearn.metrics.balanced_accuracy_score.html"}],"rel":["matriz-de-confusion","desbalanceo-de-clases","precision-y-recall","linea-base"]},{"id":"precision-y-recall","name":"Precisión y recall","en":"precision & recall","frase":"Precisión: cuántas alarmas son ciertas. Recall: cuántos casos reales se detectan.","desc":"La precisión es TP / (TP + FP): de lo que el modelo marca como positivo, qué fracción lo es. El recall, o sensibilidad, es TP / (TP + FN): de los positivos reales, qué fracción encuentra. Suelen estar en tensión: bajar el umbral detecta más casos (más recall) a costa de más falsas alarmas (menos precisión).","cuando":"Precisión, cuando las falsas alarmas son caras; recall, cuando perder un caso positivo es grave.","ej":"Un detector de fraude marca 100 operaciones y 80 son fraude: precisión del 80 %. Si había 200 fraudes en total, su recall es del 40 %.","py":[{"c":"sklearn.metrics.precision_score","u":"https://scikit-learn.org/stable/modules/generated/sklearn.metrics.precision_score.html"},{"c":"sklearn.metrics.recall_score","u":"https://scikit-learn.org/stable/modules/generated/sklearn.metrics.recall_score.html"}],"rel":["f1-score","curva-precision-recall","umbral-de-decision","matriz-de-confusion"]},{"id":"f1-score","name":"F1-score","en":"F1-score","frase":"La media armónica de precisión y recall: solo es alta si ambas lo son.","desc":"F1 = 2·P·R / (P + R). Al ser una media armónica, se hunde si una de las dos es baja, así que resume en un solo número el equilibrio entre ambas. El Fβ generaliza la idea dando β veces más importancia al recall que a la precisión. Depende del umbral de decisión y no tiene en cuenta los verdaderos negativos.","cuando":"Para resumir en un número un problema desbalanceado en el que importan tanto la precisión como el recall.","ej":"Con una precisión de 0,9 y un recall de 0,1, la media aritmética sería 0,5, pero el F1 es solo 0,18.","py":[{"c":"sklearn.metrics.f1_score","u":"https://scikit-learn.org/stable/modules/generated/sklearn.metrics.f1_score.html"},{"c":"sklearn.metrics.fbeta_score","u":"https://scikit-learn.org/stable/modules/generated/sklearn.metrics.fbeta_score.html"}],"rel":["precision-y-recall","promedios-macro-y-micro","curva-precision-recall","umbral-de-decision"]},{"id":"curva-roc-y-auc","name":"Curva ROC y AUC","en":"ROC curve & AUC","frase":"Rendimiento del clasificador en todos los umbrales: tasa de aciertos frente a tasa de falsas alarmas.","desc":"La curva ROC representa la tasa de verdaderos positivos frente a la de falsos positivos al mover el umbral de decisión. El área bajo la curva (AUC) resume el rendimiento en un número entre 0,5 (azar) y 1 (perfecto), y equivale a la probabilidad de que un positivo elegido al azar reciba más puntuación que un negativo elegido al azar. Con clases muy desbalanceadas puede resultar demasiado optimista.","cuando":"Para comparar clasificadores por su capacidad de ordenar los casos, con independencia del umbral, cuando las clases están razonablemente equilibradas.","ej":"Un modelo de riesgo de impago con un AUC de 0,80 ordena correctamente el 80 % de los pares formados por un cliente que impaga y otro que paga.","py":[{"c":"sklearn.metrics.roc_curve","u":"https://scikit-learn.org/stable/modules/generated/sklearn.metrics.roc_curve.html"},{"c":"sklearn.metrics.roc_auc_score","u":"https://scikit-learn.org/stable/modules/generated/sklearn.metrics.roc_auc_score.html"},{"c":"sklearn.metrics.RocCurveDisplay","u":"https://scikit-learn.org/stable/modules/generated/sklearn.metrics.RocCurveDisplay.html"}],"rel":["curva-precision-recall","umbral-de-decision","metricas-de-clasificacion","desbalanceo-de-clases"]},{"id":"curva-precision-recall","name":"Curva precisión-recall","en":"precision-recall curve (average precision)","frase":"Precisión frente a recall en todos los umbrales: la curva útil cuando los positivos son raros.","desc":"Muestra cómo cae la precisión a medida que se exige más recall al bajar el umbral. Su área, la precisión media (AP), tiene como referencia la proporción de positivos y no 0,5, por lo que es mucho más informativa que la ROC cuando la clase positiva es rara. Permite elegir el umbral según el recall mínimo o la precisión que se necesiten.","cuando":"Con clases muy desbalanceadas, cuando lo que importa es la calidad de las detecciones positivas.","ej":"En detección de fraude con un 0,5 % de positivos, un modelo con un AUC ROC de 0,95 puede tener una precisión media de solo 0,30, lo que revela muchas falsas alarmas.","py":[{"c":"sklearn.metrics.precision_recall_curve","u":"https://scikit-learn.org/stable/modules/generated/sklearn.metrics.precision_recall_curve.html"},{"c":"sklearn.metrics.average_precision_score","u":"https://scikit-learn.org/stable/modules/generated/sklearn.metrics.average_precision_score.html"},{"c":"sklearn.metrics.PrecisionRecallDisplay","u":"https://scikit-learn.org/stable/modules/generated/sklearn.metrics.PrecisionRecallDisplay.html"}],"rel":["curva-roc-y-auc","precision-y-recall","desbalanceo-de-clases","umbral-de-decision"]},{"id":"umbral-de-decision","name":"Umbral de decisión","en":"decision threshold","frase":"El corte de probabilidad a partir del cual el modelo decide \"positivo\"; 0,5 rara vez es el óptimo.","desc":"Los clasificadores dan una puntuación o una probabilidad, y el umbral la convierte en decisión. Moverlo cambia el equilibrio entre falsos positivos y falsos negativos sin reentrenar. Se elige con datos de validación según el coste de cada error o un objetivo mínimo, como un recall del 95 %. Si las probabilidades deben interpretarse como tales, conviene calibrarlas.","cuando":"Siempre que los dos tipos de error tengan costes distintos o las clases estén desbalanceadas.","ej":"Si dejar pasar un fraude cuesta 50 veces más que revisar una alerta, con probabilidades bien calibradas el umbral óptimo es 1/51, alrededor de 0,02.","hp":[["scoring","métrica que se maximiza al buscar el umbral"],["thresholds","umbrales candidatos que se prueban"]],"py":[{"c":"sklearn.model_selection.TunedThresholdClassifierCV","u":"https://scikit-learn.org/stable/modules/generated/sklearn.model_selection.TunedThresholdClassifierCV.html"},{"c":"sklearn.model_selection.FixedThresholdClassifier","u":"https://scikit-learn.org/stable/modules/generated/sklearn.model_selection.FixedThresholdClassifier.html"}],"rel":["precision-y-recall","curva-roc-y-auc","curva-precision-recall","teoria-de-la-decision"]},{"id":"promedios-macro-y-micro","name":"Promedios macro y micro","en":"macro & micro averaging","frase":"Cómo combinar en un solo número una métrica calculada por clase cuando hay varias clases.","desc":"El promedio macro calcula la métrica en cada clase y hace la media simple, así que todas las clases pesan igual, aunque sean raras. El micro suma los aciertos y errores de todas las clases antes de calcular, así que dominan las clases frecuentes. El ponderado hace la media por clase pesando por su número de ejemplos.","cuando":"Macro, cuando las clases minoritarias importan tanto como las frecuentes; micro, cuando importa el rendimiento global por ejemplo.","ej":"Un clasificador de incidencias acierta casi siempre en \"consulta\" (el 90 % de los casos) y falla en \"urgente\": su F1 micro es alto y su F1 macro lo delata.","py":[{"c":"f1_score(y_true, y_pred, average=\"macro\")","s":1}],"rel":["f1-score","clasificacion-multiclase-y-multietiqueta","desbalanceo-de-clases","metricas-de-clasificacion"]}]}]},{"id":"ajuste-de-hiperparametros-y-automl","name":"Ajuste de hiperparámetros y AutoML","en":"hyperparameter tuning & AutoML","frase":"Buscar de forma sistemática la mejor configuración del modelo, o incluso el mejor modelo.","desc":"Los hiperparámetros, como la profundidad de un árbol o el learning rate, no se aprenden de los datos: se eligen comparando configuraciones en validación. Las estrategias van de la búsqueda en rejilla y aleatoria a la optimización bayesiana. AutoML automatiza además la elección del preprocesado y del algoritmo, y NAS, el diseño de la arquitectura de una red.","ej":"Probar 50 combinaciones de profundidad, número de árboles y learning rate de un gradient boosting y quedarse con la de mejor AUC en validación cruzada.","rel":["parametros-e-hiperparametros","busqueda-en-rejilla-y-aleatoria","optimizacion-bayesiana-de-hiperparametros","automl"],"children":[{"id":"busqueda-en-rejilla-y-aleatoria","name":"Búsqueda en rejilla y aleatoria","en":"grid & random search","frase":"Probar todas las combinaciones de una rejilla, o un número fijo de combinaciones al azar.","desc":"La búsqueda en rejilla evalúa todas las combinaciones de unos valores prefijados, y su coste crece exponencialmente con el número de hiperparámetros. La aleatoria muestrea combinaciones de distribuciones definidas y, con el mismo presupuesto, suele encontrar mejores resultados, porque explora más valores de los hiperparámetros que de verdad importan. Ambas evalúan cada combinación con validación cruzada.","cuando":"Rejilla, con pocos hiperparámetros y valores discretos; aleatoria, como opción por defecto con un presupuesto limitado.","ej":"En lugar de probar las 5 × 5 × 5 = 125 combinaciones de una rejilla, probar 30 al azar suele dar un resultado casi igual de bueno.","hp":[["n_iter","en la búsqueda aleatoria, número de combinaciones que se prueban"],["cv","esquema de validación cruzada"],["scoring","métrica que se optimiza"]],"py":[{"c":"sklearn.model_selection.GridSearchCV","u":"https://scikit-learn.org/stable/modules/generated/sklearn.model_selection.GridSearchCV.html"},{"c":"sklearn.model_selection.RandomizedSearchCV","u":"https://scikit-learn.org/stable/modules/generated/sklearn.model_selection.RandomizedSearchCV.html"}],"rel":["optimizacion-bayesiana-de-hiperparametros","validacion-cruzada","parametros-e-hiperparametros","automl"]},{"id":"optimizacion-bayesiana-de-hiperparametros","name":"Optimización bayesiana de hiperparámetros","en":"Bayesian hyperparameter optimization","frase":"Elegir la siguiente configuración que se prueba aprendiendo de los resultados anteriores.","desc":"Construye un modelo sustituto, como un proceso gaussiano o un estimador de Parzen en árbol (TPE), que predice el rendimiento de cada configuración a partir de las ya evaluadas. Una función de adquisición decide dónde probar después, equilibrando explorar zonas inciertas y explotar las prometedoras. Necesita muchas menos evaluaciones que la búsqueda aleatoria cuando cada entrenamiento es caro.","cuando":"Cuando cada entrenamiento es costoso y hay varios hiperparámetros continuos que ajustar.","ej":"Ajustar el learning rate, el dropout y el tamaño de las capas de una red con 40 entrenamientos en lugar de cientos.","hp":[["direction","si la métrica se maximiza o se minimiza"],["sampler","algoritmo que propone la siguiente prueba (TPE, procesos gaussianos…)"],["pruner","corta pronto las pruebas poco prometedoras"]],"py":[{"c":"optuna.create_study","u":"https://optuna.readthedocs.io/en/stable/reference/generated/optuna.create_study.html"},{"c":"optuna.samplers.TPESampler","u":"https://optuna.readthedocs.io/en/stable/reference/samplers/generated/optuna.samplers.TPESampler.html"}],"rel":["busqueda-en-rejilla-y-aleatoria","procesos-gaussianos","exploracion-vs-explotacion","automl"]},{"id":"automl","name":"AutoML","en":"AutoML","frase":"Automatizar la elección del preprocesado, del algoritmo y de sus hiperparámetros.","desc":"Un sistema de AutoML recibe los datos y una métrica y busca por sí solo la mejor combinación de preprocesado, modelo e hiperparámetros dentro de un presupuesto de tiempo, a menudo combinando los mejores modelos en un ensemble. Es útil como punto de partida rápido o como línea base fuerte, pero no sustituye entender los datos ni evitar fugas.","cuando":"Para obtener rápidamente una línea base fuerte en datos tabulares o cuando no hay tiempo de ajustar a mano.","ej":"Darle a una herramienta de AutoML una tabla de clientes y una hora de cómputo, y obtener un ensemble de modelos de gradient boosting ya ajustado.","hp":[["time_budget","tiempo máximo de búsqueda en segundos"],["metric","métrica que se optimiza"]],"py":[{"c":"flaml.AutoML","u":"https://microsoft.github.io/FLAML/docs/reference/automl/automl/"},{"c":"autosklearn.classification.AutoSklearnClassifier","u":"https://automl.github.io/auto-sklearn/master/api.html#autosklearn.classification.AutoSklearnClassifier"}],"rel":["ajuste-de-hiperparametros-y-automl","nas","ensembles","linea-base"]},{"id":"nas","name":"Búsqueda de arquitecturas neuronales (NAS)","en":"neural architecture search (NAS)","frase":"Buscar automáticamente la mejor arquitectura de red neuronal para un problema.","desc":"La búsqueda de arquitecturas neuronales explora un espacio de diseños posibles (número y tipo de capas, conexiones, anchuras) con estrategias como algoritmos evolutivos, aprendizaje por refuerzo, optimización bayesiana o métodos diferenciables. Es muy costosa, pero ha producido arquitecturas eficientes como EfficientNet, cuya red base se obtuvo así.","cuando":"Cuando el cómputo es asumible y la arquitectura óptima no es obvia, o hay restricciones fuertes de latencia o memoria.","ej":"Buscar la red de clasificación de imágenes más precisa que quepa en un móvil y responda en menos de 20 ms.","hp":[["max_trials","número de arquitecturas distintas que se prueban"]],"py":[{"c":"autokeras.ImageClassifier","u":"https://autokeras.com/image_classifier/"}],"rel":["automl","mobilenet-y-efficientnet","optimizacion-bayesiana-de-hiperparametros","arquitecturas-cnn-de-referencia"]}]},{"id":"despliegue-y-mlops","name":"Despliegue y MLOps","en":"deployment & MLOps","frase":"Llevar el modelo a producción y mantenerlo funcionando bien con el paso del tiempo.","desc":"Un modelo solo aporta valor cuando se usa. Esta parte cubre cómo servir predicciones, por lotes o en tiempo real, versionar datos y modelos, automatizar el reentrenamiento y vigilar que el rendimiento no se degrade. MLOps aplica a los modelos las prácticas de la ingeniería de software: automatización, pruebas y monitorización.","ej":"Un modelo de recomendación se reentrena cada noche con los datos del día y solo se publica si supera al anterior en una prueba automática.","rel":["mlops","despliegue-e-inferencia","deriva-de-datos","seguimiento-de-experimentos"],"children":[{"id":"mlops","name":"MLOps","en":"MLOps","frase":"Prácticas y herramientas para entrenar, desplegar y mantener modelos de forma fiable y repetible.","desc":"Extiende DevOps al aprendizaje automático: versiona código, datos y modelos; automatiza el entrenamiento, la evaluación y el despliegue (CI/CD); registra cada modelo con sus métricas; y monitoriza en producción para reentrenar cuando haga falta. Su objetivo es que llevar un modelo a producción y actualizarlo sea rutinario, trazable y reproducible.","cuando":"En cuanto un modelo pasa a producción y hay que actualizarlo, auditarlo o mantener varios a la vez.","ej":"Un registro de modelos guarda cada versión del modelo de riesgo con sus datos de entrenamiento, sus métricas y quién aprobó su paso a producción.","py":[{"c":"mlflow.register_model","u":"https://mlflow.org/docs/latest/api_reference/python_api/mlflow.html#mlflow.register_model"}],"rel":["despliegue-e-inferencia","deriva-de-datos","seguimiento-de-experimentos","reproducibilidad-y-semillas"]},{"id":"despliegue-e-inferencia","name":"Despliegue e inferencia","en":"deployment & inference","frase":"Poner el modelo a disposición de otros sistemas para que haga predicciones reales.","desc":"El modelo se guarda (se serializa) y se sirve por lotes, con predicciones programadas sobre muchos datos, o en tiempo real, normalmente detrás de una API. En tiempo real importan la latencia, el coste y la escalabilidad, y se recurre a formatos optimizados como ONNX, a la cuantización o a hardware específico. Hay que garantizar que el preprocesado en producción sea idéntico al del entrenamiento.","cuando":"Cuando el modelo validado debe empezar a usarse en una aplicación, un proceso o un informe.","ej":"Un modelo de detección de fraude publicado como API que responde en menos de 50 ms a cada pago con tarjeta.","py":[{"c":"joblib.dump","u":"https://joblib.readthedocs.io/en/stable/generated/joblib.dump.html"},{"c":"fastapi.FastAPI","u":"https://fastapi.tiangolo.com/reference/fastapi/"},{"c":"onnxruntime.InferenceSession","u":"https://onnxruntime.ai/docs/api/python/api_summary.html#onnxruntime.InferenceSession"}],"rel":["mlops","pipelines-de-preprocesado","cuantizacion","gpu-y-tpu"]},{"id":"deriva-de-datos","name":"Monitorización y deriva de datos","en":"data drift & concept drift","frase":"Los datos de producción cambian respecto a los de entrenamiento y el modelo se degrada en silencio.","desc":"La deriva de datos (data drift) es un cambio en la distribución de las entradas; la deriva de concepto, un cambio en la relación entre las entradas y la respuesta. Ambas degradan el modelo sin que nada falle de forma visible. Se vigilan comparando distribuciones con tests estadísticos o índices como el PSI y, cuando llegan las etiquetas reales, siguiendo las métricas de rendimiento.","cuando":"En todo modelo en producción, sobre todo en entornos cambiantes como el consumo, el fraude o los mercados.","ej":"Los modelos de demanda entrenados antes de la pandemia fallaron en 2020 porque los hábitos de compra cambiaron de golpe.","py":[{"c":"scipy.stats.ks_2samp","u":"https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.ks_2samp.html"},{"c":"scipy.spatial.distance.jensenshannon","u":"https://docs.scipy.org/doc/scipy/reference/generated/scipy.spatial.distance.jensenshannon.html"}],"rel":["mlops","ood","validacion-en-series-temporales","aprendizaje-online"]}]},{"id":"herramientas-y-hardware","name":"Herramientas y hardware","en":"tools & hardware","frase":"Las librerías y el hardware con los que se construyen y entrenan los modelos en la práctica.","desc":"El ecosistema práctico del ML: frameworks como scikit-learn para modelos clásicos y PyTorch, Keras o JAX para deep learning; plataformas como Hugging Face para compartir modelos y datos; herramientas para registrar experimentos; y hardware acelerado (GPU y TPU), que hace viable entrenar redes grandes.","ej":"Un proyecto típico usa pandas y scikit-learn para la línea base, PyTorch en GPU para la red final y una herramienta de seguimiento para comparar las ejecuciones.","rel":["frameworks-de-ml","gpu-y-tpu","hugging-face","seguimiento-de-experimentos"],"children":[{"id":"gpu-y-tpu","name":"GPU y TPU","en":"GPU & TPU","frase":"Procesadores para cálculo masivamente paralelo que hacen viable entrenar redes grandes.","desc":"Entrenar redes neuronales consiste sobre todo en multiplicar matrices, una operación muy paralelizable. Las GPU, con miles de núcleos, la aceleran decenas de veces respecto a una CPU. Las TPU de Google son chips diseñados específicamente para estas operaciones. La memoria del acelerador suele ser el límite práctico del tamaño del modelo y del lote.","cuando":"Para entrenar o servir redes neuronales medianas o grandes; los modelos clásicos sobre datos tabulares rara vez lo necesitan.","ej":"Ajustar por completo un modelo de lenguaje de 7.000 millones de parámetros exige varias GPU con decenas de GB de memoria; con QLoRA cabe en una sola.","py":[{"c":"torch.cuda.is_available","u":"https://docs.pytorch.org/docs/stable/generated/torch.cuda.is_available.html"},{"c":"jax.devices","u":"https://docs.jax.dev/en/latest/_autosummary/jax.devices.html"}],"rel":["frameworks-de-ml","epoca-y-tamano-de-lote","qlora","despliegue-e-inferencia"]},{"id":"frameworks-de-ml","name":"Frameworks de ML (scikit-learn, Keras/TensorFlow, PyTorch, JAX)","en":"ML frameworks","frase":"Las librerías con las que se construyen los modelos: scikit-learn, Keras, TensorFlow, PyTorch y JAX.","desc":"scikit-learn ofrece modelos clásicos con una interfaz común (fit, predict) y es el estándar para datos tabulares. PyTorch domina la investigación y buena parte de la industria en deep learning. Keras ofrece una interfaz de alto nivel que funciona sobre TensorFlow, PyTorch o JAX. JAX combina una sintaxis similar a NumPy con diferenciación automática y compilación para acelerar el cálculo.","ej":"Una línea base con regresión logística en scikit-learn y, después, una red en PyTorch o Keras para comparar.","rel":["herramientas-y-hardware","diferenciacion-automatica","api-secuencial","hugging-face"]},{"id":"hugging-face","name":"Hugging Face (Hub y librerías)","en":"Hugging Face (Hub & libraries)","frase":"Plataforma y librerías para descargar, usar y compartir modelos y datasets preentrenados.","desc":"El Hub de Hugging Face aloja cientos de miles de modelos y datasets públicos. Sus librerías permiten cargarlos y usarlos en pocas líneas: transformers (modelos de texto, visión y audio), datasets, diffusers (modelos de difusión), peft (ajuste eficiente) y tokenizers, entre otras. Se ha convertido en el punto de partida habitual para trabajar con modelos preentrenados.","cuando":"Para partir de un modelo preentrenado en lugar de entrenar desde cero, o para compartir modelos y datos.","ej":"Clasificar el sentimiento de reseñas de clientes con un modelo preentrenado del Hub en tres líneas de código.","py":[{"c":"transformers.pipeline","u":"https://huggingface.co/docs/transformers/main_classes/pipelines#transformers.pipeline"},{"c":"huggingface_hub.hf_hub_download","u":"https://huggingface.co/docs/huggingface_hub/package_reference/file_download#huggingface_hub.hf_hub_download"},{"c":"datasets.load_dataset","u":"https://huggingface.co/docs/datasets/package_reference/loading_methods#datasets.load_dataset"}],"rel":["transfer-learning","modelos-fundacionales","llms-locales-vs-api","peft"]},{"id":"seguimiento-de-experimentos","name":"Seguimiento de experimentos (TensorBoard, W&B)","en":"experiment tracking","frase":"Registrar parámetros, métricas y artefactos de cada entrenamiento para compararlos y reproducirlos.","desc":"Cada ejecución guarda su configuración, sus curvas de entrenamiento, sus métricas finales y el modelo resultante. Así se pueden comparar decenas de pruebas, saber qué cambio produjo una mejora y reproducir cualquier resultado. TensorBoard, MLflow y Weights & Biases son las herramientas más extendidas.","cuando":"En cuanto se prueban varias configuraciones o modelos, y siempre que se trabaja en equipo.","ej":"Comparar en un panel las curvas de pérdida de 20 entrenamientos con distintos learning rates para elegir el mejor.","py":[{"c":"mlflow.start_run","u":"https://mlflow.org/docs/latest/api_reference/python_api/mlflow.html#mlflow.start_run"},{"c":"wandb.init","u":"https://docs.wandb.ai/ref/python/functions/init"},{"c":"keras.callbacks.TensorBoard","u":"https://keras.io/api/callbacks/tensorboard/"}],"rel":["mlops","curvas-de-aprendizaje","reproducibilidad-y-semillas","callbacks"]}]}]},{"id":"aprendizaje-supervisado","name":"Aprendizaje supervisado","en":"supervised learning","frase":"Aprender a predecir una respuesta conocida a partir de ejemplos etiquetados.","desc":"El modelo aprende, a partir de ejemplos etiquetados (X, y), una función que asigna una salida a cada entrada, y después la aplica para predecir casos nuevos. Si la salida es un número, el problema es de regresión; si es una categoría, de clasificación. Es el paradigma más usado en la industria.","cuando":"Cuando tienes ejemplos históricos con la respuesta correcta y quieres predecirla en casos nuevos.","ej":"Con miles de correos marcados como spam o no spam, entrenar un modelo que filtre los correos nuevos. Con viviendas ya vendidas, predecir el precio de una nueva.","py":[{"c":"modelo.fit(X_train, y_train)","s":1},{"c":"modelo.predict(X_test)","s":1}],"rel":["regresion-vs-clasificacion","aprendizaje-no-supervisado","entrenamiento-validacion-y-test","funcion-de-perdida-vs-metrica"],"children":[{"id":"regresion-vs-clasificacion","name":"Regresión vs clasificación","en":"regression vs classification","frase":"Predecir un número (regresión) o una categoría (clasificación).","desc":"Son los dos tipos de problema supervisado. En regresión la salida es un valor numérico continuo, como un precio o una temperatura. En clasificación es una categoría, como spam/no spam o la especie de una flor. Muchos clasificadores devuelven en realidad una probabilidad por clase, y la etiqueta final sale de aplicar un umbral.","ej":"Predecir el precio de una vivienda es regresión. Predecir si se venderá en menos de un mes es clasificación binaria.","py":[{"c":"sklearn.linear_model.LinearRegression","u":"https://scikit-learn.org/stable/modules/generated/sklearn.linear_model.LinearRegression.html"},{"c":"sklearn.linear_model.LogisticRegression","u":"https://scikit-learn.org/stable/modules/generated/sklearn.linear_model.LogisticRegression.html"}],"rel":["metricas-de-regresion","metricas-de-clasificacion","umbral-de-decision","regresion-logistica"]},{"id":"clasificacion-multiclase-y-multietiqueta","name":"Clasificación multiclase y multietiqueta","en":"multiclass & multilabel classification","frase":"Elegir una clase entre varias, o asignar varias etiquetas a la vez.","desc":"En la clasificación multiclase cada ejemplo pertenece a una sola de K clases, y el modelo suele dar K probabilidades con una softmax. En la multietiqueta un ejemplo puede tener varias etiquetas a la vez, y cada una se predice por separado con una sigmoide. La estrategia One-vs-Rest convierte cualquier clasificador binario en multiclase entrenando un modelo por clase.","cuando":"Cuando hay más de dos clases posibles o cada ejemplo puede tener varias etiquetas simultáneas.","ej":"Reconocer qué dígito del 0 al 9 aparece en una imagen es multiclase. Etiquetar una película como \"comedia\" y \"romántica\" a la vez es multietiqueta.","py":[{"c":"sklearn.multiclass.OneVsRestClassifier","u":"https://scikit-learn.org/stable/modules/generated/sklearn.multiclass.OneVsRestClassifier.html"},{"c":"sklearn.multioutput.MultiOutputClassifier","u":"https://scikit-learn.org/stable/modules/generated/sklearn.multioutput.MultiOutputClassifier.html"}],"rel":["softmax","promedios-macro-y-micro","entropia-cruzada","regresion-logistica"]},{"id":"modelos-lineales","name":"Modelos lineales","en":"linear models","frase":"Predicción como suma ponderada de las variables: simple, rápida e interpretable.","desc":"Modelos cuya predicción es una combinación lineal de las variables, ŷ = w₀ + w₁x₁ + … + wₙxₙ, a veces pasada por una función como la sigmoide. Son rápidos, estables e interpretables, porque cada peso indica el efecto de su variable. Suelen ser la primera línea base que conviene probar.","cuando":"Como primera línea base y cuando necesitas un modelo fácil de explicar con relaciones aproximadamente lineales.","ej":"Estimar el consumo de un coche a partir de su peso y su potencia, y leer directamente cuántos litros añade cada 100 kg.","py":[{"c":"sklearn.linear_model","u":"https://scikit-learn.org/stable/api/sklearn.linear_model.html"}],"rel":["regresion-lineal","regresion-logistica","glm","linea-base"],"children":[{"id":"regresion-lineal","name":"Regresión lineal (mínimos cuadrados)","en":"linear regression (ordinary least squares)","frase":"La recta que mejor se ajusta a los datos minimizando el error al cuadrado.","desc":"Ajusta la recta o el hiperplano que minimiza la suma de los errores al cuadrado entre predicción y valor real. Tiene solución analítica (las ecuaciones normales), aunque también se puede resolver por descenso por gradiente. Supone relación lineal, errores independientes y varianza constante.","cuando":"Para predecir una variable numérica cuando la relación es aproximadamente lineal o necesitas interpretar el efecto de cada variable.","ej":"Predecir el precio de una vivienda como una constante más 2.000 € por m² y 15.000 € por cada habitación.","py":[{"c":"sklearn.linear_model.LinearRegression","u":"https://scikit-learn.org/stable/modules/generated/sklearn.linear_model.LinearRegression.html"},{"c":"statsmodels.api.OLS","u":"https://www.statsmodels.org/stable/generated/statsmodels.regression.linear_model.OLS.html"}],"rel":["mse-rmse-y-mae","ridge-lasso-y-elastic-net","descenso-por-gradiente","regresion-lineal-bayesiana"]},{"id":"regresion-polinomica-e-interacciones","name":"Regresión polinómica e interacciones","en":"polynomial regression & interaction terms","frase":"Añadir potencias y productos de variables para captar curvas e interacciones.","desc":"Extiende el modelo lineal añadiendo como variables nuevas potencias (x², x³) y productos entre variables (x₁·x₂). Sigue siendo lineal en los parámetros, pero capta curvas e interacciones, es decir, efectos de una variable que dependen del valor de otra. Con muchos términos crece el riesgo de sobreajuste.","cuando":"Cuando un modelo lineal se queda corto porque la relación es curva o el efecto de una variable depende de otra.","ej":"La publicidad puede vender más en temporada alta. El término publicidad × temporada recoge esa interacción.","hp":[["degree","grado del polinomio; más grado, más flexibilidad y más riesgo de sobreajuste"],["interaction_only","genera solo productos entre variables, sin potencias"]],"py":[{"c":"sklearn.preprocessing.PolynomialFeatures","u":"https://scikit-learn.org/stable/modules/generated/sklearn.preprocessing.PolynomialFeatures.html"}],"rel":["regresion-lineal","feature-engineering","sobreajuste","gam"]},{"id":"ridge-lasso-y-elastic-net","name":"Ridge, Lasso y Elastic Net","en":"Ridge, Lasso & Elastic Net","frase":"Regresión lineal con penalización de los pesos para evitar el sobreajuste.","desc":"Versiones regularizadas de la regresión lineal que penalizan los pesos grandes para reducir el sobreajuste. Ridge (L2) encoge todos los coeficientes hacia cero. Lasso (L1) lleva algunos exactamente a cero, y con ello selecciona variables. Elastic Net combina ambas penalizaciones. La fuerza de la penalización, α, es un hiperparámetro.","cuando":"Cuando tienes muchas variables, correlacionadas entre sí o con pocos datos; Lasso, además, cuando quieres que el modelo seleccione variables.","ej":"Con 500 variables candidatas y pocos datos, Lasso se queda con las 20 que tienen efecto real y anula el resto.","hp":[["alpha","fuerza de la penalización; más alta, coeficientes más pequeños"],["l1_ratio","en Elastic Net, mezcla de penalizaciones (0 = Ridge, 1 = Lasso)"]],"py":[{"c":"sklearn.linear_model.Ridge","u":"https://scikit-learn.org/stable/modules/generated/sklearn.linear_model.Ridge.html"},{"c":"sklearn.linear_model.Lasso","u":"https://scikit-learn.org/stable/modules/generated/sklearn.linear_model.Lasso.html"},{"c":"sklearn.linear_model.ElasticNet","u":"https://scikit-learn.org/stable/modules/generated/sklearn.linear_model.ElasticNet.html"}],"rel":["regularizacion","regresion-lineal","metodos-integrados","penalizacion-l1-y-l2"]},{"id":"regresion-logistica","name":"Regresión logística","en":"logistic regression","frase":"Modelo lineal que convierte una suma ponderada en la probabilidad de una clase.","desc":"Modelo lineal de clasificación binaria. Calcula una combinación lineal de las variables y la transforma con la sigmoide en una probabilidad entre 0 y 1. Se entrena minimizando la entropía cruzada, lo que equivale a máxima verosimilitud. Sus coeficientes se leen en log-odds, por eso se usa mucho cuando hay que explicar las decisiones.","cuando":"Para clasificación binaria como línea base sólida, sobre todo si necesitas probabilidades fiables y explicar el peso de cada variable.","ej":"Estimar la probabilidad de que un paciente tenga diabetes a partir de su edad, su IMC y su glucosa, y marcarlo como positivo si supera 0,5.","hp":[["C","inversa de la regularización; más pequeño, modelo más simple"],["l1_ratio","tipo de penalización (0 = L2, 1 = L1, valores intermedios = Elastic Net)"],["class_weight","compensa clases desbalanceadas (\"balanced\")"]],"py":[{"c":"sklearn.linear_model.LogisticRegression","u":"https://scikit-learn.org/stable/modules/generated/sklearn.linear_model.LogisticRegression.html"}],"rel":["odds-y-odds-ratio","sigmoide-y-tanh","entropia-cruzada","glm"],"children":[{"id":"odds-y-odds-ratio","name":"Odds y odds ratio","en":"odds & odds ratio","frase":"Por cuánto se multiplican las probabilidades a favor de un suceso al cambiar una variable.","desc":"Las odds son el cociente p/(1−p) entre la probabilidad de que ocurra un suceso y la de que no ocurra. En la regresión logística, cada coeficiente β dice cuánto cambian las log-odds por cada unidad de su variable. e^β es el odds ratio, el factor por el que se multiplican las odds; un odds ratio de 2 significa que se duplican.","cuando":"Para interpretar y comunicar el efecto de cada variable en una regresión logística.","ej":"Si fumar tiene un odds ratio de 3 en un modelo de enfermedad cardíaca, las odds de un fumador triplican las de un no fumador con el resto de variables iguales.","py":[{"c":"np.exp(modelo.coef_)","s":1}],"rel":["regresion-logistica","modelos-interpretables-por-diseno","intervalo-de-confianza"]}]},{"id":"glm","name":"Modelos lineales generalizados (GLM)","en":"generalized linear models","frase":"Regresión lineal generalizada a conteos, proporciones o cantidades positivas mediante una función de enlace.","desc":"Generalizan la regresión lineal a respuestas que no siguen una normal. Conectan una combinación lineal de las variables con la media de la respuesta mediante una función de enlace, y suponen una distribución de la familia exponencial. La regresión lineal (enlace identidad, normal) y la logística (logit, binomial) son casos particulares; la de Poisson modela conteos.","cuando":"Cuando la variable a predecir no es normal: conteos (Poisson), sí/no (binomial) o cantidades positivas y asimétricas (gamma).","ej":"Predecir cuántos siniestros tendrá un conductor en un año con una regresión de Poisson y enlace logarítmico.","hp":[["alpha","fuerza de la regularización en los modelos de scikit-learn"],["family","distribución de la respuesta y su enlace en statsmodels (Poisson, Binomial, Gamma)"]],"py":[{"c":"sklearn.linear_model.PoissonRegressor","u":"https://scikit-learn.org/stable/modules/generated/sklearn.linear_model.PoissonRegressor.html"},{"c":"statsmodels.api.GLM","u":"https://www.statsmodels.org/stable/generated/statsmodels.genmod.generalized_linear_model.GLM.html"}],"rel":["regresion-lineal","regresion-logistica","glmm","gam"]},{"id":"glmm","name":"Modelos mixtos (GLMM)","en":"(generalized) linear mixed models","frase":"Modelos lineales con efectos aleatorios para datos agrupados o medidas repetidas.","desc":"Modelos lineales (o generalizados) que añaden efectos aleatorios para datos agrupados, jerárquicos o con medidas repetidas. Los efectos fijos son comunes a todos los datos, mientras que los aleatorios dejan que cada grupo (un paciente, un colegio, una tienda) tenga su propia desviación. Así se recoge la correlación entre observaciones del mismo grupo.","cuando":"Cuando las observaciones vienen en grupos (pacientes, colegios, tiendas) que comparten características dentro de cada grupo.","ej":"Analizar las notas de alumnos de muchos colegios dejando que cada colegio tenga su propio nivel de partida (intercepto aleatorio).","hp":[["groups","variable que define los grupos"],["re_formula","qué efectos varían de un grupo a otro (por defecto, solo el intercepto)"]],"py":[{"c":"statsmodels.formula.api.mixedlm","u":"https://www.statsmodels.org/stable/generated/statsmodels.formula.api.mixedlm.html"},{"c":"statsmodels.genmod.bayes_mixed_glm.BinomialBayesMixedGLM","u":"https://www.statsmodels.org/stable/generated/statsmodels.genmod.bayes_mixed_glm.BinomialBayesMixedGLM.html"}],"rel":["glm","regresion-lineal-bayesiana","modelos-interpretables-por-diseno"]},{"id":"gam","name":"Modelos aditivos generalizados (GAM)","en":"generalized additive models","frase":"Suma de curvas suaves, una por variable: no lineal pero interpretable.","desc":"Sustituyen cada término lineal βⱼxⱼ por una función suave fⱼ(xⱼ), normalmente un spline, y suman los efectos: g(E[y]) = β₀ + f₁(x₁) + … + fₙ(xₙ). Captan relaciones no lineales sin perder interpretabilidad, porque el efecto de cada variable se puede dibujar por separado.","cuando":"Cuando las relaciones no son lineales pero necesitas ver y explicar el efecto de cada variable por separado.","ej":"Modelar el riesgo de hospitalización según la edad con una curva en U, más alta en niños y ancianos, algo que una recta no puede captar.","hp":[["n_splines","número de tramos de cada curva; más tramos, curvas más flexibles"],["lam","penalización de la rugosidad; más alta, curvas más suaves"]],"py":[{"c":"pygam.LinearGAM","u":"https://github.com/dswah/pyGAM"},{"c":"interpret.glassbox.ExplainableBoostingClassifier","u":"https://interpret.ml/docs/ebm.html"}],"rel":["glm","ebm","regresion-polinomica-e-interacciones"]}]},{"id":"knn","name":"k vecinos más cercanos (k-NN)","en":"k-nearest neighbors","frase":"Predice copiando a los k ejemplos más parecidos.","desc":"Para predecir un caso nuevo, busca los k ejemplos de entrenamiento más cercanos según una distancia. Después vota su clase (clasificación
