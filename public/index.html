casos arrastren todo el modelo.","hp":[["delta","en Huber, error a partir del cual la penalización pasa de cuadrática a lineal"]],"py":[{"c":"keras.losses.MeanSquaredError","u":"https://keras.io/api/losses/regression_losses/#meansquarederror-class"},{"c":"keras.losses.MeanAbsoluteError","u":"https://keras.io/api/losses/regression_losses/#meanabsoluteerror-class"},{"c":"keras.losses.Huber","u":"https://keras.io/api/losses/regression_losses/#huber-class"},{"c":"torch.nn.HuberLoss","u":"https://docs.pytorch.org/docs/stable/generated/torch.nn.HuberLoss.html"}],"rel":["mse-rmse-y-mae","funciones-de-perdida","outliers","maxima-verosimilitud"]},{"id":"entropia-cruzada","name":"Entropía cruzada (binaria y categórica)","en":"cross-entropy (binary & categorical)","frase":"La pérdida estándar de clasificación: penaliza asignar poca probabilidad a la clase correcta.","desc":"Mide −log de la probabilidad que el modelo asigna a la clase verdadera, promediada sobre los ejemplos. La versión binaria acompaña a una salida sigmoide y la categórica, a una softmax; la variante \"sparse\" recibe la clase como un entero en lugar de en one-hot. Es la NLL de una distribución categórica, y por estabilidad numérica conviene pasarle los logits en lugar de las probabilidades.","ej":"Si el modelo asigna un 0,9 a la clase correcta, la pérdida de ese ejemplo es 0,105; si le asigna un 0,1, es 2,3.","hp":[["label_smoothing","reparte una pequeña parte de la probabilidad entre las clases incorrectas para evitar el exceso de confianza"]],"py":[{"c":"keras.losses.BinaryCrossentropy","u":"https://keras.io/api/losses/probabilistic_losses/#binarycrossentropy-class"},{"c":"keras.losses.SparseCategoricalCrossentropy","u":"https://keras.io/api/losses/probabilistic_losses/#sparsecategoricalcrossentropy-class"},{"c":"torch.nn.CrossEntropyLoss","u":"https://docs.pytorch.org/docs/stable/generated/torch.nn.CrossEntropyLoss.html"},{"c":"torch.nn.BCEWithLogitsLoss","u":"https://docs.pytorch.org/docs/stable/generated/torch.nn.BCEWithLogitsLoss.html"}],"rel":["nll","softmax","divergencia-de-kullback-leibler","funciones-de-perdida"]},{"id":"perdidas-perceptuales","name":"Pérdidas perceptuales","en":"perceptual losses","frase":"Comparan imágenes por sus características visuales en una red preentrenada, no píxel a píxel.","desc":"Dos imágenes desplazadas un píxel tienen un error cuadrático grande aunque parezcan idénticas. Las pérdidas perceptuales comparan las activaciones que ambas imágenes producen en una red preentrenada, como VGG, que capturan bordes, texturas y formas. Se usan en superresolución, transferencia de estilo y modelos generativos para obtener resultados más nítidos y naturales. LPIPS es una medida de este tipo calibrada con juicios humanos.","cuando":"Para entrenar o evaluar modelos que generan imágenes cuando importa la calidad visual percibida más que el error por píxel.","ej":"Un modelo de superresolución entrenado con MSE produce caras borrosas; con una pérdida perceptual recupera la textura de la piel y del pelo.","py":[{"c":"lpips.LPIPS","u":"https://github.com/richzhang/PerceptualSimilarity"},{"c":"keras.applications.VGG19","u":"https://keras.io/api/applications/vgg/vgg_models/#vgg19-function"}],"rel":["transferencia-de-estilo-neuronal","srgan","metricas-perceptuales","superresolucion-inpainting-y-colorizacion"]}]},{"id":"optimizacion","name":"Optimización","en":"optimization","frase":"Cómo se ajustan los pesos de la red, paso a paso, para reducir la pérdida.","desc":"Entrenar una red es resolver un problema de optimización: encontrar los pesos que minimizan la pérdida. La retropropagación calcula el gradiente, que indica cómo cambia la pérdida al mover cada peso, y un optimizador da pasos en la dirección que la reduce. Detalles como el learning rate, el tamaño de lote, el momentum o la inicialización deciden si el entrenamiento converge, a qué velocidad y a qué solución.","ej":"Entrenar una CNN con Adam y un learning rate de 0,001 que se reduce cuando la pérdida de validación se estanca.","rel":["descenso-por-gradiente","backpropagation","adam-y-adamw","learning-rate"],"children":[{"id":"descenso-por-gradiente","name":"Descenso por gradiente","en":"gradient descent","frase":"Bajar por la superficie de la pérdida dando pasos en la dirección de máxima pendiente descendente.","desc":"En cada paso actualiza los pesos con w ← w − η·∇L(w), donde ∇L es el gradiente de la pérdida y η, el learning rate. Si el paso es pequeño, avanza despacio; si es grande, oscila o diverge. En las redes neuronales la superficie de la pérdida no es convexa, pero en la práctica el descenso por gradiente encuentra soluciones que generalizan bien.","ej":"Es como bajar una montaña con niebla: en cada paso miras la pendiente bajo tus pies y avanzas cuesta abajo.","py":[{"c":"keras.optimizers.SGD","u":"https://keras.io/api/optimizers/sgd/"},{"c":"torch.optim.SGD","u":"https://docs.pytorch.org/docs/stable/generated/torch.optim.SGD.html"}],"rel":["learning-rate","batch-mini-batch-y-sgd","backpropagation","momentum"]},{"id":"backpropagation","name":"Retropropagación (backpropagation)","en":"backpropagation","frase":"Calcula de forma eficiente cuánto contribuye cada peso al error, propagándolo de la salida hacia atrás.","desc":"Aplica la regla de la cadena capa a capa, desde la pérdida hasta la entrada, reutilizando los cálculos intermedios. Con un pase hacia delante y otro hacia atrás obtiene el gradiente de la pérdida respecto a todos los pesos, con un coste similar al de hacer la propia predicción. Es el algoritmo que hizo práctico entrenar redes con muchas capas.","ej":"Si una red clasifica mal la foto de un gato, la retropropagación indica a cada uno de sus millones de pesos cuánto y en qué sentido debe cambiar.","py":[{"c":"torch.Tensor.backward","u":"https://docs.pytorch.org/docs/stable/generated/torch.Tensor.backward.html"}],"rel":["diferenciacion-automatica","descenso-por-gradiente","desvanecimiento-y-explosion-del-gradiente","bptt"]},{"id":"diferenciacion-automatica","name":"Diferenciación automática","en":"automatic differentiation","frase":"El framework calcula las derivadas exactas de cualquier cálculo que escribas, sin derivar a mano.","desc":"Los frameworks registran las operaciones que se aplican a los tensores y, recorriendo ese grafo de cálculo con la regla de la cadena, obtienen derivadas exactas, no aproximaciones numéricas. El modo inverso, que es la retropropagación, es eficiente cuando hay muchos parámetros y una sola salida, como la pérdida. Permite entrenar cualquier arquitectura diferenciable sin escribir los gradientes.","cuando":"Siempre que se entrena un modelo diferenciable o se necesita el gradiente de una función compleja.","ej":"Definir una pérdida nueva que combina tres términos y obtener sus gradientes automáticamente en una línea.","py":[{"c":"torch.autograd.grad","u":"https://docs.pytorch.org/docs/stable/generated/torch.autograd.grad.html"},{"c":"jax.grad","u":"https://docs.jax.dev/en/latest/_autosummary/jax.grad.html"}],"rel":["backpropagation","frameworks-de-ml","capas-y-perdidas-personalizadas","descenso-por-gradiente"]},{"id":"batch-mini-batch-y-sgd","name":"Batch, mini-batch y SGD","en":"batch, mini-batch & SGD","frase":"Calcular el gradiente con todos los datos, con un subconjunto o con un solo ejemplo en cada paso.","desc":"El descenso por lotes (batch) usa todo el conjunto en cada paso: es preciso pero lento. El estocástico (SGD) usa un solo ejemplo: es rápido pero muy ruidoso. El mini-batch, con lotes de decenas o cientos de ejemplos, es el estándar: aprovecha la GPU y su ruido moderado ayuda a escapar de malos mínimos. En la práctica, \"SGD\" suele referirse a esta última variante.","cuando":"Mini-batch, siempre para redes neuronales; el lote completo, solo con datasets pequeños y métodos que lo necesitan, como L-BFGS.","ej":"Con un millón de imágenes y lotes de 256, cada época tiene unos 3.900 pasos de actualización.","hp":[["batch_size","número de ejemplos por lote"],["shuffle","barajar los datos en cada época"]],"py":[{"c":"torch.utils.data.DataLoader","u":"https://docs.pytorch.org/docs/stable/data.html#torch.utils.data.DataLoader"},{"c":"keras.Model.fit","u":"https://keras.io/api/models/model_training_apis/#fit-method"}],"rel":["epoca-y-tamano-de-lote","descenso-por-gradiente","learning-rate","gpu-y-tpu"]},{"id":"epoca-y-tamano-de-lote","name":"Época y tamaño de lote","en":"epoch & batch size","frase":"Época: una pasada completa por los datos. Lote: cuántos ejemplos se usan en cada actualización.","desc":"El entrenamiento recorre los datos varias veces (épocas), divididos en lotes, y cada lote produce una actualización de los pesos. Los lotes grandes aprovechan mejor el hardware y dan gradientes más estables, pero necesitan más memoria y a veces generalizan algo peor; si se aumenta el lote, suele convenir subir también el learning rate. El número de épocas se controla con early stopping.","ej":"Entrenar 30 épocas con lotes de 64 imágenes; la pérdida de validación deja de mejorar en la época 18.","hp":[["epochs","número de pasadas completas por los datos"],["batch_size","ejemplos por actualización"]],"py":[{"c":"keras.Model.fit","u":"https://keras.io/api/models/model_training_apis/#fit-method"}],"rel":["batch-mini-batch-y-sgd","early-stopping","learning-rate","curvas-de-aprendizaje"]},{"id":"learning-rate","name":"Tasa de aprendizaje (learning rate)","en":"learning rate","frase":"El tamaño de cada paso del optimizador: el hiperparámetro más importante del entrenamiento.","desc":"Multiplica el gradiente en cada actualización. Si es demasiado alto, la pérdida oscila o se dispara; si es demasiado bajo, el entrenamiento avanza muy despacio o se queda atascado. Su valor óptimo depende del optimizador, del tamaño de lote y de la arquitectura, y suele buscarse en escala logarítmica, por ejemplo entre 10⁻⁵ y 10⁻¹. Casi siempre conviene variarlo durante el entrenamiento.","cuando":"Es lo primero que hay que ajustar al entrenar una red y lo primero que hay que revisar si la pérdida no baja o se dispara.","ej":"Con Adam, 0,001 suele funcionar como punto de partida; para ajustar un modelo preentrenado se usan valores entre 10 y 100 veces menores.","hp":[["learning_rate / lr","tamaño del paso (Keras / PyTorch)"]],"py":[{"c":"keras.optimizers.Adam","u":"https://keras.io/api/optimizers/adam/"},{"c":"torch.optim.Adam","u":"https://docs.pytorch.org/docs/stable/generated/torch.optim.Adam.html"}],"rel":["lr-schedulers","adam-y-adamw","descenso-por-gradiente","learning-rates-discriminativos"]},{"id":"lr-schedulers","name":"Programación de la tasa de aprendizaje","en":"learning rate schedules","frase":"Variar el learning rate durante el entrenamiento: subirlo con cuidado al principio y bajarlo para afinar.","desc":"Un programador ajusta el learning rate según avanzan los pasos o las épocas. Los más usados son el decaimiento por escalones o exponencial; el coseno, que lo baja suavemente hasta casi cero; el calentamiento (warm-up), que lo sube poco a poco al principio para estabilizar redes grandes; y la reducción cuando la pérdida de validación se estanca. Suelen mejorar tanto la velocidad como el resultado final.","cuando":"Casi siempre en redes profundas; el calentamiento, en transformers y en entrenamientos con lotes grandes.","ej":"Calentar durante las primeras 1.000 iteraciones hasta 3·10⁻⁴ y después bajar con un coseno hasta cero al final del entrenamiento.","hp":[["patience","en la reducción por meseta, épocas sin mejora antes de bajar el learning rate"],["factor","por cuánto se multiplica el learning rate al reducirlo"],["T_max","en el coseno de PyTorch, pasos hasta llegar al mínimo"]],"py":[{"c":"keras.optimizers.schedules.CosineDecay","u":"https://keras.io/api/optimizers/learning_rate_schedules/cosine_decay/"},{"c":"keras.callbacks.ReduceLROnPlateau","u":"https://keras.io/api/callbacks/reduce_lr_on_plateau/"},{"c":"torch.optim.lr_scheduler.CosineAnnealingLR","u":"https://docs.pytorch.org/docs/stable/generated/torch.optim.lr_scheduler.CosineAnnealingLR.html"},{"c":"torch.optim.lr_scheduler.OneCycleLR","u":"https://docs.pytorch.org/docs/stable/generated/torch.optim.lr_scheduler.OneCycleLR.html"}],"rel":["learning-rate","adam-y-adamw","callbacks","receta-de-entrenamiento"]},{"id":"momentum","name":"Momentum","en":"momentum","frase":"Acumula la dirección de los pasos anteriores para avanzar más rápido y oscilar menos.","desc":"En lugar de seguir solo el gradiente actual, mantiene una media móvil de los gradientes pasados, como una bola que coge inercia al rodar cuesta abajo. Acelera el avance en las direcciones consistentes y amortigua las oscilaciones en las que cambian de signo. El momentum de Nesterov evalúa el gradiente en la posición a la que apunta la inercia, lo que lo hace algo más preciso.","cuando":"Al usar SGD, prácticamente siempre; Adam ya incorpora una forma de momentum.","ej":"En un valle estrecho y alargado, SGD zigzaguea de pared a pared; con un momentum de 0,9 avanza casi en línea recta hacia el fondo.","hp":[["momentum","fracción de la velocidad anterior que se conserva, típicamente 0,9"],["nesterov","activa el momentum de Nesterov"]],"py":[{"c":"keras.optimizers.SGD","u":"https://keras.io/api/optimizers/sgd/"},{"c":"torch.optim.SGD","u":"https://docs.pytorch.org/docs/stable/generated/torch.optim.SGD.html"}],"rel":["descenso-por-gradiente","adam-y-adamw","rmsprop-y-adagrad","learning-rate"]},{"id":"rmsprop-y-adagrad","name":"RMSprop y Adagrad","en":"RMSprop & Adagrad","frase":"Optimizadores que adaptan el learning rate de cada peso según el tamaño de sus gradientes pasados.","desc":"Adagrad divide el paso de cada parámetro por la raíz de la suma de sus gradientes al cuadrado: los parámetros con gradientes grandes o frecuentes avanzan menos, y los raros, más, lo que funciona bien con datos dispersos. Su problema es que el paso decrece sin parar. RMSprop lo corrige usando una media móvil de los gradientes al cuadrado en lugar de la suma, y es la base de Adam.","cuando":"Adagrad, con variables dispersas como texto o recomendación; RMSprop, en redes recurrentes o como alternativa a Adam.","ej":"En un modelo con embeddings de palabras, Adagrad da pasos grandes a las palabras raras, que reciben pocas actualizaciones.","hp":[["learning_rate / lr","tamaño de paso base (Keras / PyTorch)"],["rho / alpha","en RMSprop, factor de olvido de la media móvil (Keras / PyTorch)"]],"py":[{"c":"keras.optimizers.RMSprop","u":"https://keras.io/api/optimizers/rmsprop/"},{"c":"keras.optimizers.Adagrad","u":"https://keras.io/api/optimizers/adagrad/"},{"c":"torch.optim.RMSprop","u":"https://docs.pytorch.org/docs/stable/generated/torch.optim.RMSprop.html"},{"c":"torch.optim.Adagrad","u":"https://docs.pytorch.org/docs/stable/generated/torch.optim.Adagrad.html"}],"rel":["adam-y-adamw","momentum","learning-rate","word-embeddings"]},{"id":"adam-y-adamw","name":"Adam y AdamW","en":"Adam & AdamW","frase":"El optimizador por defecto: combina momentum con un learning rate adaptado a cada peso.","desc":"Adam mantiene dos medias móviles por parámetro: la del gradiente (momentum) y la de su cuadrado (como RMSprop), con una corrección del sesgo inicial. Funciona bien con poco ajuste en casi cualquier arquitectura. AdamW separa el weight decay del gradiente y lo aplica directamente a los pesos, lo que regulariza mejor; es el estándar para entrenar transformers.","cuando":"Como optimizador por defecto en deep learning; AdamW, cuando además se quiere regularizar con weight decay.","ej":"Ajustar un modelo de lenguaje con AdamW, un learning rate de 2·10⁻⁵ y un weight decay de 0,01.","hp":[["learning_rate / lr","tamaño de paso (Keras / PyTorch)"],["beta_1 / betas","tasas de olvido de las medias móviles (Keras / PyTorch)"],["weight_decay","fuerza del decaimiento de pesos en AdamW"]],"py":[{"c":"keras.optimizers.Adam","u":"https://keras.io/api/optimizers/adam/"},{"c":"keras.optimizers.AdamW","u":"https://keras.io/api/optimizers/adamw/"},{"c":"torch.optim.Adam","u":"https://docs.pytorch.org/docs/stable/generated/torch.optim.Adam.html"},{"c":"torch.optim.AdamW","u":"https://docs.pytorch.org/docs/stable/generated/torch.optim.AdamW.html"}],"rel":["momentum","rmsprop-y-adagrad","penalizacion-l1-y-l2","learning-rate"]},{"id":"metodos-de-segundo-orden","name":"Métodos de segundo orden (Newton)","en":"second-order methods (Newton, L-BFGS)","frase":"Usan también la curvatura de la pérdida para dar pasos mejor dirigidos, a un coste mucho mayor.","desc":"El método de Newton usa la matriz hessiana de segundas derivadas para saltar directamente al mínimo de una aproximación cuadrática. Converge en muy pocas iteraciones, pero con millones de parámetros calcular e invertir la hessiana es inviable. Los métodos cuasi-Newton, como L-BFGS, la aproximan con los gradientes recientes y se usan en modelos pequeños, en optimización clásica y en ajustes deterministas con el lote completo.","cuando":"Con pocos parámetros (miles, no millones) y gradientes de lote completo, como en regresión logística o en el ajuste de modelos estadísticos.","ej":"La regresión logística de scikit-learn usa por defecto L-BFGS y converge en unas decenas de iteraciones.","py":[{"c":"torch.optim.LBFGS","u":"https://docs.pytorch.org/docs/stable/generated/torch.optim.LBFGS.html"},{"c":"scipy.optimize.minimize","u":"https://docs.scipy.org/doc/scipy/reference/generated/scipy.optimize.minimize.html"}],"rel":["descenso-por-gradiente","optimizacion","regresion-logistica","adam-y-adamw"]},{"id":"inicializacion-de-pesos","name":"Inicialización de pesos","en":"weight initialization (Glorot/Xavier, He)","frase":"Elegir los valores iniciales de los pesos para que la señal no se apague ni explote al atravesar la red.","desc":"Si los pesos empiezan demasiado pequeños, las activaciones y los gradientes se desvanecen capa a capa; si son demasiado grandes, explotan. Las inicializaciones de Glorot (Xavier) y de He fijan la varianza de los pesos según el número de entradas y salidas de cada capa para mantener estable la señal: Glorot, pensada para tanh y sigmoide; He, para ReLU. Inicializar todos los pesos igual impide que las neuronas aprendan cosas distintas.","ej":"Una red profunda con ReLU e inicialización He empieza a aprender desde la primera época; con pesos aleatorios demasiado pequeños, apenas se mueve.","py":[{"c":"keras.initializers.HeNormal","u":"https://keras.io/api/layers/initializers/#henormal-class"},{"c":"keras.initializers.GlorotUniform","u":"https://keras.io/api/layers/initializers/#glorotuniform-class"},{"c":"torch.nn.init.kaiming_normal_","u":"https://docs.pytorch.org/docs/stable/nn.init.html#torch.nn.init.kaiming_normal_"},{"c":"torch.nn.init.xavier_uniform_","u":"https://docs.pytorch.org/docs/stable/nn.init.html#torch.nn.init.xavier_uniform_"}],"rel":["desvanecimiento-y-explosion-del-gradiente","relu-y-variantes","capas-de-normalizacion","receta-de-entrenamiento"]},{"id":"desvanecimiento-y-explosion-del-gradiente","name":"Desvanecimiento y explosión del gradiente","en":"vanishing & exploding gradients","frase":"En redes profundas, el gradiente puede hacerse diminuto o enorme al propagarse hacia atrás por las capas.","desc":"La retropropagación multiplica derivadas capa a capa. Si esos factores son menores que 1, el gradiente se desvanece y las primeras capas apenas aprenden; si son mayores, explota y el entrenamiento diverge. Es especialmente grave en redes muy profundas y en las recurrentes. Las soluciones son activaciones como ReLU, una buena inicialización, capas de normalización, conexiones residuales, LSTM o GRU en secuencias y el recorte del gradiente.","cuando":"El recorte del gradiente, al entrenar redes recurrentes o transformers grandes, o cuando la pérdida se dispara de repente.","ej":"Una RNN simple no aprende dependencias de más de unos diez pasos porque el gradiente se desvanece; una LSTM sí las aprende.","hp":[["max_norm","norma máxima del gradiente; si la supera, se reescala (en los optimizadores de Keras, clipnorm)"]],"py":[{"c":"torch.nn.utils.clip_grad_norm_","u":"https://docs.pytorch.org/docs/stable/generated/torch.nn.utils.clip_grad_norm_.html"},{"c":"keras.optimizers.Adam(clipnorm=1.0)","s":1}],"rel":["backpropagation","inicializacion-de-pesos","conexion-residual","lstm","capas-de-normalizacion"]}]},{"id":"regularizacion-en-redes","name":"Regularización en redes","en":"regularization in neural networks","frase":"Técnicas para que una red con millones de parámetros no memorice los datos de entrenamiento.","desc":"Las redes neuronales tienen capacidad de sobra para memorizar el conjunto de entrenamiento, así que necesitan regularización para generalizar. Las técnicas más usadas son penalizar los pesos grandes (L2 o weight decay), apagar neuronas al azar (dropout), parar el entrenamiento a tiempo (early stopping), añadir ruido y aumentar los datos. Se suelen combinar varias.","ej":"Una red que llega al 100 % de acierto en entrenamiento y se queda en el 80 % en validación mejora con dropout y aumento de datos.","rel":["penalizacion-l1-y-l2","dropout","early-stopping","data-augmentation","sobreajuste"],"children":[{"id":"penalizacion-l1-y-l2","name":"Penalización L1 y L2 (weight decay)","en":"L1 & L2 regularization (weight decay)","frase":"Añadir a la pérdida un castigo por los pesos grandes para obtener modelos más simples.","desc":"La penalización L2 suma a la pérdida el cuadrado de los pesos multiplicado por un factor y los empuja hacia cero sin anularlos. La L1 suma su valor absoluto y tiende a dejar pesos exactamente en cero. En redes, la L2 se aplica casi siempre como weight decay, que reduce un poco los pesos en cada paso; con Adam conviene usar AdamW, que lo aplica de forma desacoplada.","cuando":"Casi siempre, como regularización básica; L1, cuando además se busca que muchos pesos sean cero.","ej":"Añadir un weight decay de 10⁻⁴ al entrenar una CNN con 5.000 imágenes reduce la diferencia entre entrenamiento y validación.","hp":[["l2","factor de la penalización L2 en Keras"],["weight_decay","factor del decaimiento de pesos en el optimizador"]],"py":[{"c":"keras.regularizers.L2","u":"https://keras.io/api/layers/regularizers/#l2-class"},{"c":"keras.regularizers.L1L2","u":"https://keras.io/api/layers/regularizers/#l1l2-class"},{"c":"torch.optim.AdamW","u":"https://docs.pytorch.org/docs/stable/generated/torch.optim.AdamW.html"}],"rel":["ridge-lasso-y-elastic-net","regularizacion","adam-y-adamw","regularizacion-en-redes"]},{"id":"dropout","name":"Dropout","en":"dropout","frase":"Apagar al azar una fracción de neuronas en cada paso de entrenamiento para que no dependan unas de otras.","desc":"En cada paso de entrenamiento, cada neurona se anula con una probabilidad p y las demás se reescalan. La red no puede apoyarse en neuronas concretas y aprende representaciones redundantes y robustas; equivale a entrenar a la vez muchas subredes que comparten pesos. En inferencia se desactiva; mantenerlo activo al predecir (MC dropout) permite estimar la incertidumbre.","cuando":"En capas densas grandes y en transformers cuando hay sobreajuste; en las convolucionales se usa menos, o en su versión espacial.","ej":"Un dropout de 0,5 tras cada capa densa de un clasificador de texto reduce la distancia entre el acierto de entrenamiento y el de validación.","hp":[["rate / p","probabilidad de apagar cada neurona (Keras / PyTorch)"]],"py":[{"c":"keras.layers.Dropout","u":"https://keras.io/api/layers/regularization_layers/dropout/"},{"c":"torch.nn.Dropout","u":"https://docs.pytorch.org/docs/stable/generated/torch.nn.Dropout.html"}],"rel":["regularizacion-en-redes","ensembles","estimacion-de-incertidumbre-en-redes","inyeccion-de-ruido"]},{"id":"early-stopping","name":"Early stopping","en":"early stopping","frase":"Parar el entrenamiento cuando el error de validación deja de mejorar.","desc":"Mientras el error de entrenamiento sigue bajando, el de validación acaba subiendo cuando la red empieza a memorizar. Early stopping vigila la métrica de validación y detiene el entrenamiento tras varias épocas sin mejora, recuperando los pesos del mejor momento. Es una regularización barata que además ahorra cómputo.","cuando":"Prácticamente siempre que se entrena una red durante varias épocas con un conjunto de validación.","ej":"Con una paciencia de 5 épocas, el entrenamiento se detiene en la época 23 y se restauran los pesos de la 18, la mejor en validación.","hp":[["patience","épocas sin mejora antes de parar"],["monitor","métrica que se vigila"],["restore_best_weights","recupera los pesos de la mejor época"]],"py":[{"c":"keras.callbacks.EarlyStopping","u":"https://keras.io/api/callbacks/early_stopping/"}],"rel":["curvas-de-aprendizaje","callbacks","sobreajuste","entrenamiento-validacion-y-test"]},{"id":"inyeccion-de-ruido","name":"Inyección de ruido","en":"noise injection","frase":"Añadir ruido aleatorio a las entradas, los pesos o las activaciones para que la red sea más robusta.","desc":"Perturbar los datos durante el entrenamiento obliga a la red a ser insensible a pequeñas variaciones, lo que actúa como regularización: añadir ruido gaussiano a las entradas equivale, aproximadamente, a una penalización L2. El ruido también es la base de los autoencoders de eliminación de ruido, del suavizado de etiquetas y del entrenamiento robusto frente a ataques.","cuando":"Con pocos datos o entradas ruidosas, o cuando se busca robustez frente a perturbaciones.","ej":"Añadir ruido gaussiano a las lecturas de sensores durante el entrenamiento para que el modelo tolere la imprecisión de los sensores reales.","hp":[["stddev","desviación típica del ruido gaussiano"]],"py":[{"c":"keras.layers.GaussianNoise","u":"https://keras.io/api/layers/regularization_layers/gaussian_noise/"},{"c":"keras.layers.GaussianDropout","u":"https://keras.io/api/layers/regularization_layers/gaussian_dropout/"}],"rel":["regularizacion-en-redes","autoencoder-denoising","dropout","data-augmentation"]}]},{"id":"entrenamiento-en-la-practica","name":"Entrenamiento en la práctica","en":"training in practice","frase":"Los hábitos que separan un entrenamiento que funciona de uno que falla en silencio.","desc":"Entrenar redes tiene mucho de oficio: empezar simple, verificar cada pieza, vigilar las curvas de pérdida, guardar los mejores modelos y poder reproducir cada resultado. Las redes fallan en silencio: un error de preprocesado o en la pérdida no produce ninguna excepción, solo un modelo peor de lo que podría ser.","ej":"Antes de entrenar con todo el dataset, comprobar que la red es capaz de memorizar un único lote de 32 ejemplos.","rel":["receta-de-entrenamiento","curvas-de-aprendizaje","callbacks","reproducibilidad-y-semillas"],"children":[{"id":"receta-de-entrenamiento","name":"Receta de entrenamiento","en":"neural network training recipe","frase":"Un proceso paso a paso para entrenar redes: de lo simple a lo complejo, verificando cada paso.","desc":"Una receta habitual es: inspeccionar a fondo los datos; montar el ciclo completo con un modelo sencillo y líneas base; comprobar que la red puede sobreajustar un lote pequeño; aumentar la capacidad hasta sobreajustar el conjunto de entrenamiento; regularizar para generalizar; y, solo entonces, ajustar los hiperparámetros. Cada paso aísla posibles errores antes de añadir complejidad.","cuando":"Al empezar cualquier proyecto de deep learning y al depurar un entrenamiento que no funciona.","ej":"Si la red no consigue memorizar 10 imágenes, el fallo está en el código o en los datos, no en que le falten capas.","rel":["entrenamiento-en-la-practica","linea-base","curvas-de-aprendizaje","sobreajuste"]},{"id":"curvas-de-aprendizaje","name":"Curvas de aprendizaje","en":"learning curves","frase":"La evolución de la pérdida o la métrica durante el entrenamiento, en entrenamiento y en validación.","desc":"Comparar la pérdida de entrenamiento con la de validación es la herramienta de diagnóstico más útil. Si ambas son altas, hay infraajuste; si la de entrenamiento baja y la de validación sube, sobreajuste; si oscilan mucho, el learning rate puede ser excesivo. Otra variante muestra el rendimiento frente al tamaño del conjunto de entrenamiento e indica si conseguir más datos ayudaría.","cuando":"Siempre, durante y después de cada entrenamiento, para decidir el siguiente paso.","ej":"La pérdida de validación toca fondo en la época 12 y después sube mientras la de entrenamiento sigue bajando: señal de sobreajuste.","py":[{"c":"sklearn.model_selection.learning_curve","u":"https://scikit-learn.org/stable/modules/generated/sklearn.model_selection.learning_curve.html"},{"c":"history.history[\"val_loss\"]","s":1}],"rel":["sobreajuste","infraajuste","early-stopping","seguimiento-de-experimentos"]},{"id":"callbacks","name":"Callbacks","en":"callbacks","frase":"Funciones que se ejecutan en momentos concretos del entrenamiento para vigilar, guardar o ajustar el modelo.","desc":"Un callback es código que el bucle de entrenamiento llama en momentos determinados, como al final de cada época o de cada lote. Se usan para parar a tiempo (early stopping), guardar el mejor modelo, ajustar el learning rate, registrar métricas o detener el entrenamiento si la pérdida da NaN. Permiten personalizar el entrenamiento sin reescribir el bucle.","cuando":"En cualquier entrenamiento de más de unos minutos, para no perder el mejor modelo ni malgastar cómputo.","ej":"Guardar automáticamente los pesos cada vez que mejora el acierto en validación y parar tras 10 épocas sin mejora.","hp":[["monitor","métrica que se vigila"],["save_best_only","guarda solo cuando la métrica mejora"]],"py":[{"c":"keras.callbacks.ModelCheckpoint","u":"https://keras.io/api/callbacks/model_checkpoint/"},{"c":"keras.callbacks.Callback","u":"https://keras.io/api/callbacks/base_callback/"}],"rel":["early-stopping","lr-schedulers","seguimiento-de-experimentos","curvas-de-aprendizaje"]},{"id":"reproducibilidad-y-semillas","name":"Reproducibilidad y semillas","en":"reproducibility & random seeds","frase":"Fijar las fuentes de aleatoriedad para poder repetir un entrenamiento y obtener el mismo resultado.","desc":"La inicialización de pesos, el barajado de datos, el dropout y el aumento de datos dependen de números aleatorios. Fijar las semillas de Python, NumPy y el framework permite repetir resultados, aunque en GPU algunas operaciones no son deterministas salvo que se fuerce. Como cada semilla da un resultado algo distinto, conviene comparar modelos con varias semillas y no con una sola ejecución.","cuando":"Siempre que se comparen modelos, se depure un entrenamiento o se publiquen resultados.","ej":"Un modelo parece un 1 % mejor que otro, pero con cinco semillas distintas la diferencia desaparece: era ruido.","py":[{"c":"keras.utils.set_random_seed","u":"https://keras.io/api/utils/python_utils/#setrandomseed-function"},{"c":"torch.manual_seed","u":"https://docs.pytorch.org/docs/stable/generated/torch.manual_seed.html"},{"c":"torch.use_deterministic_algorithms","u":"https://docs.pytorch.org/docs/stable/generated/torch.use_deterministic_algorithms.html"}],"rel":["seguimiento-de-experimentos","mlops","validacion-cruzada","entrenamiento-en-la-practica"]}]},{"id":"construccion-de-modelos","name":"Construcción de modelos","en":"building models","frase":"Las formas de definir la arquitectura de una red en código, de una pila simple a grafos complejos.","desc":"Los frameworks ofrecen varios niveles. La API secuencial apila capas una tras otra. La funcional permite grafos con ramas, varias entradas y salidas y capas compartidas. La subclasificación, heredando de Layer, Model o nn.Module, da libertad total para lógica personalizada. Elegir el nivel adecuado hace el código más simple y más fácil de mantener.","ej":"Un clasificador de imágenes simple cabe en una API secuencial; un modelo que combina una foto y su descripción necesita la funcional.","rel":["api-secuencial","api-funcional","capas-y-perdidas-personalizadas","multi-entrada-salida"],"children":[{"id":"api-secuencial","name":"API secuencial","en":"Sequential API","frase":"Definir una red como una pila de capas en la que cada una alimenta a la siguiente.","desc":"Es la forma más sencilla de construir un modelo: una lista ordenada de capas en la que la salida de cada una es la entrada de la siguiente. Basta para los MLP y las CNN clásicas. No admite varias entradas o salidas, ramas ni capas compartidas; para eso existe la API funcional.","cuando":"Para modelos que son una cadena de capas con una entrada y una salida.","ej":"Un clasificador de dígitos: aplanar la imagen, una capa densa de 128 neuronas con ReLU y una salida softmax de 10 clases.","py":[{"c":"keras.Sequential","u":"https://keras.io/api/models/sequential/"},{"c":"torch.nn.Sequential","u":"https://docs.pytorch.org/docs/stable/generated/torch.nn.Sequential.html"}],"rel":["api-funcional","mlp","construccion-de-modelos","frameworks-de-ml"]},{"id":"api-funcional","name":"API funcional","en":"Functional API","frase":"Definir la red conectando capas como funciones, lo que permite ramas, atajos y varias entradas o salidas.","desc":"Cada capa se aplica sobre el tensor de salida de otra, y el modelo se define indicando sus entradas y sus salidas. Así se construyen grafos arbitrarios sin ciclos: conexiones residuales, ramas paralelas que se concatenan, capas compartidas y modelos con varias entradas o salidas. La arquitectura sigue siendo inspeccionable y se puede dibujar.","cuando":"Cuando el modelo no es una simple cadena de capas: atajos, ramas o varias entradas o salidas.","ej":"Una red que recibe la imagen de un producto y su precio, procesa cada uno por una rama distinta y concatena ambas antes de clasificar.","py":[{"c":"keras.Model","u":"https://keras.io/api/models/model/"},{"c":"keras.Input","u":"https://keras.io/api/layers/core_layers/input/"}],"rel":["api-secuencial","multi-entrada-salida","conexion-residual","capas-y-perdidas-personalizadas"]},{"id":"capas-y-perdidas-personalizadas","name":"Capas y pérdidas personalizadas","en":"custom layers & losses","frase":"Programar tus propias capas, pérdidas o modelos cuando las piezas estándar no bastan.","desc":"Heredando de las clases base del framework se define una capa con sus pesos y su cálculo hacia delante, o una pérdida que compara la predicción con el objetivo de forma específica. La diferenciación automática se encarga de los gradientes. Es la vía para implementar ideas nuevas o incorporar restricciones del dominio al entrenamiento.","cuando":"Cuando necesitas una operación, una restricción o un objetivo que no existe en la librería.","ej":"Una pérdida que penaliza el doble quedarse corto en la previsión de demanda que pasarse, porque la rotura de stock cuesta más que el exceso.","py":[{"c":"keras.layers.Layer","u":"https://keras.io/api/layers/base_layer/#layer-class"},{"c":"keras.losses.Loss","u":"https://keras.io/api/losses/#loss-class"},{"c":"torch.nn.Module","u":"https://docs.pytorch.org/docs/stable/generated/torch.nn.Module.html"}],"rel":["diferenciacion-automatica","construccion-de-modelos","funciones-de-perdida","api-funcional"]},{"id":"redes-siamesas","name":"Redes siamesas (pesos compartidos)","en":"Siamese networks (shared weights)","frase":"Dos o más ramas idénticas, con los mismos pesos, que procesan entradas distintas para compararlas.","desc":"Cada entrada pasa por la misma red, que la convierte en un vector, y después se mide la distancia entre los vectores. Se entrenan con pérdidas contrastivas o de triplete, que acercan los pares similares y alejan los diferentes hasta un margen. Así aprenden una medida de similitud y permiten reconocer clases nuevas con pocos ejemplos, solo comparando.","cuando":"Para verificar si dos elementos son el mismo (firmas, caras, productos) o buscar similares, sobre todo con muchas clases y pocos ejemplos de cada una.","ej":"Un sistema de desbloqueo facial compara el vector de tu cara con el que guardó al registrarte, sin reentrenar la red para cada usuario.","hp":[["margin","separación mínima exigida entre los pares distintos y los similares"]],"py":[{"c":"torch.nn.TripletMarginLoss","u":"https://docs.pytorch.org/docs/stable/generated/torch.nn.TripletMarginLoss.html"},{"c":"torch.nn.CosineEmbeddingLoss","u":"https://docs.pytorch.org/docs/stable/generated/torch.nn.CosineEmbeddingLoss.html"}],"rel":["aprendizaje-contrastivo","embeddings","busqueda-por-similitud","distancia-y-similitud"]},{"id":"multi-entrada-salida","name":"Modelos multi-entrada y multi-salida","en":"multi-input & multi-output models","frase":"Modelos que combinan varios tipos de datos de entrada o resuelven varias tareas a la vez.","desc":"Con varias entradas, cada una (una imagen, un texto, unas variables tabulares) se procesa por su propia rama y las representaciones se fusionan, normalmente concatenándolas. Con varias salidas, un tronco común alimenta cabezas distintas, cada una con su pérdida, y la pérdida total es una suma ponderada. Compartir la representación entre tareas relacionadas suele mejorar todas ellas.","cuando":"Cuando los datos llegan en varias modalidades o hay varias predicciones relacionadas que pueden compartir aprendizaje.","ej":"A partir de la foto y la descripción de un anuncio inmobiliario, predecir a la vez el precio (regresión) y el tipo de vivienda (clasificación).","py":[{"c":"keras.Model","u":"https://keras.io/api/models/model/"},{"c":"keras.layers.Concatenate","u":"https://keras.io/api/layers/merging_layers/concatenate/"},{"c":"model.compile(loss={...}, loss_weights={...})","s":1}],"rel":["api-funcional","fine-tuning-multitarea","aprendizaje-multimodal","capas-y-perdidas-personalizadas"]}]}]},{"id":"arquitecturas-de-redes-neuronales","name":"Arquitecturas de redes neuronales","en":"neural network architectures","frase":"Las formas de red adaptadas a cada tipo de dato: imágenes, secuencias o texto.","desc":"Las formas que puede tomar una red según el tipo de dato. Las CNN aprovechan la estructura espacial de las imágenes y las RNN la secuencial del texto o las series. Los Transformers relacionan todos los elementos entre sí mediante atención, y los autoencoders comprimen y reconstruyen. Cada arquitectura incorpora un sesgo inductivo distinto.","ej":"Para clasificar imágenes se suele usar una CNN o un Vision Transformer; para traducir texto, un Transformer encoder-decoder.","rel":["cnn","rnn","atencion-y-transformers","autoencoders"],"children":[{"id":"bloques-comunes","name":"Bloques comunes","en":"common building blocks","frase":"Piezas reutilizables que aparecen en casi todas las arquitecturas modernas.","desc":"Más allá del tipo de red, ciertas piezas se repiten: las conexiones residuales, que permiten apilar muchas capas; las capas de normalización, que estabilizan el entrenamiento; y las capas de embedding, que convierten símbolos discretos en vectores. Conocerlas ayuda a leer cualquier arquitectura nueva como una combinación de bloques ya conocidos.","ej":"Un bloque de transformer combina atención, una red densa, dos conexiones residuales y dos normalizaciones de capa.","rel":["conexion-residual","capas-de-normalizacion","capa-de-embedding","bloque-transformer"],"children":[{"id":"conexion-residual","name":"Conexión residual (skip connection)","en":"residual (skip) connection","frase":"Sumar la entrada de un bloque a su salida para que la red solo tenga que aprender la corrección necesaria.","desc":"En lugar de aprender una transformación completa H(x), el bloque aprende el residuo F(x) y devuelve x + F(x); si el bloque no aporta nada, basta con que F tienda a cero. El atajo deja pasar el gradiente directamente hacia las primeras capas, lo que permitió entrenar redes de cientos de capas (ResNet), y es una parte esencial de todos los transformers.","cuando":"En cualquier red profunda, de más de una decena de capas, sea convolucional o transformer.","ej":"ResNet-152 se entrena sin problemas gracias a sus atajos, mientras que una red equivalente sin ellos empeora al añadirle capas.","py":[{"c":"keras.layers.Add","u":"https://keras.io/api/layers/merging_layers/add/"},{"c":"x = x + bloque(x)","s":1}],"rel":["resnet","desvanecimiento-y-explosion-del-gradiente","bloque-transformer","api-funcional"]},{"id":"capas-de-normalizacion","name":"Capas de normalización (batch, layer, group)","en":"normalization layers (batch, layer, group)","frase":"Reescalan las activaciones durante el entrenamiento para mantenerlas en un rango estable.","desc":"Normalizan las activaciones a media cero y varianza uno, y después aplican una escala y un desplazamiento aprendidos. Batch normalization calcula las estadísticas sobre el lote y es habitual en las CNN; depende del tamaño del lote y se comporta distinto en entrenamiento y en inferencia. Layer normalization normaliza cada ejemplo por separado y es la estándar en transformers; group normalization, intermedia entre ambas, funciona bien con lotes pequeños.","cuando":"Batch norm, en CNN con lotes de tamaño razonable; layer norm, en transformers y RNN; group norm, con lotes pequeños.","ej":"Añadir batch normalization tras cada convolución permite usar learning rates más altos y converger en menos épocas.","hp":[["momentum","en batch norm, inercia de la media móvil de las estadísticas"],["num_groups","en group norm, número de grupos de canales"]],"py":[{"c":"keras.layers.BatchNormalization","u":"https://keras.io/api/layers/normalization_layers/batch_normalization/"},{"c":"keras.layers.LayerNormalization","u":"https://keras.io/api/layers/normalization_layers/layer_normalization/"},{"c":"torch.nn.BatchNorm2d","u":"https://docs.pytorch.org/docs/stable/generated/torch.nn.BatchNorm2d.html"},{"c":"torch.nn.GroupNorm","u":"https://docs.pytorch.org/docs/stable/generated/torch.nn.GroupNorm.html"}],"rel":["estandarizacion","bloque-transformer","inicializacion-de-pesos","gdn"]},{"id":"capa-de-embedding","name":"Capa de embedding","en":"embedding layer","frase":"Una tabla que asigna a cada símbolo discreto un vector denso que se aprende durante el entrenamiento.","desc":"Convierte índices enteros (palabras, tokens, productos, usuarios) en vectores de dimensión fija. Equivale a multiplicar un vector one-hot por una matriz, pero es mucho más eficiente. Los vectores empiezan aleatorios y se ajustan junto con el resto de la red, de modo que los símbolos que se comportan de forma parecida acaban cerca. Es la primera capa de todo modelo de lenguaje.","cuando":"Siempre que la entrada sean categorías con muchos valores posibles: palabras, identificadores de usuario o de producto.","ej":"En un recomendador, cada uno de los 50.000 productos se representa con un vector de 64 dimensiones aprendido a partir de las compras.","hp":[["input_dim / num_embeddings","número de símbolos distintos (Keras / PyTorch)"],["output_dim / embedding_dim","dimensión de cada vector (Keras / PyTorch)"]],"py":[{"c":"keras.layers.Embedding","u":"https://keras.io/api/layers/core_layers/embedding/"},{"c":"torch.nn.Embedding","u":"https://docs.pytorch.org/docs/stable/generated/torch.nn.Embedding.html"}],"rel":["embeddings","word-embeddings","codificacion-de-variables-categoricas","tokenizacion"]}]},{"id":"cnn","name":"Redes convolucionales (CNN)","en":"convolutional neural networks (CNN)","frase":"Redes que recorren la entrada con pequeños filtros compartidos para detectar patrones locales.","desc":"Las redes convolucionales aplican los mismos filtros en todas las posiciones de una imagen, una señal o una secuencia, lo que reduce enormemente los parámetros y aprovecha que un patrón significa lo mismo esté donde esté. Al apilar convoluciones y pooling, las primeras capas detectan bordes y texturas, y las profundas, partes y objetos. Dominaron la visión por computador a partir de 2012.","cuando":"Con datos con estructura espacial o temporal local: imágenes, audio, señales y series.","ej":"Una CNN que distingue las radiografías de tórax con neumonía de las normales a partir de los píxeles.","py":[{"c":"keras.layers.Conv2D","u":"https://keras.io/api/layers/convolution_layers/convolution2d/"},{"c":"torch.nn.Conv2d","u":"https://docs.pytorch.org/docs/stable/generated/torch.nn.Conv2d.html"}],"rel":["convolucion","pooling","arquitecturas-cnn-de-referencia","clasificacion-de-imagenes","transformers-vs-cnn-y-rnn"],"children":[{"id":"convolucion","name":"Convolución","en":"convolution","frase":"Deslizar un pequeño filtro por la entrada y calcular en cada posición su producto con la zona que cubre.","desc":"Un filtro, por ejemplo de 3 × 3 píxeles, recorre la imagen y en cada posición multiplica sus pesos por los valores que cubre y los suma, produciendo un mapa de respuestas. Sus pesos se comparten en todas las posiciones y solo mira una zona local, lo que la hace eficiente y adecuada para detectar patrones que se repiten. En las CNN los filtros no se diseñan a mano: se aprenden.","ej":"Un filtro con valores negativos a la izquierda y positivos a la derecha responde con fuerza en los bordes verticales de una imagen.","hp":[["filters / out_channels","número de filtros (Keras / PyTorch)"],["kernel_size","tamaño del filtro"]],"py":[{"c":"keras.layers.Conv2D","u":"https://keras.io/api/layers/convolution_layers/convolution2d/"},{"c":"torch.nn.Conv2d","u":"https://docs.pytorch.org/docs/stable/generated/torch.nn.Conv2d.html"}],"rel":["filtros-y-mapas-de-caracteristicas","padding-y-stride","campo-receptivo","cnn"]},{"id":"filtros-y-mapas-de-caracteristicas","name":"Filtros y mapas de características","en":"filters & feature maps","frase":"Cada filtro aprende a detectar un patrón; su salida es un mapa que indica dónde aparece.","desc":"Una capa convolucional aplica muchos filtros en paralelo, y cada uno produce un mapa de características (un canal) que se activa donde encuentra su patrón. Los filtros de cada capa operan sobre todos los canales de la anterior, combinando patrones simples en otros cada vez más complejos. El número de filtros por capa suele crecer a medida que disminuye la resolución espacial.","ej":"En una red entrenada con fotos de caras, los filtros de las primeras capas detectan bordes y colores, y los de las capas profundas, ojos y narices.","rel":["convolucion","visualizacion-de-filtros-y-activaciones","campo-receptivo","cnn"]},{"id":"padding-y-stride","name":"Padding y stride","en":"padding & stride","frase":"Padding: bordes añadidos para conservar el tamaño. Stride: cuántos píxeles salta el filtro en cada paso.","desc":"Sin relleno, cada convolución recorta los bordes de la entrada; con padding \"same\" se añaden ceros alrededor para que la salida conserve el tamaño. El stride indica el salto del filtro: con stride 2, la salida se reduce a la mitad en cada dimensión, una alternativa al pooling para bajar la resolución. Ambos determinan el tamaño de salida: ⌊(n + 2p − k)/s⌋ + 1.","ej":"Una imagen de 32 × 32 con un filtro de 3 × 3, padding de 1 y stride de 2 da un mapa de 16 × 16.","hp":[["padding","relleno de los bordes (\"valid\" o \"same\" en Keras; número de píxeles en PyTorch)"],["strides / stride","salto del filtro (Keras / PyTorch)"]],"py":[{"c":"keras.layers.Conv2D","u":"https://keras.io/api/layers/convolution_layers/convolution2d/"},{"c":"torch.nn.Conv2d","u":"https://docs.pytorch.org/docs/stable/generated/torch.nn.Conv2d.html"}],"rel":["convolucion","pooling","campo-receptivo","convolucion-transpuesta"]},{"id":"pooling","name":"Pooling","en":"pooling","frase":"Resumir cada pequeña región de un mapa en un solo valor para reducir su tamaño.","desc":"El max pooling se queda con el valor máximo de cada ventana y el average pooling, con la media. Reducen la resolución, el cálculo y los parámetros de las capas siguientes, y dan cierta tolerancia a pequeños desplazamientos. El pooling global promedia cada mapa completo en un único número y suele sustituir a las capas densas finales en las CNN modernas.","cuando":"Para reducir la resolución entre bloques convolucionales; el pooling global, al final de la red, antes de clasificar.","ej":"Un max pooling de 2 × 2 convierte un mapa de 64 × 64 en uno de 32 × 32 conservando las respuestas más fuertes.","hp":[["pool_size / kernel_size","tamaño de la ventana (Keras / PyTorch)"]],"py":[{"c":"keras.layers.MaxPooling2D","u":"https://keras.io/api/layers/pooling_layers/max_pooling2d/"},{"c":"keras.layers.GlobalAveragePooling2D","u":"https://keras.io/api/layers/pooling_layers/global_average_pooling2d/"},{"c":"torch.nn.MaxPool2d","u":"https://docs.pytorch.org/docs/stable/generated/torch.nn.MaxPool2d.html"},{"c":"torch.nn.AdaptiveAvgPool2d","u":"https://docs.pytorch.org/docs/stable/generated/torch.nn.AdaptiveAvgPool2d.html"}],"rel":["padding-y-stride","equivarianza-e-invarianza","cnn","campo-receptivo"]},{"id":"campo-receptivo","name":"Campo receptivo","en":"receptive field","frase":"La región de la entrada que puede influir en una neurona concreta de la red.","desc":"Una neurona de la primera capa convolucional solo ve el tamaño de su filtro, por ejemplo 3 × 3 píxeles. Cada capa adicional, cada pooling y cada stride amplían esa región, de modo que las neuronas profundas ven zonas grandes de la imagen y pueden reconocer objetos completos. Si el campo receptivo es menor que los objetos de interés, la red no puede verlos enteros; las convoluciones dilatadas lo amplían sin añadir parámetros.","ej":"Tras apilar tres convoluciones de 3 × 3, cada neurona ve una región de 7 × 7 píxeles de la imagen original.","rel":["convolucion","pooling","convolucion-1d","transformers-vs-cnn-y-rnn"]},{"id":"equivarianza-e-invarianza","name":"Equivarianza e invarianza","en":"equivariance & invariance","frase":"Equivarianza: si la entrada se desplaza, la salida se desplaza igual. Invarianza: la salida no cambia.","desc":"La convolución es equivariante a las traslaciones: un patrón desplazado produce la misma respuesta, desplazada. El pooling y la agregación global hacen que la salida final sea aproximadamente invariante: la clase no cambia por mover el objeto. Las CNN no son invariantes por sí solas a rotaciones o cambios de escala; esas invarianzas se enseñan con aumento de datos o con arquitecturas específicas.","ej":"Un gato en una esquina de la foto o en el centro activa los mismos filtros en posiciones distintas, y la red lo clasifica igual.","rel":["convolucion","pooling","data-augmentation","cnn"]},{"id":"convolucion-1d","name":"Convolución 1D","en":"1D convolution","frase":"Convolución que se desliza en una sola dimensión, para secuencias, series temporales y audio.","desc":"El filtro recorre la secuencia a lo largo del tiempo detectando patrones locales, como subidas bruscas en una señal o combinaciones de palabras en un texto. Es mucho más rápida y paralelizable que una RNN. Con convoluciones dilatadas, que saltan pasos, el campo receptivo crece exponencialmente con la profundidad y capta dependencias largas, como en WaveNet o en las redes convolucionales temporales.","cuando":"Para clasificar o predecir series temporales, señales y audio, sobre todo cuando importan los patrones locales.","ej":"Detectar arritmias en un electrocardiograma reconociendo la forma de cada latido.","hp":[["filters","número de filtros"],["kernel_size","longitud del filtro"],["dilation_rate","separación entre los elementos del filtro"]],"py":[{"c":"keras.layers.Conv1D","u":"https://keras.io/api/layers/convolution_layers/convolution1d/"},{"c":"torch.nn.Conv1d","u":"https://docs.pytorch.org/docs/stable/generated/torch.nn.Conv1d.html"}],"rel":["convolucion","redes-neuronales-para-series","campo-receptivo","rnn"]},{"id":"convolucion-separable","name":"Convolución separable","en":"depthwise separable convolution","frase":"Dividir una convolución en un filtrado por canal y una mezcla de canales: casi igual de potente y mucho más barata.","desc":"Una convolución normal filtra y mezcla canales a la vez. La separable en profundidad lo hace en dos pasos: primero aplica un filtro espacial independiente a cada canal (depthwise) y después una convolución de 1 × 1 que combina los canales (pointwise). Con filtros de 3 × 3 reduce el cálculo y los parámetros entre 8 y 9 veces, con una pérdida de precisión pequeña. Es la base de MobileNet y EfficientNet.","cuando":"En modelos que deben ser ligeros: móviles, dispositivos embebidos o inferencia en tiempo real.","ej":"MobileNet clasifica imágenes en un móvil con una fracción del cálculo de una CNN clásica gracias a las convoluciones separables.","hp":[["depth_multiplier","filtros espaciales por cada canal de entrada"],["groups","en PyTorch, igualarlo al número de canales hace la convolución depthwise"]],"py":[{"c":"keras.layers.SeparableConv2D","u":"https://keras.io/api/layers/convolution_layers/separable_convolution2d/"},{"c":"keras.layers.DepthwiseConv2D","u":"https://keras.io/api/layers/convolution_layers/depthwise_convolution2d/"},{"c":"torch.nn.Conv2d","u":"https://docs.pytorch.org/docs/stable/generated/torch.nn.Conv2d.html"}],"rel":["mobilenet-y-efficientnet","convolucion","cnn","despliegue-e-inferencia"]},{"id":"convolucion-transpuesta","name":"Convolución transpuesta (upsampling)","en":"transposed convolution (upsampling)","frase":"La operación que aumenta la resolución de un mapa de características con pesos aprendidos.","desc":"Hace el camino inverso, en forma, a una convolución con stride: aumenta el tamaño espacial de un mapa, por ejemplo de 16 × 16 a 32 × 32, con filtros que se aprenden. Se usa en los decodificadores de autoencoders, en los generadores de GAN y en redes de segmentación como U-Net. Puede producir artefactos en forma de tablero de ajedrez; una alternativa es aumentar la resolución por interpolación y aplicar después una convolución normal.","cuando":"Cuando la red debe producir una salida con resolución espacial: imágenes generadas, máscaras de segmentación o reconstrucciones.","ej":"El decodificador de U-Net recupera paso a paso la resolución completa de la imagen para clasificar cada píxel.","hp":[["strides / stride","factor de aumento de la resolución (Keras / PyTorch)"],["kernel_size","tamaño del filtro"]],"py":[{"c":"keras.layers.Conv2DTranspose","u":"https://keras.io/api/layers/convolution_layers/convolution2d_transpose/"},{"c":"keras.layers.UpSampling2D","u":"https://keras.io/api/layers/reshaping_layers/up_sampling2d/"},{"c":"torch.nn.ConvTranspose2d","u":"https://docs.pytorch.org/docs/stable/generated/torch.nn.ConvTranspose2d.html"}],"rel":["u-net","autoencoder-convolucional","dcgan","padding-y-stride"]},{"id":"inspiracion-biologica-de-las-cnn","name":"Inspiración biológica de las CNN","en":"biological inspiration of CNNs","frase":"Las CNN imitan, a grandes rasgos, la jerarquía del sistema visual de los mamíferos.","desc":"Hubel y Wiesel descubrieron en los años 60 que las neuronas de la corteza visual primaria responden a bordes con cierta orientación dentro de una pequeña zona del campo visual, su campo receptivo, y que etapas posteriores combinan esas respuestas en patrones más complejos. El Neocognitrón de Fukushima (1980) y después LeNet trasladaron esa idea a redes con filtros locales, compartidos y organizados en jerarquía. La analogía es útil, pero aproximada.","ej":"Los filtros que aprende la primera capa de una CNN se parecen a los detectores de bordes orientados medidos en la corteza visual.","rel":["cnn","campo-receptivo","modelos-bioinspirados-y-multiescala","neurona-artificial"]}]},{"id":"rnn","name":"Redes recurrentes (RNN)","en":"recurrent neural networks (RNN)","frase":"Redes con memoria que procesan secuencias paso a paso, actualizando un estado interno.","desc":"Una red recurrente lee un elemento de la secuencia en cada paso y lo combina con su estado oculto anterior para producir uno nuevo, aplicando los mismos pesos en todos los pasos. Así procesa secuencias de cualquier longitud teniendo en cuenta el contexto pasado. Las RNN simples olvidan rápido, y LSTM y GRU resuelven ese problema. Los transformers las han desplazado en lenguaje, pero siguen siendo útiles en series temporales y en dispositivos con pocos recursos.","cuando":"Para secuencias como series temporales, señales o texto, sobre todo si se procesan en tiempo real, paso a paso.","ej":"Predecir la siguiente lectura de un sensor a partir de las anteriores, actualizando el estado con cada nueva medida.","py":[{"c":"keras.layers.SimpleRNN","u":"https://keras.io/api/layers/recurrent_layers/simple_rnn/"},{"c":"torch.nn.RNN","u":"https://docs.pytorch.org/docs/stable/generated/torch.nn.RNN.html"}],"rel":["estado-oculto-y-memoria","lstm","gru","bptt","transformers-vs-cnn-y-rnn"],"children":[{"id":"estado-oculto-y-memoria","name":"Estado oculto y memoria","en":"hidden state & memory","frase":"El vector que la red recurrente arrastra de un paso al siguiente y que resume lo visto hasta entonces.","desc":"En cada paso, el estado oculto se calcula a partir de la entrada actual y del estado anterior: hₜ = f(W·xₜ + U·hₜ₋₁ + b). Funciona como una memoria de tamaño fijo que comprime toda la historia relevante. Su capacidad es limitada: en las RNN simples la información antigua se diluye rápidamente, por lo que LSTM y GRU añaden puertas que deciden qué guardar y qué olvidar.","ej":"Al leer \"las llaves que dejé encima de la mesa ___\", el estado oculto debe recordar que el sujeto está en plural para predecir \"están\".","rel":["rnn","lstm","gru","bptt"]},{"id":"bptt","name":"Retropropagación a través del tiempo (BPTT)","en":"backpropagation through time (BPTT)","frase":"Entrenar una RNN desplegándola en el tiempo y aplicando retropropagación a lo largo de todos los pasos.","desc":"Se desenrolla la red como si cada paso temporal fuera una capa, todas con los mismos pesos, y se aplica retropropagación desde el final de la secuencia hacia el principio, sumando los gradientes de cada paso. En secuencias largas el gradiente se desvanece o explota y el coste crece con la longitud, así que se suele truncar a un número fijo de pasos (BPTT truncada).","ej":"Para entrenar con textos de 10.000 caracteres, se retropropaga en tramos de 100 pasos, pasando el estado de cada tramo al siguiente.","rel":["backpropagation","rnn","desvanecimiento-y-explosion-del-gradiente","lstm"]},{"id":"lstm","name":"LSTM","en":"long short-term memory (LSTM)","frase":"RNN con una memoria interna y puertas que deciden qué recordar, qué olvidar y qué emitir.","desc":"Añade a la RNN una celda de memoria que fluye entre pasos con cambios mínimos, regulada por tres puertas sigmoides: la de olvido decide qué borrar, la de entrada qué añadir y la de salida qué mostrar como estado oculto. Esa vía casi lineal deja pasar el gradiente durante muchos pasos, lo que permite aprender dependencias de cientos de pasos. Fue la arquitectura dominante en lenguaje y voz hasta la llegada de los transformers.","cuando":"Para series temporales y secuencias con dependencias largas cuando no hay datos o recursos para un transformer.","ej":"Predecir la demanda eléctrica de las próximas 24 horas a partir de las dos semanas anteriores.","hp":[["units / hidden_size","tamaño del estado (Keras / PyTorch)"],["return_sequences","devolver el estado de cada paso o solo el último"],["dropout","dropout sobre las entradas de cada paso"]],"py":[{"c":"keras.layers.LSTM","u":"https://keras.io/api/layers/recurrent_layers/lstm/"},{"c":"torch.nn.LSTM","u":"https://docs.pytorch.org/docs/stable/generated/torch.nn.LSTM.html"}],"rel":["gru","rnn","desvanecimiento-y-explosion-del-gradiente","redes-neuronales-para-series"]},{"id":"gru","name":"GRU","en":"gated recurrent unit (GRU)","frase":"Variante simplificada de la LSTM, con dos puertas y sin celda de memoria separada.","desc":"La GRU fusiona la celda y el estado oculto, y usa dos puertas: la de actualización decide cuánto del estado anterior se conserva y la de reinicio, cuánto se usa para calcular el candidato nuevo. Tiene menos parámetros que la LSTM, entrena más rápido y en muchas tareas rinde de forma parecida.","cuando":"Como alternativa más ligera a la LSTM, sobre todo con pocos datos o recursos limitados.","ej":"El teclado de un móvil sugiere la siguiente palabra con una GRU pequeña que funciona sin conexión.","hp":[["units / hidden_size","tamaño del estado (Keras / PyTorch)"],["num_layers","en PyTorch, número de capas apiladas"]],"py":[{"c":"keras.layers.GRU","u":"https://keras.io/api/layers/recurrent_layers/gru/"},{"c":"torch.nn.GRU","u":"https://docs.pytorch.org/docs/stable/generated/torch.nn.GRU.html"}],"rel":["lstm","rnn","estado-oculto-y-memoria"]},{"id":"rnn-bidireccional","name":"RNN bidireccional","en":"bidirectional RNN","frase":"Dos RNN que leen la secuencia en sentidos opuestos para que cada posición tenga contexto pasado y futuro.","desc":"Una RNN recorre la secuencia de principio a fin y otra de fin a principio, y en cada posición se combinan sus estados. Así la representación de cada elemento tiene en cuenta lo que viene antes y lo que viene después. Solo sirve cuando la secuencia completa está disponible, no para predecir el futuro en tiempo real.","cuando":"Para etiquetar o clasificar secuencias completas, como reconocer entidades en un texto o transcribir audio ya grabado.","ej":"Para saber si \"banco\" se refiere a un asiento o a una entidad financiera, ayuda leer también las palabras que vienen después.","hp":[["merge_mode","cómo se combinan los dos sentidos (concatenar, sumar…)"],["bidirectional","en PyTorch, activa la lectura en ambos sentidos"]],"py":[{"c":"keras.layers.Bidirectional","u":"https://keras.io/api/layers/recurrent_layers/bidirectional/"},{"c":"torch.nn.LSTM","u":"https://docs.pytorch.org/docs/stable/generated/torch.nn.LSTM.html"}],"rel":["rnn","lstm","bert","topologias-de-secuencia"]},{"id":"echo-state-networks","name":"Echo State Networks (reservoir computing)","en":"echo state networks (reservoir computing)","frase":"RNN con un depósito aleatorio y fijo de neuronas recurrentes en la que solo se entrena la capa de salida.","desc":"Las redes de estado de eco, un tipo de reservoir computing, generan al azar una red recurrente grande, el depósito, y no la entrenan: la entrada lo excita y produce dinámicas ricas, como las ondas en un estanque. Solo se aprende una salida lineal, normalmente con regresión ridge, lo que hace el entrenamiento rapidísimo y sin retropropagación. Su radio espectral debe estar cerca de 1 para que el depósito recuerde sin volverse inestable.","cuando":"Para predecir series temporales caóticas o dinámicas con muy poco cómputo de entrenamiento.","ej":"Predecir la evolución de un sistema caótico, como el de Lorenz, entrenando solo una regresión lineal sobre los estados del depósito.","hp":[["units","número de neuronas del depósito"],["sr","radio espectral de la matriz recurrente"],["lr","tasa de fuga (leak rate) de las neuronas"],["ridge","regularización de la salida lineal"]],"py":[{"c":"reservoirpy.nodes.Reservoir","u":"https://reservoirpy.readthedocs.io/en/latest/api/generated/reservoirpy.nodes.Reservoir.html"},{"c":"reservoirpy.nodes.Ridge","u":"https://reservoirpy.readthedocs.io/en/latest/api/generated/reservoirpy.nodes.Ridge.html"}],"rel":["rnn","ridge-lasso-y-elastic-net","redes-neuronales-para-series","rnn-clasicas"]},{"id":"rnn-clasicas","name":"RNN clásicas: Hopfield, Elman y Jordan","en":"classic RNNs (Hopfield, Elman, Jordan)","frase":"Las primeras redes recurrentes: la memoria asociativa de Hopfield y las redes simples de Elman y Jordan.","desc":"La red de Hopfield (1982) conecta todas las neuronas entre sí y funciona como memoria asociativa: almacena patrones como mínimos de una función de energía y recupera un patrón completo a partir de una versión parcial o ruidosa. Las redes de Elman y Jordan, de finales de los 80, añadieron unidades de contexto que copian el estado oculto o la salida del paso anterior, y son la base de la RNN simple actual.","ej":"Una red de Hopfield que ha memorizado letras reconstruye una \"A\" completa a partir de una imagen con la mitad de los píxeles borrados.","py":[{"c":"keras.layers.SimpleRNN","u":"https://keras.io/api/layers/recurrent_layers/simple_rnn/"}],"rel":["rnn","estado-oculto-y-memoria","echo-state-networks","breve-historia-de-la-ia"]},{"id":"topologias-de-secuencia","name":"Topologías de secuencia (one-to-many, many-to-one, many-to-many)","en":"sequence topologies (one-to-many, many-to-one, many-to-many)","frase":"Cómo se relacionan entrada y salida en un modelo de secuencias: una a muchas, muchas a una o muchas a muchas.","desc":"En one-to-many, una entrada genera una secuencia, como al describir una imagen con una frase. En many-to-one, una secuencia produce una sola salida, como al clasificar el sentimiento de una reseña. En many-to-many, una secuencia produce otra: alineada paso a paso, como al etiquetar cada palabra, o de distinta longitud mediante un codificador y un decodificador, como en la traducción.","ej":"Traducir \"how are you\" a \"¿cómo estás?\" es many-to-many con codificador y decodificador; puntuar una reseña de 1 a 5 estrellas es many-to-one.","hp":[["return_sequences","devolver la salida de cada paso (many-to-many) o solo la última (many-to-one)"]],"py":[{"c":"keras.layers.LSTM","u":"https://keras.io/api/layers/recurrent_layers/lstm/"},{"c":"keras.layers.RepeatVector","u":"https://keras.io/api/layers/reshaping_layers/repeat_vector/"},{"c":"keras.layers.TimeDistributed","u":"https://keras.io/api/layers/recurrent_layers/time_distributed/"}],"rel":["rnn","tipos-de-transformer","prediccion-multipaso","analisis-de-sentimiento"]}]},{"id":"atencion-y-transformers","name":"Atención y Transformers","en":"attention & Transformers","frase":"La arquitectura que pondera qué partes de la entrada importan para cada elemento y que domina la IA actual.","desc":"El mecanismo de atención permite que cada elemento de una secuencia consulte directamente a todos los demás y combine su información según su relevancia. El transformer (2017) construye una red entera con atención, capas densas, normalización y conexiones residuales, sin recurrencia ni convolución. Se paraleliza muy bien y escala con los datos y el cómputo, así que es la base de los LLM, de los modelos de visión modernos y de los multimodales.","ej":"GPT, BERT, ViT, CLIP y muchos modelos de texto a imagen se basan en transformers.","rel":["mecanismo-de-atencion","bloque-transformer","llm","transformers-vs-cnn-y-rnn"],"children":[{"id":"mecanismo-de-atencion","name":"Mecanismo de atención","en":"attention mechanism","frase":"Combinar la información de todos los elementos de una secuencia ponderando cada uno por su relevancia.","desc":"Para cada elemento, la atención calcula una puntuación de relevancia con cada uno de los demás, la convierte en pesos con una softmax y devuelve la media ponderada de sus representaciones. Así cada posición accede directamente a la información que necesita, por lejos que esté, en lugar de depender de una memoria comprimida como las RNN. Nació para mejorar la traducción automática y acabó dando lugar al transformer.","ej":"Al traducir \"the red car\", para generar \"rojo\" el modelo presta casi toda su atención a \"red\".","py":[{"c":"keras.layers.Attention","u":"https://keras.io/api/layers/attention_layers/attention/"},{"c":"torch.nn.functional.scaled_dot_product_attention","u":"https://docs.pytorch.org/docs/stable/generated/torch.nn.functional.scaled_dot_product_attention.html"}],"rel":["query-key-y-value","atencion-por-producto-escalar-escalado","autoatencion","mapas-de-atencion"]},{"id":"query-key-y-value","name":"Query, Key y Value","en":"query, key & value","frase":"Cada elemento emite una consulta, una clave y un valor: la consulta busca, la clave se compara y el valor se entrega.","desc":"La atención proyecta cada elemento en tres vectores con matrices aprendidas. La consulta (query) expresa qué busca; la clave (key), qué ofrece; el valor (value), qué información aporta si resulta elegido. La relevancia entre dos elementos es el producto escalar de la consulta de uno con la clave del otro, y la salida es la suma de los valores ponderada por esas relevancias.","ej":"En \"el gato que perseguía al perro maulló\", la consulta de \"maulló\" encaja con la clave de \"gato\", y su valor aporta quién realiza la acción.","rel":["mecanismo-de-atencion","atencion-por-producto-escalar-escalado","autoatencion","atencion-cruzada"]},{"id":"atencion-por-producto-escalar-escalado","name":"Atención por producto escalar escalado","en":"scaled dot-product attention","frase":"La fórmula de la atención: softmax(QKᵀ/√d)·V.","desc":"Multiplica las consultas por las claves para obtener una matriz de puntuaciones, la divide por la raíz de la dimensión d, aplica una softmax por filas para obtener pesos y los usa para promediar los valores. La división por √d evita que, en dimensiones altas, los productos escalares crezcan tanto que la softmax se sature y anule el gradiente. Su coste crece con el cuadrado de la longitud de la secuencia.","ej":"Con secuencias de 1.000 tokens, la matriz de puntuaciones tiene un millón de entradas por cada cabeza y cada capa.","py":[{"c":"torch.nn.functional.scaled_dot_product_attention","u":"https://docs.pytorch.org/docs/stable/generated/torch.nn.functional.scaled_dot_product_attention.html"}],"rel":["query-key-y-value","softmax","atencion-multicabeza","ventana-de-contexto"]},{"id":"autoatencion","name":"Autoatención (self-attention)","en":"self-attention","frase":"Atención de una secuencia sobre sí misma: cada elemento se relaciona con todos los demás de la misma secuencia.","desc":"En la autoatención, consultas, claves y valores salen de la misma secuencia, así que cada posición actualiza su representación con información de todas las demás. Capta dependencias de cualquier distancia en un solo paso y en paralelo para todas las posiciones. Es la operación central de los codificadores y decodificadores transformer.","ej":"En \"el animal no cruzó la calle porque estaba cansado\", la autoatención relaciona \"estaba cansado\" con \"animal\" y no con \"calle\".","py":[{"c":"keras.layers.MultiHeadAttention","u":"https://keras.io/api/layers/attention_layers/multi_head_attention/"},{"c":"torch.nn.MultiheadAttention","u":"https://docs.pytorch.org/docs/stable/generated/torch.nn.MultiheadAttention.html"}],"rel":["mecanismo-de-atencion","atencion-multicabeza","atencion-cruzada","bloque-transformer"]},{"id":"atencion-multicabeza","name":"Atención multicabeza","en":"multi-head attention","frase":"Varias atenciones en paralelo, cada una libre de fijarse en un tipo de relación distinto.","desc":"En lugar de una sola atención, se aplican varias cabezas en paralelo, cada una con sus propias proyecciones de consultas, claves y valores en un subespacio más pequeño. Cada cabeza puede especializarse en un tipo de relación, como la sintaxis, la correferencia o la posición, y sus salidas se concatenan y se proyectan. Cuesta aproximadamente lo mismo que una única atención de dimensión completa.","ej":"En un modelo de lenguaje, una cabeza puede seguir qué adjetivo modifica a qué sustantivo, y otra, a qué nombre se refiere cada pronombre.","hp":[["num_heads","número de cabezas"],["key_dim / embed_dim","dimensión de cada cabeza en Keras, dimensión total del modelo en PyTorch"],["dropout","dropout sobre los pesos de atención"]],"py":[{"c":"keras.layers.MultiHeadAttention","u":"https://keras.io/api/layers/attention_layers/multi_head_attention/"},{"c":"torch.nn.MultiheadAttention","u":"https://docs.pytorch.org/docs/stable/generated/torch.nn.MultiheadAttention.html"}],"rel":["atencion-por-producto-escalar-escalado","autoatencion","bloque-transformer","mapas-de-atencion"]},{"id":"atencion-cruzada","name":"Atención cruzada","en":"cross-attention","frase":"Atención en la que una secuencia consulta a otra distinta.","desc":"Las consultas vienen de una secuencia y las claves y valores, de otra. Es el puente entre el codificador y el decodificador en traducción: cada palabra que se genera consulta la frase original. También conecta modalidades: en los modelos de texto a imagen, la imagen en construcción consulta el texto de la instrucción, y en muchos modelos multimodales el texto consulta la imagen.","ej":"En Stable Diffusion, la atención cruzada inyecta la descripción \"un astronauta a caballo\" en cada paso de la generación de la imagen.","py":[{"c":"keras.layers.MultiHeadAttention","u":"https://keras.io/api/layers/attention_layers/multi_head_attention/"},{"c":"torch.nn.MultiheadAttention","u":"https://docs.pytorch.org/docs/stable/generated/torch.nn.MultiheadAttention.html"}],"rel":["autoatencion","tipos-de-transformer","stable-diffusion","arquitectura-mllm"]},{"id":"mascara-causal","name":"Máscara causal","en":"causal mask","frase":"Impide que cada posición vea las posiciones futuras, para que el modelo genere de izquierda a derecha.","desc":"En un modelo autorregresivo, la predicción del token siguiente no puede depender de tokens que todavía no existen. La máscara causal anula, antes de la softmax, las puntuaciones de atención hacia posiciones posteriores, de modo que cada token solo ve los anteriores. Así el modelo se entrena en paralelo con toda la secuencia y después genera token a token.","ej":"Al entrenar con \"el cielo es azul\", la posición de \"es\" solo ve \"el cielo\", nunca \"azul\".","hp":[["is_causal","aplica la máscara causal en el cálculo de la atención"]],"py":[{"c":"torch.nn.functional.scaled_dot_product_attention","u":"https://docs.pytorch.org/docs/stable/generated/torch.nn.functional.scaled_dot_product_attention.html"},{"c":"torch.nn.Transformer.generate_square_subsequent_mask","u":"https://docs.pytorch.org/docs/stable/generated/torch.nn.Transformer.html#torch.nn.Transformer.generate_square_subsequent_mask"}],"rel":["modelos-autorregresivos","gpt","clm","autoatencion"]},{"id":"codificacion-posicional","name":"Codificación posicional","en":"positional encoding","frase":"Información sobre el orden de los elementos, que la atención por sí sola no tiene.","desc":"La atención trata la entrada como un conjunto: sin ayuda, \"el perro muerde al hombre\" y \"el hombre muerde al perro\" serían indistinguibles. La codificación posicional añade a cada token una señal de su posición. El transformer original usaba senos y cosenos de distintas frecuencias; otros modelos aprenden un vector por posición, y los LLM actuales suelen usar RoPE, que rota consultas y claves según la posición y generaliza mejor a contextos largos.","ej":"Sin codificación posicional, un modelo de traducción no distinguiría \"Juan llama a Ana\" de \"Ana llama a Juan\".","py":[{"c":"keras_hub.layers.SinePositionEncoding","u":"https://keras.io/keras_hub/api/modeling_layers/sine_position_encoding/"},{"c":"keras_hub.layers.PositionEmbedding","u":"https://keras.io/keras_hub/api/modeling_layers/position_embedding/"},{"c":"keras_hub.layers.RotaryEmbedding","u":"https://keras.io/keras_hub/api/modeling_layers/rotary_embedding/"}],"rel":["autoatencion","bloque-transformer","ventana-de-contexto","transformers-vs-cnn-y-rnn"]},{"id":"bloque-transformer","name":"Bloque Transformer","en":"Transformer block","frase":"La unidad que se apila para construir un transformer: atención, red densa, residuos y normalización.","desc":"Cada bloque aplica autoatención multicabeza seguida de una red feed-forward de dos capas que procesa cada posición por separado, normalmente expandiendo la dimensión cuatro veces. Ambas subcapas van envueltas en conexiones residuales y normalización de capa, que en los modelos modernos se aplica antes de cada subcapa (pre-norm) para estabilizar el entrenamiento. Un modelo completo es una pila de bloques idénticos.","ej":"BERT-base apila 12 bloques con 12 cabezas de atención y representaciones de 768 dimensiones.","hp":[["num_heads / nhead","cabezas de atención (Keras / PyTorch)"],["intermediate_dim / dim_feedforward","tamaño de la red densa interna (Keras / PyTorch)"],["dropout","dropout en la atención y en la red densa"]],"py":[{"c":"keras_hub.layers.TransformerEncoder","u":"https://keras.io/keras_hub/api/modeling_layers/transformer_encoder/"},{"c":"torch.nn.TransformerEncoderLayer","u":"https://docs.pytorch.org/docs/stable/generated/torch.nn.TransformerEncoderLayer.html"}],"rel":["atencion-multicabeza","conexion-residual","capas-de-normalizacion","tipos-de-transformer"]},{"id":"tipos-de-transformer","name":"Encoder, decoder y encoder-decoder","en":"encoder, decoder & encoder-decoder Transformers","frase":"Tres configuraciones: solo codificador para entender, solo decodificador para generar y ambos para transformar.","desc":"Los modelos solo codificador, como BERT, usan atención bidireccional y producen representaciones de toda la entrada: son ideales para clasificar o extraer información. Los solo decodificador, como GPT, usan máscara causal y generan texto token a token: son la base de los LLM. Los codificador-decodificador, como T5 o el transformer original, leen una entrada con el codificador y generan otra secuencia con el decodificador, unidos por atención cruzada; encajan en traducción y resumen.","ej":"BERT para clasificar correos, GPT para redactarlos y T5 para traducirlos.","py":[{"c":"torch.nn.Transformer","u":"https://docs.pytorch.org/docs/stable/generated/torch.nn.Transformer.html"},{"c":"transformers.AutoModelForSeq2SeqLM","u":"https://huggingface.co/docs/transformers/model_doc/auto#transformers.AutoModelForSeq2SeqLM"}],"rel":["bert","gpt","t5","atencion-cruzada","mascara-causal"]},{"id":"token-cls","name":"Token [CLS]","en":"[CLS] token","frase":"Un token especial al principio de la secuencia cuya representación final resume toda la entrada.","desc":"Modelos como BERT y ViT añaden al inicio un token [CLS] sin significado propio. Gracias a la autoatención, su representación en la última capa recoge información de toda la secuencia y se usa como entrada de la cabeza de clasificación. Una alternativa habitual es promediar las representaciones de todos los tokens (mean pooling), que a menudo funciona igual o mejor para obtener embeddings de frases.","ej":"Para clasificar el sentimiento de una reseña con BERT, el vector final del token [CLS] pasa a una capa densa con softmax.","py":[{"c":"salida.last_hidden_state[:, 0]","s":1}],"rel":["bert","vit","vocabulario-y-tokens-especiales","modelos-de-embeddings-de-texto"]},{"id":"transformers-vs-cnn-y-rnn","name":"Transformers vs CNN y RNN","en":"Transformers vs CNNs & RNNs","frase":"Atención global y paralela frente a convoluciones locales y recurrencia secuencial.","desc":"Las RNN procesan paso a paso, se paralelizan mal y olvidan las dependencias lejanas. Las CNN ven zonas locales y necesitan muchas capas para relacionar elementos lejanos, pero incorporan supuestos útiles, como la localidad, que las hacen eficientes con pocos datos. Los transformers relacionan cualquier par de posiciones en una sola capa y se paralelizan muy bien, pero su coste es cuadrático con la longitud y necesitan más datos. Con datos y cómputo abundantes, suelen ganar.","cuando":"Transformers, con muchos datos o modelos preentrenados; CNN o RNN, con pocos datos, secuencias muy largas o hardware limitado.","ej":"Con 10.000 imágenes, una ResNet suele superar a un ViT entrenado desde cero; con cientos de millones de imágenes, gana el ViT.","rel":["cnn","rnn","atencion-y-transformers","vit"]}]},{"id":"autoencoders","name":"Autoencoders","en":"autoencoders","frase":"Redes que aprenden a reconstruir su propia entrada pasando por una representación comprimida.","desc":"Un codificador transforma la entrada en un código de menor tamaño y un decodificador intenta reconstruir la entrada a partir de él. Como el código es un cuello de botella, la red debe quedarse con lo esencial de los datos. Se entrenan sin etiquetas y sirven para reducir la dimensión, eliminar ruido, detectar anomalías (lo que se reconstruye mal es raro) y como base de modelos generativos como el VAE.","cuando":"Para comprimir, eliminar ruido o detectar anomalías en datos complejos, como imágenes o señales, sin necesidad de etiquetas.","ej":"Un autoencoder entrenado con las vibraciones de motores s
